  "conclusions": [
    {
      "id": "C1",
      "title": "全过程动能定理：多个过程、多个力，只看初末动能和各力在各自位移上做的功，一次列式；恒力只在一段作用时只算这一段，撤去后不再做功；重力做功只与初末高度差有关",
      "formula": "W总 = Ek末 − Ek初；W_F = Fd·cosα；W_G = mg(h初 − h末)",
      "derivation": "公式：W总 = W₁ + W₂ + … = Ek末 − Ek初；W_F = Fd·cosα（d 为 F 作用期间的位移）；W_G = mg(h初 − h末)；撤去后又滑 s₂ 停下：s₂ = (F − f)s₁/f（#15）。\n沿运动方向对每一小段用牛顿第二定律 ΣF = ma，与 v² − v₀² = 2ax 相乘，得 ΣF·Δx = Δ(½mv²)，即每一段的合力功等于这一段的动能增量（沪科版第七章第三节由匀加速直线运动导出，并指出对变力、曲线运动同样成立）。把各段首尾相接，中间各分界点的动能一加一减全部抵消，只剩 Ek末 − Ek初 = 各段、各力做功之和。所以多过程问题可以「一次列式」：不必求中间速度，也不必管每一段是匀加速还是变加速。\n各力的功分开算：恒力 F 只在它作用的位移 d 内做功 Fd·cosα，撤去后不再做功；重力做功 mg(h初 − h末) 只看高度差，与路径无关（光滑曲面、圆弧上只有重力做功）；支持力始终与速度垂直，不做功；摩擦力见 C2。例：\n· #15：F 作用 s₁ 后撤去，又滑 s₂ 停下，全过程 Fs₁ − Ff(s₁ + s₂) = 0，s₂ = (F − Ff)s₁/Ff（教参正是这样「对全过程分析」）\n· #1：EkB 到落地只有重力做功，EkB = E₁ − mgh₁；A 到落地 FL − μmgL + mgh₁ = E₁（原解析的「更简便的解法」）\n· #3（按 g = 9.8 m/s²）：撤去 F 后 μmg × 18 m = ½mv²，v = 2.66 m/s；全过程 F cos37° × 12 m − μ(mg + F sin37°) × 12 m − μmg × 18 m = 0，F = 12.13 N\n· #10：从释放到 ef，mg[H + r(1 − cos37°)] − μmg cos37° · H/sin37° = ½mv²，34 J − 20 J = 14 J，v² = 28 m²/s²，在 ef 处 N = mg + mv²/r = 24 N\n· 2023 等级考第 3 题（对照）：三块碎片从同一高度以相同速率抛出，只有重力做功 mgh，末动能 ½mv₀² + mgh，落地速率 √(v₀² + 2gh) 一样大，与抛出方向无关\n动画：下方左图是「动能定理账本」——Ek初 从横轴画起，W_F、W_G、W_f 依次接在前一根柱的顶端（正功向上、负功向下），最后一根 Ek 从横轴画起，恰与前面各项之和等高；读数中 W总 − ΔEk 始终在 10⁻¹² J 以下。"

      "id": "C2",
      "title": "摩擦力做功：大小等于摩擦力乘路程（往返时累加，不是位移）；直斜面上等于 μmg 乘斜面的水平投影，与倾角无关；分段粗糙时各段相加，总量与粗糙段的位置无关",
      "formula": "W_f = −μmg·s路程；斜面上 W_f = −μmg·x投影",
      "derivation": "公式：水平面 W_f = −μmg·s；斜面 W_f = −μmg cosθ · s斜 = −μmg · x投影；斜推 W_f = −μ(mg + F sinα)d；分段 W_f = −Σμᵢmg·sᵢ。\n滑动摩擦力大小 f = μN 不变时，方向总与相对运动方向相反，每一小段位移上做功 −f|Δx|，累加得 −f·s，s 是路程而不是位移：往返时每一趟都做负功，不会抵消。\n直斜面上 N = mg cosθ，滑过斜面长 s斜，W_f = −μmg cosθ · s斜 = −μmg · (s斜 cosθ) = −μmg · x投影：摩擦力做的功与「把斜面压平后在水平面上滑同样的水平距离」相同，与倾角无关。例：\n· #5：直滑道水平距离 L = 4 m，W克 = μmgL = 0.2 × 500 N × 4 m = 400 J，不必求倾角；½mv² = mg(H + h) − 400 J = 1600 J，v = 8 m/s\n· #11：沿坡道上滑，−mgS sinθ − μmgS cosθ = 0 − ½mv₀²，S = v₀²/[2g(sinθ + μ cosθ)] = 49 m（g = 9.8 m/s²）\n斜推、斜拉时支持力 N = mg ± F sinα 跟着变，推力作用段的摩擦力也变（#3；母题 ①(e) 斜向下推既减小了水平分力，又增大了摩擦力）。\n分段粗糙：各段 W_f 相加，W_f = −Σμᵢmg·sᵢ。总量只与各段的长度有关，与先后次序无关：\n· #8：½mv₀² = μmg(L − d) + 0.5μmg·d，4.5 = 0.2 × (30 − d) + 0.1d，d = 15 m；擦冰提前或推后，d 都一样（选 B）\n· #18：两次 ½mv₀² = μ₁mg·xMN + μ₂mg(x − xMN)，x₁ = x₂\n时间则与次序有关（牛顿第二定律）：两次的 v–t 图与横轴围成的面积（位移）相同；减速慢的一段（擦冰、μ 小）放在前面，速度在较长时间里保持较大，走完同样的位移用时短（#8 选 C：先擦 17.75 s、后擦 23.66 s；#18：粗糙的 MN 段离出发点越近，越早被减速，用时越长，t₁ < t₂）。\n动画：粗糙段在表面上方画一排细点（点状标注），只有在这些段上摩擦力才做功；下方右图 Ek–s 中，只有摩擦力做功的水平段是斜率为 −μmg 的直线。"

/* ================= 线稿绘图工具 FIG（所有母题共用，不改） =================
   画法照试卷插图：装置用墨线，固定面画斜线阴影，辅助线用虚线，物理量和点的字母用斜体衬线；
   只有矢量带颜色（--g 重力/外力，--n 弹力/约束力，--v 速度，--a 其他矢量）。
   用法：SIM.draw 里 const F=FIG(ctx,W,tok)；坐标是画布像素，F.u = W/720 是线宽与几何的基准单位，
   F.ut 是字号单位（窄屏时不再随画布缩小，保证字母不小于约 11 CSS 像素；自写文字函数也要用 F.ut 算字号）。
   颜色：F.ink 墨线、F.auxColor 辅助线、F.paper 纸色（F.aux 是画辅助线的方法，不是颜色）。 */
const FIG=(ctx,W,tok)=>{
  const u=W/720,ink=tok('--fig-ink'),aux=tok('--fig-aux'),paper=tok('--card');
  const dp=W/(ctx.canvas.clientWidth||W),ut=Math.max(u,dp*11/19);   // dp：每 CSS 像素的画布像素数
  const SERIF='"Times New Roman","STIX Two Text",Times,serif',SANS=tok('--f-body');
  const path=(fn,{w=1.6,color=ink,dash=null,fill=null}={})=>{ctx.save();ctx.beginPath();fn();
    if(fill){ctx.fillStyle=fill;ctx.fill()}
    if(w>0){ctx.lineWidth=w*u;ctx.strokeStyle=color;ctx.setLineDash(dash?dash.map(d=>d*u):[]);ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}
    ctx.restore()};
  // 文字先描一圈底色再填色，压在线条上也清楚
  const text=(t,x,y,font,color,align,base)=>{ctx.save();ctx.font=font;ctx.textAlign=align;ctx.textBaseline=base;
    ctx.lineJoin="round";ctx.lineWidth=5*ut;ctx.strokeStyle=paper;ctx.strokeText(t,x,y);ctx.fillStyle=color;ctx.fillText(t,x,y);ctx.restore()};
  const F={u,ut,ink,auxColor:aux,paper,
    clear(){ctx.save();ctx.setLineDash([]);ctx.fillStyle=paper;ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height);ctx.restore()},
    line(x1,y1,x2,y2,o){path(()=>{ctx.moveTo(x1,y1);ctx.lineTo(x2,y2)},o)},
    poly(pts,o){path(()=>pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y)),o)},
    circle(x,y,r,o){path(()=>ctx.arc(x,y,r,0,2*Math.PI),o)},
    arc(x,y,r,a0,a1,o){path(()=>ctx.arc(x,y,r,a0,a1),o)},
    rect(x,y,w,h,o){path(()=>ctx.rect(x,y,w,h),o)},
    // 辅助线（中心线、投影线等）
    aux(x1,y1,x2,y2,o={}){F.line(x1,y1,x2,y2,{w:1,color:aux,dash:[6,5],...o})},
    // 运动轨迹：细虚线
    trail(pts,o={}){if(pts.length>1)F.poly(pts,{w:1.3,color:aux,dash:[5,5],...o})},
    // 固定面斜线：沿 (x1,y1)→(x2,y2) 的直线，画在 side 一侧（屏幕坐标下，1 = 前进方向右手侧）
    hatch(x1,y1,x2,y2,side=1,{gap=12,len=10}={}){const L=Math.hypot(x2-x1,y2-y1),n=Math.max(1,Math.round(L/(gap*u)));
      const tx=(x2-x1)/L,ty=(y2-y1)/L,nx=-ty*side,ny=tx*side,ox=(nx-tx)*len*u/Math.SQRT2,oy=(ny-ty)*len*u/Math.SQRT2;
      path(()=>{for(let i=0;i<=n;i++){const x=x1+(x2-x1)*i/n,y=y1+(y2-y1)*i/n;ctx.moveTo(x,y);ctx.lineTo(x+ox,y+oy)}},{w:1,color:aux})},
    // 圆弧形固定面的斜线：out = true 画在圆外侧
    hatchArc(cx,cy,r,a0,a1,out=true,{gap=12,len=10}={}){const n=Math.max(1,Math.round(r*Math.abs(a1-a0)/(gap*u))),s=out?1:-1;
      path(()=>{for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n,c=Math.cos(a),si=Math.sin(a),x=cx+r*c,y=cy+r*si;
        const nx=c*s,ny=si*s,tx=-si,ty=c;ctx.moveTo(x,y);ctx.lineTo(x+(nx-tx)*len*u/Math.SQRT2,y+(ny-ty)*len*u/Math.SQRT2)}},{w:1,color:aux})},
    // 矢量：从 (x,y) 画到 (x+dx,y+dy)，细杆 + 窄实心箭头；label 用斜体写在箭头外侧，
    // 与别的矢量共线时用 off=[dx,dy]（单位 u，相对箭头尖）把标注挪到旁边
    arrow(x,y,dx,dy,color,label,{w=2,head=12,size=19,off=null}={}){const L=Math.hypot(dx,dy);if(L<2*u)return;
      const ux=dx/L,uy=dy/L,h=Math.min(head*u,L*.6),hw=h*.34,tx=x+dx,ty=y+dy;
      F.line(x,y,tx-ux*h*.7,ty-uy*h*.7,{w,color});
      path(()=>{ctx.moveTo(tx,ty);ctx.lineTo(tx-ux*h-uy*hw,ty-uy*h+ux*hw);ctx.lineTo(tx-ux*h+uy*hw,ty-uy*h-ux*hw);ctx.closePath()},{w:0,fill:color});
      if(label)F.label(label,off?tx+off[0]*u:tx+ux*14*u,off?ty+off[1]*u:ty+uy*14*u,{color,size})},
    // 斜体衬线字母（物理量、点名）
    label(t,x,y,{color=ink,size=19,align='center',base='middle',italic=true}={}){text(t,x,y,`${italic?'italic ':''}${size*ut}px ${SERIF}`,color,align,base)},
    // 中文小注
    zh(t,x,y,{color=aux,size=14,align='center',base='middle'}={}){text(t,x,y,`${size*ut}px ${SANS}`,color,align,base)},
    dot(x,y,r=2.6,color=ink){F.circle(x,y,r*u,{w:0,fill:color})},
    // 带名字的点：实心小点 + 斜体字母（dx、dy 为字母相对点的偏移，单位 u）
    point(x,y,name,dx=-13,dy=13){F.dot(x,y);if(name)F.label(name,x+dx*u,y+dy*u)},
    // 小球：空心圆，球心另用 F.dot 标出（矢量画完后再点，表示力作用在重心）
    ball(x,y,r){F.circle(x,y,r,{w:1.6,fill:paper})},
    // 尺寸标注：两端带箭头的细线，文字写在中点外侧 off（单位 u）
    dim(x1,y1,x2,y2,t,{off=14,color=ink}={}){const L=Math.hypot(x2-x1,y2-y1);if(L<4*u)return;const ux=(x2-x1)/L,uy=(y2-y1)/L,h=Math.min(8*u,L/3),hw=h*.38;
      F.line(x1,y1,x2,y2,{w:1,color});
      for(const[px,py,sx]of[[x1,y1,1],[x2,y2,-1]])path(()=>{ctx.moveTo(px,py);ctx.lineTo(px+sx*ux*h-uy*hw,py+sx*uy*h+ux*hw);ctx.lineTo(px+sx*ux*h+uy*hw,py+sx*uy*h-ux*hw);ctx.closePath()},{w:0,fill:color});
      if(t)F.label(t,(x1+x2)/2-uy*off*u,(y1+y2)/2+ux*off*u,{color})},
  };
  return F;
};

/* ================= SIM 模块：每个母题替换这一段 =================
   约定接口：
   SIM.legend            [{label, color(CSS 变量名)}]
   SIM.init(P)           → 状态 S（含 S.done、S.status={text,cls}）
   SIM.step(S,P,dt)      推进 dt 秒（引擎保证 dt ≤ 0.5 ms）
   SIM.readouts(S,P)     → [[标签, 带单位的值]]
   SIM.draw(ctx,S,P,W,H,tok)  tok(name) 取主题色
   SIM.verdict(P)        → 理论预判 HTML
*/
const SIM=(()=>{
  /* 动能定理的多过程问题：三个情境（push 恒力推过粗糙段后冲上光滑圆弧 / shuttle 粗糙水平面与光滑斜面间往返 / slope 斜面滑下后在水平面停下），
     都沿轨道按弧长坐标 u 一维积分（RK4），不用预设轨迹。状态 y = [u, v, W_F, W_G, W_f1, W_f2, s, s1, s2]：
       v = du/dt；W_F 推力的功、W_G 重力的功、W_f1 水平粗糙段（AB / BC / 水平面）上摩擦力的功、W_f2 粗糙斜面（CD / 斜面）上摩擦力的功，
       都按 dW/dt = 力 × 速度（功率）与运动方程一起积分；s 总路程，s1、s2 两种粗糙面上的路程。
     ① push：u < 0 为 A 左侧的光滑斜面（37°），0 ≤ u ≤ L 为粗糙段 AB（推力在 u 第一次到达 min(d, L) 时撤去，只作用这一次；
        推力作用时 N = mg + F sinα），L ≤ u ≤ L + πR 为光滑半圆，φ = (u − L)/R，ü = −g sinφ，N = m(v²/R + g cosφ)；
        上半圆（φ > 90°）N 减到 −10⁻⁶mg 时脱轨（φ 只比 90° 多 10⁻⁴ rad 以内时不判脱轨，即「恰好升到 C」），转为对 (x, y, vx, vy, W_G, s) 的抛体积分；
        过 D 后平抛；落到水平面（或左侧斜面）即停止；脱轨后落回圆轨道即停止（演示到此结束）。
     ② shuttle：u < 0 左斜面 AB（光滑），0 ≤ u ≤ L 粗糙段 BC，u > L 右斜面 CD（动摩擦因数 μ′）。
     ③ slope：u < 0 斜面（μ₁），u ≥ 0 水平面（μ）。画面以出发点正下方的 P 为原点。
     滑动摩擦力 −μN·sgn(v) 在 v = 0 处不连续：每一步把 sgn(v) 固定为步首的符号（直线段上加速度恒定，RK4 给出精确的二次式），
       「速度过零」作为事件在步内二分定位，到零时 v 置 0；下一步先沿两个方向试算加速度（最大静摩擦力 = 滑动摩擦力），
       两个方向都推不动（容差 10⁻⁴ m/s²，μ′ = tanθ 这类临界取「静止」）就静止，否则按加速度方向起动。不会在很小的速度上反复抖动。
     事件（都在步内二分定位）：经过 A、B、C、O（段的分界）、撤去 F、到达 C 的高度、过 D、脱轨、速度过零、落地、落回轨道。
     时间：初始化时用同样的方程粗算一遍（直线段步长 50 ms——加速度恒定时 RK4 与步长无关，圆弧与抛体 2 ms），得到全过程的时间、范围与量程；
       全过程短于 2 s 时慢放到约 2 s、长于 12 s 时快放到约 12 s（倍数取整），停下或落地后再演示 1 s；正式播放步长 h ≤ 0.5 ms，读数用真实时间。
       往返超过 2000 趟或 600 s 仍未停，停止积分，按公式给出停点。公式值只用于预判、读数对照与画面量程，不进入积分。
     引擎不支持的界面细节放在 verdict 里处理（引擎每次同步参数都会调用它）：m、μ、L 用对数滑块（捕获滑块的 input，换算成真值交给输入框的 change）；
       θ、α 的输入框填 37 时按 36.87° 载入、53 按 53.13°；播放按钮旁加「单步」；slope 情境加「保留上一次停点」开关；题干中的数按 3 位有效数字显示。 */
  const g=10,PI=Math.PI,HALF=PI/2,DEG=PI/180,THL=Math.atan2(3,4);
  const TOLA=1e-4,TOLN=1e-6,PHG=1e-4,LIM_TRIP=2000,LIM_T=600,HOLD=1,HMAX=5e-4;
  const SUP={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
  const sup=n=>String(n).replace(/./g,c=>SUP[c]);
  const ok=x=>typeof x==='number'&&isFinite(x);
  // n 位有效数字；|x| < 10⁻³ 或 ≥ 10⁵ 写成 a×10ⁿ；负号用 −
  const sf=(x,n=3)=>{if(!ok(x))return'—';const a=Math.abs(x),s=x<0?'−':'';if(a<1e-300)return'0';
    let p=Math.floor(Math.log10(a)),m=+(a/Math.pow(10,p)).toPrecision(n);if(m>=10){m/=10;p++}
    if(p<-3||p>=5)return s+m.toFixed(n-1)+'×10'+sup(p);
    return s+(m*Math.pow(10,p)).toFixed(Math.max(0,n-1-p))};
  const sg=(x,n=3)=>ok(x)&&x>0?'+'+sf(x,n):sf(x,n);
  const z=(x,s)=>Math.abs(x)<=1e-9*Math.abs(s)?0:x;                 // 相对量程小于 10⁻⁹ 的数显示为 0（积分舍入误差）
  const zp=(x,s)=>Math.abs(x)<=1e-5*Math.abs(s)?0:x;                // 位置：小于量程 10⁻⁵ 的距离显示为 0（如恰好停在 C）
  const nice=x=>{if(!(x>0))return 1;const p=Math.pow(10,Math.floor(Math.log10(x))),r=x/p;return(r<1.5?1:r<3.5?2:r<7.5?5:10)*p};
  const RT=[1,1.5,2,2.5,3,4,5,6,8,10];
  const niceRate=r=>{if(!(r>0))return 1;if(Math.abs(r-1)<1e-12)return 1;const inv=r<1,x=inv?1/r:r,p=Math.pow(10,Math.floor(Math.log10(x))),q=x/p;
    let best=1;for(const c of RT)if(Math.abs(Math.log(c/q))<Math.abs(Math.log(best/q)))best=c;const v=best*p;return inv?1/v:v};
  const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
  const num=x=>String(+(+x).toPrecision(3));
  const rateTxt=r=>Math.abs(r-1)<1e-9?'实时':r>1?'快放 ×'+num(r):'慢放 ×'+num(1/r);
  const tS=x=>!ok(x)?'—':Math.abs(x)<1e4?x.toFixed(Math.abs(x)<.1&&x!==0?5:4):sf(x,6);
  const deg=a=>String(+(a/DEG).toFixed(2))+'°';

  /* ---------- 数值积分工具 ---------- */
  function rk4(d,y,h){const n=y.length,k1=d(y),q=new Array(n),o=new Array(n);
    for(let i=0;i<n;i++)q[i]=y[i]+k1[i]*h/2;const k2=d(q);
    for(let i=0;i<n;i++)q[i]=y[i]+k2[i]*h/2;const k3=d(q);
    for(let i=0;i<n;i++)q[i]=y[i]+k3[i]*h;const k4=d(q);
    for(let i=0;i<n;i++)o[i]=y[i]+h/6*(k1[i]+2*k2[i]+2*k3[i]+k4[i]);return o}
  const cross=(a,b,dir)=>dir<0?a>0&&b<=0:a<0&&b>=0;
  // 一步积分并检测事件 evs = [[编号, g(y), 方向]]：越过零点时在步内二分，返回刚越过零点的步长与状态
  function stepEv(d,y,h,evs){const yn=rk4(d,y,h);let best=null;
    for(const[id,gf,dir]of evs){const a=gf(y);if(cross(a,gf(yn),dir)){let lo=0,hi=h;
      for(let i=0;i<60;i++){const md=(lo+hi)/2;if(cross(a,gf(rk4(d,y,md)),dir))hi=md;else lo=md}
      if(!best||hi<best[0])best=[hi,id]}}
    if(!best)return{h,y:yn,ev:null};return{h:best[0],y:rk4(d,y,best[0]),ev:best[1]}}

  const scOf=P=>P.scene==='shuttle'||P.scene==='slope'?P.scene:'push';

  /* ================= 参数与公式（只用于预判、对照、量程） ================= */
  function cfgPush(P,K){
    const F=Math.max(0,+P.F||0),al=clamp(+P.al||0,-89,89)*DEG,d=Math.max(0,+P.d||0),L=Math.max(1e-3,+P.L||0),R=Math.max(1e-3,+P.R||0),vA=Math.max(0,+P.vA||0);
    const{m,mu}=K,mg=m*g;
    Object.assign(K,{F,al,d,L,R,vA,de:Math.min(d,L),Fc:F*Math.cos(al),N1r:mg+F*Math.sin(al),sL:.6,cL:.8,tL:.75,uC:L+R*HALF,uD:L+R*PI,mgR:mg*R});
    K.N1=Math.max(0,K.N1r);K.lift=K.N1r<0;K.push0=F>0&&K.de>0;K.hA=vA*vA/(2*g);K.u0=vA>0?-K.hA/K.sL:0;K.EA=.5*m*vA*vA;K.Ek0=0;
    const T={};K.T=T;
    T.k=K.de*(Math.cos(al)-mu*Math.sin(al));T.aP=(K.Fc-mu*K.N1)/m;
    const den=Math.cos(al)-mu*Math.sin(al);T.F0=den>1e-12?mu*mg/den:Infinity;
    if(!K.lift&&T.k>1e-12){T.FB=(mu*mg*L-K.EA)/T.k;T.FC=(mu*mg*L+K.mgR-K.EA)/T.k;T.FD=(mu*mg*L+2.5*K.mgR-K.EA)/T.k}
    if(vA===0&&!(K.push0&&T.aP>TOLA)){T.kind='none';return}
    if(K.push0&&vA*vA+2*K.de*T.aP<=0){T.kind='stopPush';T.sR=T.uStop=vA*vA/(2*(-T.aP));return}
    if(K.push0)T.v1=Math.sqrt(vA*vA+2*K.de*T.aP);
    T.Etot=K.push0?.5*m*T.v1*T.v1+mu*mg*K.de:K.EA;      // = ½mv_A² + F·k：都折算成「μmg × AB 上的路程」
    T.sR=T.Etot/(mu*mg);T.EkB=T.Etot-mu*mg*L;
    if(T.EkB<=0)T.kind='AB';
    else{T.vB=Math.sqrt(2*T.EkB/m);T.NB=mg+m*T.vB*T.vB/R;
      // 分类的容差与积分一致：φ 只比 90° 多 10⁻⁴ rad 以内不判脱轨；N_D/(mg) = 2E_kB/(mgR) − 5 ≥ −10⁻⁶ 算过 D
      if(T.EkB<=K.mgR*(1+1e-4)){T.kind='low';T.hArc=T.EkB/mg}
      else if(T.EkB<2.5*K.mgR*(1-2e-7)){T.kind='der';T.hd=(T.vB*T.vB+g*R)/(3*g);T.vd=Math.sqrt(Math.max(0,g*(T.hd-R)));derLand(K,T)}
      else{T.kind='pass';T.vD=Math.sqrt(Math.max(0,T.vB*T.vB-4*g*R));T.ND=m*T.vD*T.vD/R-mg;T.tf=Math.sqrt(4*R/g);const xr=T.vD*T.tf;
        if(xr<=L){T.xl=L-xr;T.yl=0;T.dl=xr}
        else{const Tn=K.tL,tt=(-T.vD*Tn+Math.sqrt(T.vD*T.vD*Tn*Tn+2*g*(L*Tn+2*R)))/g;T.xl=L-T.vD*tt;T.yl=-T.xl*Tn;T.dl=T.vD*tt;T.onSlope=true}}}
    if(T.kind==='AB'||T.kind==='low'){const n=Math.max(0,Math.ceil(T.sR/L-1e-12)-1),D=T.sR-n*L;T.n=n;T.D=D;T.uStop=n%2?L-D:D}
  }
  // 脱轨后的抛物线（解析式）：先落回右半圆轨道，还是从左侧开口飞出、落到 AB（或左侧斜面）上
  function derLand(K,T){const R=K.R,L=K.L,c=(R-T.hd)/R,ph=Math.acos(clamp(c,-1,1)),x0=L+R*Math.sin(ph),y0=T.hd,vx=T.vd*Math.cos(ph),vy=T.vd*Math.sin(ph);
    const P=t=>[x0+vx*t,y0+vy*t-g*t*t/2],qIn=([x,y])=>x>=L?R*R-((x-L)*(x-L)+(y-R)*(y-R)):1,gr=([x,y])=>y-(x<0?-x*K.tL:0);
    let inside=false,tp=0;const dt=Math.max(1e-5,Math.sqrt(R/g)*2e-4);
    for(let t=dt;t<60;t+=dt){const p=P(t);if(!inside&&qIn(p)>1e-13*R*R)inside=true;
      const hit=inside&&qIn(p)<=0,land=gr(p)<=0;
      if(hit||land){let lo=tp,hi=t;for(let i=0;i<60;i++){const md=(lo+hi)/2,pm=P(md);if((hit&&qIn(pm)<=0)||(land&&gr(pm)<=0))hi=md;else lo=md}
        const q=P(hi);T.dLand={kind:hit?'hit':'land',x:q[0],y:q[1],dB:L-q[0]};return}
      tp=t}}
  function cfgShuttle(P,K){
    const h=Math.max(1e-3,+P.h||0),v0=Math.max(0,+P.v0||0),th=clamp(+P.th||36.87,1,89)*DEG,L=Math.max(1e-3,+P.L||0),muD=Math.max(0,+P.muD||0);
    const{m,mu}=K,mg=m*g;
    Object.assign(K,{h,v0,th,L,muD,sn:Math.sin(th),cs:Math.cos(th),tn:Math.tan(th)});K.u0=-h/K.sn;K.Ek0=.5*m*v0*v0;
    const T={};K.T=T;

      if(S.seg==='AB')return S.push?{text:'推力作用：F 做正功，摩擦力做负功',cls:''}:S.y[1]>0?{text:S.rm?'撤去 F：只有摩擦力做功，匀减速':'在 AB 上滑行：摩擦力做负功',cls:''}:{text:'在 AB 上向左滑行：摩擦力仍做负功',cls:''};
      const ph=(S.y[0]-K.L)/K.R;return S.y[1]>=0?{text:ph<HALF?'沿光滑半圆上升：只有重力做功':'上半圆：支持力减小',cls:''}:{text:'沿圆弧滑回',cls:''}}
    if(K.sc==='shuttle'){
      if(S.rest)return S.stop.seg==='S2'?{text:`停在 CD 上：沿斜面 ${f(S.stop.u-K.L)} m（μ′ ≥ tanθ）`,cls:'ok'}:{text:`停在 BC 上：离 B ${f(zp(S.stop.u,K.L))} m（离 C ${f(zp(K.L-S.stop.u,K.L))} m）`,cls:'ok'};
      if(!S.started)return{text:'准备就绪：物块在斜面 AB 上',cls:''};
      if(S.seg==='S1')return{text:S.y[1]>=0?'沿光滑斜面 AB 滑下':'滑上斜面 AB（光滑，不损失机械能）',cls:''};
      if(S.seg==='BC')return{text:`在 BC 上滑行：摩擦力做负功（第 ${S.trips+1} 趟）`,cls:''};
      return{text:K.muD>0?(S.y[1]>=0?'滑上粗糙斜面 CD：重力、摩擦力都做负功':'沿 CD 滑下：摩擦力仍做负功'):'滑上斜面 CD（光滑）',cls:''}}
    if(S.rest){if(K.T.kind==='none')return{text:`tanθ ≤ μ₁：不下滑`,cls:'warn'};
      return S.stop.seg==='I'?{text:`停在斜面上（tanθ ≤ μ₁）`,cls:'ok'}:{text:`停下：离 O ${f(S.stop.u)} m，离出发点水平 ${f(K.xO+S.stop.u)} m`,cls:'ok'}}
    if(!S.started)return{text:'准备就绪：物块在斜面顶端',cls:''};
    return S.seg==='I'?{text:'沿斜面下滑：重力做正功，摩擦力做负功',cls:''}:{text:'在水平面上减速：只有摩擦力做功',cls:''}}

  /* ================= 画图 ================= */
  function txt(ctx,F,tok){const t=F.ut,SERIF='"Times New Roman","STIX Two Text",Times,serif',SANS=tok('--f-body');
    const wid=(s,size,o={})=>{ctx.save();ctx.font=o.zh?`${size*t}px ${SANS}`:`${o.i===false?'':'italic '}${size*t}px ${SERIF}`;const w=ctx.measureText(s).width;ctx.restore();return w};
    const sz=o=>(o.s||19)*(o.sub?.66:1);
    const pw=parts=>parts.reduce((a,[s,o={}])=>a+wid(s,sz(o),o),0);
    // 一行混排：parts = [[文字, {i:false 正体, s 字号, sub 下标, zh 中文}]]，按 align 对齐到 (x,y)
    const run=(parts,x,y,{color=F.ink,align='left'}={})=>{let cx=x-(align==='center'?.5:align==='right'?1:0)*pw(parts);
      for(const[s,o={}]of parts){const size=sz(o),w=wid(s,size,o),y1=y+(o.sub?(o.s||19)*.3*t:0);
        if(o.zh)F.zh(s,cx,y1,{color,size,align:'left'});else F.label(s,cx,y1,{color,size,align:'left',italic:o.i!==false});cx+=w}};
    const q=(b,sub,pr,s=19)=>{const p=[[b,{s,i:!/^[Δ0-9]/.test(b)}]];if(sub)p.push([sub,{s,sub:1,i:/^[a-zA-Z]$/.test(sub),zh:/[一-鿿]/.test(sub)}]);if(pr)p.push(['′',{s,i:false}]);return p};
    const R=(s,size=14)=>[s,{i:false,s:size}],Zh=(s,size=13)=>[s,{zh:1,s:size}];
    return{wid,pw,run,q,R,Zh}}
  // 矢量：标注 pl = 0 写在箭头尖外侧，'u'、'd'、'l'、'r' 写在箭头尖的上、下、左、右
  function vec(L,x,y,dx,dy,color,lab,pl=0){const{F,T,u,t}=L,len=Math.hypot(dx,dy);if(!(len>=2*u))return;
    F.arrow(x,y,dx,dy,color,null,{w:2,head:11});if(!lab)return;const ux=dx/len,uy=dy/len;
    if(pl){const k=Math.min(10*t,len*.4),o={u:[0,-12],d:[0,12],l:[-13,0],r:[13,0]}[pl];T.run(lab,x+dx-ux*k+o[0]*t,y+dy-uy*k+o[1]*t,{color,align:pl==='l'?'right':pl==='r'?'left':'center'})}
    else T.run(lab,x+dx+ux*8*t,y+dy+uy*9*t,{color,align:Math.abs(ux)<.4?'center':ux>0?'left':'right'})}
  // 固定面：墨线 + 斜线阴影（从左往右画，阴影在下方）；粗糙段在表面上方加一排细小点
  const surf=(L,x1,y1,x2,y2)=>{L.F.line(x1,y1,x2,y2,{w:2});L.F.hatch(x1,y1,x2,y2,1)};
  function rough(L,x1,y1,x2,y2){const{F,u}=L,len=Math.hypot(x2-x1,y2-y1);if(len<4*u)return;const tx=(x2-x1)/len,ty=(y2-y1)/len,nx=ty,ny=-tx,gap=6*u,n=Math.max(1,Math.floor(len/gap));
    for(let i=0;i<n;i++){const s=(i+.5)*len/n;F.dot(x1+tx*s+nx*3.6*u,y1+ty*s+ny*3.6*u,.85)}}
  // 物块：墨线空心方块，底边中点贴在接触点 (x,y)，随切线（世界角 psi）转动；返回重心
  function block(L,x,y,psi,b){const{F}=L,c=Math.cos(psi),s=Math.sin(psi),tx=c,ty=-s,nx=-s,ny=-c,h=b/2;
    F.poly([[x-tx*h,y-ty*h],[x+tx*h,y+ty*h],[x+tx*h+nx*b,y+ty*h+ny*b],[x-tx*h+nx*b,y-ty*h+ny*b],[x-tx*h,y-ty*h]],{w:1.6,fill:L.paper});
    return[x+nx*h,y+ny*h,nx,ny]}
  function cross0(L,x,y){const{F,u}=L;F.line(x-5*u,y,x+5*u,y,{w:1});F.line(x,y-5*u,x,y+5*u,{w:1})}
  // 第一行：左上角是点状标注的图例，右上角是比例尺与画面倍速
  function corner(L,K,sc){const{F,T,u,t,W,y0,C}=L,yy=y0+9*t;let xr=W-12*u;
    if(Math.abs(K.rate-1)>1e-9){const s=rateTxt(K.rate);F.zh(s,xr,yy,{align:'right',size:13,color:C.w});xr-=T.wid(s,13,{zh:1})+16*u}
    const st=[.01,.02,.05,.1,.2,.5,1,2,5,10,20,50].find(s=>s*sc>=30*u)||100,x0=xr-st*sc;
    F.line(x0,yy,xr,yy,{w:1.2});F.line(x0,yy-4*u,x0,yy+4*u,{w:1.2});F.line(xr,yy-4*u,xr,yy+4*u,{w:1.2});
    T.run([T.R(num(st)+' m',13)],x0-5*u,yy,{align:'right'});
    const lx=12*u;F.line(lx,yy+4*u,lx+26*u,yy+4*u,{w:1.6});rough(L,lx,yy+4*u,lx+26*u,yy+4*u);F.zh('粗糙段',lx+31*u,yy,{align:'left',size:13})}
  const muLab=(L,sym,v,x,y,al='center')=>L.T.run([...sym,L.T.R(' = '+sf(v,2),14)],x,y,{align:al});
  // 装置图的竖直位置：图形高 ph（不小于 minH），在 [top, yMax − botM] 里居中；返回地面的 y
  function place(top,yMax,botM,wy,sc,minH){const avail=Math.max(0,yMax-botM-top),ph=Math.max(wy*sc,Math.min(minH,avail));return top+Math.max(0,(avail-ph)/2)+ph}
  // 地面下方的尺寸标注行
  const rowY=(L,yG,i)=>yG+30*L.u+8*L.t+i*22*L.t;
  // 停点：竖直短线穿过地面，「停」写在地面下方左侧（上方留给物块与矢量）
  function stopMark(L,x,yG){const{F,u}=L;F.line(x,yG-6*u,x,yG+7*u,{w:1.4});F.zh('停',x-6*u,yG+16*u,{align:'right',size:12})}
  // 受力与速度：从重心画出；N 先画，mg 后画；力的箭头长度上限 84u
  function vectors(L,K,S,cx,cy,nx,ny,psi,p){const{u,T,C}=L,cap=84*u,fs=32*u/Math.max(K.m*g,K.sc==='push'?K.F:0,1e-12),vs=50*u/Math.max(K.B.vmax,1e-12);
    const ln=x=>Math.min(cap,x*fs),tx=Math.cos(psi),ty=-Math.sin(psi),q=T.q;
    if(p.fly){if(!S.fin){vec(L,cx,cy,0,ln(K.m*g),C.g,q('mg',0,0,17),'r');if(p.v>1e-9)vec(L,cx,cy,p.vx*vs,-p.vy*vs,C.v,q('v',0,0,17),0)}L.F.dot(cx,cy,2.2);return}
    const tr=TR[K.sc],N=tr.N(K,S,S.seg,S.y[0],S.y[1]),mu=tr.mu(K,S,S.seg),v=S.y[1],moving=Math.abs(v)>1e-9&&!S.rest;
    if(N>0)vec(L,cx,cy,nx*ln(N),ny*ln(N),C.n,q('N',0,0,17),0);
    vec(L,cx,cy,0,ln(K.m*g),C.g,q('mg',0,0,17),'r');
    if(moving&&mu>0){const f=mu*N,sg0=v>0?-1:1;vec(L,cx,cy,sg0*tx*ln(f),sg0*ty*ln(f),C.n,q('f',0,0,17),0)}
    if(K.sc==='push'&&S.push&&S.seg==='AB'&&!S.rest){const a=K.al;vec(L,cx,cy,Math.cos(a)*ln(K.F),Math.sin(a)*ln(K.F),C.g,q('F',0,0,17),0)}
    if(moving)vec(L,cx,cy,Math.sign(v)*tx*Math.abs(v)*vs,Math.sign(v)*ty*Math.abs(v)*vs,C.v,q('v',0,0,17),Math.abs(ty)<.3?'u':0);
    L.F.dot(cx,cy,2.2)}
  // 各次速度为零的最高点：短横线（最多 8 条），标 h₁、h₂ …（同一侧相邻两个标注太近时不标）
  function apexMarks(L,S,X,Y,segs,lab){const{F,T,u,t}=L;let k=0;const lastY={};
    for(const a of S.apex){if(!segs.includes(a.seg))continue;k++;if(k>8)break;const ax=X(a.x),ay=Y(a.y),rt=a.seg==='S2'||a.seg==='ARC';
      F.aux(ax-(rt?2:22)*u,ay,ax+(rt?22:2)*u,ay,{dash:[3,3]});
      if(lab&&k<=4&&(lastY[a.seg]===undefined||Math.abs(lastY[a.seg]-ay)>15*t)){T.run(T.q('h',String(k),0,15),rt?ax+24*u:ax-24*u,ay+(rt?-9:9)*t,{align:rt?'left':'right'});lastY[a.seg]=ay}}}

  /* ---------- ① 推过粗糙段冲上圆弧：装置图 ---------- */
  function devPush(L,S,yMax){
    const{F,T,u,t,W,y0,bsU}=L,K=S.K,B=K.B,q=T.q;
    const hS=Math.max(B.ySL*1.08,.45*K.R,.05*K.L),xL=-hS/K.tL,wx=K.L+K.R-xL,wy=Math.max(2*K.R,hS);
    const nRow=K.pFin&&K.pFin.kind==='land'?2:1,mxL=(K.vA>0?40:20)*u,mxR=40*u,top=y0+34*t,botM=30*u+8*t+nRow*22*t;
    const sc=Math.min((W-mxL-mxR)/wx,Math.max(10*u,yMax-top-botM)/wy),pw=wx*sc;
    const x0=mxL+(W-mxL-mxR-pw)/2,yG=place(top,yMax,botM,wy,sc,96*u);
    const X=x=>x0+(x-xL)*sc,Y=y=>yG-y*sc,Rp=K.R*sc,cxO=X(K.L),cyO=Y(K.R);
    corner(L,K,sc);
    // 轨道：左侧光滑斜面、粗糙段 AB（点状标注）、光滑半圆 BCD（外侧斜线阴影）、B 右侧地面
    const xa=X(0),xb=X(K.L);
    surf(L,X(xL),Y(hS),xa,yG);surf(L,xa,yG,xb,yG);rough(L,xa,yG,xb,yG);
    F.line(xb,yG,X(K.L+K.R)+24*u,yG,{w:2});F.hatch(xb,yG,X(K.L+K.R)+24*u,yG,1);
    F.arc(cxO,cyO,Rp,-HALF,HALF,{w:2});F.hatchArc(cxO,cyO,Rp,-HALF,HALF,true);
    if(xa-X(xL)>44*u)F.zh('光滑',X(xL/2)+8*u,Y(hS/2)-12*u,{align:'left',size:13});
    muLab(L,[['μ',{s:17}]],K.mu,xa+Math.min((xb-xa)*.22,60*u),yG-14*t,'center');
    T.run([['A',{s:17}]],xa-5*u,yG+12*t,{align:'right'});T.run([['B',{s:17}]],xb,yG+12*t,{align:'center'});
    if(Rp>=22*u){F.zh('光滑',W-4*u,cyO+18*t,{align:'right',size:13});
      // C、D 两个高度（C5）与半径 R
      F.aux(cxO-Rp-10*u,cyO,cxO+Rp+12*u,cyO);F.aux(cxO-Rp*.7,Y(2*K.R),cxO+Rp+12*u,Y(2*K.R));
      cross0(L,cxO,cyO);T.run([['O',{s:16}]],cxO-6*u,cyO-11*t,{align:'right'});
      {const a=PI/4;F.aux(cxO,cyO,cxO+Rp*Math.cos(a),cyO+Rp*Math.sin(a));T.run([['R',{s:16}]],cxO+Rp*.5*Math.cos(a)-8*t,cyO+Rp*.5*Math.sin(a)+6*t,{align:'right'})}
      T.run([['C',{s:17}]],cxO+Rp+6*u,cyO-10*t,{align:'left'});T.run([['D',{s:17}]],cxO,cyO-Rp-11*t,{align:'center'});
      F.zh('最高点',cxO+12*u,cyO-Rp-11*t,{align:'left',size:12})}
    else F.zh('B 端的光滑半圆 R = '+sf(K.R,2)+' m（图中很小）',W-12*u,y0+27*t,{align:'right',size:12});
    // 推力作用距离 d、撤去 F
    if(K.push0){const xe=X(K.de),yd=yG-Math.max(Math.min(Rp*1.15,yG-top-8*t),60*u);F.aux(xa,yG-2*u,xa,yd-5*u);F.aux(xe,yG-2*u,xe,yd-5*u);
      F.dim(xa,yd,xe,yd,null);T.run([['d',{s:17}]],(xa+xe)/2,yd-10*t,{align:'center'});
      const rt=xe+5*u+T.wid('撤去 F',12,{zh:1})<cxO-Rp-4*u;F.zh('撤去 F',rt?xe+5*u:xe-5*u,yd-11*t,{align:rt?'left':'right',size:12})}
    // 释放点与高度 h_A
    if(K.vA>0){const xs=X(K.u0*K.cL),ys=Y(K.hA),xd=Math.max(10*u,xs-16*u);F.dot(xs,ys,2.6);F.aux(xd-5*u,ys,xs,ys);F.aux(xd-5*u,yG,xa,yG,{dash:[3,4]});
      F.dim(xd,ys,xd,yG,null);T.run(q('h','A',0,17),xd-5*t,(ys+yG)/2,{align:'right'})}
    // 尺寸：L（第一行）、落点离 B（第二行）
    const r1=rowY(L,yG,0),r2=rowY(L,yG,1);
    F.aux(xa,yG+8*u,xa,r1+5*u,{dash:[3,3]});F.aux(xb,yG+8*u,xb,r1+5*u,{dash:[3,3]});
    F.dim(xa,r1,xb,r1,null);T.run([['L',{s:17}]],(xa+xb)/2,r1+11*t,{align:'center'});
    apexMarks(L,S,X,Y,['ARC','S'],false);
    // 轨迹（空中）
    if(S.trail.length>1)F.trail(S.trail.map(([x,y])=>[X(x),Y(y)]));
    if(S.der){const px=X(S.der.x),py=Y(S.der.y),nx=(px-cxO)/Math.max(Rp,1e-9),ny=(py-cyO)/Math.max(Rp,1e-9);F.dot(px,py,2.6);
      F.zh('脱轨点',cxO+nx*(Rp+14*u),cyO+ny*(Rp+14*u)-4*t,{align:nx>.3?'left':'center',size:12})}
    if(S.fin){const fx=X(S.fin.x),fy=Y(S.fin.y);
      if(S.fin.kind==='land'){F.line(fx,fy-7*u,fx,fy+7*u,{w:1.6});F.zh('落点',fx,fy-16*t,{size:12});
        F.aux(fx,yG+8*u,fx,r2+5*u,{dash:[3,3]});F.aux(xb,r1+6*u,xb,r2+5*u,{dash:[3,3]});
        if(Math.abs(xb-fx)>=4*u){F.dim(fx,r2,xb,r2,null);T.run([['x',{s:17}]],(fx+xb)/2,r2+11*t,{align:'center'})}}
      else{F.dot(fx,fy,2.4);F.zh('落回轨道',fx+8*u,fy+12*t,{align:'left',size:12})}}
    if(S.stop&&S.stop.seg==='AB'&&S.started)stopMark(L,X(S.stop.x),yG);
    // 物块（方块）或质点（空中，空心小圆）
    const p=posOf(K,S),bs=Math.min(14*bsU,K.reachB?Math.max(7*u,.5*Rp):14*bsU);
    if(p.fly){const bx=X(p.x),by=Y(p.y),rb=Math.max(4*u,.42*bs);F.ball(bx,by,rb);vectors(L,K,S,bx,by,0,0,0,p)}
    else{const[cx,cy,nx,ny]=block(L,X(p.x),Y(p.y),p.psi,bs);vectors(L,K,S,cx,cy,nx,ny,p.psi,p)}}

  /* ---------- ② 两斜面间往返：装置图 ---------- */
  function devShuttle(L,S,yMax){
    const{F,T,u,t,W,y0,bsU}=L,K=S.K,TT=K.T,B=K.B,q=T.q;
    const Hd=Math.max(K.h,B.ySR,B.ySL)*1.1,xl=-Hd/K.tn,xr=K.L+Hd/K.tn,wx=xr-xl,wy=Hd;
    const rows=Math.max(1,Math.min(TT.trips+1,LIM_TRIP)),mx=36*u,top=y0+34*t;
    const rulerH=Math.min(70*u,Math.max(20*u,rows*7*u)),botM=30*u+8*t+16*t+rulerH;
    const sc=Math.min((W-2*mx)/wx,Math.max(10*u,yMax-top-botM)/wy),pw=wx*sc,x0=(W-pw)/2,yG=place(top,yMax,botM,wy,sc,90*u);
    const X=x=>x0+(x-xl)*sc,Y=y=>yG-y*sc,xb=X(0),xc=X(K.L);
    corner(L,K,sc);
    surf(L,X(xl),Y(Hd),xb,yG);surf(L,xb,yG,xc,yG);surf(L,xc,yG,X(xr),Y(Hd));rough(L,xb,yG,xc,yG);
    if(K.muD>0)rough(L,xc,yG,X(xr),Y(Hd));
    F.zh('光滑',X(xl*.55)+8*u,Y(Hd*.55)-12*u,{align:'left',size:13});
    if(K.muD>0)muLab(L,q('μ',0,true,17),K.muD,X(K.L-xl*.55)-8*u,Y(Hd*.55)-14*t,'right');else F.zh('光滑',X(K.L-xl*.55)-8*u,Y(Hd*.55)-12*u,{align:'right',size:13});
    // μ 标在粗糙段上远离停点的一端，停下后不被物块挡住
    {const st=K.pStop,nearB=st&&st.seg==='BC'&&st.u<K.L/2;muLab(L,[['μ',{s:17}]],K.mu,nearB?xc-8*u:xb+8*u,yG-14*t,nearB?'right':'left')}
    T.run([['A',{s:17}]],X(xl)-6*u,Y(Hd)-4*t,{align:'right'});T.run([['B',{s:17}]],xb-4*u,yG+12*t,{align:'right'});
    T.run([['C',{s:17}]],xc+4*u,yG+12*t,{align:'left'});T.run([['D',{s:17}]],X(xr)+6*u,Y(Hd)-4*t,{align:'left'});
    // 释放点与 h
    {const xs=X(K.u0*K.cs),ys=Y(K.h),xd=Math.max(10*u,X(xl)-14*u);F.dot(xs,ys,2.6);F.aux(xd-5*u,ys,xs-4*u,ys);F.aux(xd-5*u,yG,xb,yG,{dash:[3,4]});
      F.dim(xd,ys,xd,yG,null);T.run([['h',{s:17}]],xd-5*t,(ys+yG)/2,{align:'right'})}
    apexMarks(L,S,X,Y,['S1','S2'],true);
    // L 与路程尺：每滑过一趟 BC 画一条长 L 的细墨线，奇数行向右、偶数行向左

    r.push(['画面倍速',rateTxt(K.rate)]);return r}
  function roShuttle(S){const K=S.K,T=K.T,c=common(S),w='待测',r=c.r,f4=x=>sf(x,4),mg=K.m*g;
    r.push(['BC 上的路程 s_BC 实测 / 公式',f4(S.y[7])+' / '+(T.stop.over?'—':f4(T.sBC))+' m']);
    if(K.muD>0)r.push(['CD 上的路程',f4(S.y[8])+' m']);
    r.push(...ledRows(c,K,K.muD>0?[['Wf1','摩擦力做功 W_f（BC 上）'],['Wf2','摩擦力做功 W_f（CD 上）']]:[['Wf1','摩擦力做功 W_f（只在 BC 上）']]));

    r.push(['经过 B、C 的次数 实测 / 公式',`${S.nB}、${S.nC} / `+(T.stop.over?'—':`${T.nB}、${T.nC}`)]);
    if(K.muD===0&&ok(T.s))r.push(['s = h/μ + v₀²/(2μg) = nL + Δ',`${sf(T.s,4)} m = ${T.n}L + ${sf(zp(T.D,K.L),3)} m`]);
    if(K.muD>0&&!T.st&&T.Ein)r.push(['回到 C 的动能比 实测 / (tanθ − μ′)/(tanθ + μ′)',(S.cd.length>=2?f4(S.cd[1]/S.cd[0]):w)+' / '+f4(T.r)]);
    if(K.muD>0)r.push(['CD 上摩擦力做功 实测 / 公式',sg(z(S.y[5],mg),4)+' / '+(T.stop.over?'—':sg(z(T.WCD,mg),4))+' J']);
    const st=S.rest&&!S.over&&S.stop;

  function roSlope(S){const K=S.K,T=K.T,c=common(S),w='待测',r=c.r,f4=x=>sf(x,4),mg=K.m*g,o=S.atO;

    if(T.kind==='hor'){r.push(['到 O：v_O 实测 / 公式',(o?f4(o.v):w)+' / '+f4(T.vO)+' m/s'],['到 O 用时 实测 / 公式',(o?tS(o.t):w)+' / '+tS(T.tO)+' s'],

      ['停点离 O：x 实测 / v_O²/(2μg)',(st?f4(S.stop.u):w)+' / '+f4(T.x)+' m'],
      ['离出发点水平距离 x总 实测 / 公式',(st?f4(K.xO+S.stop.u):w)+' / '+f4(T.xT)+' m'+(Math.abs(K.muS-K.mu)<1e-12&&K.v0===0?'（= h/μ）':'')])}
    if(T.kind==='inc')r.push(['停在斜面上：沿斜面滑行 实测 / v₀²/(2|a₁|)',(S.rest&&S.started?f4(S.stop.u-K.u0):w)+' / '+f4(T.dInc)+' m']);
    r.push(['h/μ（μ₁ = μ 时的 x总）',f4(T.hmu)+' m'],['tanθ 与 μ₁',`tanθ = ${sf(K.tn,3)}，μ₁ = ${sf(K.muS,3)} → `+(K.tn>K.muS+1e-5?'能滑下':'不下滑（θ ≤ '+sf(T.thMin,3)+'°）')]);
    r.push(['画面倍速',rateTxt(K.rate)]);return r}

  /* ================= 引擎不支持的界面细节 ================= */
  let cur=null,curP=null,ui=null,DATA=null;
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const tokD=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  function redraw(){if(typeof document==='undefined')return;const cv=document.getElementById('cv');if(!cv||!cur||!curP)return;
    SIM.draw(cv.getContext('2d'),cur,curP,cv.width,cv.height,tokD);
    const ro=document.getElementById('readout');if(ro)ro.innerHTML=SIM.readouts(cur,curP).map(([k,v])=>`<div class="ro"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('');
    const st=document.getElementById('status');if(st){st.textContent=cur.status.text;st.className='status '+cur.status.cls}}
  const playing=()=>{const pb=document.getElementById('play');return!!pb&&/暂停/.test(pb.textContent)};
  const LOGK=['m','mu','L'],ANG=['th','al'];
  const stepDt=S=>clamp(Math.max(S.K.Tp/S.K.rate,.5)/40,.01,.25);
  function enhance(){
    if(ui||typeof document==='undefined')return;
    const play=document.getElementById('play');if(!play||!play.parentElement)return;
    ui={};
    for(const k of LOGK){const r=document.getElementById('in-'+k),n=document.getElementById('num-'+k);if(!r||!n)continue;
      const lo=Math.log10(+n.min),hi=Math.log10(+n.max);r.min=String(lo);r.max=String(hi);r.step='0.002';r.dataset.log='1';
      // 在外层捕获滑块的 input，不让它到达引擎（引擎会把对数值当真值），改由输入框的 change 交给引擎
      r.parentElement.addEventListener('input',e=>{if(e.target!==r)return;e.stopPropagation();
        n.value=String(+Math.pow(10,+r.value).toPrecision(3));n.dispatchEvent(new Event('change'))},true)}
    // 角度：输入 37 按 36.87°、53 按 53.13°（3∶4∶5 三角形）载入
    for(const k of ANG){const n=document.getElementById('num-'+k);if(!n)continue;
      n.parentElement.addEventListener('change',e=>{if(e.target!==n)return;const v=parseFloat(n.value);
        if(Math.abs(Math.abs(v)-37)<1e-9)n.value=String(Math.sign(v)*36.87);else if(Math.abs(Math.abs(v)-53)<1e-9)n.value=String(Math.sign(v)*53.13)},true)}
    const bar=play.parentElement;
    ui.step=document.createElement('button');ui.step.type='button';ui.step.textContent='单步';bar.appendChild(ui.step);
    ui.step.addEventListener('click',()=>{const S=cur;if(!S||S.done||playing())return;S.started=true;adv(S,stepDt(S));redraw();
      const pb=document.getElementById('play');if(pb)pb.textContent=S.done?'▶ 再开始':'▶ 继续'});
    ui.keep=document.createElement('button');ui.keep.type='button';bar.appendChild(ui.keep);
    ui.keep.addEventListener('click',()=>{keepOn=!keepOn;syncUI();redraw()});
  }
  function syncUI(){if(!ui||!curP)return;ui.keep.hidden=scOf(curP)!=='slope';ui.keep.setAttribute('aria-pressed',String(keepOn));ui.keep.textContent=keepOn?'保留上一次停点 ✓':'保留上一次停点'}
  // 题干中的数：3 位有效数字（角度保留两位小数，° 紧贴数字）
  const stemNum=x=>{if(!ok(x))return'—';if(x===0)return'0';let s=String(+x.toPrecision(3));if(s.replace(/^[-0.]+/,'').replace('.','').length<2)s=(+x).toPrecision(2);return s.replace('-','−')};
  function refreshUI(P){
    if(typeof document==='undefined')return;
    try{enhance();curP=P;
      for(const k of LOGK){const r=document.getElementById('in-'+k);if(!r||!r.dataset.log)continue;r.value=String(Math.log10(Math.max(+P[k],1e-12)))}
      if(!DATA)DATA=JSON.parse(document.getElementById('data').textContent);
      const keys=[...DATA.problem.stem.matchAll(/\{(\w+)\}/g)].map(m=>m[1]).filter(k=>k!=='constraint');

        sp.textContent=U[k]==='°'?String(+(+P[k]).toFixed(2)).replace('-','−')+'°':stemNum(+P[k])+(U[k]?' '+U[k]:'')});
      syncUI()}catch(e){}
  }
  function uiState(S){if(!ui)return;try{ui.step.disabled=!!S.done}catch(e){}}
  // 一次播放结束时记下停点（slope「保留上一次停点」用）
  function remember(S){const K=S.K;if(K.sc!=='slope'||!S.done||!S.stop||S.stop.seg!=='H'||!S.started)return;
    runs=runs.filter(r=>r.key!==K.key);runs.push({key:K.key,xT:K.xO+S.stop.u});if(runs.length>6)runs.shift()}

  return{
    legend:[{label:'重力 mg、推力 F',color:'--g'},{label:'支持力 N、摩擦力 f',color:'--n'},{label:'速度 v',color:'--v'}],
    init(P){const K=cfg(P);K.key=memo.key;const S=init0(K);S.status=stat(S);cur=S;curP=P;return S},
    step(S,P,dt){if(S.done)return;cur=S;curP=P;S.started=true;adv(S,dt);if(S.done)remember(S)},
    readouts(S,P){uiState(S);const K=S.K;return K.sc==='push'?roPush(S):K.sc==='shuttle'?roShuttle(S):roSlope(S)},
    draw(ctx,S,P,W,H,tok){
      const F=FIG(ctx,W,tok),u=F.u,t=F.ut;F.clear();
      const narrow=typeof matchMedia==='function'&&matchMedia('(max-width:640px)').matches,cw=ctx.canvas.clientWidth||640;
      // 桌面宽度时状态条（一行，底边约 46 CSS px）浮在画布左上角，图从它下面开始；窄屏（≤ 640px）时状态条排在画布下方
      const y0=narrow?8*u:(46*720/cw+8)*u;
      const L={F,T:txt(ctx,F,tok),u,t,ink:F.ink,cX:F.auxColor,paper:F.paper,C:{g:tok('--g'),n:tok('--n'),v:tok('--v'),w:tok('--warn')},
        W,H,y0,bsU:narrow?Math.max(u,.8*t):t,narrow};

      const K=S.K,yC=y0+(H-y0)*.6;

    verdict(P){

        let h=`推力作用段：N = mg + F sinα = ${b(N(K.N1))}，f = μN = ${N(K.mu*K.N1)}；W_F = Fd·cosα = ${b(J(K.Fc*K.de))}${K.d>K.L?`（d ≥ L，推到 B 点撤去）`:''}（C1、C2）。`;
        if(!K.push0)h=`没有推力（F = 0 或 d = 0）${K.vA>0?`：物块从左侧光滑斜面高 ${m(K.hA)} 处滑下，到 A 点 v_A = ${ms(K.vA)}`:''}。`;
        if(T.kind==='none')return h+`<br>${K.push0?`推不动：F cosα = ${N(K.Fc)} ≤ μ(mg + F sinα) = ${N(K.mu*K.N1)}（推动所需 F > ${sf(T.F0,3)} N）。`:'物块静止。'}`;
        if(T.kind==='stopPush')return h+`<br>推力不足以克服摩擦，物块在推力作用下减速，停在离 A ${b(m(T.uStop))} 处。`;
        if(K.push0)h+=` 撤去 F 时 v₁ = √(v_A² + 2d(F cosα − μN)/m) = ${b(ms(T.v1))}。`;
        h+=`<br>A → B 全过程：½mv_A² + F·k − μmgL = E_kB，k = d(cosα − μ sinα) = ${sf(T.k,3)} m，μmgL = ${J(K.mu*mg*K.L)}，`;
        if(T.kind==='AB')return h+`E_kB ≤ 0：到不了 B，停在离 A ${b(m(T.uStop))} 处（AB 上路程 (½mv_A² + Fk)/(μmg) = ${m(T.sR)}，C4、C6）。`+thr(K);
        h+=`E_kB = ${b(J(T.EkB))}，v_B = ${b(ms(T.vB))}，N_B = mg + mv_B²/R = ${b(N(T.NB))}（竖直向下压轨道）。<br>`;
        h+=`与 mgR = ${J(K.mgR)}、2.5mgR = ${J(2.5*K.mgR)} 比较（C5）：`;

        else if(T.kind==='der')h+=`mgR < E_kB < 2.5mgR，在上半圆脱轨：离 B 高 (v_B² + gR)/(3g) = ${b(m(T.hd))}，此时 v = ${ms(T.vd)}，之后做斜抛运动。`;
        else h+=`E_kB ≥ 2.5mgR，能通过 D：v_D = √(v_B² − 4gR) = ${b(ms(T.vD))}，N_D = mv_D²/R − mg = ${b(N(z(T.ND,mg)))}（N_B − N_D = 6mg）；平抛 2R 用时 ${sf(T.tf,3)} s，落点离 B ${b(m(T.dl))}${T.onSlope?'（越过 A，落在左侧斜面上）':''}。`;
        return h+thr(K)}

        if(T.EkC1<=0)return h+`mgh + ½mv₀² ≤ μmgL，第一趟就停在 BC 上，离 B ${b(m(T.stop.u))}（C6）。`;
        h+=`到 C 时 E_k = mgh + ½mv₀² − μmgL = ${J(T.EkC1)}，第一次滑上 CD 的高度 ${b(m(T.y1))}${K.muD>0?' = E_k/[mg(1 + μ′/tanθ)]':''}（C1）。<br>`;

        else if(T.st)h+=`μ′ = ${sf(K.muD,3)} ≥ tanθ = ${sf(K.tn,3)}：最大静摩擦力不小于 mg sinθ，物块滑上 CD 后停在斜面上，沿 CD 滑 ${b(m(T.stop.sp))}（高 ${m(T.y1)}），不再下滑。`;
        else h+=`μ′ = ${sf(K.muD,3)} < tanθ = ${sf(K.tn,3)}，滑上 CD 后会滑回；每滑上滑下一次，回到 C 的动能变为原来的 (tanθ − μ′)/(tanθ + μ′) = ${b(sf(T.r,3))}（C6）。`+(T.stop.over?'往返次数太多。':`最终停在${T.stop.seg==='BC'?`离 B ${b(m(T.stop.u))} 处`:'CD 上'}，BC 上路程 ${m(T.sBC)}，CD 上摩擦力做功 ${J(T.WCD)}；经过 B ${T.nB} 次、C ${T.nC} 次。`);

      if(T.kind==='none')return h+`<br>tanθ = ${sf(K.tn,3)} ≤ μ₁ = ${sf(K.muS,3)}：最大静摩擦力不小于 mg sinθ，物块不下滑。`;
      if(T.kind==='inc')return h+`<br>a₁ < 0，物块沿斜面减速，滑行 ${b(m(T.dInc))} 后停在斜面上（tanθ < μ₁）。`;
      h+=` 斜面长 h/sinθ = ${m(K.Lin)}，到 O：v_O = ${b(ms(T.vO))}；水平面上 a₂ = μg = ${sf(T.a2,3)} m/s²，滑行 x = v_O²/(2μg) = ${b(m(T.x))}（C1）。<br>`;
      h+=`摩擦力做功：斜面上 −μ₁mg·h/tanθ = ${b(J(T.Wf2))}（= μ₁mg × 斜面的水平投影 ${m(K.xO)}，C2），水平面上 −μmg·x = ${b(J(T.Wf1))}，全过程 ${J(T.Wf1+T.Wf2)}`+(K.v0===0?`（= −mgh = ${J(-mg*K.h)}，C3）`:'')+`。<br>`;
      h+=`停点离 O：x = h(1 − μ₁/tanθ)/μ${K.v0>0?' + v₀²/(2μg)':''} = ${b(m(T.x))}；离出发点的水平距离 x总 = h/tanθ + x = ${b(m(T.xT))}`+(Math.abs(K.muS-K.mu)<1e-12&&K.v0===0?`，正是 h/μ = ${m(T.hmu)}：与 θ、m 无关（C3）。`:`（μ₁ = μ、v₀ = 0 时为 h/μ = ${m(T.hmu)}）。`);
      return h},
    _cfg:P=>cfg(P),_adv:adv
  };
  function thr(K){const T=K.T;if(!ok(T.FB))return'';const f=x=>sf(x,3)+' N';
    return`<br>临界推力（C4、C5，按当前 d、α、L、μ、R、v_A）：到达 B 需 F > ${'<b>'+f(T.FB)+'</b>'}；到达 C 需 F ≥ ${'<b>'+f(T.FC)+'</b>'}（不超过 C：F ≤ ${f(T.FC)}）；通过 D 需 F ≥ ${'<b>'+f(T.FD)+'</b>'}。不脱离轨道：F ≤ ${f(T.FC)} 或 F ≥ ${f(T.FD)}；两者之间在上半圆脱轨。`}
})();

/* ================= 通用渲染引擎（所有母题共用，不改） ================= */
(()=>{
const D=JSON.parse(document.getElementById('data').textContent);
const PLAY=D.playLabel||'发射';   // 播放按钮上的动词，数据里可用 playLabel 改写（如「碰撞」「转动」）
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const root=document.documentElement;
const tok=n=>getComputedStyle(root).getPropertyValue(n).trim();
const PS=D.problem.params;
const P={};PS.forEach(p=>P[p.key]=p.def);
const unitSep=u=>/^[°′″]/.test(u)?'':' ';   // 角度单位紧贴数字：90°
const fmtP=p=>p.type==='choice'?p.options.find(o=>o.value===P[p.key]).label:(+P[p.key]).toFixed(p.dec??2)+(p.unit?unitSep(p.unit)+p.unit:'');

/* 静态内容 */
document.title=`格物 ${D.id} ${D.name.replace(/（.*）/,'')}`;
$('hName').textContent=D.name;
$('hSub').textContent=`${D.module} · ${D.chapter}　关联：${D.related.join('、')}`;
$('hTable').innerHTML=`<tr><th>编号</th><th>考查频率</th><th>难度</th><th>版本</th></tr>
<tr><td class="code">${esc(D.id)}</td><td>${esc(D.freq)}</td><td title="${D.difficulty} / 5">${'●'.repeat(D.difficulty)}${'○'.repeat(5-D.difficulty)}</td><td>${esc(D.version)}</td></tr>`;
$('foot').textContent=`格物 Gewu · ${D.id} · ${D.version} · ${D.footer??'g 取 10 m/s²'}`;   // 数据里可用 footer 改写页脚常量
$('tags').innerHTML=D.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('');
$('stemNote').textContent=D.problem.note||'';
$('bCond').innerHTML=D.boundary.conditions.map(c=>`<li><span>${esc(c)}</span></li>`).join('');
$('bBack').innerHTML=D.boundary.fallback.map(c=>`<li><span>${esc(c)}</span></li>`).join('');
$('legend').innerHTML=SIM.legend.map(l=>`<span><i style="background:var(${l.color})"></i>${esc(l.label)}</span>`).join('');
$('concl').innerHTML=D.conclusions.map(c=>`<details><summary><span class="badge">${c.id}</span><span class="t">${esc(c.title)}</span><span class="f">${esc(c.formula)}</span><span class="chev" aria-hidden="true"></span></summary><div class="deriv">${esc(c.derivation)}</div></details>`).join('');
const qCard=(q,isVar)=>`<article class="q">
  <div class="head"><span class="badge">${q.id}</span><h3>${esc(q.title)}</h3>${isVar?q.cs.map(c=>`<span class="chip">${c}</span>`).join(''):`<span class="chip">${q.anim?'计划做动画':'不做动画'}</span>`}</div>
  <p>${esc(q.stem)}</p>
  ${isVar?'':`<p class="map">映射：<b>${esc(q.map)}</b></p>`}
  <details><summary><span class="chev" aria-hidden="true"></span>答案与解析</summary><div class="ans"><p class="a">答案：${esc(q.answer)}</p><p>${esc(q.analysis)}</p></div></details>
  <div class="foot"><span class="src">${esc(q.source)}</span>${isVar?`<button data-load="${q.id}">加载到动画 ↑</button>`:''}</div>
</article>`;
$('variants').innerHTML=D.variants.map(v=>qCard(v,true)).join('');
$('reskins').innerHTML=D.reskins.map(r=>qCard(r,false)).join('');
$('sources').innerHTML=D.sources.map(s=>`<li><b>${esc(s.src)}</b><span>${esc(s.desc)}</span></li>`).join('');

/* 参数控件 */
const box=$('params');
PS.forEach(p=>{
  if(p.type==='choice'){
    const d=document.createElement('div');d.className='seg';d.id=`f-${p.key}`;d.setAttribute('role','group');d.setAttribute('aria-label',p.label);
    d.innerHTML=p.options.map(o=>`<button id="opt-${p.key}-${o.value}" data-k="${p.key}" data-v="${o.value}">${esc(o.label)}${o.hint?`<small>${esc(o.hint)}</small>`:""}</button>`).join('');
    box.appendChild(d);
  }else{
    const d=document.createElement('div');d.className='field';d.id=`f-${p.key}`;
    d.innerHTML=`<label for="num-${p.key}"><span class="s">${esc(p.sym)}</span><span class="note">${esc(p.label)}</span></label><span class="numin"><input type="number" id="num-${p.key}" min="${p.min}" max="${p.max}" step="any" inputmode="decimal" aria-label="${esc(p.label)}"><span class="u">${esc(p.unit||'')}</span></span><input type="range" id="in-${p.key}" min="${p.min}" max="${p.max}" step="${p.step}" value="${p.def}" aria-label="${esc(p.label)} 滑块">`;
    box.appendChild(d);
    d.querySelector('input[type=range]').addEventListener('input',e=>{P[p.key]=+e.target.value;active=-1;sync();reset()});
    const num=d.querySelector('input[type=number]');
    num.addEventListener('change',()=>{let v=parseFloat(num.value);
      if(Number.isFinite(v)){v=Math.min(p.max,Math.max(p.min,v));P[p.key]=v;active=-1;reset()}sync()});
    num.addEventListener('keydown',e=>{if(e.key==='Enter')num.blur()});
  }
});
box.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;P[b.dataset.k]=b.dataset.v;active=-1;sync();reset()});
let active=-1;
const shown=w=>!w||Object.entries(w).every(([k,v])=>[].concat(v).includes(P[k]));
const CH0=PS.find(p=>p.type==='choice');   // 预设只按第一个选项参数（情境 / 模式）分组，其余选项由预设的 load 带过去
const chosen=o=>!CH0||o[CH0.key]===undefined||o[CH0.key]===P[CH0.key];
const numTxt=(p,v)=>String(+(+v).toFixed(Math.max(p.dec??2,4)));
function sync(){
  PS.forEach(p=>{
    if(p.type==='choice'){p.options.forEach(o=>$(`opt-${p.key}-${o.value}`).setAttribute('aria-pressed',P[p.key]===o.value));if(p.when)$(`f-${p.key}`).hidden=!shown(p.when)}
    else{$(`in-${p.key}`).value=P[p.key];const n=$(`num-${p.key}`);if(document.activeElement!==n)n.value=numTxt(p,P[p.key]);$(`f-${p.key}`).hidden=!shown(p.when)}
  });
  const fill=s=>esc(s).replace(/\{(\w+)\}/g,(m,k)=>{
    if(k==='constraint'){const p=PS.find(x=>x.type==='choice');return esc(p.options.find(o=>o.value===P[p.key]).text)}
    const p=PS.find(x=>x.key===k);return p?`<span class="num">${esc(fmtP(p))}</span>`:m});
  const [lead,ask='']=D.problem.stem.split(/问[:：]/);
  $('stem').innerHTML=fill(lead.trim());
  const qs=ask.split(/[①②③④⑤⑥]/).map(s=>s.trim()).filter(Boolean);
  $('asks').innerHTML=qs.map((q,i)=>`<li><b>${i+1}</b><span>${fill(q)}</span></li>`).join('');
  $('asks').hidden=!qs.length;
  $('verdict').innerHTML=SIM.verdict(P);
  const ch=PS.find(p=>p.type==='choice');
  $('presetMode').textContent=ch?`· ${ch.options.find(o=>o.value===P[ch.key]).label}`:'';
  $('presets').innerHTML=D.presets.map((p,i)=>chosen(p.load)?`<button data-preset="${i}" aria-pressed="${i===active}" title="${esc(p.note||'')}">${esc(p.label)}</button>`:'').join('');
  const pn=$('pnote'),ap=D.presets[active];pn.hidden=!(ap&&ap.note);if(ap&&ap.note)pn.innerHTML=`<b>${esc(ap.label)}</b>：${esc(ap.note)}`;
}
function load(o,i=-1){Object.assign(P,o);active=i;sync();reset()}
$('presets').addEventListener('click',e=>{const b=e.target.closest('[data-preset]');if(b)load(D.presets[+b.dataset.preset].load,+b.dataset.preset)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-load]');if(!b)return;
  load(D.variants.find(v=>v.id===b.dataset.load).load);
  show('pane-lab');document.querySelector('.board').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})});

/* 画布与循环 */
const cv=$('cv'),ctx=cv.getContext('2d');let S,running=false,speed=1,lastT=0;
function size(){const r=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);const w=Math.max(200,Math.round(r.width*dpr));if(cv.width!==w){cv.width=w;cv.height=w}}
function render(){size();SIM.draw(ctx,S,P,cv.width,cv.height,tok);
  $('readout').innerHTML=SIM.readouts(S,P).map(([k,v])=>`<div class="ro"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('');
  const st=$('status');st.textContent=S.status.text;st.className='status '+S.status.cls}
function reset(){running=false;S=SIM.init(P);$('play').textContent=`▶ ${PLAY}`;render()}
function loop(t){if(!running)return;const real=Math.min(.05,(t-lastT)/1000);lastT=t;
  const sim=real*speed,n=Math.max(1,Math.ceil(sim/5e-4));for(let i=0;i<n;i++)SIM.step(S,P,sim/n);
  render();if(S.done){running=false;$('play').textContent=`▶ 再${PLAY}`;return}requestAnimationFrame(loop)}
$('play').onclick=()=>{if(running){running=false;$('play').textContent='▶ 继续';return}
  if(S.done)S=SIM.init(P);running=true;$('play').textContent='❚❚ 暂停';lastT=performance.now();requestAnimationFrame(loop)};
$('reset').onclick=reset;
$('slow').onclick=()=>{speed=speed===1?.25:1;$('slow').textContent=speed===1?'慢放 ×0.25':'正常速度'};
new ResizeObserver(render).observe(cv);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);
new MutationObserver(render).observe(root,{attributes:true,attributeFilter:['data-theme']});
/* 选项卡 */
const tabs=[...document.querySelectorAll('[role=tab]')];
function show(id){tabs.forEach(t=>{const on=t.dataset.pane===id;t.setAttribute('aria-selected',on);t.tabIndex=on?0:-1;$(t.dataset.pane).hidden=!on});
  if(id==='pane-lab')requestAnimationFrame(render)}
tabs.forEach((t,i)=>{t.addEventListener('click',()=>show(t.dataset.pane));
  t.addEventListener('keydown',e=>{const d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;if(!d)return;e.preventDefault();
    const n=tabs[(i+d+tabs.length)%tabs.length];n.focus();show(n.dataset.pane)})});
$('nConcl').textContent=D.conclusions.length;$('nVar').textContent=D.variants.length;$('nSkin').textContent=D.reskins.length;$('nSrc').textContent=D.sources.length;
show('pane-lab');
sync();reset();
})();
</script>
