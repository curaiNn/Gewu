<script>
/* ================= 线稿绘图工具 FIG（所有母题共用，不改） =================
   画法照试卷插图：装置用墨线，固定面画斜线阴影，辅助线用虚线，物理量和点的字母用斜体衬线；
   只有矢量带颜色（--g 重力/外力，--n 弹力/约束力，--v 速度，--a 其他矢量）。
   用法：SIM.draw 里 const F=FIG(ctx,W,tok)；坐标是画布像素，F.u = W/720 是线宽与几何的基准单位，
   F.ut 是字号单位（窄屏时不再随画布缩小，保证字母不小于约 11 CSS 像素；自写文字函数也要用 F.ut 算字号）。
   颜色：F.ink 墨线、F.auxColor 辅助线、F.paper 纸色（F.aux 是画辅助线的方法，不是颜色）。 */
const FIG=(ctx,W,tok)=>{
  const u=W/720,ink=tok('--fig-ink'),aux=tok('--fig-aux'),paper=tok('--card');
  const dp=W/(ctx.canvas.clientWidth||W),ut=Math.max(u,dp*11/19);   // dp：每 CSS 像素的画布像素数
  const SERIF='"Times New Roman","STIX Two Text",Times,serif',SANS=tok('--f-body');
  const path=(fn,{w=1.6,color=ink,dash=null,fill=null}={})=>{ctx.save();ctx.beginPath();fn();
    if(fill){ctx.fillStyle=fill;ctx.fill()}
    if(w>0){ctx.lineWidth=w*u;ctx.strokeStyle=color;ctx.setLineDash(dash?dash.map(d=>d*u):[]);ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}
    ctx.restore()};
  // 文字先描一圈底色再填色，压在线条上也清楚
  const text=(t,x,y,font,color,align,base)=>{ctx.save();ctx.font=font;ctx.textAlign=align;ctx.textBaseline=base;
    ctx.lineJoin="round";ctx.lineWidth=5*ut;ctx.strokeStyle=paper;ctx.strokeText(t,x,y);ctx.fillStyle=color;ctx.fillText(t,x,y);ctx.restore()};
  const F={u,ut,ink,auxColor:aux,paper,
    clear(){ctx.save();ctx.setLineDash([]);ctx.fillStyle=paper;ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height);ctx.restore()},
    line(x1,y1,x2,y2,o){path(()=>{ctx.moveTo(x1,y1);ctx.lineTo(x2,y2)},o)},
    poly(pts,o){path(()=>pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y)),o)},
    circle(x,y,r,o){path(()=>ctx.arc(x,y,r,0,2*Math.PI),o)},
    arc(x,y,r,a0,a1,o){path(()=>ctx.arc(x,y,r,a0,a1),o)},
    rect(x,y,w,h,o){path(()=>ctx.rect(x,y,w,h),o)},
    // 辅助线（中心线、投影线等）
    aux(x1,y1,x2,y2,o={}){F.line(x1,y1,x2,y2,{w:1,color:aux,dash:[6,5],...o})},
    // 运动轨迹：细虚线
    trail(pts,o={}){if(pts.length>1)F.poly(pts,{w:1.3,color:aux,dash:[5,5],...o})},
    // 固定面斜线：沿 (x1,y1)→(x2,y2) 的直线，画在 side 一侧（屏幕坐标下，1 = 前进方向右手侧）
    hatch(x1,y1,x2,y2,side=1,{gap=12,len=10}={}){const L=Math.hypot(x2-x1,y2-y1),n=Math.max(1,Math.round(L/(gap*u)));
      const tx=(x2-x1)/L,ty=(y2-y1)/L,nx=-ty*side,ny=tx*side,ox=(nx-tx)*len*u/Math.SQRT2,oy=(ny-ty)*len*u/Math.SQRT2;
      path(()=>{for(let i=0;i<=n;i++){const x=x1+(x2-x1)*i/n,y=y1+(y2-y1)*i/n;ctx.moveTo(x,y);ctx.lineTo(x+ox,y+oy)}},{w:1,color:aux})},
    // 圆弧形固定面的斜线：out = true 画在圆外侧
    hatchArc(cx,cy,r,a0,a1,out=true,{gap=12,len=10}={}){const n=Math.max(1,Math.round(r*Math.abs(a1-a0)/(gap*u))),s=out?1:-1;
      path(()=>{for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n,c=Math.cos(a),si=Math.sin(a),x=cx+r*c,y=cy+r*si;
        const nx=c*s,ny=si*s,tx=-si,ty=c;ctx.moveTo(x,y);ctx.lineTo(x+(nx-tx)*len*u/Math.SQRT2,y+(ny-ty)*len*u/Math.SQRT2)}},{w:1,color:aux})},
    // 矢量：从 (x,y) 画到 (x+dx,y+dy)，细杆 + 窄实心箭头；label 用斜体写在箭头外侧，
    // 与别的矢量共线时用 off=[dx,dy]（单位 u，相对箭头尖）把标注挪到旁边
    arrow(x,y,dx,dy,color,label,{w=2,head=12,size=19,off=null}={}){const L=Math.hypot(dx,dy);if(L<2*u)return;
      const ux=dx/L,uy=dy/L,h=Math.min(head*u,L*.6),hw=h*.34,tx=x+dx,ty=y+dy;
      F.line(x,y,tx-ux*h*.7,ty-uy*h*.7,{w,color});
      path(()=>{ctx.moveTo(tx,ty);ctx.lineTo(tx-ux*h-uy*hw,ty-uy*h+ux*hw);ctx.lineTo(tx-ux*h+uy*hw,ty-uy*h-ux*hw);ctx.closePath()},{w:0,fill:color});
      if(label)F.label(label,off?tx+off[0]*u:tx+ux*14*u,off?ty+off[1]*u:ty+uy*14*u,{color,size})},
    // 斜体衬线字母（物理量、点名）
    label(t,x,y,{color=ink,size=19,align='center',base='middle',italic=true}={}){text(t,x,y,`${italic?'italic ':''}${size*ut}px ${SERIF}`,color,align,base)},
    // 中文小注
    zh(t,x,y,{color=aux,size=14,align='center',base='middle'}={}){text(t,x,y,`${size*ut}px ${SANS}`,color,align,base)},
    dot(x,y,r=2.6,color=ink){F.circle(x,y,r*u,{w:0,fill:color})},
    // 带名字的点：实心小点 + 斜体字母（dx、dy 为字母相对点的偏移，单位 u）
    point(x,y,name,dx=-13,dy=13){F.dot(x,y);if(name)F.label(name,x+dx*u,y+dy*u)},
    // 小球：空心圆，球心另用 F.dot 标出（矢量画完后再点，表示力作用在重心）
    ball(x,y,r){F.circle(x,y,r,{w:1.6,fill:paper})},
    // 尺寸标注：两端带箭头的细线，文字写在中点外侧 off（单位 u）
    dim(x1,y1,x2,y2,t,{off=14,color=ink}={}){const L=Math.hypot(x2-x1,y2-y1);if(L<4*u)return;const ux=(x2-x1)/L,uy=(y2-y1)/L,h=Math.min(8*u,L/3),hw=h*.38;
      F.line(x1,y1,x2,y2,{w:1,color});
      for(const[px,py,sx]of[[x1,y1,1],[x2,y2,-1]])path(()=>{ctx.moveTo(px,py);ctx.lineTo(px+sx*ux*h-uy*hw,py+sx*uy*h+ux*hw);ctx.lineTo(px+sx*ux*h+uy*hw,py+sx*uy*h-ux*hw);ctx.closePath()},{w:0,fill:color});
      if(t)F.label(t,(x1+x2)/2-uy*off*u,(y1+y2)/2+ux*off*u,{color})},
  };
  return F;
};

/* ================= SIM 模块：每个母题替换这一段 =================
   约定接口：
   SIM.legend            [{label, color(CSS 变量名)}]
   SIM.init(P)           → 状态 S（含 S.done、S.status={text,cls}）
   SIM.step(S,P,dt)      推进 dt 秒（引擎保证 dt ≤ 0.5 ms）
   SIM.readouts(S,P)     → [[标签, 带单位的值]]
   SIM.draw(ctx,S,P,W,H,tok)  tok(name) 取主题色
   SIM.verdict(P)        → 理论预判 HTML
*/
const SIM=(()=>{
  /* OPT-LGT-02 光的折射与全反射：半圆形玻璃砖 / 平行玻璃砖 / 光导纤维 / 圆筒（含水滴）。
     物理：几何光学数值追迹，不预设光路。四个情境共用一个追迹函数 trace()：从光源出发，逐段求光线与各界面
       （线段、圆弧）的最近交点，取该点法线 N（朝入射一侧），按矢量形式的折射定律 k′ = ηk + (η cos i − cos t)N
       （η = n₁/n₂）求折射方向；sin²t = η²(1 − cos²i) ≥ 1 判为全反射，反射方向 k′ = k − 2(k·N)N。
       部分反射与部分折射的能流按菲涅耳公式（自然光，Rs、Rp 取平均）分配，能流 < 1% 的光线不再追；
       哪些界面分出反射光由各情境的规则 pol 决定（「部分反射只追一级」，光纤侧面以芯内反射光为主光线）。
       两侧介质的折射率由 nAt(x, y) 按位置给出；色散时红光（700 nm）用 n、紫光（400 nm）用 n + Δn 各追一次。
     光纤：L ≤ 12D 时整根逐个界面追迹；否则只追左端 6D、右端 3D 两段，中间按「展开」的直线算出光线在右段起点的
       位置、方向与反射次数（N ≈ L tan r/D），再从那里继续追迹；中间段的时间按路程 Δx/cos r、速度 c/n₁ 计入。
     时间：每段光线记下光到达两端的真实时刻（路程 ÷ (c/n)）。「入射」时光脉冲沿光路推进：引擎给的时间步乘慢放倍数
       换成真实时间，全程慢放到约 3 s；光纤有折断号时左段、中间段、右段分别约 1.2 s、0.6 s、1.2 s。读数为真实时间。
     坐标：世界坐标单位 m，x 向右、y 向上。半圆形玻璃砖以 O 为原点，平直面在 y = 0；平行玻璃砖上表面 y = 0、入射点 O₁ 在原点；
       光纤以端面中心 O 为原点、轴线为 x 轴；圆筒以圆心 O 为原点，入射光从左侧沿 y = b 射来。
     引擎不支持的界面细节放在 verdict 里处理（引擎每次同步参数都会调用它）：
       ① L、D 用对数滑块（同 EM-ESF-01：滑块改为 lg 刻度，捕获 input 事件后交给数字输入框的 change）；题干里 L、D 改用科学计数；
       ② r ≤ 0.95R、b < R：越界时改写对应输入框并触发 change（同 MEC-PRJ-01 的 d < L）。 */
  const C0=3e8,RAD=Math.PI/180,DEG=180/Math.PI,PI=Math.PI,TAU=2*Math.PI,EMIN=.01,GRAZE=.3*RAD,SNAP=.003*RAD,RS=.05,T_ANIM=3;
  const ok=x=>typeof x==='number'&&isFinite(x);
  const NB=' ';
  const fmt=(x,d=2)=>{if(!ok(x))return'—';return(Math.abs(x)<.5*Math.pow(10,-d)?0:x).toFixed(d).replace('-','−')};
  const SUP={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
  const exp10=x=>{const e=Math.floor(Math.log10(Math.abs(x)));return[x/Math.pow(10,e),e]};
  const sci=(x,d=2)=>{if(!ok(x))return'—';if(x===0)return'0';let[m,e]=exp10(x);if(Math.abs(+m.toFixed(d))>=10){m/=10;e++}
    return m.toFixed(d).replace('-','−')+'×10'+String(e).replace(/./g,c=>SUP[c])};
  const num=(x,sig=3)=>{if(!ok(x))return'—';if(x===0)return'0';const a=Math.abs(x);
    if(a>=1e-3&&a<1e5){const e=Math.floor(Math.log10(a));return fmt(x,Math.max(0,sig-1-e))}return sci(x,sig-1)};
  const dg=(a,d=2)=>ok(a)?fmt(a,d)+'°':'—';
  const pc=x=>ok(x)?fmt(100*x,x<.1?2:1)+'%':'—';
  // 时间：自动选 ps、ns、μs、ms、s（三位有效数字）
  const tim=t=>{if(!ok(t))return'—';const a=Math.abs(t);const U=a<1e-9?[1e-12,'ps']:a<1e-6?[1e-9,'ns']:a<1e-3?[1e-6,'μs']:a<1?[1e-3,'ms']:[1,'s'];
    return num(t/U[0],3)+NB+U[1]};
  const timU=t=>{const a=Math.abs(t);return a<1e-9?[1e-12,'ps']:a<1e-6?[1e-9,'ns']:a<1e-3?[1e-6,'μs']:a<1?[1e-3,'ms']:[1,'s']};
  // 长度：m → cm / mm / μm / m
  const len=x=>{if(!ok(x))return'—';const a=Math.abs(x);return a>=1?num(x,3)+NB+'m':a>=.01?fmt(x*100,a>=.1?2:3)+NB+'cm':a>=1e-5?num(x*1000,3)+NB+'mm':num(x*1e6,3)+NB+'μm'};
  const cm=x=>ok(x)?fmt(x*100,Math.abs(x)<.01?4:3)+NB+'cm':'—';
  const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
  const vel=n=>sci(C0/n,3)+NB+'m/s';

  /* ---------- 光线追迹（四个情境共用） ---------- */
  const inArc=(a,a0,a1)=>{if(a1-a0>=TAU-1e-12)return true;let d=(a-a0)%TAU;if(d<0)d+=TAU;return d<=a1-a0+1e-12};
  const seg=(ax,ay,bx,by,tag,sink=false)=>({k:'s',ax,ay,bx,by,tag,sink});
  const circ=(cx,cy,R,a0,a1,tag,sink=false)=>({k:'c',cx,cy,R,a0,a1,tag,sink});
  // 光线 p + tk 与面 s 的第一个交点（t > tmin），返回 t 与该点的单位法线（未定向）
  function isect(s,px,py,kx,ky,tmin){
    if(s.k==='s'){const ex=s.bx-s.ax,ey=s.by-s.ay,den=kx*ey-ky*ex;if(Math.abs(den)<1e-300)return null;
      const wx=s.ax-px,wy=s.ay-py,t=(wx*ey-wy*ex)/den,v=(wx*ky-wy*kx)/den;
      if(t<=tmin||v<-1e-12||v>1+1e-12)return null;const L=Math.hypot(ex,ey);return{t,nx:-ey/L,ny:ex/L}}
    const ox=px-s.cx,oy=py-s.cy,B=kx*ox+ky*oy,Cc=ox*ox+oy*oy-s.R*s.R,disc=B*B-Cc;if(disc<0)return null;
    const q=Math.sqrt(disc);
    for(const t of[-B-q,-B+q]){if(t<=tmin)continue;const hx=ox+kx*t,hy=oy+ky*t;if(inArc(Math.atan2(hy,hx),s.a0,s.a1))return{t,nx:hx/s.R,ny:hy/s.R}}
    return null}
  // 菲涅耳反射率（自然光）
  const fres=(n1,n2,ci,ct)=>{const rs=(n1*ci-n2*ct)/(n1*ci+n2*ct),rp=(n1*ct-n2*ci)/(n1*ct+n2*ci);return(rs*rs+rp*rp)/2};
  const fresA=(n1,n2,th)=>{const s=n1*Math.sin(th)/n2;if(s>=1)return 1;return fres(n1,n2,Math.cos(th),Math.sqrt(1-s*s))};
  /* Wd：{surf 面, nAt(x,y) 折射率, eps 交点容差, probe 取样距离, farAir 空气中最多画多长, graze 贴界面光线的长度, max 段数上限, pol(hit, ray) → {t, r}}
     ray0：{x, y, kx, ky, E?, t?, role?}。返回 {segs, hits}：每段记下端点、所在介质 n、两端的真实时刻 t0、t1、能流 E、角色 role；
     每个界面交点记下 n₁、n₂、入射角 th1、折射角 th2（全反射为 NaN）、临界角 C、反射率 R、折射与反射方向 td、rd。 */
  function trace(Wd,ray0){
    let nGraze=0;const segs=[],hits=[],st=[{x:ray0.x,y:ray0.y,kx:ray0.kx,ky:ray0.ky,E:ray0.E??1,t:ray0.t??0,role:ray0.role||'main',par:-1}];let guard=0;
    while(st.length&&guard++<Wd.max){
      const r=st.pop();let best=null;
      for(const s of Wd.surf){const h=isect(s,r.x,r.y,r.kx,r.ky,Wd.eps);if(h&&(!best||h.t<best.t))best={...h,s}}
      let tt=best?best.t:Infinity,cut=false;
      if(tt>Wd.farAir){const m=Math.min(tt,Wd.farAir)/2;if(Wd.nAt(r.x+r.kx*m,r.y+r.ky*m)===1){tt=Wd.farAir;cut=true}}
      if(!ok(tt))continue;
      const hx=r.x+r.kx*tt,hy=r.y+r.ky*tt,nm=Wd.nAt(r.x+r.kx*tt/2,r.y+r.ky*tt/2);
      const sg={ax:r.x,ay:r.y,bx:hx,by:hy,kx:r.kx,ky:r.ky,n:nm,t0:r.t,t1:r.t+tt*nm/C0,E:r.E,role:r.role,par:r.par,id:segs.length};segs.push(sg);
      if(cut){sg.end='far';continue}
      if(best.s.sink){sg.end=best.s.tag;continue}
      let Nx=best.nx,Ny=best.ny;if(Nx*r.kx+Ny*r.ky>0){Nx=-Nx;Ny=-Ny}
      const n1=nm,n2=Wd.nAt(hx-Nx*Wd.probe,hy-Ny*Wd.probe),ci=Math.min(1,-(Nx*r.kx+Ny*r.ky));
      const h={k:hits.length,x:hx,y:hy,Nx,Ny,tag:best.s.tag,n1,n2,th1:Math.acos(ci),C:n1>n2?Math.asin(n2/n1):NaN,role:r.role,seg:sg.id,t:sg.t1,E:r.E,kx:r.kx,ky:r.ky};
      const dC=h.th1-h.C;h.near=ok(dC)&&Math.abs(dC)<GRAZE;h.crit=ok(dC)&&Math.abs(dC)<SNAP&&(Wd.snap||[]).includes(h.tag);hits.push(h);sg.hit=h.k;
      if(n1===n2){h.out='pass';h.th2=h.th1;h.R=0;h.td=[r.kx,r.ky];h.rd=[r.kx+2*ci*Nx,r.ky+2*ci*Ny];   // 两侧折射率相同：不是界面，光直线穿过
        st.push({...r,x:hx,y:hy,t:sg.t1,par:sg.id,role:Wd.pol(h,r).t||r.role});continue}
      const eta=n1/n2,s2=eta*eta*(1-ci*ci),rx=r.kx+2*ci*Nx,ry=r.ky+2*ci*Ny;h.rd=[rx,ry];
      // 全反射；与临界角相差不到 0.01°（角度的显示精度）时按恰好临界处理：折射角 90°、折射光能流为零
      if(s2>=1||h.crit){h.out=h.crit?'crit':'tir';h.R=1;h.th2=h.crit?PI/2:NaN;
        st.push({x:hx,y:hy,kx:rx,ky:ry,E:r.E,t:sg.t1,role:r.role,par:sg.id});
        if(h.near&&!(Wd.grazeOnce&&nGraze)){const tx=r.kx+ci*Nx,ty=r.ky+ci*Ny,L=Math.hypot(tx,ty);nGraze++;   // 恰好全反射：折射光贴着界面画
          if(L>1e-12)segs.push({ax:hx,ay:hy,bx:hx+tx/L*Wd.graze,by:hy+ty/L*Wd.graze,kx:tx/L,ky:ty/L,n:n2,t0:sg.t1,t1:sg.t1+Wd.graze*n2/C0,E:0,role:'graze',par:sg.id,id:segs.length,end:'graze',hit:h.k})}
        continue}
      const ct=Math.sqrt(1-s2),R=fres(n1,n2,ci,ct),tx=eta*r.kx+(eta*ci-ct)*Nx,ty=eta*r.ky+(eta*ci-ct)*Ny;
      h.out='ref';h.R=R;h.th2=Math.asin(Math.min(1,Math.sqrt(s2)));h.td=[tx,ty];
      const d=Wd.pol(h,r);
      if(d.t&&(r.E*(1-R)>=EMIN||h.near))st.push({x:hx,y:hy,kx:tx,ky:ty,E:r.E*(1-R),t:sg.t1,role:d.t,par:sg.id});
      if(d.r&&r.E*R>=EMIN)st.push({x:hx,y:hy,kx:rx,ky:ry,E:r.E*R,t:sg.t1,role:d.r,par:sg.id});
    }
    return{segs,hits}}
  const mainHits=T=>T.hits.filter(h=>h.role==='main').sort((a,b)=>a.t-b.t);
  const ang=(ax,ay,bx,by)=>Math.acos(clamp((ax*bx+ay*by)/(Math.hypot(ax,ay)*Math.hypot(bx,by)),-1,1));

  /* ---------- 参数整理（越界时按约束取值；界面上的联动见 keep） ---------- */
  function prm(P){
    const sc=['semi','slab','fiber','tube'].includes(P.scene)?P.scene:'semi';
    const n=clamp(+P.n||1.5,1,2.5),dn=clamp(+P.dn||0,0,.1);
    const R=clamp(+P.R||4,1,10),r=clamp(+P.r||0,0,.95*R),b=clamp(+P.b||0,0,R*(1-1e-4));
    return{sc,n,dn,th:clamp(+P.th||0,0,89),i1:clamp(+P.i1||0,0,89),d:clamp(+P.d||3,.5,10),
      n1:clamp(+P.n1||1.5,1,2.5),n2:clamp(+P.n2||1,1,2.5),i2:clamp(+P.i2||0,0,89),L:clamp(+P.L||1,.01,1e5),D:clamp(+P.D||.05,.005,50),R,r,b}}
  const cols=q=>q.dn>0?[['red',q.n],['vio',q.n+q.dn]]:[['ink',q.n]];

  /* ---------- 四个情境的世界 ---------- */
  function bSemi(q){
    const R=RS,th=q.th*RAD;
    const W=nn=>({surf:[circ(0,0,R,0,PI,'arc'),seg(-R,0,R,0,'flat'),circ(0,0,R,-PI,0,'aux',true),circ(0,0,1.42*R,0,PI,'outer',true)],
      nAt:(x,y)=>y>0&&x*x+y*y<R*R?nn:1,eps:R*1e-9,probe:R*1e-7,farAir:3*R,graze:R,max:400,snap:['flat'],
      pol:(h,r)=>h.tag==='flat'&&r.role==='main'?{t:'refr',r:'refl'}:{t:r.role,r:null}});
    const ray={x:-Math.sin(th)*1.4199*R,y:Math.cos(th)*1.4199*R,kx:Math.sin(th),ky:-Math.cos(th)};
    const K={sc:'semi',q,R,th,tr:cols(q).map(([col,nn])=>({col,n:nn,...trace(W(nn),ray)}))};
    for(const T of K.tr){T.hO=T.hits.find(h=>h.tag==='flat'&&h.role==='main');T.hA=T.hits.find(h=>h.tag==='arc'&&h.role==='main');
      T.sRefr=T.segs.find(s=>s.role==='refr');T.C=Math.asin(1/T.n)}
    return K}
  function bSlab(q){
    const d=q.d/100,i=q.i1*RAD,X=1e4*d,La=1.3*d;
    const W=nn=>({surf:[seg(-X,0,X,0,'top'),seg(-X,-d,X,-d,'bot')],nAt:(x,y)=>y<0&&y>-d?nn:1,
      eps:d*1e-9,probe:d*1e-7,farAir:La,graze:d,max:400,pol:(h,r)=>h.k===0?{t:'main',r:'refl'}:{t:r.role,r:null}});
    const ray={x:-Math.sin(i)*La*(1-1e-9),y:Math.cos(i)*La*(1-1e-9),kx:Math.sin(i),ky:-Math.cos(i)};
    const K={sc:'slab',q,d,i,tr:cols(q).map(([col,nn])=>({col,n:nn,...trace(W(nn),ray)}))};
    for(const T of K.tr){const m=mainHits(T);T.h1=m.find(h=>h.tag==='top');T.h2=m.find(h=>h.tag==='bot');T.C=Math.asin(1/T.n);
      T.sIn=T.segs.find(s=>s.par===T.h1?.seg&&s.role==='main');T.sOut=T.h2?T.segs.find(s=>s.par===T.h2.seg&&s.role==='main'):null}
    return K}
  function bFiber(q){
    const n1=q.n1,n2=q.n2,i=q.i2*RAD,L=q.L,D=q.D/1000,hw=D/2,tc=n2===1?0:.35*D,ho=hw+tc,brk=L>12*D;
    const xL=brk?6*D:L,xR=brk?3*D:0,yc=tc>0?ho:hw+.9*D;
    const pol=(h,r)=>h.tag==='wall'&&r.role==='main'?{t:'leak',r:'main'}:{t:r.role,r:null};
    const W=(Lp,f0,f1,cutEnd)=>{const s=[];
      if(f0)s.push(seg(0,-ho,0,ho,'face0'));if(f1)s.push(seg(Lp,-ho,Lp,ho,'face1'));if(cutEnd)s.push(seg(Lp,-yc,Lp,yc,'cut',true));
      s.push(seg(0,hw,Lp,hw,'wall'),seg(0,-hw,Lp,-hw,'wall'));
      if(tc>0)s.push(seg(0,ho,Lp,ho,'clad',true),seg(0,-ho,Lp,-ho,'clad',true));
      else s.push(seg(0,hw+.9*D,Lp,hw+.9*D,'out',true),seg(0,-hw-.9*D,Lp,-hw-.9*D,'out',true));
      return{surf:s,nAt:(x,y)=>x<0||x>Lp?1:Math.abs(y)<hw?n1:Math.abs(y)<ho?n2:1,eps:D*1e-9,probe:D*1e-7,farAir:1.6*D,graze:.8*D,max:40000,grazeOnce:true,snap:['wall'],pol}};
    const ray={x:-1.5*D*Math.cos(i),y:1.5*D*Math.sin(i),kx:Math.cos(i),ky:-Math.sin(i)};
    const K={sc:'fiber',q,n1,n2,i,L,D,hw,tc,ho,brk,xL,xR,yc};
    K.A=trace(W(xL,true,!brk,brk),ray);
    const mA=mainHits(K.A);K.h0=mA.find(h=>h.tag==='face0');K.walls=mA.filter(h=>h.tag==='wall');
    K.Cp=n2<n1?Math.asin(n2/n1):NaN;K.sinMax=Math.sqrt(Math.max(0,n1*n1-n2*n2));K.imax=n2<n1?(K.sinMax>=1?PI/2:Math.asin(K.sinMax)):NaN;

        const dx=L-xR-xL,slope=sc.ky/sc.kx,hu=sc.by+hw+slope*dx,m=Math.floor(hu/D),fr=hu-m*D,odd=Math.abs(m)%2===1;
        const y=odd?hw-fr:fr-hw,ky=odd?-sc.ky:sc.ky,Rw=K.walls.length?K.walls[K.walls.length-1].R:1;
        K.Nmid=Math.abs(m);const E=sc.E*Math.pow(Rw,K.Nmid),t=sc.t1+dx/sc.kx*n1/C0;
        K.cut={x:sc.bx,y:sc.by,t:sc.t1,E:sc.E,dx,tMid:t};

  function bTube(q){

    const W=nn=>{const s=[circ(0,0,R,-PI,PI,'out')];if(!drop)s.push(circ(0,0,r,-PI,PI,'in'));
      s.push(seg(-Hw,yLo,Hw,yLo,'box',true),seg(Hw,yLo,Hw,yHi,'box',true),seg(Hw,yHi,-Hw,yHi,'box',true),seg(-Hw,yHi,-Hw,yLo,'box',true));
      let inSeen=false;
      const pol=drop?(h,rr)=>h.k===1&&rr.role==='main'?{t:'thru',r:'main'}:{t:rr.role,r:null}
        :(h,rr)=>{if(h.k===0)return{t:'main',r:'refl'};if(h.tag==='in'&&rr.role==='main'&&!inSeen){inSeen=true;return{t:'main',r:'refl2'}}return{t:rr.role,r:null}};

  /* ---------- 时间映射：动画时间 τ → 真实时间 t（分段线性） ---------- */
  function timing(K){
    const all=K.sc==='fiber'?[...K.A.segs,...(K.B?K.B.segs:[])]:K.tr.flatMap(T=>T.segs);
    const tEnd=Math.max(...all.map(s=>s.t1));K.tEnd=tEnd;
    if(K.sc==='fiber'&&K.brk&&K.B){const tA=K.cut.t,tB=K.cut.tMid;K.mapA=[0,1.2,1.8,T_ANIM];K.mapT=[0,tA,tB,tEnd]}
    else if(K.sc==='fiber'){const tr=K.brk?tEnd:Math.max(tEnd,K.tO+K.L*K.n1/C0);K.mapA=[0,T_ANIM];K.mapT=[0,tr]}
    else{K.mapA=[0,T_ANIM];K.mapT=[0,tEnd]}

  }
  const realOf=(K,tau)=>{const A=K.mapA,T=K.mapT;if(tau<=0)return 0;for(let j=1;j<A.length;j++)if(tau<=A[j])return T[j-1]+(T[j]-T[j-1])*(tau-A[j-1])/(A[j]-A[j-1]);return T[T.length-1]};
  const rateAt=(K,tau)=>{const A=K.mapA,T=K.mapT;let j=1;while(j<A.length-1&&tau>A[j])j++;return(T[j]-T[j-1])/(A[j]-A[j-1])};   // 真实秒 / 动画秒
  function build(P){const q=prm(P);const K=q.sc==='semi'?bSemi(q):q.sc==='slab'?bSlab(q):q.sc==='fiber'?bFiber(q):bTube(q);timing(K);return K}

  /* ---------- 判定（光路画好即可判定，不等播放） ---------- */
  const NAME={semi:'半圆形玻璃砖',slab:'平行玻璃砖',fiber:'光导纤维',tube:'圆筒'};
  const CN={red:'红光',vio:'紫光',ink:''};
  function semiJ(T){const h=T.hO;if(!h)return{k:'none'};
    if(h.out==='tir'||h.out==='crit')return{k:h.near?'graze':'tir',crit:h.out==='crit',th:h.th1,C:h.C};
    return{k:h.near?'graze':'part',th:h.th1,r:h.th2,C:h.C,R:h.R}}
  function judge(K){
    if(K.sc==='semi'){const js=K.tr.map(semiJ),j=js[0],C=K.tr[0].C;
      if(K.tr.length>1){const[a,b]=js,w=x=>x.k==='part'?`r${NB}=${NB}${dg(x.r*DEG)}`:x.crit?'恰好全反射':'全反射';
        if(a.k==='part'&&b.k!=='part')return{text:`紫光${b.crit?'恰好':'已'}全反射，红光 r${NB}=${NB}${dg(a.r*DEG)}`,cls:'ok'};
        if(a.k!=='part'&&b.k!=='part')return{text:'红光、紫光都全反射，折射光消失',cls:'warn'};
        return{text:`红光 ${w(a)}，紫光 ${w(b)}（紫光偏折大）`,cls:''}}
      if(K.tr[0].hO&&K.tr[0].hO.out==='pass')return{text:`n${NB}=${NB}1：没有界面，光不偏折、不反射`,cls:''};
      if(j.k==='graze')return{text:`恰好全反射：θ${NB}≈${NB}C${NB}=${NB}${dg(C*DEG)}，折射光贴着平直面`,cls:'ok'};
      if(j.k==='tir')return{text:`全反射：θ${NB}=${NB}${dg(j.th*DEG)}${NB}>${NB}C${NB}=${NB}${dg(C*DEG)}，折射光消失`,cls:'warn'};
      if(j.k==='part')return{text:`部分反射：r${NB}=${NB}${dg(j.r*DEG)}，反射 ${pc(j.R)}`,cls:''};
      return{text:'—',cls:''}}
    if(K.sc==='slab'){const T=K.tr[0],o=slabM(K,T);
      if(K.tr.length>1){const s=slabSep(K);return{text:`红、紫出射光都与入射光平行，相距 ${cm(s)}`,cls:'ok'}}
      return{text:`出射光与入射光平行：侧移 Δ${NB}=${NB}${cm(o.shift)}`,cls:'ok'}}
    if(K.sc==='fiber'){const w=K.walls[0];
      if(!w)return{text:'沿轴线传播，不碰侧面',cls:'ok'};
      const a=dg(w.th1*DEG);
      if(K.n2>=K.n1)return{text:`n₂${NB}≥${NB}n₁：不能全反射，光从侧面漏出`,cls:'warn'};
      if(w.out==='crit')return{text:`恰好全反射：界面入射角 ${a}${NB}=${NB}C′`,cls:'ok'};
      if(w.out==='tir')return{text:`全反射：界面入射角 ${a}${NB}>${NB}C′${NB}=${NB}${dg(K.Cp*DEG)}${w.near?'（接近临界）':''}`,cls:'ok'};
      if(w.near)return{text:`接近临界：界面入射角 ${a} 略小于 C′，每次反射漏出 ${pc(1-w.R)}`,cls:'warn'};
      return{text:`漏光：界面入射角 ${a}${NB}<${NB}C′${NB}=${NB}${dg(K.Cp*DEG)}`,cls:'warn'}}
    const T=K.tr[0],o=tubeM(K,T);
    if(K.drop){if(K.tr.length>1){const v=tubeM(K,K.tr[1]);return{text:`4α − 2θ：红光 ${dg(o.rb*DEG)}，紫光 ${dg(v.rb*DEG)}，外圈红`,cls:'ok'}}
      return{text:`水滴：背面反射一次后射出，4α − 2θ${NB}=${NB}${dg(o.rb*DEG)}`,cls:'ok'}}
    if(o.kind==='miss')return{text:`碰不到内表面：b${NB}≥${NB}nr`,cls:''};
    if(o.kind==='graze')return{text:`恰好全反射：b${NB}=${NB}r，φ${NB}=${NB}C${NB}=${NB}${dg(T.C*DEG)}`,cls:'ok'};
    if(o.kind==='tir')return{text:`内表面全反射：φ${NB}=${NB}${dg(o.phi*DEG)}${NB}>${NB}C`,cls:'ok'};
    return{text:`进入筒内：φ${NB}=${NB}${dg(o.phi*DEG)}${NB}<${NB}C${NB}=${NB}${dg(T.C*DEG)}`,cls:''}}

  /* ---------- 由追迹结果量出的量 ---------- */
  function slabM(K,T){const h1=T.h1,h2=T.h2,s0=T.segs[0],o={};if(!h1||!h2)return o;

  /* ---------- 状态 ---------- */
  function status(S){const K=S.K;

  /* ---------- 读数 ---------- */
  function readouts(S){

      R.push(['入射角 i',dg(m.i*DEG)],[two?'折射角 r（红 / 紫）':'折射角 r',two?ms.map(o=>dg(o.r*DEG)).join(' / '):dg(m.r*DEG)],
        ['sin i / sin r（= n）',two?ms.map(o=>o.i>1e-9?fmt(Math.sin(o.i)/Math.sin(o.r),4):'—').join(' / '):m.i>1e-9?fmt(Math.sin(m.i)/Math.sin(m.r),4):'—'],
        ['下表面入射角 r′ 与 C',`${dg(m.r2*DEG)} < C = ${dg(T.C*DEG)}`],['出射角 i′',dg(m.i2*DEG)],['出射光与入射光的夹角',dg(m.par*DEG,3)],
        [two?'侧移 Δ（红 / 紫）':'侧移 Δ = d sin(i − r)/cos r',two?ms.map(o=>cm(o.shift)).join(' / '):cm(m.shift)],
        ['O₁O₂ 水平距离 d·tan r',cm(m.dx)],['砖内光程 d/cos r',cm(m.path)],[two?'砖内传播时间（红 / 紫）':'砖内传播时间',two?ms.map(o=>tim(o.tg)).join(' / '):tim(m.tg)],
        ['视深 h′ = d·tan r/tan i',ok(m.depth)?cm(m.depth):`${cm(K.d/T.n)}（i → 0 的极限）`],['竖直看的视深 d/n',cm(K.d/T.n)],

      R.push(['n × 玻璃中光线到 O 的距离（= b）',two?ms.map(o=>cm(o.pn)).join(' / '):cm(m.pn)],['出射光的总偏折角',two?ms.map(o=>dg(o.dev*DEG)).join(' / '):dg(m.dev*DEG)])}

  /* ---------- 理论预判（按公式） ---------- */
  function verdict(P){const q=prm(P),b=x=>`<b>${x}</b>`,sC=n=>Math.asin(1/n)*DEG;
    if(q.sc==='semi'){const n=q.n,th=q.th*RAD,s=n*Math.sin(th),C=sC(n);
      let h=`v = c/n = ${b(vel(n))}；sin C = 1/n，C = ${b(dg(C))}。<br>`;
      h+=s<1?`θ = ${dg(q.th)} < C：sin r = n sinθ = ${fmt(s,4)}，r = ${b(dg(Math.asin(s)*DEG))}，反射光与折射光夹角 180° − θ − r = ${b(dg(180-q.th-Math.asin(s)*DEG))}；反射 ${pc(fresA(n,1,th))}（拓展）`
        :`θ = ${dg(q.th)} ≥ C：${b('全反射')}，折射光消失`;
      if(q.dn>0){const nv=n+q.dn,Cv=sC(nv);h+=`。<br>紫光 n紫 = ${fmt(nv,4)}，C紫 = ${b(dg(Cv))} < C红，紫光先消失`;
        const sv=nv*Math.sin(th);h+=sv<1?`；紫光 r = ${dg(Math.asin(sv)*DEG)}`:'；当前紫光已全反射'}
      return h+'。'}
    if(q.sc==='slab'){const n=q.n,i=q.i1*RAD,d=q.d/100,r=Math.asin(Math.sin(i)/n),C=sC(n);
      let h=`sin r = sin i/n，r = ${b(dg(r*DEG))}；下表面入射角 = r < C = ${dg(C)}，${b('不会全反射')}，出射角 = i，出射光与入射光平行。<br>`;
      h+=`Δ = d sin(i − r)/cos r = ${b(cm(d*Math.sin(i-r)/Math.cos(r)))}；砖内 t = nd/(c cos r) = ${b(tim(n*d/(C0*Math.cos(r))))}；视深 h′ = d·tan r/tan i = ${b(i>1e-9?cm(d*Math.tan(r)/Math.tan(i)):cm(d/n))}（竖直看 d/n = ${cm(d/n)}）`;
      if(q.dn>0){const nv=n+q.dn,rv=Math.asin(Math.sin(i)/nv),sh=x=>d*Math.sin(i-x)/Math.cos(x);
        h+=`。<br>紫光 r紫 = ${b(dg(rv*DEG))}，sin r红/sin r紫 = n紫/n红 = ${fmt(nv/n,4)}；两束出射光平行，相距 ${b(cm(Math.abs(sh(rv)-sh(r))))}`}
      return h+'。'}
    if(q.sc==='fiber'){const n1=q.n1,n2=q.n2,i=q.i2*RAD,L=q.L,D=q.D/1000,r=Math.asin(Math.sin(i)/n1),t=L*n1/(C0*Math.cos(r)),t0=L*n1/C0;
      let h;
      if(n2>=n1)h=`n₂ ≥ n₁：芯内的光射向包层是光疏射向光密，${b('不能全反射')}`;
      else{const Cp=Math.asin(n2/n1)*DEG,sm=Math.sqrt(n1*n1-n2*n2),im=sm>=1?NaN:Math.asin(sm)*DEG,ia=90-r*DEG;
        h=`sin C′ = n₂/n₁，C′ = ${b(dg(Cp))}；sin i_max = √(n₁² − n₂²) = ${fmt(sm,4)}，${sm>=1?b('任意入射角都全反射'):'i_max = '+b(dg(im))}。<br>`;
        h+=`i = ${dg(q.i2)}：r = ${dg(r*DEG)}，界面入射角 90° − r = ${dg(ia)}，${Math.abs(ia-Cp)<.3?b('恰好全反射'):ia>Cp?b('全反射'):b('漏光')}`;
        h+=`。<br>t = Ln₁/(c cos r) = ${b(tim(t))}，t₀ = Ln₁/c = ${b(tim(t0))}，最长 Ln₁²/(cn₂) = ${b(tim(L*n1*n1/(C0*n2)))}${sm>=1?'（此时入射角取不到上限）':''}；N ≈ L tan r/D ≈ ${b(L*Math.tan(r)/D<1e5?fmt(L*Math.tan(r)/D,1):sci(L*Math.tan(r)/D,2))} 次`}
      return h+'。'}
    const n=q.n,R=q.R,r=q.r,bb=q.b,th=Math.asin(bb/R),al=Math.asin(Math.sin(th)/n),C=sC(n);
    let h=`sinθ = b/R = ${fmt(bb/R,4)}，θ = ${b(dg(th*DEG))}；sinα = sinθ/n，α = ${b(dg(al*DEG))}；n × (玻璃中光线到 O 的距离) = b。<br>`;
    if(r<=0){const rb=(4*al-2*th)*DEG;h+=`水滴（r = 0）：背面入射角也是 α < C，部分反射；出射光与入射光反方向的夹角 4α − 2θ = ${b(dg(rb))}`;
      if(q.dn>0){const av=Math.asin(Math.sin(th)/(n+q.dn));h+=`，紫光 ${b(dg((4*av-2*th)*DEG))}`}return h+'。'}
    if(bb>=n*r)h+=`b ≥ nr = ${cm(n*r/100)}：${b('碰不到内表面')}`;
    else{const ph=Math.asin(bb/(n*r))*DEG;h+=`sinφ = b/(nr) = ${fmt(bb/(n*r),4)}，φ = ${b(dg(ph))} ${Math.abs(ph-C)<.3?'= C，'+b('恰好全反射'):ph>C?'> C = '+dg(C)+'，'+b('全反射'):'< C = '+dg(C)+'，'+b('折射进入筒内')}`}
    h+=`。<br>全反射的范围 r ≤ b < nr：${b(cm(r/100)+' ~ '+cm(Math.min(n*r,R)/100))}${n*r>=R?'（nr ≥ R，到 b → R 为止）':''}；恰好全反射时 b = r，即 R sinθ = r，壁厚 R − r = R(1 − sinθ) = ${cm((R-r)/100)}（与 n 无关）`;
    return h+'。'}

  /* ---------- 引擎不支持的界面细节（见文件头） ---------- */
  const LOGK=['L','D'];
  let fixing=false;
  function setNum(P,key,val){P[key]=val;if(typeof document==='undefined'||fixing)return;const n=document.getElementById('num-'+key);
    if(n){fixing=true;try{n.value=String(val);n.dispatchEvent(new Event('change'))}finally{fixing=false}}}
  // 先把要改的都算出来再逐个改：改第一个时引擎会重新同步并再调 verdict，那一层直接返回
  function keep(P){if(fixing)return;
    const R=+P.R,fx=[];if(+P.r>.95*R+1e-9)fx.push(['r',Math.floor(.95*R*100+1e-6)/100]);if(+P.b>=R)fx.push(['b',Math.floor((R-.01)*100+1e-6)/100]);
    for(const[k,v]of fx)setNum(P,k,v)}
  const sciS=x=>{let[m,e]=exp10(x);m=+m.toPrecision(2);if(m>=10){m/=10;e++}return(Number.isInteger(m)?m.toFixed(1):String(m))+'×10'+String(e).replace(/./g,c=>SUP[c])};
  const sciIn=x=>{if(!ok(x)||x<=0)return String(x);let[m,e]=exp10(x);m=+m.toPrecision(4);if(m>=10){m=+(m/10).toPrecision(4);e++}return e>=-2&&e<=4?String(+x.toPrecision(4)):m+'e'+e};
  function ui(P){
    if(typeof document==='undefined')return;
    for(const k of LOGK){const r=document.getElementById('in-'+k),n=document.getElementById('num-'+k);if(!r||!n)continue;
      // 滑块的端点取 0.005 的整数倍，滑块才能停在 lg = 0、1、2…（1 mm、1 m、100 m）上；越出参数范围的部分由引擎截到边界
      if(!r.dataset.log){r.dataset.log='1';r.min=String(Math.floor(Math.log10(+n.min)*200)/200);r.max=String(Math.ceil(Math.log10(+n.max)*200)/200);r.step='0.005';
        // 在外层捕获滑块的 input，不让它到达引擎（引擎会把对数值当真值），改由输入框的 change 交给引擎
        r.parentElement.addEventListener('input',e=>{if(e.target!==r)return;e.stopPropagation();
          n.value=String(+Math.pow(10,+r.value).toPrecision(3));n.dispatchEvent(new Event('change'))},true)}
      if(+P[k]>0)r.value=String(Math.log10(+P[k]));
      if(document.activeElement!==n)n.value=sciIn(+P[k])}
    // 题干：L、D 写成 1.0×10³ m、0.050 mm 这样的有效数字
    document.querySelectorAll('#stem .num,#asks .num').forEach(s=>{const m=s.textContent.match(/^(\d+(?:\.\d+)?) (m|mm)$/);if(!m)return;const v=+m[1];
      s.textContent=(m[2]==='m'?(v>=1e3?sciS(v):String(+v.toPrecision(2))):(v>=1?String(+v.toPrecision(2)):String(+v.toPrecision(2)).replace(/^0\.(0*)(\d)$/,'0.$1$20')))+' '+m[2]})}

  /* ---------- 画图 ---------- */
  // 波长 → 颜色（与 OPT-LGT-01 相同的分段近似，不按人眼亮度减弱）；红 700 nm、紫 400 nm
  const hue=nm=>{let r=0,g=0,b=0;if(nm<440){r=.6*(440-nm)/60;b=1}else if(nm<490){g=(nm-440)/50;b=1}else if(nm<510){g=1;b=(510-nm)/20}
    else if(nm<580){r=(nm-510)/70;g=1}else if(nm<645){r=1;g=(645-nm)/65}else r=1;return[r,g,b]};
  const g8=v=>Math.round(255*Math.pow(Math.min(1,Math.max(0,v)),.8));
  const nice=x=>{const p=Math.pow(10,Math.floor(Math.log10(x))),m=x/p;return(m<1.5?1:m<3.5?2:m<7.5?5:10)*p};
  const lenTxt=x=>x<1e-3?`${+(x*1e6).toPrecision(3)} μm`:x<.01?`${+(x*1000).toPrecision(3)} mm`:x<1?`${+(x*100).toPrecision(3)} cm`:`${+x.toPrecision(3)} m`;

  function draw(ctx,S,P,W,H,tok){
    const F=FIG(ctx,W,tok),u=F.u,ut=F.ut,K=S.K,INK=F.ink,AUX=F.auxColor;
    const narrow=typeof matchMedia==='function'&&matchMedia('(max-width:640px)').matches,dp=W/(ctx.canvas.clientWidth||W);
    const SERIF='"Times New Roman","STIX Two Text",Times,serif',SANS=tok('--f-body');
    F.clear();
    // —— 版面：桌面宽度时状态条（约 46 CSS px）浮在左上角，图从它下面开始；窄屏时状态条在画布下方，不用让 ——
    const top=narrow?6*u:46*dp+4*u,pad=14*u;
    // 颜色：深色背景下把红、紫两色调亮一些
    const pr=(F.paper.match(/[0-9a-f]{2}/gi)||['ff','ff','ff']).map(h=>parseInt(h,16)),dark=(pr[0]+pr[1]+pr[2])/3<110;
    const css=c=>{const k=dark?.3:0;return`rgb(${c.map(v=>Math.round(g8(v)*(1-k)+255*k)).join(',')})`};
    const COL={ink:INK,red:css(hue(700)),vio:css(hue(400))};
    // —— 带下标的文字：sg = [[文字, 类型]]，i 斜体、r 正体、s 斜体下标、n 正体下标、z 中文 ——
    const fsz=kd=>kd==='s'||kd==='n'?.68:1;
    const font=(kd,sz)=>kd==='z'?`${sz*ut}px ${SANS}`:`${kd==='r'||kd==='n'?'':'italic '}${fsz(kd)*sz*ut}px ${SERIF}`;
    const adv_=(t,kd,sz)=>{ctx.save();ctx.font=font(kd,sz);const w=ctx.measureText(t).width;ctx.restore();return w};
    const wid=(sg,sz)=>sg.reduce((w,[t,kd])=>w+adv_(t,kd,sz),0);
    const rich=(sg,x,y,{color=INK,size=19}={})=>{let xx=x-wid(sg,size)/2;
      for(const[t,kd]of sg){const yy=y+(kd==='s'||kd==='n'?.3*size*ut:0);
        if(kd==='z')F.zh(t,xx,yy,{color,size,align:'left'});else F.label(t,xx,yy,{color,size:fsz(kd)*size,align:'left',italic:!(kd==='r'||kd==='n')});xx+=adv_(t,kd,size)}};
    // —— 防叠字：每个字给几个候选位置，取第一个不出界、不压已占位置（且尽量不压线）的 ——
    const obs=[],todo=[],segs=[];
    const meet=(a,c)=>a.x<c.x+c.w&&c.x<a.x+a.w&&a.y<c.y+c.h&&c.y<a.y+a.h;
    const segBox=(b,[x1,y1,x2,y2])=>{let t0=0,t1=1;const dx=x2-x1,dy=y2-y1;
      for(const[p,q]of[[-dx,x1-b.x],[dx,b.x+b.w-x1],[-dy,y1-b.y],[dy,b.y+b.h-y1]]){if(p===0){if(q<0)return false}else{const r=q/p;if(p<0){if(r>t1)return false;if(r>t0)t0=r}else{if(r<t0)return false;if(r<t1)t1=r}}}return true};
    const hit=q=>q.x<2*u||q.x+q.w>W-2*u||q.y<top+2*u||q.y+q.h>H-2*u||obs.some(c=>meet(q,c));
    const soft=q=>segs.some(l=>segBox(q,l));
    const box=(sg,sz,[x,y])=>{const w=wid(sg,sz),h=sz*ut*.95;return{x:x-w/2-2*ut,y:y-h/2-2*ut,w:w+4*ut,h:h+4*ut}};
    const put=(sg,cands,o={})=>{const sz=o.size||19,c=cands.filter(p=>ok(p[0])&&ok(p[1]));if(!c.length)return null;
      const p=c.find(q=>!hit(box(sg,sz,q))&&!soft(box(sg,sz,q)))||c.find(q=>!hit(box(sg,sz,q)))||(o.must?c[0]:null);
      if(!p)return null;obs.push(box(sg,sz,p));todo.push([sg,p[0],p[1],o]);return p};
    const around=(sg,x,y,dirs,gap=4*ut,sz=19)=>{const w=wid(sg,sz)+4*ut,h=sz*ut*.95+4*ut;
      return dirs.map(([dx,dy])=>{const n=Math.hypot(dx,dy)||1;dx/=n;dy/=n;const e=Math.abs(dx)*w/2+Math.abs(dy)*h/2+gap;return[x+dx*e,y+dy*e]})};
    const block=(x,y,r)=>obs.push({x:x-r,y:y-r,w:2*r,h:2*r});
    const D8=[[0,-1],[1,-1],[-1,-1],[1,0],[-1,0],[0,1],[1,1],[-1,1]];
    const I=s=>[[s,'i']],Z=s=>[[s,'z']],SUB=(a,b,kd='n')=>[[a,'i'],[b,kd]],PR=s=>[[s,'i'],['′','i']];
    const zh=(t,cands,o={})=>put(Z(t),cands,{color:AUX,size:14,...o});
    const line=(x1,y1,x2,y2,o)=>{F.line(x1,y1,x2,y2,o);segs.push([x1,y1,x2,y2])};
    const aux=(x1,y1,x2,y2,o)=>{F.aux(x1,y1,x2,y2,o);segs.push([x1,y1,x2,y2])};

    /* —— 版面：上部光路图，下部坐标图 —— */
    const gh=Math.round(Math.max(150*u,(H-top)*.28,7.6*19*ut));
    const DA={x0:pad,x1:W-pad,y0:top+4*u,y1:H-gh-6*u};
    let sc=1,ox=0,oy=0;
    const X=x=>ox+x*sc,Y=y=>oy-y*sc;
    const fit=(b,m={})=>{const aw=DA.x1-DA.x0-(m.l||0)-(m.r||0),ah=DA.y1-DA.y0-(m.t||0)-(m.b||0);
      sc=Math.min(aw/Math.max(b.x1-b.x0,1e-12),ah/Math.max(b.y1-b.y0,1e-12));
      ox=DA.x0+(m.l||0)+(aw-(b.x1-b.x0)*sc)/2-b.x0*sc;oy=DA.y0+(m.t||0)+(ah-(b.y1-b.y0)*sc)/2+b.y1*sc};
    const rate=rateAt(K,S.tau),tauP=.12*rate;   // 光脉冲的长度：动画中约 0.12 s
    const playing=S.t>0;

    /* —— 光线：墨线 + 指示方向的小箭头；部分反射、折射光按能流变细；色散时红、紫两条细彩线 —— */
    const wStd=1.9,wMin=Math.max(.4,.6*dp/u);
    const wOf=E=>wMin+(wStd-wMin)*clamp(E,0,1);
    const head=(x1,y1,x2,y2,color,w)=>{const L=Math.hypot(x2-x1,y2-y1);if(L<34*u)return;const ux=(x2-x1)/L,uy=(y2-y1)/L,h=(5+1.6*w)*u,hw=h*.38,
      mx=x1+ux*(L/2+h/2),my=y1+uy*(L/2+h/2);ctx.save();ctx.beginPath();ctx.moveTo(mx,my);ctx.lineTo(mx-ux*h-uy*hw,my-uy*h+ux*hw);ctx.lineTo(mx-ux*h+uy*hw,my-uy*h-ux*hw);
      ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.restore()};
    function ray(x1,y1,x2,y2,color,w,o={}){F.line(x1,y1,x2,y2,{w,color,dash:o.dash||null});segs.push([x1,y1,x2,y2]);if(!o.noHead)head(x1,y1,x2,y2,color,w)}
    const same=(a,b,tol)=>Math.hypot(a.ax-b.ax,a.ay-b.ay)<tol&&Math.hypot(a.bx-b.bx,a.by-b.by)<tol;
    // trs：[{segs, col}]；map(x, y) → 屏幕；wf(seg) 线宽；返回每段的颜色（供光脉冲用）
    function drawRays(trs,map,wf=s=>s.role==='graze'?wMin:wOf(s.E),skipG=false,tol=1e-9){
      const out=[];
      if(trs.length===1){for(const s of trs[0].segs){if(skipG&&s.role==='graze')continue;const[a,b]=[map(s.ax,s.ay),map(s.bx,s.by)];ray(a[0],a[1],b[0],b[1],INK,wf(s));out.push([s,INK,null])}return out}
      const[A,B]=trs,shA=new Set(),shB=new Set();
      A.segs.forEach(a=>{const b=B.segs.find(q=>!shB.has(q.id)&&same(a,q,tol));if(b){shA.add(a.id);shB.add(b.id);out.push([a,INK,b])}});
      for(const T of[A,B])for(const s of T.segs){if(skipG&&s.role==='graze')continue;const sh=(T===A?shA:shB).has(s.id),[a,b]=[map(s.ax,s.ay),map(s.bx,s.by)];
        if(sh){if(T===A)ray(a[0],a[1],b[0],b[1],INK,wf(s))}
        else{const c=COL[T.col];ray(a[0],a[1],b[0],b[1],c,Math.max(wMin,Math.min(1.3,wf(s))));out.push([s,c,null])}}
      return out}
    // 光脉冲：真实时间 [t − τ, t] 落在该段上的部分，画成粗短线
    function pulses(list,map){if(!playing)return;const t=S.t;
      const part=s=>{const a=Math.max(s.t0,t-tauP),b=Math.min(s.t1,t);if(b<=a||s.t1<=s.t0)return null;
        const f=x=>(x-s.t0)/(s.t1-s.t0);return[s.ax+(s.bx-s.ax)*f(a),s.ay+(s.by-s.ay)*f(a),s.ax+(s.bx-s.ax)*f(b),s.ay+(s.by-s.ay)*f(b)]};
      for(const[s,c,s2]of list){if(s.role==='graze')continue;const w=s.E>=.3?3.6:s.E>=.05?2.6:1.8;
        const pa=part(s);
        if(s2){const pb=part(s2);   // 红、紫共用的一段：两色同时到达时画墨线，否则各画各的
          if(pa&&pb&&Math.abs(s.t0-s2.t0)<.02*tauP&&Math.abs(s.t1-s2.t1)<.02*tauP){const[a,b]=[map(pa[0],pa[1]),map(pa[2],pa[3])];F.line(a[0],a[1],b[0],b[1],{w,color:INK})}
          else{for(const[p,cc]of[[pa,COL.red],[pb,COL.vio]])if(p){const[a,b]=[map(p[0],p[1]),map(p[2],p[3])];F.line(a[0],a[1],b[0],b[1],{w:Math.min(w,2.6),color:cc})}}}
        else if(pa){const[a,b]=[map(pa[0],pa[1]),map(pa[2],pa[3])];F.line(a[0],a[1],b[0],b[1],{w:c===INK?w:Math.min(w,2.6),color:c})}}}
    // 角弧：屏幕点 P 处、两条世界方向 a、b 之间的小弧；字写在角平分线外侧
    function arcL(Pp,a,b,rad,sg,o={}){const A=Math.atan2(-a[1],a[0]),B=Math.atan2(-b[1],b[0]);let d=B-A;while(d>PI)d-=TAU;while(d<-PI)d+=TAU;
      if(Math.abs(d)<.5*RAD)return;const s=d>=0?A:B;F.arc(Pp[0],Pp[1],rad,s,s+Math.abs(d),{w:1,color:o.color||INK,dash:o.dash||null});
      if(!sg)return;const m=A+d/2,sz=o.size||17,c=[];for(const k of[9,16,24,33])c.push([Pp[0]+Math.cos(m)*(rad+k*ut),Pp[1]+Math.sin(m)*(rad+k*ut)]);
      const ex=o.extra||[],all=[...c,...ex],near=c.length;
      const p=put(sg,all,{size:sz,must:true,color:o.lc||INK});
      // 远处的候选位置：从弧的中点引一条细线到字
      if(p&&all.indexOf(p)>=near){const ax=Pp[0]+Math.cos(m)*rad,ay=Pp[1]+Math.sin(m)*rad,bb=box(sg,sz,p),tx=clamp(ax,bb.x,bb.x+bb.w),ty=clamp(ay,bb.y,bb.y+bb.h);F.line(ax,ay,tx,ty,{w:.8,color:AUX})}}

      const x=TX(K.b);F.dot(x,gy,3.4);
      put(I('b'),[[x,gy-30*ut],[x,gy+40*ut]],{size:16})}
    function gDrop(){
      const R=K.R,f=(b,n)=>{const th=Math.asin(b/R),a=Math.asin(Math.sin(th)/n);return(4*a-2*th)*DEG};
      let mx=0;for(const T of K.tr)for(let b=0;b<R;b+=R/2000)mx=Math.max(mx,f(b,T.n));
      const yTop=Math.max(10,Math.ceil(mx/10)*10+5),G=axes([['b','i'],['/cm','r']],[['4','r'],['α','i'],[' − 2','r'],['θ','i'],['/(°)','r']],wid([['40','r']],14));
      const TX=b=>G.gx0+(G.px1-G.gx0)*b/R,VY=v=>G.gy0-(G.gy0-G.py1)*v/yTop;
      for(let v=10;v<yTop;v+=10)if(v%20===0)tickY(G,VY(v),[[String(v),'r']]);
      const st=nice(R*100/3);for(let v=st;v<=R*100*1.0001;v+=st)tickX(G,TX(v/100),[[String(+v.toPrecision(3)),'r']]);
      const two=K.tr.length>1;
      for(const T of K.tr){const c=two?COL[T.col]:INK,pts=[];let best=[0,0];for(let k=0;k<=3000;k++){const b=R*(1-1e-6)*k/3000,v=f(b,T.n);if(k%10===0||k===3000)pts.push([TX(b),VY(v)]);if(v>best[1])best=[b,v]}
        curve(pts,{w:two?1.2:1.6,color:c});
        if(T.col!=='vio'){F.aux(TX(best[0]),VY(best[1]),TX(best[0]),G.gy0);F.aux(G.gx0,VY(best[1]),TX(best[0]),VY(best[1]));
          put([['虹（极大 ','z'],[fmt(best[1],2)+'°','r'],['）','z']],[[TX(best[0])-60*ut,VY(best[1])-12*ut],[TX(best[0]),VY(best[1])-14*ut]],{size:13,must:true})}
        const o=tubeM(K,T);if(ok(o.rb)){const x=TX(K.b),y=VY(o.rb*DEG);F.aux(x,G.gy0,x,y);F.dot(x,y,2.8,c)}}}

    if(K.sc==='semi'){dSemi();gSemi()}else if(K.sc==='slab'){dSlab();gSlab()}else if(K.sc==='fiber'){dFiber();gFiber()}else{dTube();K.drop?gDrop():gTube()}
    todo.forEach(([sg,x,y,o])=>rich(sg,x,y,o));
    F.zh(slowTxt,DA.x1,DA.y0+7*ut,{align:'right',color:playing?INK:AUX});
  }

  return{
    legend:[{label:'光线（墨线；部分反射、部分折射光按能流变细）',color:'--fig-ink'},{label:'法线、界面延长线（细虚线）',color:'--fig-aux'},
      {label:'色散：红光 700 nm',color:'--lam700,rgb(255,0,0)'},{label:'紫光 400 nm',color:'--lam400,rgb(122,0,255)'}],
    init(P){const K=build(P);const S={K,tau:0,t:0,done:false};S.status=status(S);return S},
    step(S,P,dt){if(S.done)return;const K=S.K;S.tau=Math.min(K.Tanim+.2,S.tau+dt);S.t=realOf(K,S.tau);
      if(S.tau>=K.Tanim+.2)S.done=true;S.status=status(S)},
    readouts(S,P){return readouts(S)},
    draw,
    verdict(P){keep(P);ui(P);return verdict(P)},
    _build:build   // 供自查脚本直接取追迹结果
  };
})();

/* ================= 通用渲染引擎（所有母题共用，不改） ================= */
(()=>{
const D=JSON.parse(document.getElementById('data').textContent);
const PLAY=D.playLabel||'发射';   // 播放按钮上的动词，数据里可用 playLabel 改写（如「碰撞」「转动」）
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const root=document.documentElement;
const tok=n=>getComputedStyle(root).getPropertyValue(n).trim();
const PS=D.problem.params;
const P={};PS.forEach(p=>P[p.key]=p.def);
const unitSep=u=>/^[°′″]/.test(u)?'':' ';   // 角度单位紧贴数字：90°
const fmtP=p=>p.type==='choice'?p.options.find(o=>o.value===P[p.key]).label:(+P[p.key]).toFixed(p.dec??2)+(p.unit?unitSep(p.unit)+p.unit:'');

/* 静态内容 */
document.title=`格物 ${D.id} ${D.name.replace(/（.*）/,'')}`;
$('hName').textContent=D.name;
$('hSub').textContent=`${D.module} · ${D.chapter}　关联：${D.related.join('、')}`;
$('hTable').innerHTML=`<tr><th>编号</th><th>考查频率</th><th>难度</th><th>版本</th></tr>
<tr><td class="code">${esc(D.id)}</td><td>${esc(D.freq)}</td><td title="${D.difficulty} / 5">${'●'.repeat(D.difficulty)}${'○'.repeat(5-D.difficulty)}</td><td>${esc(D.version)}</td></tr>`;
$('foot').textContent=`格物 Gewu · ${D.id} · ${D.version} · ${D.footer??'g 取 10 m/s²'}`;   // 数据里可用 footer 改写页脚常量
$('tags').innerHTML=D.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('');
$('stemNote').textContent=D.problem.note||'';
$('bCond').innerHTML=D.boundary.conditions.map(c=>`<li><span>${esc(c)}</span></li>`).join('');
$('bBack').innerHTML=D.boundary.fallback.map(c=>`<li><span>${esc(c)}</span></li>`).join('');
$('legend').innerHTML=SIM.legend.map(l=>`<span><i style="background:var(${l.color})"></i>${esc(l.label)}</span>`).join('');
$('concl').innerHTML=D.conclusions.map(c=>`<details><summary><span class="badge">${c.id}</span><span class="t">${esc(c.title)}</span><span class="f">${esc(c.formula)}</span><span class="chev" aria-hidden="true"></span></summary><div class="deriv">${esc(c.derivation)}</div></details>`).join('');
const qCard=(q,isVar)=>`<article class="q">
  <div class="head"><span class="badge">${q.id}</span><h3>${esc(q.title)}</h3>${isVar?q.cs.map(c=>`<span class="chip">${c}</span>`).join(''):`<span class="chip">${q.anim?'计划做动画':'不做动画'}</span>`}</div>
  <p>${esc(q.stem)}</p>
  ${isVar?'':`<p class="map">映射：<b>${esc(q.map)}</b></p>`}
  <details><summary><span class="chev" aria-hidden="true"></span>答案与解析</summary><div class="ans"><p class="a">答案：${esc(q.answer)}</p><p>${esc(q.analysis)}</p></div></details>
  <div class="foot"><span class="src">${esc(q.source)}</span>${isVar?`<button data-load="${q.id}">加载到动画 ↑</button>`:''}</div>
</article>`;
$('variants').innerHTML=D.variants.map(v=>qCard(v,true)).join('');
$('reskins').innerHTML=D.reskins.map(r=>qCard(r,false)).join('');
$('sources').innerHTML=D.sources.map(s=>`<li><b>${esc(s.src)}</b><span>${esc(s.desc)}</span></li>`).join('');

/* 参数控件 */
const box=$('params');
PS.forEach(p=>{
  if(p.type==='choice'){
    const d=document.createElement('div');d.className='seg';d.id=`f-${p.key}`;d.setAttribute('role','group');d.setAttribute('aria-label',p.label);
    d.innerHTML=p.options.map(o=>`<button id="opt-${p.key}-${o.value}" data-k="${p.key}" data-v="${o.value}">${esc(o.label)}${o.hint?`<small>${esc(o.hint)}</small>`:""}</button>`).join('');
    box.appendChild(d);
  }else{
    const d=document.createElement('div');d.className='field';d.id=`f-${p.key}`;
    d.innerHTML=`<label for="num-${p.key}"><span class="s">${esc(p.sym)}</span><span class="note">${esc(p.label)}</span></label><span class="numin"><input type="number" id="num-${p.key}" min="${p.min}" max="${p.max}" step="any" inputmode="decimal" aria-label="${esc(p.label)}"><span class="u">${esc(p.unit||'')}</span></span><input type="range" id="in-${p.key}" min="${p.min}" max="${p.max}" step="${p.step}" value="${p.def}" aria-label="${esc(p.label)} 滑块">`;
    box.appendChild(d);
    d.querySelector('input[type=range]').addEventListener('input',e=>{P[p.key]=+e.target.value;active=-1;sync();reset()});
    const num=d.querySelector('input[type=number]');
    num.addEventListener('change',()=>{let v=parseFloat(num.value);
      if(Number.isFinite(v)){v=Math.min(p.max,Math.max(p.min,v));P[p.key]=v;active=-1;reset()}sync()});
    num.addEventListener('keydown',e=>{if(e.key==='Enter')num.blur()});
  }
});
box.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;P[b.dataset.k]=b.dataset.v;active=-1;sync();reset()});
let active=-1;
const shown=w=>!w||Object.entries(w).every(([k,v])=>[].concat(v).includes(P[k]));
const CH0=PS.find(p=>p.type==='choice');   // 预设只按第一个选项参数（情境 / 模式）分组，其余选项由预设的 load 带过去
const chosen=o=>!CH0||o[CH0.key]===undefined||o[CH0.key]===P[CH0.key];
const numTxt=(p,v)=>String(+(+v).toFixed(Math.max(p.dec??2,4)));
function sync(){
  PS.forEach(p=>{
    if(p.type==='choice'){p.options.forEach(o=>$(`opt-${p.key}-${o.value}`).setAttribute('aria-pressed',P[p.key]===o.value));if(p.when)$(`f-${p.key}`).hidden=!shown(p.when)}
    else{$(`in-${p.key}`).value=P[p.key];const n=$(`num-${p.key}`);if(document.activeElement!==n)n.value=numTxt(p,P[p.key]);$(`f-${p.key}`).hidden=!shown(p.when)}
  });
  const fill=s=>esc(s).replace(/\{(\w+)\}/g,(m,k)=>{
    if(k==='constraint'){const p=PS.find(x=>x.type==='choice');return esc(p.options.find(o=>o.value===P[p.key]).text)}
    const p=PS.find(x=>x.key===k);return p?`<span class="num">${esc(fmtP(p))}</span>`:m});
  const [lead,ask='']=D.problem.stem.split(/问[:：]/);
  $('stem').innerHTML=fill(lead.trim());
  const qs=ask.split(/[①②③④⑤⑥]/).map(s=>s.trim()).filter(Boolean);
  $('asks').innerHTML=qs.map((q,i)=>`<li><b>${i+1}</b><span>${fill(q)}</span></li>`).join('');
  $('asks').hidden=!qs.length;
  $('verdict').innerHTML=SIM.verdict(P);
  const ch=PS.find(p=>p.type==='choice');
  $('presetMode').textContent=ch?`· ${ch.options.find(o=>o.value===P[ch.key]).label}`:'';
  $('presets').innerHTML=D.presets.map((p,i)=>chosen(p.load)?`<button data-preset="${i}" aria-pressed="${i===active}" title="${esc(p.note||'')}">${esc(p.label)}</button>`:'').join('');
  const pn=$('pnote'),ap=D.presets[active];pn.hidden=!(ap&&ap.note);if(ap&&ap.note)pn.innerHTML=`<b>${esc(ap.label)}</b>：${esc(ap.note)}`;
}
function load(o,i=-1){Object.assign(P,o);active=i;sync();reset()}
$('presets').addEventListener('click',e=>{const b=e.target.closest('[data-preset]');if(b)load(D.presets[+b.dataset.preset].load,+b.dataset.preset)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-load]');if(!b)return;
  load(D.variants.find(v=>v.id===b.dataset.load).load);
  show('pane-lab');document.querySelector('.board').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})});

/* 画布与循环 */
const cv=$('cv'),ctx=cv.getContext('2d');let S,running=false,speed=1,lastT=0;
function size(){const r=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);const w=Math.max(200,Math.round(r.width*dpr));if(cv.width!==w){cv.width=w;cv.height=w}}
function render(){size();SIM.draw(ctx,S,P,cv.width,cv.height,tok);
  $('readout').innerHTML=SIM.readouts(S,P).map(([k,v])=>`<div class="ro"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('');
  const st=$('status');st.textContent=S.status.text;st.className='status '+S.status.cls}
function reset(){running=false;S=SIM.init(P);$('play').textContent=`▶ ${PLAY}`;render()}
function loop(t){if(!running)return;const real=Math.min(.05,(t-lastT)/1000);lastT=t;
  const sim=real*speed,n=Math.max(1,Math.ceil(sim/5e-4));for(let i=0;i<n;i++)SIM.step(S,P,sim/n);
  render();if(S.done){running=false;$('play').textContent=`▶ 再${PLAY}`;return}requestAnimationFrame(loop)}
$('play').onclick=()=>{if(running){running=false;$('play').textContent='▶ 继续';return}
  if(S.done)S=SIM.init(P);running=true;$('play').textContent='❚❚ 暂停';lastT=performance.now();requestAnimationFrame(loop)};
$('reset').onclick=reset;
$('slow').onclick=()=>{speed=speed===1?.25:1;$('slow').textContent=speed===1?'慢放 ×0.25':'正常速度'};
new ResizeObserver(render).observe(cv);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);
new MutationObserver(render).observe(root,{attributes:true,attributeFilter:['data-theme']});
/* 选项卡 */
const tabs=[...document.querySelectorAll('[role=tab]')];
function show(id){tabs.forEach(t=>{const on=t.dataset.pane===id;t.setAttribute('aria-selected',on);t.tabIndex=on?0:-1;$(t.dataset.pane).hidden=!on});
  if(id==='pane-lab')requestAnimationFrame(render)}
tabs.forEach((t,i)=>{t.addEventListener('click',()=>show(t.dataset.pane));
  t.addEventListener('keydown',e=>{const d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;if(!d)return;e.preventDefault();
    const n=tabs[(i+d+tabs.length)%tabs.length];n.focus();show(n.dataset.pane)})});
$('nConcl').textContent=D.conclusions.length;$('nVar').textContent=D.variants.length;$('nSkin').textContent=D.reskins.length;$('nSrc').textContent=D.sources.length;
show('pane-lab');
sync();reset();
})();
</script>
