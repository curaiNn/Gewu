  "conclusions": [
    {
      "id": "C1",
      "title": "多过程问题的分段与衔接：以「力突变」为分段点（施加或撤去外力、进入另一接触面、速度为零后滑动摩擦力反向或变为静摩擦力、与传送带共速）；每段受力恒定，做匀变速直线运动；相邻两段由速度衔接，位移、时间相加；v–t 图是折线",
      "formula": "aₖ = F合ₖ/m；vₖ = vₖ₋₁ + aₖtₖ；xₖ = (vₖ₋₁ + vₖ)tₖ/2 = (vₖ² − vₖ₋₁²)/(2aₖ)；x = Σxₖ；v–t 图斜率 = a，与 t 轴所围面积 = 位移（t 轴下方为反向位移），速度连续、加速度可以突变",
      "derivation": "每一段内各力恒定，F合恒定，a = F合/m 恒定，所以每段都是匀变速直线运动，可用 v = v₀ + at、x = v₀t + ½at²、v² − v₀² = 2ax、x = (v₀ + v)t/2。力突变时加速度立刻突变，但速度不能突变（力有限，Δv = aΔt 在极短时间内趋于零），所以上一段的末速度就是下一段的初速度，v–t 图连续、在分段点折一下。斜率是加速度，面积是位移；求总位移、比较时间时常用面积（#11：擦冰早晚不同，两种走法的 v–t 图与 t 轴所围面积相同，早擦时前段速度降得慢，所用时间短，选 C）。例：\n· #15：0–t₀ 内升力 4 × 4.2 N = 16.8 N，m = 0.835 kg + 0.365 kg = 1.2 kg，a₁ = (16.8 − 12) ÷ 1.2 m/s² = 4.0 m/s²，t₀ = 5 ÷ 4.0 s = 1.25 s；悬停高度 = 梯形面积 ½ × 5 × 1.25 m + 5 × 2.5 m + ½ × 5 × 0.625 m ≈ 17.2 m；3t₀–3.5t₀ 内 a₃ = 5 ÷ 0.625 m/s² = 8.0 m/s²（向下），升力 m(g − a₃) = 2.4 N，上升 1.5625 m，机械能增加 2.4 N × 1.5625 m = 3.75 J\n· #5：无电区内只受阻力，匀减速，平均速度 (32 + 28)/2 m/s = 30 m/s，t = 150 m ÷ 30 m/s = 5.0 s，a = 0.8 m/s²，f = ma = 4.0×10⁵ N；离开后 F − f = ma′，F = 4.0×10⁵ N + 5×10⁵ × 0.5 N = 6.5×10⁵ N——前一段求出的阻力用到后一段，这是多过程题最常见的衔接方式"
    },
    {

      "formula": "上滑 a上 = g(sinθ + μcosθ)，x = v₀²/(2a上)，t上 = v₀/a上；μ ≥ tanθ 停住，静摩擦力 mg sinθ；μ < tanθ 下滑 a下 = g(sinθ − μcosθ)，回到出发点 t下/t上 = √(a上/a下)，v回 = v₀√(a下/a上) < v₀；向下运动且 μ > tanθ 时匀减速 a = g(μcosθ − sinθ)",
      "derivation": "上滑时物块相对斜面向上运动，滑动摩擦力沿斜面向下，与重力的下滑分力同向：mg sinθ + μmg cosθ = ma上。到最高点速度为零，摩擦力变为静摩擦力，需要 mg sinθ 才能平衡，最大静摩擦力是 μmg cosθ，所以 μ ≥ tanθ 时停住，μ < tanθ 时下滑。下滑时摩擦力反向：mg sinθ − μmg cosθ = ma下 < ma上。上下两段位移大小相同：x = v₀²/(2a上) = v回²/(2a下)，v回 = v₀√(a下/a上)；x = ½at²，t下/t上 = √(a上/a下)。上滑快、下滑慢，回来时速度变小、用时变长（摩擦力一直做负功）。μ = 0（光滑）时 a上 = a下 = g sinθ，往返对称。例：\n· #12：停下后不溜滑 mg sinθ ≤ μmg cosθ，tanθ ≤ 0.4（原卷写 θ < arctan0.4）；θ = 15° 时 S = v₀²/[2g(sinθ + μcosθ)] = 25² ÷ [2 × 9.8 × (0.26 + 0.4 × 0.97)] m ≈ 49 m\n· #7：AB 段 a = g(sinθ − μcosθ) = 9.8 × (0.6 − 0.4) m/s² = 1.96 m/s²，AB = H/sinθ = 10 m，vB = √(2 × 1.96 × 10) m/s ≈ 6.26 m/s；BC 段 a = μg = 4.9 m/s²，t = vB/(μg) ≈ 1.28 s。全程摩擦力做功由动能定理得 −mgH = −5880 J，与 θ、μ 无关（MEC-ENG-02，V2 第 (4) 问）\n· #1：沿斜坡匀减速下坡，加速度 a = (20 − 5) ÷ 5 m/s² = 3.0 m/s²，沿坡向上；制动力 F、阻力 f 沿坡向上，重力分力沿坡向下：F + f − mg sinθ = ma，F = 1500 × 3.0 N − 500 N + 1500 × 9.8 × sin4.8° N ≈ 5230 N；位移 (20 + 5)/2 × 5 m = 62.5 m。下坡时重力分力帮倒忙，所需制动力比平路大 mg sinθ（R2）\n· 2023 等级考第 19 题（另见）：μ = √3/3 = tan30°，撤去拉力后线框减速到零时 mg sin30° = μmg cos30°，恰好不下滑"

      "derivation": "支持力 N 垂直斜面，摩擦力 f 沿斜面，两者垂直，合力 F = √(N² + f²)，与法线的夹角 φ 满足 tanφ = f/N。滑动时 f = μN，tanφ = μ，与速度大小无关，只在相对运动反向时偏到法线另一侧；N = mg cosθ 时 F = mg cosθ√(1 + μ²)。静止时物块只受重力和斜面作用力，二力平衡，F = mg、竖直向上。物块只受重力 mg 和斜面作用力 F、加速度为 a（沿斜面）时，F = ma − mg（矢量），由余弦定理 F = m√(g² + a² + 2ag sinθ)（a 沿斜面向上：a 与 −g 的夹角为 90° − θ）；a 沿斜面向下取 −。例：\n· #2：松鼠沿 60° 树枝向上匀加速，a = 2x/t² = 1.0 m/s²；F = 0.3 × √(9.8² + 1.0² + 2 × 1.0 × 9.8 × sin60°) N ≈ 3.2 N。树枝对松鼠的摩擦力是静摩擦力，沿树枝向上，是使它加速的动力（R3）\n· #13：滑环质量不计，所受合力为零，绳对滑环的拉力与钢索对滑环的作用力（支持力 + 摩擦力）等大反向；绳的拉力在两端相等，所以绳对游客的拉力就等于钢索对滑环的作用力：垂直钢索分量 mg cosθ，沿钢索分量 μmg cosθ（向后），T = mg cosθ√(1 + μ²) = 60 × 9.8 × 0.8 × 2/√3 N ≈ 543 N，偏离垂直钢索方向 arctan(√3/3) = 30°，偏向后上方。游客 a = g(sinθ − μcosθ) ≈ 1.35 m/s²，有竖直向下的分量，失重；拉力有与运动方向相反的分量，对游客做负功"

<script>
/* ================= 线稿绘图工具 FIG（所有母题共用，不改） =================
   画法照试卷插图：装置用墨线，固定面画斜线阴影，辅助线用虚线，物理量和点的字母用斜体衬线；
   只有矢量带颜色（--g 重力/外力，--n 弹力/约束力，--v 速度，--a 其他矢量）。
   用法：SIM.draw 里 const F=FIG(ctx,W,tok)；坐标是画布像素，F.u = W/720 是线宽与几何的基准单位，
   F.ut 是字号单位（窄屏时不再随画布缩小，保证字母不小于约 11 CSS 像素；自写文字函数也要用 F.ut 算字号）。
   颜色：F.ink 墨线、F.auxColor 辅助线、F.paper 纸色（F.aux 是画辅助线的方法，不是颜色）。 */
const FIG=(ctx,W,tok)=>{
  const u=W/720,ink=tok('--fig-ink'),aux=tok('--fig-aux'),paper=tok('--card');
  const dp=W/(ctx.canvas.clientWidth||W),ut=Math.max(u,dp*11/19);   // dp：每 CSS 像素的画布像素数
  const SERIF='"Times New Roman","STIX Two Text",Times,serif',SANS=tok('--f-body');
  const path=(fn,{w=1.6,color=ink,dash=null,fill=null}={})=>{ctx.save();ctx.beginPath();fn();
    if(fill){ctx.fillStyle=fill;ctx.fill()}
    if(w>0){ctx.lineWidth=w*u;ctx.strokeStyle=color;ctx.setLineDash(dash?dash.map(d=>d*u):[]);ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}
    ctx.restore()};
  // 文字先描一圈底色再填色，压在线条上也清楚
  const text=(t,x,y,font,color,align,base)=>{ctx.save();ctx.font=font;ctx.textAlign=align;ctx.textBaseline=base;
    ctx.lineJoin="round";ctx.lineWidth=5*ut;ctx.strokeStyle=paper;ctx.strokeText(t,x,y);ctx.fillStyle=color;ctx.fillText(t,x,y);ctx.restore()};
  const F={u,ut,ink,auxColor:aux,paper,
    clear(){ctx.save();ctx.setLineDash([]);ctx.fillStyle=paper;ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height);ctx.restore()},
    line(x1,y1,x2,y2,o){path(()=>{ctx.moveTo(x1,y1);ctx.lineTo(x2,y2)},o)},
    poly(pts,o){path(()=>pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y)),o)},
    circle(x,y,r,o){path(()=>ctx.arc(x,y,r,0,2*Math.PI),o)},
    arc(x,y,r,a0,a1,o){path(()=>ctx.arc(x,y,r,a0,a1),o)},
    rect(x,y,w,h,o){path(()=>ctx.rect(x,y,w,h),o)},
    // 辅助线（中心线、投影线等）
    aux(x1,y1,x2,y2,o={}){F.line(x1,y1,x2,y2,{w:1,color:aux,dash:[6,5],...o})},
    // 运动轨迹：细虚线
    trail(pts,o={}){if(pts.length>1)F.poly(pts,{w:1.3,color:aux,dash:[5,5],...o})},
    // 固定面斜线：沿 (x1,y1)→(x2,y2) 的直线，画在 side 一侧（屏幕坐标下，1 = 前进方向右手侧）
    hatch(x1,y1,x2,y2,side=1,{gap=12,len=10}={}){const L=Math.hypot(x2-x1,y2-y1),n=Math.max(1,Math.round(L/(gap*u)));
      const tx=(x2-x1)/L,ty=(y2-y1)/L,nx=-ty*side,ny=tx*side,ox=(nx-tx)*len*u/Math.SQRT2,oy=(ny-ty)*len*u/Math.SQRT2;
      path(()=>{for(let i=0;i<=n;i++){const x=x1+(x2-x1)*i/n,y=y1+(y2-y1)*i/n;ctx.moveTo(x,y);ctx.lineTo(x+ox,y+oy)}},{w:1,color:aux})},
    // 圆弧形固定面的斜线：out = true 画在圆外侧
    hatchArc(cx,cy,r,a0,a1,out=true,{gap=12,len=10}={}){const n=Math.max(1,Math.round(r*Math.abs(a1-a0)/(gap*u))),s=out?1:-1;
      path(()=>{for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n,c=Math.cos(a),si=Math.sin(a),x=cx+r*c,y=cy+r*si;
        const nx=c*s,ny=si*s,tx=-si,ty=c;ctx.moveTo(x,y);ctx.lineTo(x+(nx-tx)*len*u/Math.SQRT2,y+(ny-ty)*len*u/Math.SQRT2)}},{w:1,color:aux})},
    // 矢量：从 (x,y) 画到 (x+dx,y+dy)，细杆 + 窄实心箭头；label 用斜体写在箭头外侧，
    // 与别的矢量共线时用 off=[dx,dy]（单位 u，相对箭头尖）把标注挪到旁边
    arrow(x,y,dx,dy,color,label,{w=2,head=12,size=19,off=null}={}){const L=Math.hypot(dx,dy);if(L<2*u)return;
      const ux=dx/L,uy=dy/L,h=Math.min(head*u,L*.6),hw=h*.34,tx=x+dx,ty=y+dy;
      F.line(x,y,tx-ux*h*.7,ty-uy*h*.7,{w,color});
      path(()=>{ctx.moveTo(tx,ty);ctx.lineTo(tx-ux*h-uy*hw,ty-uy*h+ux*hw);ctx.lineTo(tx-ux*h+uy*hw,ty-uy*h-ux*hw);ctx.closePath()},{w:0,fill:color});
      if(label)F.label(label,off?tx+off[0]*u:tx+ux*14*u,off?ty+off[1]*u:ty+uy*14*u,{color,size})},
    // 斜体衬线字母（物理量、点名）
    label(t,x,y,{color=ink,size=19,align='center',base='middle',italic=true}={}){text(t,x,y,`${italic?'italic ':''}${size*ut}px ${SERIF}`,color,align,base)},
    // 中文小注
    zh(t,x,y,{color=aux,size=14,align='center',base='middle'}={}){text(t,x,y,`${size*ut}px ${SANS}`,color,align,base)},
    dot(x,y,r=2.6,color=ink){F.circle(x,y,r*u,{w:0,fill:color})},
    // 带名字的点：实心小点 + 斜体字母（dx、dy 为字母相对点的偏移，单位 u）
    point(x,y,name,dx=-13,dy=13){F.dot(x,y);if(name)F.label(name,x+dx*u,y+dy*u)},
    // 小球：空心圆，球心另用 F.dot 标出（矢量画完后再点，表示力作用在重心）
    ball(x,y,r){F.circle(x,y,r,{w:1.6,fill:paper})},
    // 尺寸标注：两端带箭头的细线，文字写在中点外侧 off（单位 u）
    dim(x1,y1,x2,y2,t,{off=14,color=ink}={}){const L=Math.hypot(x2-x1,y2-y1);if(L<4*u)return;const ux=(x2-x1)/L,uy=(y2-y1)/L,h=Math.min(8*u,L/3),hw=h*.38;
      F.line(x1,y1,x2,y2,{w:1,color});
      for(const[px,py,sx]of[[x1,y1,1],[x2,y2,-1]])path(()=>{ctx.moveTo(px,py);ctx.lineTo(px+sx*ux*h-uy*hw,py+sx*uy*h+ux*hw);ctx.lineTo(px+sx*ux*h+uy*hw,py+sx*uy*h-ux*hw);ctx.closePath()},{w:0,fill:color});
      if(t)F.label(t,(x1+x2)/2-uy*off*u,(y1+y2)/2+ux*off*u,{color})},
  };
  return F;
};

/* ================= SIM 模块：每个母题替换这一段 =================
   约定接口：
   SIM.legend            [{label, color(CSS 变量名)}]
   SIM.init(P)           → 状态 S（含 S.done、S.status={text,cls}）
   SIM.step(S,P,dt)      推进 dt 秒（引擎保证 dt ≤ 0.5 ms）
   SIM.readouts(S,P)     → [[标签, 带单位的值]]
   SIM.draw(ctx,S,P,W,H,tok)  tok(name) 取主题色
   SIM.verdict(P)        → 理论预判 HTML
*/
const SIM=(()=>{
  /* 牛顿第二定律的多过程问题：三个情境（斜面上滑再下滑 / 水平面先加速后减速 / 传送带），物体沿直线运动，每一段受力恒定。
     物理（不用预设轨迹）：状态 y = (s, v, 路程, 相对位移 r, 相对路程, 电动机多做的功 W)，按当前阶段的受力求 a，RK4 积分，步长 h ≤ 1 ms；
       dr/dt = v − v带，d(相对路程)/dt = |v − v带|，dW/dt = f·v带（f 为带对物块的摩擦力；带速不变，电动机对带的力与 f 等大同向）。
     阶段与受力（每段内恒定，力突变处分段）：
       斜面：s > 0（或 s = 0 且 v > 0）在斜面上，沿斜面向上为正；s < 0 在地面上（离 B 的距离取负）。v > 0 上滑 f = −μN；v < 0 下滑 f = +μN；
         v = 0 时先判是否相对滑动：需要的静摩擦力 mg sinθ ≤ μN 则静止，否则下滑。地面上 N = mg、f = μ₂mg，停下即静止。
       水平面：t < t₁ 时 N = mg − F sinα（α 斜向上为正），由静止先判能否拉（推）动：F cosα ≤ μN 则不动；N < 0 时木箱离地（超出边界，停止计算）。
         t₁ 时撤去 F：N 突变为 mg，f 突变为 μmg，停下即静止。
       传送带：w = v − v带；w ≠ 0 时 f = −μmg cosθ·sgn(w)；w = 0 时需要的静摩擦力 mg sinθ ≤ μN 则随带运动，否则相对带向下滑（f 沿带向上）。
     事件（都在步内二分定位，事件后按新状态重新判断受力）：速度为零（最高点、停下、反向）；斜面到达 B；t = t₁ 撤去 F；与带共速；到达 A、B 端（离开）。
       判静止取相对容差 10⁻⁵：37° 按 36.87° 输入，tan36.87° 比 0.75 大 2.9×10⁻⁶，μ = tanθ 的临界要判为静止；滑块上相邻的 36.86°、36.88° 离临界 3.6×10⁻⁴，不受影响。
       结束：静止（推不动）或离开传送带后再演示 1 画面秒（期间传送带照常运行）；全程超过 120 s 时截止。结束后读数冻结在结束时刻。
     公式值：逐段用匀变速公式与同样的判据算出「理论过程」（每段的 t、s、v、划痕、Q、W），只用于预判、读数对照、画面比例、视野与坐标范围，不进入积分。
     划痕 = 相对位移 r 在全过程中的最大值与最小值之差（两段相对运动反向时重叠，不超过 2L）；生热 Q = μN × 相对路程。
     时间：过程短于 1.5 s 时慢放到约 1.5 s，长于 8 s 时快放到约 8 s；读数始终为真实时间。
     引擎不支持的界面细节放在 verdict 里处理（引擎每次同步参数都会调用它）：m、F 用对数滑块（外层捕获滑块的 input，换算后交给数字输入框的 change）；
       播放按钮旁加「单步」（跳到下一个事件）；斜面情境加「显示斜面作用力」开关（只改画法，不重置）；题干中的数按 2 ~ 3 位有效数字显示，36.87° 写作 37°。 */
  const g=10,PI=Math.PI,D2R=PI/180,EPS=1e-5,TCAP=120,HMAX=1e-3,HOLD=1;
  const SUP={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
  const sup=n=>String(n).replace(/./g,c=>SUP[c]);
  const ok=x=>typeof x==='number'&&isFinite(x);
  // n 位有效数字；|x| < 10⁻³ 或 ≥ 10⁵ 写成 a×10ⁿ；负号用 −
  const sf=(x,n=3)=>{if(!ok(x))return'—';const a=Math.abs(x),s=x<0?'−':'';if(a<1e-12)return'0'; // 浮点残差（本页物理量最小约 10⁻⁶）显示为 0
  
    let p=Math.floor(Math.log10(a)),m=+(a/Math.pow(10,p)).toPrecision(n);if(m>=10){m/=10;p++}
    if(p<-3||p>=5)return s+m.toFixed(n-1)+'×10'+sup(p);
    return s+(m*Math.pow(10,p)).toFixed(Math.max(0,n-1-p))};
  const sg=(x,n=3)=>ok(x)&&x>0?'+'+sf(x,n):sf(x,n);
  const z=(x,s)=>Math.abs(x)<=1e-9*Math.abs(s)?0:x;                 // 相对量程小于 10⁻⁹ 的数显示为 0（积分舍入误差）
  const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
  const nice=x=>{if(!(x>0))return 1;const p=Math.pow(10,Math.floor(Math.log10(x))),r=x/p;return(r<1.5?1:r<3.5?2:r<7.5?5:10)*p};
  const RT=[1,1.5,2,2.5,3,4,5,6,8,10];
  // 画面倍速（物理秒 / 画面秒）：取 1、1.5、2、2.5、3、4、5、6、8 × 10ⁿ 中最接近的数；小于 1 时按慢放倍数取整齐数
  const niceRate=r=>{if(!(r>0))return 1;if(Math.abs(r-1)<1e-12)return 1;const inv=r<1,x=inv?1/r:r,p=Math.pow(10,Math.floor(Math.log10(x))),q=x/p;
    let best=1;for(const c of RT)if(Math.abs(Math.log(c/q))<Math.abs(Math.log(best/q)))best=c;const v=best*p;return inv?1/v:v};
  const num=x=>String(+(+x).toPrecision(3)).replace('-','−');
  const rateTxt=r=>Math.abs(r-1)<1e-9?'实时':r>1?'快放 ×'+num(r):'慢放 ×'+num(1/r);
  const tS=x=>!ok(x)?'—':Math.abs(x)<1e4?x.toFixed(4):sf(x,6);
  const CIR='⓪①②③④⑤⑥⑦⑧⑨⑩⑪⑫';
  const cir=i=>CIR[Math.min(i,CIR.length-1)];
  const SUBD=n=>String(n).replace(/\d/g,d=>'₀₁₂₃₄₅₆₇₈₉'[d]);
  const dg=x=>x/D2R;

  /* ---------- 参数 ---------- */
  const scOf=P=>P.scene==='flat'||P.scene==='belt'?P.scene:'slope';
  function cfg(P){
    const sc=scOf(P),m=Math.max(1e-6,+P.m||0),K={sc,m,vb:0,F:0,al:0,t1:0,th:0,sn:0,cs:1,mu2:0,L:0};
    if(sc==='slope'){const th=clamp(+P.th||0,0,89)*D2R;
      Object.assign(K,{th,sn:Math.sin(th),cs:Math.cos(th),mu:Math.max(0,+P.mu||0),mu2:Math.max(0,+P.mu2||0),v0:clamp(+P.v0||0,-1e4,1e4),s0:Math.max(0,+P.s0||0)})}
    else if(sc==='flat')Object.assign(K,{F:Math.max(0,+P.F||0),al:clamp(+P.al||0,-89,89)*D2R,mu:Math.max(0,+P.muh||0),t1:Math.max(1e-3,+P.t1||0),v0:0,s0:0});
    else{const th=clamp(+P.thb||0,0,89)*D2R,L=Math.max(1e-3,+P.L||0);
      Object.assign(K,{th,sn:Math.sin(th),cs:Math.cos(th),mu:Math.max(0,+P.mub||0),L,vb:clamp(+P.vb||0,-1e4,1e4),v0:clamp(+P.vp||0,-1e4,1e4),s0:clamp(+P.sp||0,0,L)})}
    K.vsc=Math.max(Math.abs(K.v0),Math.abs(K.vb),Math.sqrt(2*g*Math.max(K.L,K.s0,1e-6)),1e-3);
    plan(K);return K}

  /* ---------- 受力判据（积分与理论过程共用） ---------- */
  const stick=(need,fm,K)=>Math.abs(need)<=fm*(1+EPS)+1e-12*K.m*g;
  function regime(K,t,s,v){
    const m=K.m;
    if(K.sc==='slope'){
      if(s>0||(s===0&&v>0)){const N=m*g*K.cs,fm=K.mu*N,G=-m*g*K.sn;
        if(v>0)return{ph:'up',N,f:-fm,fk:'kin',a:(G-fm)/m};
        if(v<0)return{ph:'down',N,f:fm,fk:'kin',a:(G+fm)/m};
        if(stick(G,fm,K))return{ph:'restS',N,f:-G,fk:G===0?'none':'sta',a:0,rest:true};
        return{ph:'down',N,f:fm,fk:'kin',a:(G+fm)/m}}
      const N=m*g,fm=K.mu2*N;
      if(v<0)return{ph:'gnd',N,f:fm,fk:'kin',a:fm/m};
      return{ph:'restG',N,f:0,fk:'none',a:0,rest:true}}
    if(K.sc==='flat'){
      if(t<K.t1){const N=m*g-K.F*Math.sin(K.al),Fx=K.F*Math.cos(K.al);
        if(N<-1e-12*m*g)return{ph:'lift',N:0,f:0,fk:'none',a:0,Fon:true,rest:true,out:true};
        const fm=K.mu*Math.max(N,0);
        if(v>0)return{ph:'push',N,f:-fm,fk:'kin',a:(Fx-fm)/m,Fon:true};
        if(stick(Fx,fm,K))return{ph:'stat',N,f:-Fx,fk:Fx===0?'none':'sta',a:0,Fon:true,rest:true};
        return{ph:'push',N,f:-fm,fk:'kin',a:(Fx-fm)/m,Fon:true}}
      const N=m*g,fm=K.mu*N;
      if(v>0)return{ph:'glide',N,f:-fm,fk:'kin',a:-fm/m};
      return{ph:'rest',N,f:0,fk:'none',a:0,rest:true}}
    const N=m*g*K.cs,fm=K.mu*N,G=-m*g*K.sn,w=v-K.vb;
    if(w>0)return{ph:'fast',N,f:-fm,fk:'kin',a:(G-fm)/m};
    if(w<0)return{ph:'slow',N,f:fm,fk:'kin',a:(G+fm)/m};
    if(stick(G,fm,K))return{ph:'stick',N,f:-G,fk:G===0?'none':'sta',a:0,rest:K.vb===0};
    return{ph:'slow',N,f:fm,fk:'kin',a:(G+fm)/m}}

  /* ---------- 理论过程（逐段匀变速公式） ---------- */
  // s(t) = s + vt + ½at² 越过 tg 的最早时刻（dir < 0 减小着越过，> 0 增大着越过；恰好相切不算）
  function hit(s,v,a,tg,dir){
    const c=s-tg;
    if(c===0&&(dir<0?(v<0||(v===0&&a<0)):(v>0||(v===0&&a>0))))return 0;
    let r=[];
    if(a===0){if(v!==0)r=[-c/v]}
    else{const D=v*v-2*a*c;if(D<0)return Infinity;const Q=v+(v>=0?1:-1)*Math.sqrt(D);r=[-Q/a];if(Q!==0)r.push(-2*c/Q)}
    r=r.filter(x=>ok(x)&&x>1e-14).sort((p,q)=>p-q);
    for(const x of r){const vx=v+a*x;if(dir<0?vx<0:vx>0)return x}
    return Infinity}
  function nextEv(K,t,s,v,R){
    const a=R.a,c=[];
    if(K.sc==='slope'){
      if(R.ph==='up'&&a<0)c.push([v/(-a),'top']);
      if(R.ph==='down'){if(a>0&&v<0)c.push([-v/a,'stopS']);c.push([hit(s,v,a,0,-1),'B'])}
      if(R.ph==='gnd'&&a>0)c.push([-v/a,'stopG'])}
    else if(K.sc==='flat'){
      if(R.ph==='push')c.push([K.t1-t,'cut']);
      if(R.ph==='glide'&&a<0)c.push([v/(-a),'stop'])}
    else{const w=v-K.vb;
      if(R.ph!=='stick'&&w*a<0)c.push([-w/a,'co']);
      if(R.ph!=='stick'&&v*a<0)c.push([-v/a,'v0']);

  /* ---------- RK4 积分与事件 ---------- */

  /* ---------- 文字 ---------- */
  function phName(K,sg_){const p=sg_.ph,a=sg_.a;

      case'push':return(K.al<0?'推力':'拉力')+'作用，加速';

      case'stat':return K.al<0?'推不动':'拉不动';
      case'rest':return'静止';
      case'lift':return'木箱离地';
      case'fast':return K.sn>0?'相对带向上滑':'相对带向右滑';
      case'slow':return K.sn>0?'相对带向下滑':'相对带向左滑';

  function stat(S){const K=S.K,R=S.R,y=S.y,f=x=>sf(Math.abs(x)<1e-6?0:x,3);
    if(S.term){const k=S.term.kind,yy=S.term.y;
      if(k==='leaveB')return{text:`从 B 端离开：v = ${sg(z(yy[1],K.vsc*1e3),3)} m/s，t = ${f(S.term.t)} s`,cls:'ok'};
      if(k==='leaveA')return{text:`从 A 端${K.sn>0?'滑落':'离开'}：v = ${sg(z(yy[1],K.vsc*1e3),3)} m/s，t = ${f(S.term.t)} s`,cls:'ok'};
      if(k==='lift')return{text:'F sinα > mg：木箱离地，超出本模型',cls:'warn'};

      if(p==='restS')return{text:`静止在斜面上：f静 = mg sinθ ≤ μmg cosθ（t = ${f(S.term.t)} s）`,cls:'ok'};
      if(p==='restG')return{text:yy[0]===0?'静止在 B 点':`停在地面上：离 B ${f(-yy[0])} m，t = ${f(S.term.t)} s`,cls:'ok'};

      case'glide':return{text:'撤去 F：N 突变为 mg，a = μg',cls:''}}

  /* ---------- 画图工具 ---------- */
  function txt(ctx,F,tok){const t=F.ut,SERIF='"Times New Roman","STIX Two Text",Times,serif',SANS=tok('--f-body');
    const wid=(s,size,o={})=>{ctx.save();ctx.font=o.zh?`${size*t}px ${SANS}`:`${o.i===false?'':'italic '}${size*t}px ${SERIF}`;const w=ctx.measureText(s).width;ctx.restore();return w};

    // 一行混排：parts = [[文字, {i:false 正体, s 字号, sub 下标, zh 中文}]]，按 align 对齐到 (x,y)
    const run=(parts,x,y,{color=F.ink,align='left'}={})=>{let cx=x-(align==='center'?.5:align==='right'?1:0)*pw(parts);

  // 矢量：从 (x,y) 画到 (x+dx,y+dy)；标注写在箭头尖外侧，或用 pl = [dx,dy]（单位 t）指定相对箭头尖的位置

  // 虚线矢量（斜面作用力）：细虚线杆 + 实心箭头

  /* ---------- ① 斜面：装置图 ---------- */
  function devSlope(L,S,yA,yB){
    const{F,T,u,t,C,W,bs,cX,paper}=L,K=S.K,pl=K.pl,c=K.cs,sn=K.sn,side=24*bs;

  /* ---------- v–t 图 ---------- */

    F.arrow(ax,bot+4*u,0,top+2*u-bot-4*u,ink,null,{w:1.3,head:10});F.arrow(ax,y00,bx1-4*u-ax,0,ink,null,{w:1.3,head:10});

        if(aD>0)r.push(['t下 = √(2x/a下)、v回 = v₀√(a下/a上)',s4(Math.sqrt(2*x/aD))+' s、'+s4(K.v0*Math.sqrt(aD/aU))+' m/s'])}
      const gB=pl.evs.find(q=>q.id==='B');if(gB&&K.mu2>0)r.push(['地面滑行距离 v_B²/(2μ₂g)',s4(gB.v*gB.v/(2*K.mu2*g))+' m'])}
    else if(K.sc==='flat'){const N1=m*g-K.F*Math.sin(K.al),f1=K.mu*Math.max(N1,0),a1=(K.F*Math.cos(K.al)-f1)/m,a2=K.mu*g;
      r.push(['N、f：t₁ 前 → t₁ 后（公式）',`${s4(N1)} → ${s4(m*g)} N；${s4(f1)} → ${s4(K.mu*m*g)} N`]);
      if(N1>=0&&K.F*Math.cos(K.al)>f1*(1+EPS)){const v1=a1*K.t1,x1=v1*K.t1/2;
        r.push(['a₁ = (F cosα − μN)/m、a₂ = μg',s4(a1)+'、'+s4(a2)+' m/s²'],['v₁ = a₁t₁、x₁ = ½a₁t₁²',s4(v1)+' m/s、'+s4(x1)+' m']);
        if(a2>0){const t2=v1/a2,x2=v1*v1/(2*a2);r.push(['t₂ = v₁/a₂、x₂ = v₁²/(2a₂)',s4(t2)+' s、'+s4(x2)+' m']);
          const sx=S.evs.find(q=>q.id==='cut'),se=S.evs.find(q=>q.id==='stop');

      else{const ca=Math.cos(K.al),sa=Math.sin(K.al),dn=ca+K.mu*sa;
        r.push(['F cosα 与 μ(mg − F sinα)',s4(K.F*ca)+' 与 '+s4(f1)+' N']);
        r.push(['能拉（推）动的最小 F = μmg/(cosα + μ sinα)',dn>0?s4(K.mu*m*g/dn)+' N':'自锁：力再大也推不动（tan|α| ≥ 1/μ）'])}}
    else{const fm=K.mu*m*g*K.cs,Wm=y[5],dEk=.5*m*(y[1]*y[1]-K.v0*K.v0),dEp=m*g*K.sn*(y[0]-K.s0),rmin=fin?fin.rmin:S.rmin,rmax=fin?fin.rmax:S.rmax;
      const sb=K.vb*tt,sc_=Math.min(rmax-rmin,2*K.L),Q=fm*y[4];
      r.push(['物块对地位移 s物',sg(z(y[0]-K.s0,vs),5)+' m'],['带的位移 s带'+(fin?'（离开时）':''),sg(z(sb,vs),5)+' m'],['相对位移 s物 − s带（此刻）',sg(z(y[3],vs),5)+' m'],
        ['划痕 Δs 实测 / 公式',sf(sc_,5)+' / '+sf(Math.min(pl.rmax-pl.rmin,2*K.L),5)+' m'+(rmax-rmin>=2*K.L?'（整条带）':'')],
        ['相对路程 实测 / 公式',sf(y[4],5)+' / '+sf(pl.rp,5)+' m'],['摩擦生热 Q = μmg cosθ·s相对 实测 / 公式',sf(Q,5)+' / '+sf(fm*pl.rp,5)+' J'],
        ['电动机多做的功 W = ∫f·v带dt 实测 / 公式',sg(z(Wm,1),5)+' / '+sg(z(pl.W,1),5)+' J'],['ΔEk + ΔEp + Q（应等于 W）',sg(z(dEk+dEp+Q,1),5)+' J'],
        K.sn>0?['相对滑动时 |a| = g|sinθ ± μcosθ|',s4(g*(K.sn+K.mu*K.cs))+'（f 沿带向下）、'+s4(Math.abs(g*(K.mu*K.cs-K.sn)))+' m/s²（f 沿带向上）']:['相对滑动时 a = μg',s4(K.mu*g)+' m/s²']);
      if(K.sn===0&&K.mu>0&&K.v0*K.vb>=0&&K.v0!==K.vb){const a=K.mu*g;r.push(['共速：|v带 − v₀|/(μg)、|v带² − v₀²|/(2μg)',s4(Math.abs(K.vb-K.v0)/a)+' s、'+s4(Math.abs(K.vb*K.vb-K.v0*K.v0)/(2*a))+' m'])}}
    r.push(...evRows(S),...segRows(S),['画面倍速',rateTxt(K.rate)]);
    return r}

  /* ---------- 理论预判 ---------- */
  function verdict(P){
    const K=cfg(P),pl=K.pl,b=x=>`<b>${x}</b>`,s3=x=>sf(x,3),m=K.m,segs=pl.segs,term=pl.term;
    const segTxt=[];
    const endTxt=(sg_,i)=>{const nx=segs[i+1];return{dt:sg_.t1-sg_.t0,ds:Math.abs(sg_.s1-sg_.s0)}};
    if(K.sc==='slope'){
      const tn=Math.tan(K.th),aU=g*(K.sn+K.mu*K.cs),aD=g*(K.sn-K.mu*K.cs);
      let h=`斜面上 N = mg cosθ = ${b(s3(m*g*K.cs)+' N')}，滑动摩擦力 μN = ${b(s3(K.mu*m*g*K.cs)+' N')}；上滑 a上 = g(sinθ + μcosθ) = ${b(s3(aU)+' m/s²')}，下滑 a下 = g(sinθ − μcosθ) = ${b(s3(aD)+' m/s²')}（C2）。`+
        `μ = ${s3(K.mu)} ${K.mu>=tn*(1-EPS)?'≥':'<'} tanθ = ${sf(tn,3)}：速度为零后${K.mu>=tn*(1-EPS)?b('停在斜面上')+'（静摩擦力 mg sinθ = '+s3(m*g*K.sn)+' N）':b('滑下')}。<br>理论过程：`;
      segs.forEach((sg_,i)=>{const{dt,ds}=endTxt(sg_,i),k=cir(i+1);
        if(sg_.ph==='up')segTxt.push(`${k} 上滑 ${b(s3(dt)+' s')}、${b(s3(ds)+' m')}，速度减为零`);
        else if(sg_.ph==='down')segTxt.push(`${k} ${phName(K,sg_)}（|a| = ${s3(Math.abs(sg_.a))} m/s²）${s3(dt)} s、${s3(ds)} m，`+(sg_.s1<=0&&sg_.v1<0?`到 B 点 ${b(s3(Math.abs(sg_.v1))+' m/s')}`:'速度减为零'));
        else if(sg_.ph==='gnd')segTxt.push(`${k} 地面上 a = μ₂g = ${s3(Math.abs(sg_.a))} m/s²，滑行 ${b(s3(ds)+' m')}（${s3(dt)} s）`);
        else if(sg_.ph==='restS')segTxt.push(`${k} 静止在斜面上，斜面作用力 = mg = ${s3(m*g)} N，竖直向上`);
        else if(sg_.ph==='restG'&&i>0)segTxt.push(`${k} 停下`)});
      h+=segTxt.join('；')+`；全程 ${b(s3(pl.T)+' s')}${term.kind==='cap'?'（120 s 截止）':''}。<br>`;
      h+=`斜面作用力（C3）：滑动时 F斜 = mg cosθ√(1 + μ²) = ${b(s3(m*g*K.cs*Math.sqrt(1+K.mu*K.mu))+' N')}，偏离法线 arctan μ = ${s3(dg(Math.atan(K.mu)))}°；静止时等于 mg = ${s3(m*g)} N，竖直向上。`;
      return h}
    if(K.sc==='flat'){
      const N1=m*g-K.F*Math.sin(K.al),Fx=K.F*Math.cos(K.al),f1=K.mu*Math.max(N1,0),ca=Math.cos(K.al),sa=Math.sin(K.al),dn=ca+K.mu*sa;
      let h=`F 作用时 N = mg − F sinα = ${b(s3(N1)+' N')}${K.al<0?'（斜向下推，支持力增大）':K.al>0?'（斜向上拉，支持力减小）':''}，最大静摩擦力 μN = ${s3(f1)} N，F 的水平分力 F cosα = ${s3(Fx)} N。`;
      if(N1<0)return h+`F sinα > mg，${b('木箱被提离地面')}，超出本模型（适用边界）。`;
      if(!(Fx>f1*(1+EPS)))return h+`F cosα ≤ μN：${b(K.al<0?'推不动':'拉不动')}，木箱静止，静摩擦力 ${s3(Fx)} N。`+(dn>0?`要${K.al<0?'推':'拉'}动，F 至少 μmg/(cosα + μ sinα) = ${b(s3(K.mu*m*g/dn)+' N')}。`:`tan|α| ≥ 1/μ（|α| ≥ ${s3(dg(Math.atan(1/K.mu)))}°）：${b('自锁')}，力再大也推不动（C4）。`);
      const a1=(Fx-f1)/m,v1=a1*K.t1,x1=v1*K.t1/2,a2=K.mu*g;
      h+=`a₁ = (F cosα − μN)/m = ${b(s3(a1)+' m/s²')}；t₁ = ${s3(K.t1)} s 末 v₁ = ${b(s3(v1)+' m/s')}，x₁ = ${b(s3(x1)+' m')}。<br>撤去 F 后 N 突变为 mg = ${s3(m*g)} N，f = μmg = ${s3(K.mu*m*g)} N，a₂ = μg = ${b(s3(a2)+' m/s²')}`;
      if(a2>0){const t2=v1/a2,x2=v1*v1/(2*a2);h+=`，再滑 ${b(s3(t2)+' s')}、${b(s3(x2)+' m')}；全程 ${s3(x1+x2)} m、${s3(K.t1+t2)} s。x₁∶x₂ = t₁∶t₂ = a₂∶a₁ = ${b(sf(a2/a1,3))}，两段平均速度都是 v₁/2 = ${s3(v1/2)} m/s（C4）。`}
      else h+='：光滑，撤去 F 后匀速运动（120 s 截止）。';
      if(K.mu>0&&dn>0){const am=Math.atan(K.mu),Fmin=m*(a1+K.mu*g)/Math.sqrt(1+K.mu*K.mu);
        h+=`<br>（拓展）产生同样的 a₁，拉力与水平成 arctan μ = ${s3(dg(am))}° 时最省力：F_min = m(a₁ + μg)/√(1 + μ²) = ${b(s3(Fmin)+' N')}。`}
      return h}
    const fm=K.mu*m*g*K.cs,aDn=g*(K.sn+K.mu*K.cs),aUp=g*(K.mu*K.cs-K.sn);
    let h=`相对滑动时 f = μmg cosθ = ${b(s3(fm)+' N')}，方向与物块相对带的运动方向相反，总使 v 趋向 v带（C5）；`+
      (K.sn>0?`f 沿带向下时 a = g(sinθ + μcosθ) = ${s3(aDn)} m/s²，沿带向上时 a = g(μcosθ − sinθ) = ${s3(aUp)} m/s²（沿带向上为正）。μ = ${s3(K.mu)} ${K.mu>=Math.tan(K.th)*(1-EPS)?'≥':'<'} tanθ = ${sf(Math.tan(K.th),3)}：共速后${K.mu>=Math.tan(K.th)*(1-EPS)?'随带匀速（静摩擦力 mg sinθ = '+s3(m*g*K.sn)+' N）':'仍相对带向下滑，以 g(sinθ − μcosθ) = '+s3(-aUp)+' m/s² 沿带向下加速'}。`:`a = μg = ${s3(K.mu*g)} m/s²；共速后 f = 0，随带匀速。`);

    segs.forEach((sg_,i)=>{const dt=sg_.t1-sg_.t0,k=cir(i+1);if(sg_.rest)return;

    if(term.kind==='leaveB'||term.kind==='leaveA')h+=`；${b(s3(term.t)+' s')} 时从 ${term.kind.slice(-1)} 端${term.kind==='leaveA'&&K.sn>0?'滑落':'离开'}，速度 ${b(sg(term.v,3)+' m/s')}`;
    else if(term.kind==='rest')h+='；最后静止在带上';else if(term.kind==='cap')h+='（120 s 截止）';
    h+=`。<br>划痕 Δs = ${b(s3(Math.min(pl.rmax-pl.rmin,2*K.L))+' m')}${pl.rp>(pl.rmax-pl.rmin)*(1+1e-9)?`（两段相对运动反向，划痕重叠；相对路程 ${s3(pl.rp)} m）`:''}，Q = f·s相对 = ${b(s3(fm*pl.rp)+' J')}，电动机多做的功 W = ${b(sg(pl.W,3)+' J')}（= ΔEk + ΔEp + Q，C6）。`;
    return h}

  return{
    legend:[{label:'重力 mg、拉力（推力）F',color:'--g'},{label:'支持力 N、摩擦力 f',color:'--n'},{label:'速度 v、v带',color:'--v'},{label:'加速度 a',color:'--a'}],
    init(P){const S=init(P);cur=S;curP=P;return S},

  $('asks').innerHTML=qs.map((q,i)=>`<li><b>${i+1}</b><span>${fill(q)}</span></li>`).join('');
  $('asks').hidden=!qs.length;
  $('verdict').innerHTML=SIM.verdict(P);
  const ch=PS.find(p=>p.type==='choice');
  $('presetMode').textContent=ch?`· ${ch.options.find(o=>o.value===P[ch.key]).label}`:'';
  $('presets').innerHTML=D.presets.map((p,i)=>chosen(p.load)?`<button data-preset="${i}" aria-pressed="${i===active}" title="${esc(p.note||'')}">${esc(p.label)}</button>`:'').join('');
  const pn=$('pnote'),ap=D.presets[active];pn.hidden=!(ap&&ap.note);if(ap&&ap.note)pn.innerHTML=`<b>${esc(ap.label)}</b>：${esc(ap.note)}`;
}
function load(o,i=-1){Object.assign(P,o);active=i;sync();reset()}
$('presets').addEventListener('click',e=>{const b=e.target.closest('[data-preset]');if(b)load(D.presets[+b.dataset.preset].load,+b.dataset.preset)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-load]');if(!b)return;
  load(D.variants.find(v=>v.id===b.dataset.load).load);
  show('pane-lab');document.querySelector('.board').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})});

/* 画布与循环 */
const cv=$('cv'),ctx=cv.getContext('2d');let S,running=false,speed=1,lastT=0;
function size(){const r=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);const w=Math.max(200,Math.round(r.width*dpr));if(cv.width!==w){cv.width=w;cv.height=w}}
function render(){size();SIM.draw(ctx,S,P,cv.width,cv.height,tok);
  $('readout').innerHTML=SIM.readouts(S,P).map(([k,v])=>`<div class="ro"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('');
  const st=$('status');st.textContent=S.status.text;st.className='status '+S.status.cls}
function reset(){running=false;S=SIM.init(P);$('play').textContent=`▶ ${PLAY}`;render()}
function loop(t){if(!running)return;const real=Math.min(.05,(t-lastT)/1000);lastT=t;
  const sim=real*speed,n=Math.max(1,Math.ceil(sim/5e-4));for(let i=0;i<n;i++)SIM.step(S,P,sim/n);
  render();if(S.done){running=false;$('play').textContent=`▶ 再${PLAY}`;return}requestAnimationFrame(loop)}
$('play').onclick=()=>{if(running){running=false;$('play').textContent='▶ 继续';return}
  if(S.done)S=SIM.init(P);running=true;$('play').textContent='❚❚ 暂停';lastT=performance.now();requestAnimationFrame(loop)};
$('reset').onclick=reset;
$('slow').onclick=()=>{speed=speed===1?.25:1;$('slow').textContent=speed===1?'慢放 ×0.25':'正常速度'};
new ResizeObserver(render).observe(cv);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);
new MutationObserver(render).observe(root,{attributes:true,attributeFilter:['data-theme']});
/* 选项卡 */
const tabs=[...document.querySelectorAll('[role=tab]')];
function show(id){tabs.forEach(t=>{const on=t.dataset.pane===id;t.setAttribute('aria-selected',on);t.tabIndex=on?0:-1;$(t.dataset.pane).hidden=!on});
  if(id==='pane-lab')requestAnimationFrame(render)}
tabs.forEach((t,i)=>{t.addEventListener('click',()=>show(t.dataset.pane));
  t.addEventListener('keydown',e=>{const d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;if(!d)return;e.preventDefault();
    const n=tabs[(i+d+tabs.length)%tabs.length];n.focus();show(n.dataset.pane)})});
$('nConcl').textContent=D.conclusions.length;$('nVar').textContent=D.variants.length;$('nSkin').textContent=D.reskins.length;$('nSrc').textContent=D.sources.length;
show('pane-lab');
sync();reset();
})();
</script>
