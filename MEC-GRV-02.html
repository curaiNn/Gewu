.verdict{background:var(--sunk);border:1px solid var(--hair);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.8}

/* 结论 */
.cl{display:flex;flex-direction:column}
.cl details{border-top:1px solid var(--hair)}
.cl details:last-child{border-bottom:1px solid var(--hair)}
.cl summary{display:grid;grid-template-columns:2.6em minmax(0,1fr) minmax(0,auto) 1em;gap:6px 14px;align-items:center;padding:12px 4px;cursor:pointer;list-style:none}
.cl summary::-webkit-details-marker{display:none}
.cl summary:hover .t{color:var(--accent)}
.badge{display:inline-grid;place-items:center;min-width:2.3em;height:1.7em;padding:0 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-family:var(--f-mono);font-weight:600;font-size:13px}
.cl .f{font-family:var(--f-mono);font-size:14px;background:var(--sunk);border:1px solid var(--hair);border-radius:6px;padding:2px 10px;justify-self:end;text-align:right}
.chev{width:8px;height:8px;border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);transform:rotate(45deg);transition:transform .2s;justify-self:center}
details[open]>summary .chev{transform:rotate(225deg)}
@media (max-width:640px){.cl summary{grid-template-columns:2.6em minmax(0,1fr) 1em}.cl .f{grid-column:2;grid-row:2;justify-self:start;text-align:left}.chev{grid-column:3;grid-row:1}}
.deriv{margin:0 4px 14px calc(2.6em + 18px);padding:4px 0 4px 14px;border-left:2px solid var(--accent-soft);white-space:pre-line;font-size:14px;color:var(--ink)}
@media (max-width:640px){.deriv{margin-left:4px}}

/* 变式 / 换皮题 */
.qs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px}
.q{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--card);min-width:0}
.q .head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.q h3{font-size:16px;margin-right:auto}
.chip{font-size:12px;font-family:var(--f-mono);border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--muted)}
.src{font-size:12px;color:var(--faint)}
.map{font-size:13px;color:var(--muted)}
.map b{font-weight:500;color:var(--ink)}
.q details{border-top:1px dashed var(--line);padding-top:8px}
.q details summary{cursor:pointer;color:var(--accent);font-size:14px;font-weight:500;list-style:none;display:flex;align-items:center;gap:8px;width:fit-content}
.q details summary::-webkit-details-marker{display:none}
.ans{margin-top:8px;display:flex;flex-direction:column;gap:6px;font-size:14px;background:var(--sunk);border-radius:8px;padding:10px 12px}
.ans .a{font-weight:700}
.q .foot{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.q .foot button{font-size:13px;padding:4px 14px;color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft)}
.srcs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.srcs li{display:grid;grid-template-columns:minmax(0,15em) minmax(0,1fr);gap:4px 16px;padding:8px 0;border-top:1px solid var(--hair);font-size:14px}
.srcs li b{font-family:var(--f-mono);font-weight:500;font-size:13px}
.srcs li span{color:var(--muted)}
@media (max-width:620px){.srcs li{grid-template-columns:1fr}}
footer{font-size:12px;color:var(--faint);text-align:center}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important}}

<script>
/* ================= 线稿绘图工具 FIG（所有母题共用，不改） =================
   画法照试卷插图：装置用墨线，固定面画斜线阴影，辅助线用虚线，物理量和点的字母用斜体衬线；
   只有矢量带颜色（--g 重力/外力，--n 弹力/约束力，--v 速度，--a 其他矢量）。
   用法：SIM.draw 里 const F=FIG(ctx,W,tok)；坐标是画布像素，F.u = W/720 是线宽与几何的基准单位，
   F.ut 是字号单位（窄屏时不再随画布缩小，保证字母不小于约 11 CSS 像素；自写文字函数也要用 F.ut 算字号）。
   颜色：F.ink 墨线、F.auxColor 辅助线、F.paper 纸色（F.aux 是画辅助线的方法，不是颜色）。 */
const FIG=(ctx,W,tok)=>{
  const u=W/720,ink=tok('--fig-ink'),aux=tok('--fig-aux'),paper=tok('--card');
  const dp=W/(ctx.canvas.clientWidth||W),ut=Math.max(u,dp*11/19);   // dp：每 CSS 像素的画布像素数
  const SERIF='"Times New Roman","STIX Two Text",Times,serif',SANS=tok('--f-body');
  const path=(fn,{w=1.6,color=ink,dash=null,fill=null}={})=>{ctx.save();ctx.beginPath();fn();
    if(fill){ctx.fillStyle=fill;ctx.fill()}
    if(w>0){ctx.lineWidth=w*u;ctx.strokeStyle=color;ctx.setLineDash(dash?dash.map(d=>d*u):[]);ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}
    ctx.restore()};
  // 文字先描一圈底色再填色，压在线条上也清楚
  const text=(t,x,y,font,color,align,base)=>{ctx.save();ctx.font=font;ctx.textAlign=align;ctx.textBaseline=base;
    ctx.lineJoin="round";ctx.lineWidth=5*ut;ctx.strokeStyle=paper;ctx.strokeText(t,x,y);ctx.fillStyle=color;ctx.fillText(t,x,y);ctx.restore()};
  const F={u,ut,ink,auxColor:aux,paper,
    clear(){ctx.save();ctx.setLineDash([]);ctx.fillStyle=paper;ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height);ctx.restore()},
    line(x1,y1,x2,y2,o){path(()=>{ctx.moveTo(x1,y1);ctx.lineTo(x2,y2)},o)},
    poly(pts,o){path(()=>pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y)),o)},
    circle(x,y,r,o){path(()=>ctx.arc(x,y,r,0,2*Math.PI),o)},
    arc(x,y,r,a0,a1,o){path(()=>ctx.arc(x,y,r,a0,a1),o)},
    rect(x,y,w,h,o){path(()=>ctx.rect(x,y,w,h),o)},
    // 辅助线（中心线、投影线等）
    aux(x1,y1,x2,y2,o={}){F.line(x1,y1,x2,y2,{w:1,color:aux,dash:[6,5],...o})},
    // 运动轨迹：细虚线
    trail(pts,o={}){if(pts.length>1)F.poly(pts,{w:1.3,color:aux,dash:[5,5],...o})},
    // 固定面斜线：沿 (x1,y1)→(x2,y2) 的直线，画在 side 一侧（屏幕坐标下，1 = 前进方向右手侧）
    hatch(x1,y1,x2,y2,side=1,{gap=12,len=10}={}){const L=Math.hypot(x2-x1,y2-y1),n=Math.max(1,Math.round(L/(gap*u)));
      const tx=(x2-x1)/L,ty=(y2-y1)/L,nx=-ty*side,ny=tx*side,ox=(nx-tx)*len*u/Math.SQRT2,oy=(ny-ty)*len*u/Math.SQRT2;
      path(()=>{for(let i=0;i<=n;i++){const x=x1+(x2-x1)*i/n,y=y1+(y2-y1)*i/n;ctx.moveTo(x,y);ctx.lineTo(x+ox,y+oy)}},{w:1,color:aux})},
    // 圆弧形固定面的斜线：out = true 画在圆外侧
    hatchArc(cx,cy,r,a0,a1,out=true,{gap=12,len=10}={}){const n=Math.max(1,Math.round(r*Math.abs(a1-a0)/(gap*u))),s=out?1:-1;
      path(()=>{for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n,c=Math.cos(a),si=Math.sin(a),x=cx+r*c,y=cy+r*si;
        const nx=c*s,ny=si*s,tx=-si,ty=c;ctx.moveTo(x,y);ctx.lineTo(x+(nx-tx)*len*u/Math.SQRT2,y+(ny-ty)*len*u/Math.SQRT2)}},{w:1,color:aux})},
    // 矢量：从 (x,y) 画到 (x+dx,y+dy)，细杆 + 窄实心箭头；label 用斜体写在箭头外侧，
    // 与别的矢量共线时用 off=[dx,dy]（单位 u，相对箭头尖）把标注挪到旁边
    arrow(x,y,dx,dy,color,label,{w=2,head=12,size=19,off=null}={}){const L=Math.hypot(dx,dy);if(L<2*u)return;
      const ux=dx/L,uy=dy/L,h=Math.min(head*u,L*.6),hw=h*.34,tx=x+dx,ty=y+dy;
      F.line(x,y,tx-ux*h*.7,ty-uy*h*.7,{w,color});
      path(()=>{ctx.moveTo(tx,ty);ctx.lineTo(tx-ux*h-uy*hw,ty-uy*h+ux*hw);ctx.lineTo(tx-ux*h+uy*hw,ty-uy*h-ux*hw);ctx.closePath()},{w:0,fill:color});
      if(label)F.label(label,off?tx+off[0]*u:tx+ux*14*u,off?ty+off[1]*u:ty+uy*14*u,{color,size})},
    // 斜体衬线字母（物理量、点名）
    label(t,x,y,{color=ink,size=19,align='center',base='middle',italic=true}={}){text(t,x,y,`${italic?'italic ':''}${size*ut}px ${SERIF}`,color,align,base)},
    // 中文小注
    zh(t,x,y,{color=aux,size=14,align='center',base='middle'}={}){text(t,x,y,`${size*ut}px ${SANS}`,color,align,base)},
    dot(x,y,r=2.6,color=ink){F.circle(x,y,r*u,{w:0,fill:color})},
    // 带名字的点：实心小点 + 斜体字母（dx、dy 为字母相对点的偏移，单位 u）
    point(x,y,name,dx=-13,dy=13){F.dot(x,y);if(name)F.label(name,x+dx*u,y+dy*u)},
    // 小球：空心圆，球心另用 F.dot 标出（矢量画完后再点，表示力作用在重心）
    ball(x,y,r){F.circle(x,y,r,{w:1.6,fill:paper})},
    // 尺寸标注：两端带箭头的细线，文字写在中点外侧 off（单位 u）
    dim(x1,y1,x2,y2,t,{off=14,color=ink}={}){const L=Math.hypot(x2-x1,y2-y1);if(L<4*u)return;const ux=(x2-x1)/L,uy=(y2-y1)/L,h=Math.min(8*u,L/3),hw=h*.38;
      F.line(x1,y1,x2,y2,{w:1,color});
      for(const[px,py,sx]of[[x1,y1,1],[x2,y2,-1]])path(()=>{ctx.moveTo(px,py);ctx.lineTo(px+sx*ux*h-uy*hw,py+sx*uy*h+ux*hw);ctx.lineTo(px+sx*ux*h+uy*hw,py+sx*uy*h-ux*hw);ctx.closePath()},{w:0,fill:color});
      if(t)F.label(t,(x1+x2)/2-uy*off*u,(y1+y2)/2+ux*off*u,{color})},
  };
  return F;
};

/* ================= SIM 模块：每个母题替换这一段 =================
   约定接口：
   SIM.legend            [{label, color(CSS 变量名)}]
   SIM.init(P)           → 状态 S（含 S.done、S.status={text,cls}）
   SIM.step(S,P,dt)      推进 dt 秒（引擎保证 dt ≤ 0.5 ms）
   SIM.readouts(S,P)     → [[标签, 带单位的值]]
   SIM.draw(ctx,S,P,W,H,tok)  tok(name) 取主题色
   SIM.verdict(P)        → 理论预判 HTML
*/
const SIM=(()=>{
  /* 卫星变轨：霍曼转移（两次点火）/ 单次点火（进入椭圆）/ 逃逸（第二宇宙速度）。
     物理：对卫星（霍曼转移时还有目标卫星）的 (x, y, vx, vy) 做 RK4，a = −GM·r/|r|³，不用预设轨迹；点火是瞬时的速度改变，位置不变。
       霍曼转移：第一次点火把速度设为 C6 的 v_ⅡP（沿切线），扫过 π 角到达 Q 时第二次点火，把速度设为该处的圆轨道速度（沿切线），
       Δv₂ 由点火前的实测速度算出；单次点火按 k、α 设定点火后的速度；逃逸按 v₀ 沿切线。
     事件：点火、扫过 π（到达 Q）、近 / 远地点（径向速度变号）、绕满一圈（测周期）、撞上地球（r = R地）、飞出画面（r = 3r₁ 或 12r₁），
       都在该子步内二分定位；面积定律的扇形边界、第二次点火后再运行一圈等按时刻安排，子步截在这些时刻上。
     时间：真实周期是小时量级，动画把引擎给的时间步乘以放大倍数 S.TS 再推进，按阶段取值（同一阶段内不变，相等时间扫过的面积可比）：
       圆轨道约 4 s 一圈，转移轨道、椭圆半个周期约 6 s，抛物线、双曲线沿用圆轨道 Ⅰ 的倍数。
       积分子步长自适应：h = T圆(r)/20000（r 为当前地心距，T圆(r) = 2π√(r³/GM)），在近地点处即卡片规定的 T_min/20000；读数显示真实时间。
     坐标：地心为原点，x 向右、y 向上，单位 m；点火点 P 在地心左侧 (−r₁, 0)，卫星逆时针运动，从 P 之前 1/4 圈（正上方）出发。
     引擎不支持的界面细节放在 verdict 里处理（引擎每次同步参数都会调用它）：
       ① r₂ 用对数滑块（同 EM-ESF-01）：把滑块改成以 10 为底的对数刻度，在外层捕获它的 input 事件，换算成真值（取三位有效数字）
          后交给数字输入框的 change 事件，由引擎照常同步；
       ② r₂ < r₁（降轨）时把题干中的「点火加速」「远地点 Q」改写为「点火减速」「近地点 Q」。 */
  const g=10,RE=6.4e6,GM=g*RE*RE,TAU=2*Math.PI,PI=Math.PI,RAD=PI/180,DEG=180/PI,NS=20000,CAP=12;
  const SUP={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
  const ok=x=>typeof x==='number'&&isFinite(x);
  const fmt=(x,d=2)=>{if(!ok(x))return'—';return(Math.abs(x)<.5*Math.pow(10,-d)?0:x).toFixed(d).replace('-','−')};
  const exp10=x=>{const e=Math.floor(Math.log10(Math.abs(x)));return[x/Math.pow(10,e),e]};
  const sci=(x,d=2)=>{if(!ok(x))return'—';if(x===0)return'0';let[m,e]=exp10(x);if(Math.abs(+m.toFixed(d))>=10){m/=10;e++}
    return m.toFixed(d).replace('-','−')+'×10'+String(e).replace(/./g,c=>SUP[c])};
  const NB=' ';   // 数字与单位之间用不换行空格
  const km=r=>!ok(r)?'—':Math.abs(r)<1e9?fmt(r/1e3,0)+NB+'km':sci(r/1e3,2)+NB+'km';
  const kmv=r=>!ok(r)?'—':Math.abs(r)<1e9?fmt(r/1e3,0):sci(r/1e3,2);
  const kv=v=>ok(v)?fmt(v/1e3,3):'—',kms=v=>ok(v)?kv(v)+NB+'km/s':'—';
  const dvs=v=>!ok(v)?'—':Math.abs(v)<100?(v>0?'+':'')+fmt(v,1)+NB+'m/s':(v>0?'+':'')+fmt(v/1e3,3)+NB+'km/s';
  const av=a=>!ok(a)?'—':a>=1?fmt(a,3):a>=.01?fmt(a,4):sci(a,3),ms2=a=>ok(a)?av(a)+NB+'m/s²':'—';
  const J=x=>ok(x)?sci(x,2)+NB+'J':'—';
  const tfmt=s=>!ok(s)?'—':s<7200?fmt(s/60,1)+NB+'min':s<172800?fmt(s/3600,2)+NB+'h':fmt(s/3600,1)+NB+'h（'+fmt(s/86400,2)+NB+'天）';
  const tv=s=>!ok(s)?'—':s<7200?fmt(s/60,1):fmt(s/3600,s<172800?2:1);
  const tu=s=>!ok(s)?'':s<7200?'min':'h';
  const dg=a=>ok(a)?fmt(a*DEG,1)+'°':'—';
  const pair=(a,b,f,unit)=>`${f(a)} / ${ok(b)?f(b):'—'}${unit?NB+unit:''}`;
  const vc=r=>Math.sqrt(GM/r),Tc=r=>TAU*Math.sqrt(r*r*r/GM);
  const hyp=Math.hypot;

  /* ---------- 圆锥曲线（只用于取景、预画轨道、理论值；运动本身由 RK4 积分） ---------- */
  const wrap=a=>{a=(a+PI)%TAU;if(a<0)a+=TAU;return a-PI};
  function conic(x,y,vx,vy){
    const r=hyp(x,y),v2=vx*vx+vy*vy,rv=x*vx+y*vy,h=x*vy-y*vx,E=v2/2-GM/r;
    const ex=((v2-GM/r)*x-rv*vx)/GM,ey=((v2-GM/r)*y-rv*vy)/GM;let e=hyp(ex,ey);
    const par=Math.abs(E)<1e-9*GM/r;if(par)e=1;
    const p=h*h/GM,sg=h<0?-1:1,w=e>1e-9?Math.atan2(ey,ex):Math.atan2(y,x),bound=E<0&&!par;
    const C={E,h,e,p,sg,w,bound,par,rp:p/(1+e),ra:bound?p/(1-e):Infinity,a:bound?-GM/(2*E):Infinity};
    C.T=bound?Tc(C.a):Infinity;C.f0=e>1e-9?wrap(sg*(Math.atan2(y,x)-w)):0;
    C.kind=bound?(e<1e-6?'圆':'椭圆'):par?'抛物线':'双曲线';
    return C;
  }
  const at=(C,f)=>{const r=C.p/(1+C.e*Math.cos(f)),th=C.w+C.sg*f;return[r*Math.cos(th),r*Math.sin(th)]};
  const fAt=(C,r)=>Math.acos(Math.max(-1,Math.min(1,(C.p/r-1)/C.e)));   // r 处的真近点角（取正值）
  // 非束缚轨道从真近点角 f1 飞到 f2 所用的时间
  function tFly(C,f1,f2){
    if(C.par){const M=f=>{const D=Math.tan(f/2);return D+D*D*D/3};return .5*Math.sqrt(C.p**3/GM)*(M(f2)-M(f1))}
    const A=C.p/(C.e*C.e-1),q=Math.sqrt((C.e-1)/(C.e+1)),M=f=>{const Hh=2*Math.atanh(q*Math.tan(f/2));return C.e*Math.sinh(Hh)-Hh};
    return Math.sqrt(A**3/GM)*(M(f2)-M(f1));
  }

  /* ---------- 参数整理与理论值 ---------- */
  function setup(P){
    const scn=['hoh','one','esc'].includes(P.scn)?P.scn:'hoh';
    const r1=Math.max(RE,(+P.r1||0)*1e3),m=Math.max(1,+P.m||0),vI=vc(r1),TI=Tc(r1);
    const K={scn,r1,m,vI,TI,tB:TI/4,vesc:Math.sqrt(2)*vI,al:0};
    let vb;
    if(scn==='hoh'){
      const r2=Math.max(RE,(+P.r2||0)*1e3),a=(r1+r2)/2;Object.assign(K,{r2,a,vIII:vc(r2),TIII:Tc(r2)});
      K.vP=vI*Math.sqrt(2*r2/(r1+r2));K.vQ=K.vP*r1/r2;K.dv1=K.vP-vI;K.dv2=K.vIII-K.vQ;
      K.tPQ=PI*Math.sqrt(a*a*a/GM);K.TII=2*K.tPQ;K.w2=Math.sqrt(GM/(r2*r2*r2));K.phi=PI-K.w2*K.tPQ;
      K.EI=-GM*m/(2*r1);K.EII=-GM*m/(2*a);K.EIII=-GM*m/(2*r2);
      K.same=Math.abs(r2-r1)<1;K.up=r2>r1;vb=[0,-K.vP];
    }else if(scn==='one'){K.k=Math.max(0,+P.k||0);K.al=(+P.al||0)*RAD;K.v1=K.k*vI;vb=[-K.v1*Math.sin(K.al),-K.v1*Math.cos(K.al)]}
    else{K.v1=Math.max(0,(+P.v0||0)*1e3);vb=[0,-K.v1]}
    K.vb=vb;const C=conic(-r1,0,vb[0],vb[1]);K.C=C;
    K.tang=scn==='hoh'||Math.abs(K.al)<1e-9;
    // 是否撞地：束缚轨道近地点低于地面；非束缚轨道还要求近地点在前方（f0 < 0）
    K.crash=scn!=='hoh'&&C.rp<RE*(1-1e-9)&&(C.bound||C.f0<0);
    // 另一拱点（沿切线点火时与 P 隔地心相对）
    if(scn==='hoh')K.rq=K.r2;
    else if(K.tang&&C.bound&&C.e>1e-6)K.rq=Math.abs(C.ra-r1)<Math.abs(C.rp-r1)?C.rp:C.ra;
    else K.rq=null;
    // 取景
    let R=r1;const pts=[];K.RX=Infinity;
    if(scn==='hoh'){R=Math.max(r1,K.r2);for(let i=0;i<=360;i++)pts.push(at(C,i/360*TAU))}
    else if(C.bound){const cap=CAP*r1;for(let i=0;i<=360;i++){const q=at(C,i/360*TAU);if(hyp(q[0],q[1])<=cap)pts.push(q)}if(C.ra>cap)K.RX=cap}
    else{K.RX=3*r1;const fx=fAt(C,K.RX);K.fx=fx;for(let i=0;i<=120;i++)pts.push(at(C,C.f0+(fx-C.f0)*i/120))}
    K.samp=scn==='hoh'||C.bound?pts.filter(q=>hyp(q[0],q[1])<=Math.min(K.RX,1e30)*1.0001):[];
    const b={x0:-R,x1:R,y0:-R,y1:R};pts.forEach(([x,y])=>{b.x0=Math.min(b.x0,x);b.x1=Math.max(b.x1,x);b.y0=Math.min(b.y0,y);b.y1=Math.max(b.y1,y)});
    K.box=b;K.R=Math.max(b.x1-b.x0,b.y1-b.y0)/2;K.zoom=K.R/r1>15;
    // 各阶段的时间放大倍数
    K.TS1=TI/4;K.TS2=scn==='hoh'?K.tPQ/6:C.bound?C.T/12:TI/4;K.TS3=scn==='hoh'?K.TIII/4:null;
    // 矢量与能量柱的比例：本次运行中可能出现的最大速度、最小地心距
    let vmax=Math.max(vI,K.v1||0),rmin=r1;
    if(scn==='hoh'){vmax=Math.max(vI,K.vP,K.vQ,K.vIII);rmin=Math.min(r1,K.r2)}
    else if(K.crash){rmin=RE;vmax=Math.max(vmax,Math.sqrt(K.v1*K.v1+2*GM*(1/RE-1/r1)))}
    else if(C.bound||C.f0<0){rmin=Math.min(r1,C.rp);vmax=Math.max(vmax,C.h/C.rp)}
    K.vmax=vmax;K.rmin=rmin;K.amax=GM/(rmin*rmin);K.Pm=.5*m*vmax*vmax;K.Nm=GM*m/rmin;
    // 面积定律的扇形间隔：椭圆取 T/16，霍曼转移取 T_Ⅱ/16（P→Q 共 8 个），非束缚轨道取飞出画面用时的 1/7
    if(scn==='hoh')K.dT=K.same?null:K.TII/16;
    else if(C.bound)K.dT=C.T/16;
    else{const tx=tFly(C,C.f0,K.fx);K.dT=ok(tx)&&tx>0?tx/7:null}
    return K;
  }

  /* ---------- 积分 ---------- */
  function rk4(s,h){
    const x=s[0],y=s[1],vx=s[2],vy=s[3];let r2=x*x+y*y,k=-GM/(r2*Math.sqrt(r2));const a1x=k*x,a1y=k*y;
    const x2=x+vx*h/2,y2=y+vy*h/2,u2=vx+a1x*h/2,w2=vy+a1y*h/2;r2=x2*x2+y2*y2;k=-GM/(r2*Math.sqrt(r2));const a2x=k*x2,a2y=k*y2;
    const x3=x+u2*h/2,y3=y+w2*h/2,u3=vx+a2x*h/2,w3=vy+a2y*h/2;r2=x3*x3+y3*y3;k=-GM/(r2*Math.sqrt(r2));const a3x=k*x3,a3y=k*y3;
    const x4=x+u3*h,y4=y+w3*h,u4=vx+a3x*h,w4=vy+a3y*h;r2=x4*x4+y4*y4;k=-GM/(r2*Math.sqrt(r2));const a4x=k*x4,a4y=k*y4;
    return[x+h/6*(vx+2*u2+2*u3+u4),y+h/6*(vy+2*w2+2*w3+w4),vx+h/6*(a1x+2*a2x+2*a3x+a4x),vy+h/6*(a1y+2*a2y+2*a3y+a4y)];
  }
  const ang=(a,b)=>Math.atan2(a[0]*b[1]-a[1]*b[0],a[0]*b[0]+a[1]*b[1]);
  // 步内二分：fn 由正变为 ≤ 0 的时刻（相对步首）
  const root=(s0,h,fn)=>{let lo=0,hi=h;for(let i=0;i<60;i++){const m=(lo+hi)/2;if(fn(rk4(s0,m))>0)lo=m;else hi=m}return hi};
  function sched(S,t,kind,d){const e={t,kind,d};let i=S.sch.length;while(i>0&&S.sch[i-1].t>t)i--;S.sch.splice(i,0,e)}
  // 当前阶段要盯的事件：[名称, f(s)]，f 由正变为 ≤ 0 时触发
  function evFns(S,s0){
    const K=S.K,L=[];
    if(S.ph==='tr')L.push(['half',s=>PI-(S.sw+ang(s0,s))]);
    if(S.ph==='orb'){
      if(K.crash)L.push(['crash',s=>hyp(s[0],s[1])-RE]);
      if(ok(K.RX))L.push(['exit',s=>S.out?hyp(s[0],s[1])-K.RX:K.RX-hyp(s[0],s[1])]);
      if(S.C.bound)L.push(['turn',s=>TAU*(S.turns+1)-(S.sw+ang(s0,s))]);
      if(S.apSign)L.push(['apsis',s=>S.apSign*(s[0]*s[2]+s[1]*s[3])]);
    }
    return L;
  }
  // 推进至多 span 秒（真实时间）；阶段改变（时间放大倍数改变）时提前返回实际推进的时间
  function advance(S,span){
    const K=S.K,o=S.o,ph0=S.ph;let rem=span,guard=0;
    while(rem>0&&!S.done&&S.ph===ph0&&guard++<500000){
      const r=hyp(o.x,o.y);let h=Math.min(rem,Tc(Math.max(r,.5*RE))/NS);
      if(S.b)h=Math.min(h,Tc(hyp(S.b.x,S.b.y))/NS);
      const nx=S.sch.length?S.sch[0].t:Infinity;if(nx-S.t<=h)h=Math.max(0,nx-S.t);
      const s0=[o.x,o.y,o.vx,o.vy];let tau=h,ev=null,s1=s0;
      if(h>0){s1=rk4(s0,h);
        for(const[nm,fn]of evFns(S,s0))if(fn(s0)>0&&fn(s1)<=0){const t=root(s0,h,fn);if(!ev||t<tau){tau=t;ev=nm}}
        if(ev)s1=rk4(s0,tau);
        const d=ang(s0,s1);S.sw+=d;
        for(const w of S.win)if(w.on){w.A+=.5*Math.abs(s0[0]*s1[1]-s0[1]*s1[0]);w.th+=Math.abs(d);if(w.th>.004){w.pts.push([s1[0],s1[1]]);w.th=0}}
        if(tau>0)S.aMeas=hyp(s1[2]-s0[2],s1[3]-s0[3])/tau;
        [o.x,o.y,o.vx,o.vy]=s1;S.t+=tau;rem-=tau;
        if(S.b&&tau>0)[S.b.x,S.b.y,S.b.vx,S.b.vy]=rk4([S.b.x,S.b.y,S.b.vx,S.b.vy],tau);
        S.rmin=Math.min(S.rmin,hyp(o.x,o.y));S.rmax=Math.max(S.rmax,hyp(o.x,o.y));
      }
      if(ev)onEvent(S,ev);
      if(!S.done&&S.ph==='orb'&&K.crash&&hyp(o.x,o.y)<RE*(1-1e-7))onEvent(S,'crash');   // 兜底：起点就在地面上时 f(s0) = 0，二分不触发
      while(!S.done&&S.sch.length&&S.sch[0].t<=S.t+1e-9*Math.max(1,S.t))onTimed(S,S.sch.shift());
      const T=S.trail[S.trail.length-1];
      if(ev||hyp(o.x-T[0],o.y-T[1])>S.res){S.trail.push([o.x,o.y]);if(S.trail.length>9000)S.trail.splice(1,1)}
    }
    return span-rem;
  }
  // 安排面积定律的辐射线与两块阴影扇形：辐射线从 t0 起每隔 dT 一条，j0、j1 为两块扇形的起始序号
  function areas(S,t0,n,j0,j1){
    const K=S.K;S.t0=t0;
    for(let j=0;j<=n;j++)sched(S,t0+j*K.dT,'spoke');
    [j0,j1].forEach((j,i)=>{if(j===null||j<0||j>=n)return;const w={i,t0:t0+j*K.dT,t1:t0+(j+1)*K.dT,on:false,A:0,th:0,pts:[]};S.win.push(w);
      sched(S,w.t0,'w0',w);sched(S,w.t1,'w1',w)});
  }
  function onTimed(S,e){
    const K=S.K,o=S.o;
    if(e.kind==='burn')burn1(S);
    else if(e.kind==='spoke'){if(S.spokes.length<17)S.spokes.push([o.x,o.y])}
    else if(e.kind==='w0'){e.d.on=true;e.d.pts=[[o.x,o.y]];e.d.r0=hyp(o.x,o.y)}
    else if(e.kind==='w1'){e.d.on=false;e.d.pts.push([o.x,o.y]);e.d.done=true}
    else if(e.kind==='stop'){S.done=true;S.fin='stop'}
  }
  const tangent=o=>{const r=hyp(o.x,o.y);return[[-o.y/r,o.x/r],[o.x/r,o.y/r]]};   // 逆时针切向、径向朝外
  function burn1(S){
    const K=S.K,o=S.o,[t,rr]=tangent(o),v0=hyp(o.vx,o.vy);S.vIm=v0;S.tP=S.t;S.sw=0;S.EIm=.5*K.m*v0*v0-GM*K.m/hyp(o.x,o.y);
    let nv;
    if(K.scn==='hoh')nv=[K.vP*t[0],K.vP*t[1]];
    else{const c=Math.cos(K.al),s=Math.sin(K.al);nv=[K.v1*(c*t[0]+s*rr[0]),K.v1*(c*t[1]+s*rr[1])]}
    const v1=hyp(nv[0],nv[1]);
    S.burns.push({x:o.x,y:o.y,dv:[nv[0]-o.vx,nv[1]-o.vy],n:1,anim:S.anim,sgn:Math.sign(v1-v0)});
    S.W1=.5*K.m*(v1*v1-v0*v0);S.vPm=v1;S.dv1m=v1-v0;o.vx=nv[0];o.vy=nv[1];
    S.rmin=S.rmax=hyp(o.x,o.y);
    if(K.scn==='hoh'){S.ph='tr';S.TS=K.TS2;if(K.dT)areas(S,S.t,8,K.up?0:7,K.up?7:0);return}
    S.ph='orb';S.TS=K.TS2;S.C=conic(o.x,o.y,o.vx,o.vy);S.turns=0;
    const C=S.C;
    if(C.e>1e-6&&(C.bound||C.f0<0))S.apSign=K.tang?(K.v1>K.vI?1:-1):(Math.sign(o.x*o.vx+o.y*o.vy)||1);
    if(K.dT){
      if(!C.bound)areas(S,S.t,7,0,5);
      else if(K.tang||C.e<=1e-6){const pe=K.v1>=K.vI;areas(S,S.t,16,pe?0:8,pe?8:0)}
      else S.wantAreas=true;   // 非切向点火：点火点不是拱点，等到第一个拱点再开始
    }
  }
  function burn2(S){
    const K=S.K,o=S.o,[t]=tangent(o),r=hyp(o.x,o.y),v0=hyp(o.vx,o.vy),v1=vc(r);
    S.vQm=v0;S.tQ=S.t;S.dv2m=v1-v0;S.W2=.5*K.m*(v1*v1-v0*v0);
    S.burns.push({x:o.x,y:o.y,dv:[v1*t[0]-o.vx,v1*t[1]-o.vy],n:2,anim:S.anim,sgn:Math.sign(v1-v0)});
    o.vx=v1*t[0];o.vy=v1*t[1];S.vIIIm=v1;
    if(S.b)S.meet=hyp(S.b.x-o.x,S.b.y-o.y);
    // 与 Q 同时刻的辐射线、扇形终点（定时）先处理掉
    while(S.sch.length&&S.sch[0].t<=S.t+1e-6*K.tPQ)onTimed(S,S.sch.shift());
    S.ph='c3';S.TS=K.TS3;sched(S,S.t+K.TIII,'stop');
  }
  function onEvent(S,ev){
    const K=S.K,o=S.o,r=hyp(o.x,o.y),v=hyp(o.vx,o.vy);
    if(ev==='half')burn2(S);
    else if(ev==='crash'){const f=RE/r;o.x*=f;o.y*=f;S.done=true;S.fin='crash';S.trail.push([o.x,o.y])}
    else if(ev==='exit'){
      if(!S.C.bound){S.done=true;S.fin='esc';S.vinf=Math.sqrt(Math.max(0,v*v-2*GM/r))}
      else S.out=!S.out;
    }
    else if(ev==='turn'){S.turns++;if(S.turns===1)S.Tm=S.t-S.tP;if(S.turns>=2){S.done=true;S.fin='two'}}
    else if(ev==='apsis'){
      const kind=S.apSign>0?'apo':'peri';S.aps.push({kind,t:S.t,r,v});S.apSign=-S.apSign;
      if(S.wantAreas){S.wantAreas=false;areas(S,S.t,16,kind==='peri'?0:8,kind==='peri'?8:0)}
    }
  }

  /* ---------- 状态条 ---------- */
  function status(S){
    const K=S.K,o=S.o,r=hyp(o.x,o.y);
    if(S.ph==='c1')return{text:S.t===0?'圆轨道 Ⅰ：卫星将在 P 点点火（点「运行」）':'圆轨道 Ⅰ：飞向 P 点',cls:''};
    if(K.scn==='hoh'){
      if(K.same)return S.done?{text:'r₂ = r₁：不需要变轨',cls:'ok'}:{text:'r₂ = r₁：Δv = 0，仍在原轨道上',cls:''};
      if(S.ph==='tr')return{text:K.up?'转移轨道 Ⅱ：P → Q，速率减小':'转移轨道 Ⅱ：P → Q，速率增大',cls:''};
      if(S.done)return{text:`完成：P → Q 用时 ${tfmt(S.tQ-S.tP)}，在 Q 与目标会合`,cls:'ok'};
      return{text:'圆轨道 Ⅲ：已在 Q 点与目标会合',cls:'ok'};
    }
    const C=S.C;
    if(S.fin==='crash')return{text:`撞上地球（近地点 ${km(C.rp)} < R地）`,cls:'warn'};
    if(S.fin==='esc')return{text:`飞出画面：E ${C.par?'=':'>'} 0，卫星逃逸`,cls:'warn'};
    if(!C.bound)return{text:`${C.kind}：逃逸中，r = ${km(r)}`,cls:''};
    if(S.out)return{text:'远地点在画面外，仍是束缚轨道（E < 0）',cls:''};
    const n=Math.max(0,S.sw/TAU);
    if(S.done)return{text:`${C.kind}轨道：已运行两圈，T = ${tfmt(S.Tm)}`,cls:'ok'};
    return{text:`${C.kind}轨道 · ${fmt(n,2)} 圈`,cls:n>=1?'ok':''};
  }

  /* ---------- 引擎不支持的界面细节（见文件头） ---------- */
  let fixing=false;
  function ui(P){
    if(typeof document==='undefined')return;
    const r=document.getElementById('in-r2'),n=document.getElementById('num-r2');
    if(r&&n){
      if(!r.dataset.log){const lo=Math.log10(+n.min),st=.005;r.dataset.log='1';r.min=String(lo);r.max=String(lo+Math.ceil((Math.log10(+n.max)-lo)/st)*st);r.step=String(st);   // 滑块最右端略超上限，交给输入框截到 400000 km
        // 在外层捕获滑块的 input，不让它到达引擎（引擎会把对数值当真值），改由输入框的 change 交给引擎
        r.parentElement.addEventListener('input',e=>{if(e.target!==r)return;e.stopPropagation();
          const v=+Math.pow(10,+r.value).toPrecision(3);   // 三位有效数字；每格 1.16%，键盘方向键也能逐格改变
          if(fixing)return;fixing=true;try{n.value=String(v);n.dispatchEvent(new Event('change'))}finally{fixing=false}},true)}
      if(+P.r2>0)r.value=String(Math.log10(+P.r2));
    }
    const st=document.getElementById('stem');
    if(st&&+P.r2<+P.r1)st.innerHTML=st.innerHTML.replace('沿速度方向点火加速，进入椭圆转移轨道 Ⅱ，Ⅱ 的远地点 Q','点火减速，进入椭圆转移轨道 Ⅱ，Ⅱ 的近地点 Q')
      .replace('再次沿速度方向点火加速','再次点火减速');
  }

  return{
    legend:[{label:'速度 v、速度增量 Δv',color:'--v'},{label:'加速度 a（指向地心）',color:'--a'}],
    init(P){
      const K=setup(P),o={x:0,y:K.r1,vx:-K.vI,vy:0};
      const S={K,o,t:0,anim:0,done:false,ph:'c1',TS:K.TS1,sw:0,trail:[[0,K.r1]],res:K.R/300,burns:[],spokes:[],win:[],sch:[],aps:[],
        aMeas:GM/(K.r1*K.r1),out:false,apSign:0,turns:0,rmin:K.r1,rmax:K.r1};
      if(K.scn==='hoh'&&!K.same){const th=PI+K.phi-K.w2*K.tB;S.b={x:K.r2*Math.cos(th),y:K.r2*Math.sin(th),vx:-K.vIII*Math.sin(th),vy:K.vIII*Math.cos(th)}}
      sched(S,K.tB,'burn');S.status=status(S);return S;
    },
    step(S,P,dt){
      if(S.done)return;S.anim+=dt;let rem=dt,guard=0;
      while(rem>1e-12&&!S.done&&guard++<20){const ts=S.TS,used=advance(S,rem*ts);rem-=used/ts}
      if(S.t>50*S.K.TI+(S.C&&S.C.bound?3*S.C.T:0)+(S.K.TIII||0)*2+(S.K.TII||0)){S.done=true;S.fin=S.fin||'stop'}
      S.status=status(S);
    },
    readouts(S,P){
      const K=S.K,o=S.o,m=K.m,r=hyp(o.x,o.y),v=hyp(o.vx,o.vy),ek=.5*m*v*v,ep=-GM*m/r,E=ek+ep,vcr=vc(r),ver=Math.sqrt(2)*vcr;
      const orb=S.fin==='crash'?'已撞上地球':S.ph==='c1'?'圆轨道 Ⅰ':S.ph==='tr'?(K.same?'圆轨道 Ⅰ（未变轨）':'转移轨道 Ⅱ'):S.ph==='c3'?'圆轨道 Ⅲ':S.C.kind;
      const rel=v/vcr-1,judge=v>=ver*(1-1e-9)?'v ≥ v逃：将脱离地球':Math.abs(rel)<1e-6?'v = v圆：匀速圆周':rel>0?'v > v圆：离心':'v < v圆：近心';
      const R=[['已运行 t（真实时间）',tfmt(S.t)],['所在轨道',orb],['地心距 r',km(r)],['速度 v',kms(v)],
        ['该处 v圆 / v逃',`${kv(vcr)} / ${kv(ver)}${NB}km/s`],['判定',judge],
        ['加速度 a（实测 / GM/r²）',`${av(S.aMeas)} / ${av(GM/(r*r))}${NB}m/s²`],
        ['面积速度 ½|r × v|',sci(.5*Math.abs(o.x*o.vy-o.y*o.vx)/1e6,3)+NB+'km²/s'],
        ['动能 Ek',J(ek)],['引力势能 Ep',J(ep)],['机械能 E',J(E)],
        ['半长轴 −GMm/(2E)',E<0?km(-GM*m/(2*E)):'—（E ≥ 0）']];
      const W=S.win.filter(w=>w.done).sort((p,q)=>p.i-q.i);
      if(W.length===2)R.push(['扇形面积 S₁ / S₂',`${sci(W[0].A/1e6,3)} / ${sci(W[1].A/1e6,3)}${NB}km²`]);
      if(K.scn==='hoh'){
        R.push(['v_Ⅰ（公式 / 实测）',pair(K.vI,S.vIm,kv,'km/s')],['v_ⅡP（公式 / 实测）',pair(K.vP,S.vPm,kv,'km/s')],
          ['v_ⅡQ（公式 / 实测）',pair(K.vQ,S.vQm,kv,'km/s')],['v_Ⅲ（公式 / 实测）',pair(K.vIII,S.ph==='c3'?v:undefined,kv,'km/s')],
          ['Δv₁（实测）',ok(S.dv1m)?dvs(S.dv1m)+(Math.abs(S.dv1m)<1e-6?'':S.dv1m>0?' 加速':' 减速'):'—'],
          ['Δv₂（实测）',ok(S.dv2m)?dvs(S.dv2m)+(Math.abs(S.dv2m)<1e-6?'':S.dv2m>0?' 加速':' 减速'):'—'],
          ['总 Δv（公式）',dvs(Math.abs(K.dv1)+Math.abs(K.dv2)).replace('+','')],
          ['t_PQ（公式 / 实测）',`${tv(K.tPQ)} / ${ok(S.tQ)?tv(S.tQ-S.tP):'—'}${NB}${tu(K.tPQ)}`],
          ['W₁ / W₂（实测）',`${ok(S.W1)?sci(S.W1,2):'—'} / ${ok(S.W2)?sci(S.W2,2):'—'}${NB}J`],
          ['E_Ⅲ − E_Ⅰ（公式 / 实测）',`${sci(K.EIII-K.EI,3)} / ${ok(S.W2)?sci(S.W1+S.W2,3):'—'}${NB}J`],
          ['目标超前角 φ',K.same?'—':dg(K.phi)+(K.phi<0?'（落后）':'')],['会合时两星相距',ok(S.meet)?km(S.meet):'—'],
          ['T_Ⅰ / T_Ⅱ / T_Ⅲ',`${tv(K.TI)} / ${tv(K.TII)} / ${tv(K.TIII)}${NB}${tu(Math.max(K.TI,K.TIII))}`.replace(/(\d)\/(\d)/g,'$1 / $2')]);
        return R;
      }
      const C=K.C;
      R.push([K.scn==='esc'?'P 点速度 v₀':'点火后 v_P',kms(K.v1)+(K.scn==='one'?`（k = ${fmt(K.k,3)}）`:`（v₀/v逃 = ${fmt(K.v1/K.vesc,3)}）`)]);
      if(K.scn==='one'){const pt=!K.tang?'不是拱点（α ≠ 0）':Math.abs(K.k-1)<1e-9?'仍为圆轨道':K.k>1?'近地点（离心）':'远地点（近心）';R.push(['点火点 P',pt])}
      else R.push(['轨道类型',C.bound?'E < 0：椭圆（束缚）':C.par?'E = 0：抛物线':'E > 0：双曲线'],
        ['v∞（公式 / 实测）',C.bound?'—（不能逃逸）':pair(Math.sqrt(Math.max(0,K.v1*K.v1-K.vesc*K.vesc)),S.vinf,kv,'km/s')]);
      if(K.rq){const a=S.aps[0],rq=K.rq;R.push(['另一拱点 r′（公式 / 实测）',pair(rq,a&&a.r,kmv,'km')],['该处速度 v′（公式 / 实测）',pair(C.h/rq,a&&a.v,kv,'km/s')])}
      if(C.bound&&!K.tang){const pe=S.aps.find(a=>a.kind==='peri'),ap=S.aps.find(a=>a.kind==='apo');
        R.push(['近地点（公式 / 实测）',pair(C.rp,pe&&pe.r,kmv,'km')],['远地点（公式 / 实测）',pair(C.ra,ap&&ap.r,kmv,'km')])}
      if(C.bound)R.push(['周期 T（公式 / 实测）',K.crash?'—（撞地）':`${tv(C.T)} / ${ok(S.Tm)?tv(S.Tm):'—'}${NB}${tu(C.T)}`]);
      if(K.crash)R.push(['近地点 r近（公式）',km(C.rp)+' < R地']);
      return R;
    },
    draw(ctx,S,P,W,H,tok){
      // 试卷线稿：地球为墨线圆（内侧短斜线表示实体），圆轨道细墨线，转移椭圆 / 预测椭圆为细虚线（F.aux），实际轨迹 F.trail；
      // 卫星为空心小圆 + 球心点；只有矢量带颜色：速度 v、Δv（--v），加速度 a（--a，指向地心）。面积定律的扇形用辅助色细斜线。
      // 几何用 u，文字和依赖文字尺寸的版面量用 ut（窄屏时字母约 ≥ 11 CSS px）
      const K=S.K,o=S.o,F=FIG(ctx,W,tok),u=F.u,ut=F.ut,css=(ctx.canvas&&ctx.canvas.clientWidth)||W,px=W/css;
      const LS=19,ZS=15,wide=!(typeof matchMedia==='function'&&matchMedia('(max-width:640px)').matches);   // 宽屏时状态条浮在画布左上角，窄屏时排在画布下方
      const SERIF='"Times New Roman","STIX Two Text",Times,serif',SANS=tok('--f-body'),cV=tok('--v'),cA=tok('--a'),AUX=F.auxColor,INK=F.ink;
      F.clear();
      // 带下标的符号：sg = [[文字, 类型]]，类型 i 斜体、r 正体、s 斜体下标、u 正体下标、z 中文下标、c 中文
      const fs=k=>k==='s'||k==='z'||k==='u'?.66:k==='c'?.8:1;
      const font=(k,sz)=>k==='z'||k==='c'?`${fs(k)*sz*ut}px ${SANS}`:`${k==='r'||k==='u'?'':'italic '}${fs(k)*sz*ut}px ${SERIF}`;
      const adv=(t,k,sz)=>{ctx.save();ctx.font=font(k,sz);const w=ctx.measureText(t).width;ctx.restore();return w};
      const wid=(sg,sz=LS)=>sg.reduce((w,[t,k],i)=>w+adv(t,k,sz)+(i?ut:0),0);
      const rich=(sg,x,y,{color=INK,size=LS,align='center'}={})=>{
        let xx=align==='left'?x:align==='right'?x-wid(sg,size):x-wid(sg,size)/2;
        sg.forEach(([t,k])=>{const yy=y+(k==='s'||k==='z'||k==='u'?.3*size*ut:0),q={color,size:fs(k)*size,align:'left'};
          if(k==='z'||k==='c')F.zh(t,xx,yy,q);else F.label(t,xx,yy,{...q,italic:k!=='r'&&k!=='u'});xx+=adv(t,k,size)+ut})};

      // —— 版面：底部为能量柱与速度对比栏，上方画轨道；宽屏时顶端让开状态条 ——
      const pad=8*ut,headH=ZS*ut*1.55,rowH=LS*ut*1.25,Hs=Math.max(pad*1.6+headH+3*rowH,.24*H),yP=H-Hs;
      const yT=wide?46*px:6*u,yB=yP-4*u,mg=26*ut,B=K.box;
      const sc=Math.min((W-2*mg)/(B.x1-B.x0),(yB-yT-2*mg)/(B.y1-B.y0)),cx=W/2-(B.x0+B.x1)/2*sc,cy=(yT+yB)/2+(B.y0+B.y1)/2*sc;
      const X=x=>cx+x*sc,Y=y=>cy-y*sc;

      // —— 标注排布（同 MEC-GRV-01）：每个字给几个候选位置，取第一个不压球、不压矢量、不压别的字的；能不压圆和椭圆更好 ——
      const obs=[],discs=[],lines=[],rings=[],soft=[],anchors=[],todo=[];
      if(wide){ctx.save();ctx.font=`700 13px ${SANS}`;const tw=ctx.measureText(S.status.text).width;ctx.restore();
        const pw=Math.min(tw+42,css-24),pl=tw+42>css-24?Math.ceil(tw/(css-66)):1;obs.push({x:0,y:0,w:(16+pw)*px,h:(28+22.1*pl)*px})}
      const meet=(a,b)=>a.x<b.x+b.w&&b.x<a.x+a.w&&a.y<b.y+b.h&&b.y<a.y+a.h;
      const onLine=(b,[x1,y1,x2,y2])=>{const n=Math.ceil(hyp(x2-x1,y2-y1)/(2*u));
        for(let k=0;k<=n;k++){const x=x1+(x2-x1)*k/n,y=y1+(y2-y1)*k/n;if(x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h)return true}return false};
      const onRing=(b,[r1,r2])=>{const dx=Math.max(b.x-cx,0,cx-b.x-b.w),dy=Math.max(b.y-cy,0,cy-b.y-b.h);
        const far=hyp(Math.max(Math.abs(b.x-cx),Math.abs(b.x+b.w-cx)),Math.max(Math.abs(b.y-cy),Math.abs(b.y+b.h-cy)));
        return hyp(dx,dy)<=r2&&far>=r1};
      const onSoft=b=>soft.some(([x,y])=>x>b.x-2*u&&x<b.x+b.w+2*u&&y>b.y-2*u&&y<b.y+b.h+2*u);
      const put=(sg,pts,own=null,q={})=>{const sz=q.size||LS,w=wid(sg,sz),h=sz*ut*.9,box=([x,y])=>({x:x-w/2-ut,y:y-h/2-ut,w:w+2*ut,h:h+2*ut});
        const hard=p=>{const b=box(p);return b.x<0||b.y<0||b.x+b.w>W||b.y+b.h>yP-2*u||obs.some(c=>meet(b,c))||lines.some(l=>onLine(b,l))||
          discs.some(([x,y,r])=>hyp(Math.max(b.x-x,0,x-b.x-b.w),Math.max(b.y-y,0,y-b.y-b.h))<r)||
          (own&&anchors.some(a=>a!==own&&hyp(p[0]-a[0],p[1]-a[1])<hyp(p[0]-own[0],p[1]-own[1])))};
        let p=pts.find(p=>!hard(p)&&!rings.some(r=>onRing(box(p),r))&&!onSoft(box(p)))||(q.strict?null:pts.find(p=>!hard(p)));
        if(!p){if(q.opt)return false;p=pts[0]}
        obs.push(box(p));todo.push([sg,p[0],p[1],q]);return true};
      const around=(sg,x,y,dirs,gap,sz=LS)=>{const w=wid(sg,sz)+2*ut,h=sz*ut*.9+2*ut;
        return dirs.map(([dx,dy])=>{const n=hyp(dx,dy);dx/=n;dy/=n;const e=Math.abs(dx)*w/2+Math.abs(dy)*h/2+gap;return[x+dx*e,y+dy*e]})};
      const zhN=(t,pts,own,q={})=>put([[t,'c']],pts,own,{size:ZS/.8,color:AUX,...q});
      const later=[];   // 字的排布推迟到所有图形画完之后，按先后顺序排

      ctx.save();ctx.beginPath();ctx.rect(0,0,W,yP-2*u);ctx.clip();
      const re=Math.max(RE*sc,3*u),rb=Math.max(6.5*u,3.6*px),Lmin=rb+12*u;
      const ring=r=>{const R=r*sc;F.circle(cx,cy,R,{w:1.2});rings.push([R-u,R+u])};

      // 面积定律：等时间间隔的辐射线 + 两块阴影扇形（辅助色细斜线）
      const sector=(w)=>{const pts=w.on||w.done?[...w.pts,...(w.done?[]:[[o.x,o.y]])]:[];if(pts.length<2)return;
        ctx.save();ctx.beginPath();ctx.moveTo(cx,cy);pts.forEach(([x,y])=>ctx.lineTo(X(x),Y(y)));ctx.closePath();ctx.clip();
        let x0=W,x1=0,y0=H,y1=0;[[0,0],...pts].forEach(([x,y])=>{x0=Math.min(x0,X(x));x1=Math.max(x1,X(x));y0=Math.min(y0,Y(y));y1=Math.max(y1,Y(y))});
        ctx.beginPath();for(let t=x0-(y1-y0);t<x1;t+=5*u){ctx.moveTo(t,y1);ctx.lineTo(t+(y1-y0),y0)}
        ctx.lineWidth=.8*u;ctx.strokeStyle=AUX;ctx.stroke();ctx.restore();
        if(w.done||w.on){const q=pts[Math.floor(pts.length/2)],mx=(cx+X(q[0])*2)/3,my=(cy+Y(q[1])*2)/3,L=hyp(X(q[0])-cx,Y(q[1])-cy),ux=(X(q[0])-cx)/L,uy=(Y(q[1])-cy)/L;
          const sg=[['S','i'],[w.i?'2':'1','u']];later.push([3,()=>put(sg,[[mx,my],...around(sg,X(q[0]),Y(q[1]),[[ux,uy],[ux-uy,uy+ux],[ux+uy,uy-ux]],5*ut)],null,{opt:true})])}};
      S.spokes.forEach(([x,y])=>F.aux(cx,cy,X(x),Y(y),{w:.9}));
      S.win.forEach(sector);

      // 地球：墨线圆 + 内侧短斜线，地心画小实心点；画出来太小时不画斜线，在旁边小注「地球」
      F.circle(cx,cy,re,{w:1.6});rings.push([re-6*u,re+u]);
      if(re>20*u)F.hatchArc(cx,cy,re,0,TAU,false,{gap:11,len:6});
      F.dot(cx,cy,2.2);
      if(!K.zoom)later.push([6,()=>re>60*ut?zhN('地球',[[cx,cy+re*.45],[cx,cy-re*.45]],null,{opt:true}):
        zhN('地球',around([['地球','c']],cx,cy,[[-1,1],[1,1],[-1,-1],[0,1],[1,-1]],re+5*ut,ZS/.8),null,{opt:true})]);

      // 轨道：圆轨道 Ⅰ、Ⅲ 细墨线；转移椭圆 Ⅱ（单次点火时为预测的椭圆）细虚线预先画出，地球内的部分不画
      const ringLab=(r,t,fr)=>{const R=r*sc;later.push([4,()=>put([[t,'r']],fr.flatMap(f=>{const g=PI*f,c=Math.cos(g),s=-Math.sin(g);return around([[t,'r']],cx+R*c,cy+R*s,[[c,s]],5*ut)}),null,{opt:true})])};
      if(!K.zoom||K.r1*sc>30*u){ring(K.r1);ringLab(K.r1,'Ⅰ',[.75,.62,.88,.5,1.25,.35])}
      if(K.scn==='hoh'&&!K.same){ring(K.r2);ringLab(K.r2,'Ⅲ',[.25,.38,.12,.62,1.75,1.62])}
      const showII=K.samp.length>1&&!(K.scn==='hoh'&&K.same);
      if(showII){const sp=K.samp.map(([x,y])=>[X(x),Y(y)]);
        ctx.save();ctx.beginPath();ctx.rect(0,0,W,yP-2*u);ctx.arc(cx,cy,re,0,TAU,true);ctx.clip('evenodd');
        F.poly(sp,{w:1,color:AUX,dash:[6,5]});ctx.restore();
        sp.forEach(q=>soft.push(q));
        const C=K.C,cand=[.5,-.5,.35,-.35,.65,-.65,.8,-.8].map(f=>at(C,f*PI)).filter(q=>hyp(q[0],q[1])<=Math.min(K.RX,1e30));
        later.push([4,()=>put([['Ⅱ','r']],cand.flatMap(([x,y])=>{const L=hyp(x,y),c=x/L,s=-y/L;return around([['Ⅱ','r']],X(x),Y(y),[[c,s],[-c,-s]],5*ut)}),null,{opt:true})]);
      }
      // 实际轨迹
      F.trail([...S.trail.map(([x,y])=>[X(x),Y(y)]),[X(o.x),Y(o.y)]]);

      // 点火点 P、另一拱点 Q：小实心点 + 斜体字母；拱点处一小段径向辅助线，小注「近地点」「远地点」；r₁、r₂ 用尺寸线
      const pP=[X(-K.r1),Y(0)],showP=!K.zoom||K.r1*sc>30*u;
      const apsTick=(p,dir)=>{F.aux(p[0],p[1],p[0]+dir*16*u,p[1],{w:.9});lines.push([p[0],p[1],p[0]+dir*16*u,p[1]])};
      const nP=K.scn==='hoh'?(K.same?'':K.up?'近地点':'远地点'):!K.tang||K.C.e<1e-6?'':(K.v1>K.vI?'近地点':'远地点');
      if(showP){F.dot(pP[0],pP[1],2.4);anchors.push(pP);if(nP)apsTick(pP,-1);
        later.push([2,()=>put([['P','i']],around([['P','i']],pP[0],pP[1],[[-1,-1],[-1,1],[-1,0],[1,-1]],5*ut),pP)]);
        if(nP)later.push([5,()=>zhN(nP,around([[nP,'c']],pP[0]-16*u,pP[1],[[-1,.9],[-1,-.9],[-1,0],[0,1],[0,-1]],4*ut,ZS/.8),pP,{opt:true})]);
        // r₁：地心到 P
        const dimR=(L,sg,dir)=>{const ex=cx+dir*L;F.dim(cx,cy,ex,cy,null);lines.push([cx,cy,ex,cy]);
          const m=L-re>44*ut?dir*(L+re)/2:dir*L*.6;later.push([2.5,()=>put(sg,[[cx+m,cy-11*ut],[cx+m,cy+11*ut],...around(sg,ex,cy,[[dir,-1],[dir,1]],5*ut)],null,{opt:L<30*ut})])};
        dimR(K.r1*sc,[['r','i'],['1','u']],-1);
      }
      if(K.rq&&!K.crash&&hyp(K.rq,0)<=Math.min(K.RX,1e30)){
        const pQ=[X(K.rq),Y(0)],nQ=K.scn==='hoh'?(K.same?'':K.up?'远地点':'近地点'):(K.v1>K.vI?'远地点':'近地点');
        F.dot(pQ[0],pQ[1],2.4);anchors.push(pQ);if(nQ)apsTick(pQ,1);
        later.push([2,()=>put([['Q','i']],around([['Q','i']],pQ[0],pQ[1],[[1,-1],[1,1],[1,0],[-1,-1]],5*ut),pQ)]);
        if(nQ)later.push([5,()=>zhN(nQ,around([[nQ,'c']],pQ[0]+16*u,pQ[1],[[1,.9],[1,-.9],[1,0],[0,1],[0,-1]],4*ut,ZS/.8),pQ,{opt:true})]);
        const L=K.rq*sc;F.dim(cx,cy,cx+L,cy,null);lines.push([cx,cy,cx+L,cy]);
        const sg=K.scn==='hoh'?[['r','i'],['2','u']]:[['r′','i']],mm=L-re>44*ut?(L+re)/2:L*.6;
        later.push([2.5,()=>put(sg,[[cx+mm,cy-11*ut],[cx+mm,cy+11*ut],...around(sg,cx+L,cy,[[1,-1],[1,1]],5*ut)],null,{opt:L<30*ut})]);
      }else if(!K.tang&&K.C.bound&&!K.crash){
        // 非切向点火：标出预测椭圆的近地点、远地点
        const C=K.C;[[0,'近地点'],[PI,'远地点']].forEach(([f,t])=>{const q=at(C,f);if(hyp(q[0],q[1])>Math.min(K.RX,1e30))return;const p=[X(q[0]),Y(q[1])],L=hyp(q[0],q[1]),c=q[0]/L,s=-q[1]/L;
          F.dot(p[0],p[1],2.4);anchors.push(p);F.aux(p[0],p[1],p[0]+c*16*u,p[1]+s*16*u,{w:.9});lines.push([p[0],p[1],p[0]+c*16*u,p[1]+s*16*u]);
          later.push([5,()=>zhN(t,around([[t,'c']],p[0]+c*16*u,p[1]+s*16*u,[[c,s],[c-s,s+c],[c+s,s-c]],4*ut,ZS/.8),p,{opt:true})])});
      }

      // 点火记号：墨线小三角（点火点外侧，尖朝向点火点）+ 小注；点火瞬间画 Δv 箭头（--v，减速时与速度反向），1 s 后淡去
      const vref=K.vmax,LV=88*u,LA=66*u,lenV=v=>Math.max(Lmin,Math.min(LV,LV*v/vref));
      S.burns.forEach(b=>{if(hyp(b.dv[0],b.dv[1])<1e-3)return;   // Δv = 0（r₂ = r₁）时不算点火
        const r=hyp(b.x,b.y),c=b.x/r,s=-b.y/r,bx=X(b.x),by=Y(b.y),d0=rb+5*u,d1=d0+9*u,hw=4.5*u;

    box.appendChild(d);
  }else{
    const d=document.createElement('div');d.className='field';d.id=`f-${p.key}`;
    d.innerHTML=`<label for="num-${p.key}"><span class="s">${esc(p.sym)}</span><span class="note">${esc(p.label)}</span></label><span class="numin"><input type="number" id="num-${p.key}" min="${p.min}" max="${p.max}" step="any" inputmode="decimal" aria-label="${esc(p.label)}"><span class="u">${esc(p.unit||'')}</span></span><input type="range" id="in-${p.key}" min="${p.min}" max="${p.max}" step="${p.step}" value="${p.def}" aria-label="${esc(p.label)} 滑块">`;
    box.appendChild(d);
    d.querySelector('input[type=range]').addEventListener('input',e=>{P[p.key]=+e.target.value;active=-1;sync();reset()});
    const num=d.querySelector('input[type=number]');
    num.addEventListener('change',()=>{let v=parseFloat(num.value);
      if(Number.isFinite(v)){v=Math.min(p.max,Math.max(p.min,v));P[p.key]=v;active=-1;reset()}sync()});
    num.addEventListener('keydown',e=>{if(e.key==='Enter')num.blur()});
  }
});
box.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;P[b.dataset.k]=b.dataset.v;active=-1;sync();reset()});
let active=-1;
const shown=w=>!w||Object.entries(w).every(([k,v])=>[].concat(v).includes(P[k]));
const CH0=PS.find(p=>p.type==='choice');   // 预设只按第一个选项参数（情境 / 模式）分组，其余选项由预设的 load 带过去
const chosen=o=>!CH0||o[CH0.key]===undefined||o[CH0.key]===P[CH0.key];
const numTxt=(p,v)=>String(+(+v).toFixed(Math.max(p.dec??2,4)));
function sync(){
  PS.forEach(p=>{
    if(p.type==='choice'){p.options.forEach(o=>$(`opt-${p.key}-${o.value}`).setAttribute('aria-pressed',P[p.key]===o.value));if(p.when)$(`f-${p.key}`).hidden=!shown(p.when)}
    else{$(`in-${p.key}`).value=P[p.key];const n=$(`num-${p.key}`);if(document.activeElement!==n)n.value=numTxt(p,P[p.key]);$(`f-${p.key}`).hidden=!shown(p.when)}
  });
  const fill=s=>esc(s).replace(/\{(\w+)\}/g,(m,k)=>{
    if(k==='constraint'){const p=PS.find(x=>x.type==='choice');return esc(p.options.find(o=>o.value===P[p.key]).text)}
    const p=PS.find(x=>x.key===k);return p?`<span class="num">${esc(fmtP(p))}</span>`:m});
  const [lead,ask='']=D.problem.stem.split(/问[:：]/);
  $('stem').innerHTML=fill(lead.trim());
  const qs=ask.split(/[①②③④⑤⑥]/).map(s=>s.trim()).filter(Boolean);
  $('asks').innerHTML=qs.map((q,i)=>`<li><b>${i+1}</b><span>${fill(q)}</span></li>`).join('');
  $('asks').hidden=!qs.length;
  $('verdict').innerHTML=SIM.verdict(P);
  const ch=PS.find(p=>p.type==='choice');
  $('presetMode').textContent=ch?`· ${ch.options.find(o=>o.value===P[ch.key]).label}`:'';
  $('presets').innerHTML=D.presets.map((p,i)=>chosen(p.load)?`<button data-preset="${i}" aria-pressed="${i===active}" title="${esc(p.note||'')}">${esc(p.label)}</button>`:'').join('');
  const pn=$('pnote'),ap=D.presets[active];pn.hidden=!(ap&&ap.note);if(ap&&ap.note)pn.innerHTML=`<b>${esc(ap.label)}</b>：${esc(ap.note)}`;
}
function load(o,i=-1){Object.assign(P,o);active=i;sync();reset()}
$('presets').addEventListener('click',e=>{const b=e.target.closest('[data-preset]');if(b)load(D.presets[+b.dataset.preset].load,+b.dataset.preset)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-load]');if(!b)return;
  load(D.variants.find(v=>v.id===b.dataset.load).load);
  show('pane-lab');document.querySelector('.board').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})});

/* 画布与循环 */
const cv=$('cv'),ctx=cv.getContext('2d');let S,running=false,speed=1,lastT=0;
function size(){const r=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);const w=Math.max(200,Math.round(r.width*dpr));if(cv.width!==w){cv.width=w;cv.height=w}}
function render(){size();SIM.draw(ctx,S,P,cv.width,cv.height,tok);
  $('readout').innerHTML=SIM.readouts(S,P).map(([k,v])=>`<div class="ro"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('');
  const st=$('status');st.textContent=S.status.text;st.className='status '+S.status.cls}
function reset(){running=false;S=SIM.init(P);$('play').textContent=`▶ ${PLAY}`;render()}
function loop(t){if(!running)return;const real=Math.min(.05,(t-lastT)/1000);lastT=t;
  const sim=real*speed,n=Math.max(1,Math.ceil(sim/5e-4));for(let i=0;i<n;i++)SIM.step(S,P,sim/n);
  render();if(S.done){running=false;$('play').textContent=`▶ 再${PLAY}`;return}requestAnimationFrame(loop)}
$('play').onclick=()=>{if(running){running=false;$('play').textContent='▶ 继续';return}
  if(S.done)S=SIM.init(P);running=true;$('play').textContent='❚❚ 暂停';lastT=performance.now();requestAnimationFrame(loop)};
$('reset').onclick=reset;
$('slow').onclick=()=>{speed=speed===1?.25:1;$('slow').textContent=speed===1?'慢放 ×0.25':'正常速度'};
new ResizeObserver(render).observe(cv);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);
new MutationObserver(render).observe(root,{attributes:true,attributeFilter:['data-theme']});
/* 选项卡 */
const tabs=[...document.querySelectorAll('[role=tab]')];
function show(id){tabs.forEach(t=>{const on=t.dataset.pane===id;t.setAttribute('aria-selected',on);t.tabIndex=on?0:-1;$(t.dataset.pane).hidden=!on});
  if(id==='pane-lab')requestAnimationFrame(render)}
tabs.forEach((t,i)=>{t.addEventListener('click',()=>show(t.dataset.pane));
  t.addEventListener('keydown',e=>{const d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;if(!d)return;e.preventDefault();
    const n=tabs[(i+d+tabs.length)%tabs.length];n.focus();show(n.dataset.pane)})});
$('nConcl').textContent=D.conclusions.length;$('nVar').textContent=D.variants.length;$('nSkin').textContent=D.reskins.length;$('nSrc').textContent=D.sources.length;
show('pane-lab');
sync();reset();
})();
</script>
