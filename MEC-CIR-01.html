  --ink:#e4e9ef; --muted:#9aa7b6; --faint:#6f7d8c; --line:#2a3542; --hair:#212b36;
  --accent:#93acff; --accent-soft:#1f2a44; --mark:#4a4020;
  --g:#ef8f6e; --n:#5cc7a0; --v:#8db0ef; --a:#e3ac5c; --track:#c3ccd8; --fig-ink:#dde3ea; --fig-aux:#8794a2; --warn:#f0a35a; --ok:#52d39c;
  --shadow:0 1px 0 rgba(0,0,0,.25),0 12px 30px -20px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;background-position:-1px -1px}
.wrap{max-width:1160px;margin:0 auto;padding-inline:16px;padding-block:16px 56px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:800}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 22px;min-width:0;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
@media (max-width:520px){.panel{padding:16px;border-radius:12px}}
.sh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sh h2{font-size:20px;letter-spacing:.02em}
.sh small{font-size:13px;color:var(--muted)}
.sh::after{content:"";flex:1 1 40px;height:1px;background:var(--hair);align-self:center}
.label{font-size:12px;letter-spacing:.12em;color:var(--faint);font-weight:700}
.note{font-size:13px;color:var(--muted)}

/* 题头：标题 + 图纸标题栏 */
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 28px;align-items:end;padding-bottom:6px}
@media (max-width:760px){.top{grid-template-columns:1fr}}
.brand{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-bottom:6px}
.seal{font-family:var(--f-display);font-weight:800;font-size:13px;color:var(--card);background:var(--ink);padding:2px 8px;border-radius:3px;letter-spacing:.18em}
.top h1{font-size:clamp(22px,3vw,30px);line-height:1.2;letter-spacing:.01em}
.top .sub{margin-top:4px;color:var(--muted);font-size:14px}
.tb{border-collapse:collapse;font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);min-width:0}
.tb th,.tb td{border:1px solid var(--hair);padding:6px 12px;text-align:left;white-space:nowrap}
.tb th{color:var(--faint);font-weight:500;font-size:12px;letter-spacing:.06em;background:var(--sunk)}
.tb td{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tb td.code{color:var(--accent);font-weight:600}
.tbwrap{overflow-x:auto;max-width:100%}

/* 母题 */
.problem{display:flex;flex-direction:column;gap:10px;min-width:0}
.lead{font-family:var(--f-display);font-size:clamp(16px,1.7vw,17px);line-height:1.8;font-weight:600}
.num{font-family:var(--f-mono);font-weight:600;font-size:.92em;color:var(--ink);white-space:nowrap;
  background:linear-gradient(transparent 55%,var(--mark) 55%);padding:0 2px;transition:background-color .2s}
.asks{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 26px}
.asks li{display:flex;gap:8px;align-items:baseline;min-width:0}
.asks li b{flex:none}
.asks li b{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-family:var(--f-mono);font-size:13px}
.given{background:var(--sunk);border:1px solid var(--hair);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.given dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:14px}
.given dt{font-family:var(--f-mono);color:var(--muted)}
.given dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}

/* 考点 + 边界 */
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:28px;align-items:start}
@media (max-width:860px){.row2{grid-template-columns:1fr}}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:14px;border:1px solid var(--line);background:var(--sunk);padding:4px 12px;border-radius:999px}
.bnd{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:620px){.bnd{grid-template-columns:1fr}}
.bnd ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.bnd li{display:grid;grid-template-columns:1.2em minmax(0,1fr);gap:6px}
.bnd .ok li::before{content:"✓";color:var(--ok);font-weight:700}
.bnd .back li::before{content:"→";color:var(--accent);font-weight:700}

/* 选项卡 */
.board{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0;overflow:hidden}
.tabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--line);background:var(--sunk);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:none;border-radius:0;background:none;padding:13px 14px 11px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-size:15px}
.tab:hover{color:var(--ink);border-color:transparent;border-bottom-color:var(--line)}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.tab .n{font-family:var(--f-mono);font-size:11px;color:var(--faint);margin-left:5px;font-weight:500}
.pane{padding:16px 22px 22px;display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:520px){.pane{padding:16px}}
.hint{font-size:13px;color:var(--muted)}

/* 动画区 */
.lab{display:flex;flex-wrap:wrap;gap:22px 28px;align-items:flex-start}
.stage{flex:0 1 auto;width:min(100%,max(300px,calc(100vh - 430px)),640px);display:flex;flex-direction:column;gap:10px;min-width:0}
.canvas-box{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
canvas{width:100%;max-width:100%;aspect-ratio:1/1;display:block}
.status{position:absolute;left:12px;top:12px;max-width:calc(100% - 24px);display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;
  padding:5px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.status.warn{color:var(--warn)} .status.warn::before{background:var(--warn)}
.status.ok{color:var(--ok)} .status.ok::before{background:var(--ok)}
@media (max-width:640px){.status{position:static;margin:8px 10px 10px;max-width:none}}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:16px;height:3px;vertical-align:middle;margin-right:6px;border-radius:2px}
.readout{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.ro{padding:7px 12px;min-width:0;box-shadow:1px 0 0 var(--hair),0 1px 0 var(--hair)}
.ro span{display:block;font-size:12px;color:var(--faint)}
.ro b{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums;font-size:15px;overflow-wrap:anywhere}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 16px;border-radius:999px;cursor:pointer;transition:border-color .15s,background-color .15s,color .15s}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--card);border-color:var(--accent);font-weight:700;padding-inline:22px}
.ctrl{flex:1 1 300px;display:flex;flex-direction:column;gap:18px;min-width:0}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.group{display:flex;flex-direction:column;gap:10px}
.field{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"l o" "r r";gap:2px 10px;align-items:baseline}
.field label{grid-area:l;font-size:14px}
.field label .s{font-family:var(--f-mono);font-weight:600;margin-right:6px}
.field label .note{font-size:12px}
.numin{grid-area:o;display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:1px 8px 1px 2px;background:var(--sunk)}
.numin:focus-within{border-color:var(--accent)}
.numin input{width:6.2em;border:none;background:transparent;color:var(--accent);font:600 14px var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;padding:3px 2px;outline:none;-moz-appearance:textfield}
.numin input::-webkit-outer-spin-button,.numin input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.numin .u{font:500 12px var(--f-mono);color:var(--muted);min-width:1.5em}
.presets button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.pnote{font-size:13px;color:var(--muted);border-left:2px solid var(--accent-soft);padding:2px 0 2px 10px}
.pnote b{color:var(--ink);font-weight:600}
.field input{grid-area:r}
input[type=range]{width:100%;accent-color:var(--accent);margin:4px 0}
.seg{display:flex;padding:3px;gap:3px;border-radius:999px;background:var(--sunk);border:1px solid var(--line)}
.seg button{flex:1;border:none;padding:6px 10px;background:transparent;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.seg button small{display:block;font-size:12px;font-weight:400;color:var(--faint);line-height:1.4}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{font-size:13px;padding:4px 12px;background:var(--sunk)}
.verdict{background:var(--sunk);border:1px solid var(--hair);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.8}
.verdict b{color:var(--accent);font-family:var(--f-mono)}

/* 结论 */
.cl{display:flex;flex-direction:column}
.cl details{border-top:1px solid var(--hair)}
.cl details:last-child{border-bottom:1px solid var(--hair)}
.cl summary{display:grid;grid-template-columns:2.6em minmax(0,1fr) minmax(0,auto) 1em;gap:6px 14px;align-items:center;padding:12px 4px;cursor:pointer;list-style:none}
.cl summary::-webkit-details-marker{display:none}
.cl summary:hover .t{color:var(--accent)}
.badge{display:inline-grid;place-items:center;min-width:2.3em;height:1.7em;padding:0 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-family:var(--f-mono);font-weight:600;font-size:13px}
.cl .f{font-family:var(--f-mono);font-size:14px;background:var(--sunk);border:1px solid var(--hair);border-radius:6px;padding:2px 10px;justify-self:end;text-align:right}
.chev{width:8px;height:8px;border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);transform:rotate(45deg);transition:transform .2s;justify-self:center}
details[open]>summary .chev{transform:rotate(225deg)}
@media (max-width:640px){.cl summary{grid-template-columns:2.6em minmax(0,1fr) 1em}.cl .f{grid-column:2;grid-row:2;justify-self:start;text-align:left}.chev{grid-column:3;grid-row:1}}
.deriv{margin:0 4px 14px calc(2.6em + 18px);padding:4px 0 4px 14px;border-left:2px solid var(--accent-soft);white-space:pre-line;font-size:14px;color:var(--ink)}
@media (max-width:640px){.deriv{margin-left:4px}}

/* 变式 / 换皮题 */
.qs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px}
.q{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--card);min-width:0}
.q .head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.q h3{font-size:16px;margin-right:auto}
.chip{font-size:12px;font-family:var(--f-mono);border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--muted)}
.src{font-size:12px;color:var(--faint)}
.map{font-size:13px;color:var(--muted)}
.map b{font-weight:500;color:var(--ink)}
.q details{border-top:1px dashed var(--line);padding-top:8px}
.q details summary{cursor:pointer;color:var(--accent);font-size:14px;font-weight:500;list-style:none;display:flex;align-items:center;gap:8px;width:fit-content}
.q details summary::-webkit-details-marker{display:none}
.ans{margin-top:8px;display:flex;flex-direction:column;gap:6px;font-size:14px;background:var(--sunk);border-radius:8px;padding:10px 12px}
.ans .a{font-weight:700}
.q .foot{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.q .foot button{font-size:13px;padding:4px 14px;color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft)}
.srcs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.srcs li{display:grid;grid-template-columns:minmax(0,15em) minmax(0,1fr);gap:4px 16px;padding:8px 0;border-top:1px solid var(--hair);font-size:14px}
.srcs li b{font-family:var(--f-mono);font-weight:500;font-size:13px}
.srcs li span{color:var(--muted)}
@media (max-width:620px){.srcs li{grid-template-columns:1fr}}
footer{font-size:12px;color:var(--faint);text-align:center}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

<div class="wrap" id="app">
  <header class="top">
    <div>
      <div class="brand"><span class="seal">格物</span><span>Gewu · 高中物理母题</span></div>
      <h1 id="hName"></h1>
      <p class="sub" id="hSub"></p>
    </div>
    <div class="tbwrap"><table class="tb" id="hTable"></table></div>
  </header>

  <section class="panel">
    <div class="sh"><h2>母题</h2><small>题干数字随动画参数实时变化</small></div>
    <div class="problem">
      <p class="lead" id="stem"></p>
      <ol class="asks" id="asks"></ol>
      <p class="note" id="stemNote"></p>
    </div>
  </section>

  <div class="board">
    <nav class="tabs" role="tablist" aria-label="母题内容">
      <button class="tab" role="tab" id="tab-lab" aria-controls="pane-lab" data-pane="pane-lab">动画实验</button>
      <button class="tab" role="tab" id="tab-scope" aria-controls="pane-scope" data-pane="pane-scope">考点与边界</button>
      <button class="tab" role="tab" id="tab-concl" aria-controls="pane-concl" data-pane="pane-concl">结论<span class="n" id="nConcl"></span></button>
      <button class="tab" role="tab" id="tab-var" aria-controls="pane-var" data-pane="pane-var">变式<span class="n" id="nVar"></span></button>
      <button class="tab" role="tab" id="tab-skin" aria-controls="pane-skin" data-pane="pane-skin">换皮题<span class="n" id="nSkin"></span></button>
      <button class="tab" role="tab" id="tab-src" aria-controls="pane-src" data-pane="pane-src">题源<span class="n" id="nSrc"></span></button>
    </nav>

    <section class="pane" role="tabpanel" id="pane-lab" aria-labelledby="tab-lab">
      <div class="lab">
        <div class="stage">
          <div class="legend" id="legend"></div>
          <div class="canvas-box">
            <canvas id="cv" aria-label="母题动画画布"></canvas>
            <div class="status" id="status" role="status">准备就绪</div>
          </div>
          <div class="btns">
            <button class="primary" id="play">▶ 发射</button>
            <button id="reset">重置</button>
            <button id="slow">慢放 ×0.25</button>
          </div>
        </div>
        <div class="ctrl">
          <div class="group"><div class="label">参数</div><div id="params" class="group"></div></div>
          <div class="group"><div class="label">预设情形 <span id="presetMode"></span></div><div class="presets" id="presets"></div><p class="pnote" id="pnote" hidden></p></div>
          <div class="group"><div class="label">理论预判</div><div class="verdict" id="verdict"></div></div>
        </div>
      </div>
      <div class="group"><div class="label">实时读数</div><div class="readout" id="readout"></div></div>
    </section>

    <section class="pane" role="tabpanel" id="pane-scope" aria-labelledby="tab-scope" hidden>
      <div class="row2">
        <div class="group"><div class="label">核心考点</div><div class="tags" id="tags"></div></div>
        <div class="group"><div class="label">适用边界</div>
          <div class="bnd">
            <div><div class="hint">结论成立条件</div><ul class="ok" id="bCond"></ul></div>
            <div><div class="hint">超出边界时回到</div><ul class="back" id="bBack"></ul></div>
          </div>
        </div>
      </div>
    </section>

    <section class="pane" role="tabpanel" id="pane-concl" aria-labelledby="tab-concl" hidden>
      <p class="hint">点开每条结论看推导。</p>
      <div class="cl" id="concl"></div>
    </section>

    <section class="pane" role="tabpanel" id="pane-var" aria-labelledby="tab-var" hidden>
      <p class="hint">同一骨架，换条件或问法。点「加载到动画」可直接在动画里验证。</p>
      <div class="qs" id="variants"></div>
    </section>

    <section class="pane" role="tabpanel" id="pane-skin" aria-labelledby="tab-skin" hidden>
      <p class="hint">同一骨架，换情境外形。</p>
      <div class="qs" id="reskins"></div>
    </section>

    <section class="pane" role="tabpanel" id="pane-src" aria-labelledby="tab-src" hidden>
      <ul class="srcs" id="sources"></ul>
    </section>
  </div>

  <footer id="foot"></footer>
</div>

<script>
/* ================= 线稿绘图工具 FIG（所有母题共用，不改） =================
   画法照试卷插图：装置用墨线，固定面画斜线阴影，辅助线用虚线，物理量和点的字母用斜体衬线；
   只有矢量带颜色（--g 重力/外力，--n 弹力/约束力，--v 速度，--a 其他矢量）。
   用法：SIM.draw 里 const F=FIG(ctx,W,tok)；坐标是画布像素，F.u = W/720 是线宽与几何的基准单位，
   F.ut 是字号单位（窄屏时不再随画布缩小，保证字母不小于约 11 CSS 像素；自写文字函数也要用 F.ut 算字号）。
   颜色：F.ink 墨线、F.auxColor 辅助线、F.paper 纸色（F.aux 是画辅助线的方法，不是颜色）。 */
const FIG=(ctx,W,tok)=>{
  const u=W/720,ink=tok('--fig-ink'),aux=tok('--fig-aux'),paper=tok('--card');
  const dp=W/(ctx.canvas.clientWidth||W),ut=Math.max(u,dp*11/19);   // dp：每 CSS 像素的画布像素数
  const SERIF='"Times New Roman","STIX Two Text",Times,serif',SANS=tok('--f-body');
  const path=(fn,{w=1.6,color=ink,dash=null,fill=null}={})=>{ctx.save();ctx.beginPath();fn();
    if(fill){ctx.fillStyle=fill;ctx.fill()}
    if(w>0){ctx.lineWidth=w*u;ctx.strokeStyle=color;ctx.setLineDash(dash?dash.map(d=>d*u):[]);ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}
    ctx.restore()};
  // 文字先描一圈底色再填色，压在线条上也清楚
  const text=(t,x,y,font,color,align,base)=>{ctx.save();ctx.font=font;ctx.textAlign=align;ctx.textBaseline=base;
    ctx.lineJoin="round";ctx.lineWidth=5*ut;ctx.strokeStyle=paper;ctx.strokeText(t,x,y);ctx.fillStyle=color;ctx.fillText(t,x,y);ctx.restore()};
  const F={u,ut,ink,auxColor:aux,paper,
    clear(){ctx.save();ctx.setLineDash([]);ctx.fillStyle=paper;ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height);ctx.restore()},
    line(x1,y1,x2,y2,o){path(()=>{ctx.moveTo(x1,y1);ctx.lineTo(x2,y2)},o)},
    poly(pts,o){path(()=>pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y)),o)},
    circle(x,y,r,o){path(()=>ctx.arc(x,y,r,0,2*Math.PI),o)},
    arc(x,y,r,a0,a1,o){path(()=>ctx.arc(x,y,r,a0,a1),o)},
    rect(x,y,w,h,o){path(()=>ctx.rect(x,y,w,h),o)},
    // 辅助线（中心线、投影线等）
    aux(x1,y1,x2,y2,o={}){F.line(x1,y1,x2,y2,{w:1,color:aux,dash:[6,5],...o})},
    // 运动轨迹：细虚线
    trail(pts,o={}){if(pts.length>1)F.poly(pts,{w:1.3,color:aux,dash:[5,5],...o})},
    // 固定面斜线：沿 (x1,y1)→(x2,y2) 的直线，画在 side 一侧（屏幕坐标下，1 = 前进方向右手侧）
    hatch(x1,y1,x2,y2,side=1,{gap=12,len=10}={}){const L=Math.hypot(x2-x1,y2-y1),n=Math.max(1,Math.round(L/(gap*u)));
      const tx=(x2-x1)/L,ty=(y2-y1)/L,nx=-ty*side,ny=tx*side,ox=(nx-tx)*len*u/Math.SQRT2,oy=(ny-ty)*len*u/Math.SQRT2;
      path(()=>{for(let i=0;i<=n;i++){const x=x1+(x2-x1)*i/n,y=y1+(y2-y1)*i/n;ctx.moveTo(x,y);ctx.lineTo(x+ox,y+oy)}},{w:1,color:aux})},
    // 圆弧形固定面的斜线：out = true 画在圆外侧
    hatchArc(cx,cy,r,a0,a1,out=true,{gap=12,len=10}={}){const n=Math.max(1,Math.round(r*Math.abs(a1-a0)/(gap*u))),s=out?1:-1;
      path(()=>{for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n,c=Math.cos(a),si=Math.sin(a),x=cx+r*c,y=cy+r*si;
        const nx=c*s,ny=si*s,tx=-si,ty=c;ctx.moveTo(x,y);ctx.lineTo(x+(nx-tx)*len*u/Math.SQRT2,y+(ny-ty)*len*u/Math.SQRT2)}},{w:1,color:aux})},
    // 矢量：从 (x,y) 画到 (x+dx,y+dy)，细杆 + 窄实心箭头；label 用斜体写在箭头外侧，
    // 与别的矢量共线时用 off=[dx,dy]（单位 u，相对箭头尖）把标注挪到旁边
    arrow(x,y,dx,dy,color,label,{w=2,head=12,size=19,off=null}={}){const L=Math.hypot(dx,dy);if(L<2*u)return;
      const ux=dx/L,uy=dy/L,h=Math.min(head*u,L*.6),hw=h*.34,tx=x+dx,ty=y+dy;
      F.line(x,y,tx-ux*h*.7,ty-uy*h*.7,{w,color});
      path(()=>{ctx.moveTo(tx,ty);ctx.lineTo(tx-ux*h-uy*hw,ty-uy*h+ux*hw);ctx.lineTo(tx-ux*h+uy*hw,ty-uy*h-ux*hw);ctx.closePath()},{w:0,fill:color});
      if(label)F.label(label,off?tx+off[0]*u:tx+ux*14*u,off?ty+off[1]*u:ty+uy*14*u,{color,size})},
    // 斜体衬线字母（物理量、点名）
    label(t,x,y,{color=ink,size=19,align='center',base='middle',italic=true}={}){text(t,x,y,`${italic?'italic ':''}${size*ut}px ${SERIF}`,color,align,base)},
    // 中文小注
    zh(t,x,y,{color=aux,size=14,align='center',base='middle'}={}){text(t,x,y,`${size*ut}px ${SANS}`,color,align,base)},
    dot(x,y,r=2.6,color=ink){F.circle(x,y,r*u,{w:0,fill:color})},
    // 带名字的点：实心小点 + 斜体字母（dx、dy 为字母相对点的偏移，单位 u）
    point(x,y,name,dx=-13,dy=13){F.dot(x,y);if(name)F.label(name,x+dx*u,y+dy*u)},
    // 小球：空心圆，球心另用 F.dot 标出（矢量画完后再点，表示力作用在重心）
    ball(x,y,r){F.circle(x,y,r,{w:1.6,fill:paper})},
    // 尺寸标注：两端带箭头的细线，文字写在中点外侧 off（单位 u）
    dim(x1,y1,x2,y2,t,{off=14,color=ink}={}){const L=Math.hypot(x2-x1,y2-y1);if(L<4*u)return;const ux=(x2-x1)/L,uy=(y2-y1)/L,h=Math.min(8*u,L/3),hw=h*.38;
      F.line(x1,y1,x2,y2,{w:1,color});
      for(const[px,py,sx]of[[x1,y1,1],[x2,y2,-1]])path(()=>{ctx.moveTo(px,py);ctx.lineTo(px+sx*ux*h-uy*hw,py+sx*uy*h+ux*hw);ctx.lineTo(px+sx*ux*h+uy*hw,py+sx*uy*h-ux*hw);ctx.closePath()},{w:0,fill:color});
      if(t)F.label(t,(x1+x2)/2-uy*off*u,(y1+y2)/2+ux*off*u,{color})},
  };
  return F;
};

/* ================= SIM 模块：每个母题替换这一段 =================
   约定接口：
   SIM.legend            [{label, color(CSS 变量名)}]
   SIM.init(P)           → 状态 S（含 S.done、S.status={text,cls}）
   SIM.step(S,P,dt)      推进 dt 秒（引擎保证 dt ≤ 0.5 ms）
   SIM.readouts(S,P)     → [[标签, 带单位的值]]
   SIM.draw(ctx,S,P,W,H,tok)  tok(name) 取主题色
   SIM.verdict(P)        → 理论预判 HTML
*/
const SIM=(()=>{
  const g=10;
  const fmt=(x,d=2)=>(Math.abs(x)<1e-9?0:x).toFixed(d);
  const Nm=(P,th,w)=>w*w*P.R+g*Math.cos(th);           // N/m（指向圆心为正）
  const acc=(P,th,w)=>{let a=-(g/P.R)*Math.sin(th);
    if(P.mu>0&&Math.abs(w)>1e-6)a-=Math.sign(w)*P.mu*Math.abs(Nm(P,th,w))/P.R;return a};
  const pos=(P,S)=>[P.R*Math.sin(S.th),-P.R*Math.cos(S.th)];
  function cur(S,P){
    if(S.free)return{x:S.x,y:S.y,vx:S.vx,vy:S.vy,N:0};
    const[x,y]=pos(P,S);return{x,y,vx:S.w*P.R*Math.cos(S.th),vy:S.w*P.R*Math.sin(S.th),N:P.m*Nm(P,S.th,S.w)};
  }
  const norm=a=>{a%=2*Math.PI;return a<0?a+2*Math.PI:a};
  return{
    legend:[{label:'重力 mg',color:'--g'},{label:'弹力 N',color:'--n'},{label:'速度 v',color:'--v'}],
    init(P){return{th:0,w:P.v0/P.R,t:0,free:false,x:0,y:-P.R,vx:P.v0,vy:0,done:false,Q:0,maxTh:0,trail:[],status:{text:'准备就绪',cls:''}}},
    step(S,P,dt){
      if(S.done)return;
      if(S.free){
        S.vy-=g*dt;S.x+=S.vx*dt;S.y+=S.vy*dt;S.t+=dt;
        if(S.x*S.x+S.y*S.y>=P.R*P.R){const r=Math.hypot(S.x,S.y);S.x*=P.R/r;S.y*=P.R/r;S.done=true;
          S.status={text:'脱轨后斜抛，撞回轨道（演示到此结束）',cls:'warn'}}
        S.trail.push([S.x,S.y]);return;
      }
      const f=(th,w)=>[w,acc(P,th,w)];
      const k1=f(S.th,S.w),k2=f(S.th+k1[0]*dt/2,S.w+k1[1]*dt/2),k3=f(S.th+k2[0]*dt/2,S.w+k2[1]*dt/2),k4=f(S.th+k3[0]*dt,S.w+k3[1]*dt);
      const nth=S.th+dt/6*(k1[0]+2*k2[0]+2*k3[0]+k4[0]);
      const nw=S.w+dt/6*(k1[1]+2*k2[1]+2*k3[1]+k4[1]);
      if(P.mu>0){
        S.Q+=P.m*P.mu*Math.abs(Nm(P,S.th,S.w))*Math.abs(nth-S.th)*P.R;
        if(S.w!==0&&Math.sign(nw)!==Math.sign(S.w)){
          const c=Math.cos(nth),s=Math.sin(nth);
          if(c>0&&Math.abs(s)<=P.mu*c){S.th=nth;S.w=0;S.done=true;
            S.status={text:`在 θ = ${fmt(norm(nth)*180/Math.PI,1)}° 处停住（静摩擦足够）`,cls:''};S.trail.push(pos(P,S));return}
        }
      }
      S.th=nth;S.w=nw;S.t+=dt;S.maxTh=Math.max(S.maxTh,S.th);
      if(P.mode==='rope'&&Nm(P,S.th,S.w)<-1e-6){
        S.free=true;const[x,y]=pos(P,S);S.x=x;S.y=y;S.det=[x,y];
        S.vx=S.w*P.R*Math.cos(S.th);S.vy=S.w*P.R*Math.sin(S.th);
        S.status={text:`在高度 h = ${fmt(P.R+y)} m 处脱离轨道（N 减到 0）`,cls:'warn'};
      }else if(P.mode==='rod'&&P.mu===0&&Math.abs(S.w)<2e-3&&Math.cos(S.th)<-0.9999){
        S.done=true;S.w=0;S.status={text:'恰好停在最高点（v = 0，杆对球推力 = mg）',cls:'ok'};
      }
      S.trail.push(pos(P,S));if(S.trail.length>1600)S.trail.shift();
      if(!S.free&&!S.done){
        const laps=Math.floor(S.th/(2*Math.PI));
        if(laps>=1)S.status={text:`完整圆周运动中，已转 ${laps} 圈`,cls:'ok'};
        else if(S.th>Math.PI)S.status={text:'已通过最高点',cls:'ok'};
        else if(S.w<0)S.status={text:S.maxTh<=Math.PI/2+1e-6?'在下半圆往回摆':'速度减为 0 后往回滑',cls:''};
        else if(S.w>0)S.status={text:'上升中',cls:''};
      }
    },
    readouts(S,P){
      const c=cur(S,P),v=Math.hypot(c.vx,c.vy),h=P.R+c.y,ek=.5*P.m*v*v,ep=P.m*g*h;
      let n=S.free?'0 N（离轨）':fmt(Math.abs(c.N))+' N';
      if(!S.free&&Math.abs(c.N)>1e-4)n+=c.N>0?' 指向圆心':' 背离圆心';
      const laps=Math.max(0,S.th/(2*Math.PI));
      return[['速度 v',fmt(v)+' m/s'],['高度 h',fmt(h,3)+' m'],['弹力 N',n],['时间 t',fmt(S.t,3)+' s'],
        ['已转圈数',fmt(laps,2)+' 圈'],['动能 Ek',fmt(ek,3)+' J'],['势能 Ep',fmt(ep,3)+' J'],
        ['机械能 E',fmt(ek+ep,3)+' J'],['摩擦生热 Q',fmt(S.Q,3)+' J']];
    },
    draw(ctx,S,P,W,H,tok){
      // 小球按质点计算，球心沿半径 R 运动；画图时小球整个落在轨道内侧（或圆管中），与轨道相切
      const F=FIG(ctx,W,tok),u=F.u,cx=W/2,cy=H/2,Rp=W*0.32,sc=Rp/P.R,X=x=>cx+x*sc,Y=y=>cy-y*sc,rb=10*u;
      // 标注偏移按字号单位放大（F.arrow 的 off、F.point 的偏移以 u 计），窄屏时字大了，空隙也跟着大
      const k=F.ut/u,tip=(dx,dy,g=15)=>{const L=Math.hypot(dx,dy)||1;return[dx/L*g*k,dy/L*g*k]};
      F.clear();
      F.aux(cx-Rp-54*u,cy,cx+Rp+54*u,cy);F.aux(cx,cy-Rp-54*u,cx,cy+Rp+54*u);
      const rOut=P.mode==='rod'?Rp+rb+3*u:Rp+rb;
      if(P.mode==='rod'){F.circle(cx,cy,rOut,{w:1.8});F.circle(cx,cy,Rp-rb-3*u,{w:1.8})}
      else{F.circle(cx,cy,rOut,{w:2});F.hatchArc(cx,cy,rOut,0,2*Math.PI,true)}
      F.zh('最高点',cx-6*u,cy-rOut-22*F.ut,{align:'right'});F.zh('最低点',cx-6*u,cy+rOut+22*F.ut,{align:'right'});
      // 半径 R：从圆心画到左下方的球心轨迹上
      const ra=Math.PI*.75,ex=cx+Rp*Math.cos(ra),ey=cy+Rp*Math.sin(ra);
      F.line(cx,cy,ex,ey,{w:1.1});F.label('R',(cx+ex)/2+12*F.ut,(cy+ey)/2+12*F.ut);
      F.point(cx,cy,'O',-15*k,-15*k);
      // 脱轨点与脱轨高度 h（从最低点量起）
      if(S.det){const px=X(S.det[0]),py=Y(S.det[1]),xr=cx+rOut+34*u;
        F.aux(px,py,xr+8*u,py);F.aux(cx,Y(-P.R),xr+8*u,Y(-P.R));F.dim(xr,Y(-P.R),xr,py,'h',{off:-12*k});
        F.dot(px,py,2.4);F.zh('脱轨点',px+(px<cx?-30:30)*F.ut,py-16*F.ut)}
      F.trail(S.trail.map(([x,y])=>[X(x),Y(y)]));
      const c=cur(S,P),bx=X(c.x),by=Y(c.y),mg=P.m*g,fs=46*u/mg;
      if(!S.free)F.line(cx,cy,bx,by,{w:1,color:F.auxColor,dash:[3,4]});
      F.ball(bx,by,rb);
      // N 先画、mg 后画：两者共线时较短的 mg 叠在上面，两支都看得见
      if(!S.free&&Math.abs(c.N)>1e-6){const ux=-c.x/P.R,uy=-c.y/P.R;let L=c.N*fs;const cap=Rp*.6;if(Math.abs(L)>cap)L=Math.sign(L)*cap;F.arrow(bx,by,ux*L,-uy*L,tok('--n'),'N',{off:tip(ux*L,-uy*L)})}
      F.arrow(bx,by,0,mg*fs,tok('--g'),'mg',{off:[18*k,-8]});
      F.arrow(bx,by,c.vx*22*u,-c.vy*22*u,tok('--v'),S.t>0?'v':'v₀',{off:tip(c.vx,-c.vy)});
      F.dot(bx,by,2.2);
    },
    verdict(P){
      const{v0,R,m}=P,gR=g*R,v2=v0*v0,mg=m*g,k=v2/gR;
      let h=`v₀²/(gR) = <b>${fmt(k)}</b>。`;
      if(P.mu>0)h+='有摩擦时以下光滑结论只作参考，实际以动画为准。';
      h+='<br>';
      if(P.mode==='rope'){
        if(k<=2)h+=`k ≤ 2（C5）：最高只到 h = v₀²/(2g) = <b>${fmt(v2/(2*g))} m</b>，不超过圆心高度，在下半圆来回摆。`;
        else if(k<5)h+=`2 &lt; k &lt; 5（C6）：在上半圆脱轨，脱轨高度 h = (v₀²+gR)/(3g) = <b>${fmt((v2+gR)/(3*g))} m</b>，之后做斜抛运动。`;
        else{const vt=Math.sqrt(v2-4*gR);h+=`k ≥ 5（C2）：能做完整圆周。最高点 v = <b>${fmt(vt)} m/s</b>，N顶 = <b>${fmt(m*(vt*vt/R-g))} N</b>。`}
      }else{
        if(k<4-1e-3)h+=`k &lt; 4（C3）：到不了最高点，最高到 h = v₀²/(2g) = <b>${fmt(v2/(2*g))} m</b>，然后返回。`;
        else if(k<=4+1e-3)h+='k = 4（C3）：恰好到达最高点且速度为 0，停在顶端（不稳定平衡）。';
        else{const vt=Math.sqrt(v2-4*gR),Nt=m*(vt*vt/R-g);
          h+=`k &gt; 4（C3）：能做完整圆周。最高点 v = <b>${fmt(vt)} m/s</b>，${Nt>5e-4?`杆拉球 <b>${fmt(Nt)} N</b>`:Nt<-5e-4?`杆推球 <b>${fmt(-Nt)} N</b>`:'杆对球无作用力'}（C7）。`}
      }
      const Nb=mg+m*v2/R;h+=`<br>最低点 N底 = mg + mv₀²/R = <b>${fmt(Nb)} N</b>（约 ${fmt(Nb/mg,1)} mg）。`;
      return h;
    },
    _cur:cur
  };
})();

  PS.forEach(p=>{
    if(p.type==='choice')p.options.forEach(o=>$(`opt-${p.key}-${o.value}`).setAttribute('aria-pressed',P[p.key]===o.value));
    else{$(`in-${p.key}`).value=P[p.key];const n=$(`num-${p.key}`);if(document.activeElement!==n)n.value=numTxt(p,P[p.key]);$(`f-${p.key}`).hidden=!shown(p.when)}
  });
  const fill=s=>esc(s).replace(/\{(\w+)\}/g,(m,k)=>{
    if(k==='constraint'){const p=PS.find(x=>x.type==='choice');return esc(p.options.find(o=>o.value===P[p.key]).text)}
    const p=PS.find(x=>x.key===k);return p?`<span class="num">${esc(fmtP(p))}</span>`:m});
  const [lead,ask='']=D.problem.stem.split(/问[:：]/);
  $('stem').innerHTML=fill(lead.trim());
  const qs=ask.split(/[①②③④⑤⑥]/).map(s=>s.trim()).filter(Boolean);
  $('asks').innerHTML=qs.map((q,i)=>`<li><b>${i+1}</b><span>${fill(q)}</span></li>`).join('');
  $('asks').hidden=!qs.length;
  $('verdict').innerHTML=SIM.verdict(P);
  const ch=PS.find(p=>p.type==='choice');
  $('presetMode').textContent=ch?`· ${ch.options.find(o=>o.value===P[ch.key]).label}`:'';
  $('presets').innerHTML=D.presets.map((p,i)=>chosen(p.load)?`<button data-preset="${i}" aria-pressed="${i===active}" title="${esc(p.note||'')}">${esc(p.label)}</button>`:'').join('');
  const pn=$('pnote'),ap=D.presets[active];pn.hidden=!(ap&&ap.note);if(ap&&ap.note)pn.innerHTML=`<b>${esc(ap.label)}</b>：${esc(ap.note)}`;
}
function load(o,i=-1){Object.assign(P,o);active=i;sync();reset()}
$('presets').addEventListener('click',e=>{const b=e.target.closest('[data-preset]');if(b)load(D.presets[+b.dataset.preset].load,+b.dataset.preset)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-load]');if(!b)return;
  load(D.variants.find(v=>v.id===b.dataset.load).load);
  show('pane-lab');document.querySelector('.board').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})});

/* 画布与循环 */
const cv=$('cv'),ctx=cv.getContext('2d');let S,running=false,speed=1,lastT=0;
function size(){const r=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);const w=Math.max(200,Math.round(r.width*dpr));if(cv.width!==w){cv.width=w;cv.height=w}}
function render(){size();SIM.draw(ctx,S,P,cv.width,cv.height,tok);
  $('readout').innerHTML=SIM.readouts(S,P).map(([k,v])=>`<div class="ro"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('');
  const st=$('status');st.textContent=S.status.text;st.className='status '+S.status.cls}
function reset(){running=false;S=SIM.init(P);$('play').textContent='▶ 发射';render()}
function loop(t){if(!running)return;const real=Math.min(.05,(t-lastT)/1000);lastT=t;
  const sim=real*speed,n=Math.max(1,Math.ceil(sim/5e-4));for(let i=0;i<n;i++)SIM.step(S,P,sim/n);
  render();if(S.done){running=false;$('play').textContent='▶ 再发射';return}requestAnimationFrame(loop)}
$('play').onclick=()=>{if(running){running=false;$('play').textContent='▶ 继续';return}
  if(S.done)S=SIM.init(P);running=true;$('play').textContent='❚❚ 暂停';lastT=performance.now();requestAnimationFrame(loop)};
$('reset').onclick=reset;
$('slow').onclick=()=>{speed=speed===1?.25:1;$('slow').textContent=speed===1?'慢放 ×0.25':'正常速度'};
new ResizeObserver(render).observe(cv);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);
new MutationObserver(render).observe(root,{attributes:true,attributeFilter:['data-theme']});
/* 选项卡 */
const tabs=[...document.querySelectorAll('[role=tab]')];
function show(id){tabs.forEach(t=>{const on=t.dataset.pane===id;t.setAttribute('aria-selected',on);t.tabIndex=on?0:-1;$(t.dataset.pane).hidden=!on});
  if(id==='pane-lab')requestAnimationFrame(render)}
tabs.forEach((t,i)=>{t.addEventListener('click',()=>show(t.dataset.pane));
  t.addEventListener('keydown',e=>{const d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;if(!d)return;e.preventDefault();
    const n=tabs[(i+d+tabs.length)%tabs.length];n.focus();show(n.dataset.pane)})});
$('nConcl').textContent=D.conclusions.length;$('nVar').textContent=D.variants.length;$('nSkin').textContent=D.reskins.length;$('nSrc').textContent=D.sources.length;
show('pane-lab');
sync();reset();
})();
</script>
