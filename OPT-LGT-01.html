<script>
/* ================= 线稿绘图工具 FIG（所有母题共用，不改） =================
   画法照试卷插图：装置用墨线，固定面画斜线阴影，辅助线用虚线，物理量和点的字母用斜体衬线；
   只有矢量带颜色（--g 重力/外力，--n 弹力/约束力，--v 速度，--a 其他矢量）。
   用法：SIM.draw 里 const F=FIG(ctx,W,tok)；坐标是画布像素，F.u = W/720 是线宽与几何的基准单位，
   F.ut 是字号单位（窄屏时不再随画布缩小，保证字母不小于约 11 CSS 像素；自写文字函数也要用 F.ut 算字号）。
   颜色：F.ink 墨线、F.auxColor 辅助线、F.paper 纸色（F.aux 是画辅助线的方法，不是颜色）。 */
const FIG=(ctx,W,tok)=>{
  const u=W/720,ink=tok('--fig-ink'),aux=tok('--fig-aux'),paper=tok('--card');
  const dp=W/(ctx.canvas.clientWidth||W),ut=Math.max(u,dp*11/19);   // dp：每 CSS 像素的画布像素数
  const SERIF='"Times New Roman","STIX Two Text",Times,serif',SANS=tok('--f-body');
  const path=(fn,{w=1.6,color=ink,dash=null,fill=null}={})=>{ctx.save();ctx.beginPath();fn();
    if(fill){ctx.fillStyle=fill;ctx.fill()}
    if(w>0){ctx.lineWidth=w*u;ctx.strokeStyle=color;ctx.setLineDash(dash?dash.map(d=>d*u):[]);ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}
    ctx.restore()};
  // 文字先描一圈底色再填色，压在线条上也清楚
  const text=(t,x,y,font,color,align,base)=>{ctx.save();ctx.font=font;ctx.textAlign=align;ctx.textBaseline=base;
    ctx.lineJoin="round";ctx.lineWidth=5*ut;ctx.strokeStyle=paper;ctx.strokeText(t,x,y);ctx.fillStyle=color;ctx.fillText(t,x,y);ctx.restore()};
  const F={u,ut,ink,auxColor:aux,paper,
    clear(){ctx.save();ctx.setLineDash([]);ctx.fillStyle=paper;ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height);ctx.restore()},
    line(x1,y1,x2,y2,o){path(()=>{ctx.moveTo(x1,y1);ctx.lineTo(x2,y2)},o)},
    poly(pts,o){path(()=>pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y)),o)},
    circle(x,y,r,o){path(()=>ctx.arc(x,y,r,0,2*Math.PI),o)},
    arc(x,y,r,a0,a1,o){path(()=>ctx.arc(x,y,r,a0,a1),o)},
    rect(x,y,w,h,o){path(()=>ctx.rect(x,y,w,h),o)},
    // 辅助线（中心线、投影线等）
    aux(x1,y1,x2,y2,o={}){F.line(x1,y1,x2,y2,{w:1,color:aux,dash:[6,5],...o})},
    // 运动轨迹：细虚线
    trail(pts,o={}){if(pts.length>1)F.poly(pts,{w:1.3,color:aux,dash:[5,5],...o})},
    // 固定面斜线：沿 (x1,y1)→(x2,y2) 的直线，画在 side 一侧（屏幕坐标下，1 = 前进方向右手侧）
    hatch(x1,y1,x2,y2,side=1,{gap=12,len=10}={}){const L=Math.hypot(x2-x1,y2-y1),n=Math.max(1,Math.round(L/(gap*u)));
      const tx=(x2-x1)/L,ty=(y2-y1)/L,nx=-ty*side,ny=tx*side,ox=(nx-tx)*len*u/Math.SQRT2,oy=(ny-ty)*len*u/Math.SQRT2;
      path(()=>{for(let i=0;i<=n;i++){const x=x1+(x2-x1)*i/n,y=y1+(y2-y1)*i/n;ctx.moveTo(x,y);ctx.lineTo(x+ox,y+oy)}},{w:1,color:aux})},
    // 圆弧形固定面的斜线：out = true 画在圆外侧
    hatchArc(cx,cy,r,a0,a1,out=true,{gap=12,len=10}={}){const n=Math.max(1,Math.round(r*Math.abs(a1-a0)/(gap*u))),s=out?1:-1;
      path(()=>{for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n,c=Math.cos(a),si=Math.sin(a),x=cx+r*c,y=cy+r*si;
        const nx=c*s,ny=si*s,tx=-si,ty=c;ctx.moveTo(x,y);ctx.lineTo(x+(nx-tx)*len*u/Math.SQRT2,y+(ny-ty)*len*u/Math.SQRT2)}},{w:1,color:aux})},
    // 矢量：从 (x,y) 画到 (x+dx,y+dy)，细杆 + 窄实心箭头；label 用斜体写在箭头外侧，
    // 与别的矢量共线时用 off=[dx,dy]（单位 u，相对箭头尖）把标注挪到旁边
    arrow(x,y,dx,dy,color,label,{w=2,head=12,size=19,off=null}={}){const L=Math.hypot(dx,dy);if(L<2*u)return;
      const ux=dx/L,uy=dy/L,h=Math.min(head*u,L*.6),hw=h*.34,tx=x+dx,ty=y+dy;
      F.line(x,y,tx-ux*h*.7,ty-uy*h*.7,{w,color});
      path(()=>{ctx.moveTo(tx,ty);ctx.lineTo(tx-ux*h-uy*hw,ty-uy*h+ux*hw);ctx.lineTo(tx-ux*h+uy*hw,ty-uy*h-ux*hw);ctx.closePath()},{w:0,fill:color});
      if(label)F.label(label,off?tx+off[0]*u:tx+ux*14*u,off?ty+off[1]*u:ty+uy*14*u,{color,size})},
    // 斜体衬线字母（物理量、点名）
    label(t,x,y,{color=ink,size=19,align='center',base='middle',italic=true}={}){text(t,x,y,`${italic?'italic ':''}${size*ut}px ${SERIF}`,color,align,base)},
    // 中文小注
    zh(t,x,y,{color=aux,size=14,align='center',base='middle'}={}){text(t,x,y,`${size*ut}px ${SANS}`,color,align,base)},
    dot(x,y,r=2.6,color=ink){F.circle(x,y,r*u,{w:0,fill:color})},
    // 带名字的点：实心小点 + 斜体字母（dx、dy 为字母相对点的偏移，单位 u）
    point(x,y,name,dx=-13,dy=13){F.dot(x,y);if(name)F.label(name,x+dx*u,y+dy*u)},
    // 小球：空心圆，球心另用 F.dot 标出（矢量画完后再点，表示力作用在重心）
    ball(x,y,r){F.circle(x,y,r,{w:1.6,fill:paper})},
    // 尺寸标注：两端带箭头的细线，文字写在中点外侧 off（单位 u）
    dim(x1,y1,x2,y2,t,{off=14,color=ink}={}){const L=Math.hypot(x2-x1,y2-y1);if(L<4*u)return;const ux=(x2-x1)/L,uy=(y2-y1)/L,h=Math.min(8*u,L/3),hw=h*.38;
      F.line(x1,y1,x2,y2,{w:1,color});
      for(const[px,py,sx]of[[x1,y1,1],[x2,y2,-1]])path(()=>{ctx.moveTo(px,py);ctx.lineTo(px+sx*ux*h-uy*hw,py+sx*uy*h+ux*hw);ctx.lineTo(px+sx*ux*h+uy*hw,py+sx*uy*h-ux*hw);ctx.closePath()},{w:0,fill:color});
      if(t)F.label(t,(x1+x2)/2-uy*off*u,(y1+y2)/2+ux*off*u,{color})},
  };
  return F;
};

/* ================= SIM 模块：每个母题替换这一段 =================
   约定接口：
   SIM.legend            [{label, color(CSS 变量名)}]
   SIM.init(P)           → 状态 S（含 S.done、S.status={text,cls}）
   SIM.step(S,P,dt)      推进 dt 秒（引擎保证 dt ≤ 0.5 ms）
   SIM.readouts(S,P)     → [[标签, 带单位的值]]
   SIM.draw(ctx,S,P,W,H,tok)  tok(name) 取主题色
   SIM.verdict(P)        → 理论预判 HTML
*/
const SIM=(()=>{
  /* OPT-LGT-01 杨氏双缝干涉 / 单缝衍射（对照）
     屏上光强：惠更斯原理数值叠加，不套 cos² 公式。每条缝等分成 40 个子波源，按到屏上各点的精确距离 r
     叠加复振幅 Σ w·e^{i2πr/λ}/√(λr)（缝是长条，子波源是线光源，振幅随 1/√r 衰减；屏上 r 只变化约 10⁻⁴，
     换成 1/r 图样不变），再取模的平方。相位用 r − L = (x − y)²/(r + L) 计算，保留精度。
     条纹位置、Δx 都从数值结果里找暗纹（局部极小 + 黄金分割细化）读出；Δx = Lλ/d 只用于理论预判和选显示档位。
     时间：光强分布本身与时间无关，step 只推进「打开光源 → 光波从缝传到光屏 → 屏上条纹由暗到亮（曝光累积）」
     的演示时间 τ（引擎步长 ≤ 0.5 ms）；动画按示意图放慢，读数里给出真实时间 L/c。 */
  const C=3.0e8,HP=6.63e-34,QE=1.6e-19,NSUB=40,KEXP=2,TEXP=1.5,VW=130;   // VW：示意图里波面推进的速度（u/s）
  const DATA=JSON.parse(document.getElementById('data').textContent);
  const RANGES=[2,5,10,20,50],ORDER={double:[10,5,20,2,50],single:[20,10,50,5,2]};   // 显示档位 ±R（mm）及选档优先顺序
  const LAMS=[];for(let l=380;l<=760;l+=10)LAMS.push(l);                              // 白光：每 10 nm 一个波长
  const fmt=(x,d=2)=>{if(!isFinite(x))return '—';return(Math.abs(x)<.5*Math.pow(10,-d)?0:x).toFixed(d).replace('-','−')};
  const sup=n=>String(n).split('').map(c=>c==='-'?'⁻':'⁰¹²³⁴⁵⁶⁷⁸⁹'[+c]).join('');
  const sci=(x,d=2)=>{if(!isFinite(x)||x===0)return fmt(x,d);let e=Math.floor(Math.log10(Math.abs(x))),m=x/Math.pow(10,e);
    if(Math.abs(+m.toFixed(d))>=10){e++;m/=10}return `${fmt(m,d)}×10${sup(e)}`};
  // 波长 → 颜色（常用分段近似，紫端红分量减为 0.6 倍，避免 380 nm 偏品红：380–440 紫、440–490 蓝、490–570 绿、570–590 黄、590–620 橙、620–760 红，连续过渡）；dim 时两端按人眼亮度减弱
  function hue(nm,dim=true){let r=0,g=0,b=0;
    if(nm<440){r=.6*(440-nm)/60;b=1}else if(nm<490){g=(nm-440)/50;b=1}else if(nm<510){g=1;b=(510-nm)/20}
    else if(nm<580){r=(nm-510)/70;g=1}else if(nm<645){r=1;g=(645-nm)/65}else r=1;
    const f=!dim?1:nm<420?.3+.7*(nm-380)/40:nm>700?.3+.7*(780-nm)/80:1;return[r*f,g*f,b*f]}
  const g8=v=>Math.round(255*Math.pow(Math.min(1,Math.max(0,v)),.8));
  const css=c=>`rgb(${g8(c[0])},${g8(c[1])},${g8(c[2])})`;

  /* ---------- 物理：子波源叠加 ---------- */
  // 有效几何（SI 单位）。双缝时缝宽自动限制 a ≤ d/2
  function geo(P){const mode=P.mode==='single'?'single':'double',dm=+P.d,am=+P.a,lim=mode==='double'&&am>dm/2+1e-9;
    return{mode,white:P.src==='white',lam:P.lam*1e-9,d:dm*1e-3,a:(lim?dm/2:am)*1e-3,lim,L:+P.L,pol:mode==='double'&&P.pol==='yes'}}
  // 子波源：每条缝等分成 NSUB 段，取各段中点（y 向上为正，S₁ 在上）
  function srcs(mode,d,a){const cs=mode==='double'?[d/2,-d/2]:[0],ys=new Float64Array(cs.length*NSUB);
    cs.forEach((c,s)=>{for(let j=0;j<NSUB;j++)ys[s*NSUB+j]=c+a*((j+.5)/NSUB-.5)});return{ys,ns:cs.length,w:a/NSUB}}
  // 屏上 x 处两条缝各自的复振幅 [re₁, im₁, re₂, im₂]（单缝时后两项为 0）
  function amp(sr,L,lam,x){const k=2*Math.PI/lam,o=[0,0,0,0];
    for(let s=0;s<sr.ns;s++){let re=0,im=0;
      for(let j=0;j<NSUB;j++){const dx=x-sr.ys[s*NSUB+j],r=Math.sqrt(L*L+dx*dx),A=sr.w/Math.sqrt(lam*r),ph=k*dx*dx/(r+L);re+=A*Math.cos(ph);im+=A*Math.sin(ph)}
      o[2*s]=re;o[2*s+1]=im}
    return o}
  const Iof=o=>(o[0]+o[2])**2+(o[1]+o[3])**2;
  const Iat=(sr,L,lam,x)=>Iof(amp(sr,L,lam,x));
  // 精确光程差 δ = r₂ − r₁ = 2xd/(r₁ + r₂)（S₁ 在 +d/2，S₂ 在 −d/2）
  const delta=(d,L,x)=>2*x*d/(Math.sqrt(L*L+(x-d/2)**2)+Math.sqrt(L*L+(x+d/2)**2));
  // 由 δ = mλ 反求屏上位置（双曲线与屏的交点，精确）
  const xOfM=(d,L,lam,m)=>{const A=m*lam/2,B2=d*d/4-A*A;return B2>0?A*Math.sqrt(1+L*L/B2):Math.sign(m)*Infinity};
  function gold(f,a,b){const q=(Math.sqrt(5)-1)/2;let c=b-q*(b-a),d=a+q*(b-a),fc=f(c),fd=f(d);
    for(let i=0;i<50;i++){if(fc<fd){b=d;d=c;fd=fc;c=b-q*(b-a);fc=f(c)}else{a=c;c=d;fc=fd;d=a+q*(b-a);fd=f(d)}}return(a+b)/2}
  // [−X, X] 上光强的局部极小（暗纹）：先等距采样找极小，再按离中心由近到远细化 nRef 个
  function minima(sr,L,lam,X,nS,nRef){const h=2*X/(nS-1),f=x=>Iat(sr,L,lam,x),cand=[];let p2=f(-X),p1=f(-X+h);
    for(let i=2;i<nS;i++){const x=-X+i*h,c=f(x);if(p1<=p2&&p1<c)cand.push(x-h);p2=p1;p1=c}
    cand.sort((a,b)=>Math.abs(a)-Math.abs(b));
    return cand.slice(0,nRef).map(x=>gold(f,x-h,x+h)).sort((a,b)=>a-b)}
  // 双缝：由暗纹量 Δx。只取中央包络内间距一致的暗纹（缺级处包络零点会多出一个极小，用间距判别剔除），
  // 可见范围内每侧有 ≥ 2 条时只用可见的，Δx = (第 k 条上暗纹 − 第 k 条下暗纹)/(2k − 1)
  function measDouble(sr,L,lam,d,R){const unit=L*lam/d;let X=Math.max(R*1e-3,3*unit),pos=[],neg=[];
    for(let it=0;it<5;it++){const ms=minima(sr,L,lam,X,Math.min(8000,Math.max(400,Math.ceil(2*X/unit*12))),28);
      pos=ms.filter(x=>x>0);neg=ms.filter(x=>x<0).reverse();if(pos.length>=2&&neg.length>=2)break;X*=2}
    if(!pos.length||!neg.length)return null;
    const s0=pos[0]-neg[0],keep=a=>{const o=[a[0]];for(let i=1;i<a.length;i++){const s=Math.abs(a[i]-a[i-1]);if(s<.7*s0||s>1.3*s0)break;o.push(a[i])}return o};
    const p=keep(pos),n=keep(neg);let k=Math.min(p.length,n.length);
    const kv=Math.min(p.filter(x=>x<=R*1e-3).length,n.filter(x=>x>=-R*1e-3).length);if(kv>=2)k=Math.min(k,kv);
    return{dx:(p[k-1]-n[k-1])/(2*k-1),x1:p[0],xm1:n[0],pos:p,neg:n,k}}
  // 单缝：中央两侧第 1 条暗纹，及第 2 条暗纹（两侧亮纹宽）
  function measSingle(sr,L,lam,a,R){const unit=L*lam/a;let X=Math.max(R*1e-3,2.5*unit),pos=[],neg=[];
    for(let it=0;it<5;it++){const ms=minima(sr,L,lam,X,Math.min(8000,Math.max(400,Math.ceil(2*X/unit*24))),8);
      pos=ms.filter(x=>x>0);neg=ms.filter(x=>x<0).reverse();if(pos.length>=2&&neg.length>=1)break;X*=2}
    if(!pos.length||!neg.length)return null;
    return{w:pos[0]-neg[0],x1:pos[0],xm1:neg[0],side:pos.length>1?pos[1]-pos[0]:NaN}}
  // 亮度参照（底片曝光用）：双缝取母题装置，单缝取 a = 0.10 mm（λ = 600 nm、L = 1 m），都取 O 点光强
  const REF={double:Iat(srcs('double',3e-4,5e-5),1,600e-9,0),single:Iat(srcs('single',0,1e-4),1,600e-9,0)};

  /* ---------- 屏上图样（按参数与档位缓存，只在 L、λ、d、a、档位变化时重算） ---------- */
  const PC={key:'',val:null};
  function pattern(g,R,show){
    const key=JSON.stringify([g.mode,g.white,g.lam,g.d,g.a,g.L,R,show]);if(PC.key===key)return PC.val;
    const lam6=g.white?600e-9:g.lam,sr=srcs(g.mode,g.d,g.a),L=g.L,X=R*1e-3,unit=g.mode==='double'?L*lam6/g.d:L*lam6/g.a;
    let n=Math.min(g.white?601:2001,Math.max(601,Math.ceil(2*X/unit*16)));if(n%2===0)n++;
    const xs=new Float64Array(n),mOrd=new Float64Array(n),In=new Float64Array(n);
    for(let i=0;i<n;i++)xs[i]=-X+2*X*i/(n-1);xs[(n-1)/2]=0;
    for(let i=0;i<n;i++)mOrd[i]=g.mode==='double'?delta(g.d,L,xs[i])/lam6:xs[i]/unit;
    const D={xs,n,sr,mOrd,In};
    if(!g.white){
      const I0=Iat(sr,L,g.lam,0);D.I0=I0;if(g.mode==='double')D.env=new Float64Array(n);
      for(let i=0;i<n;i++){const o=amp(sr,L,g.lam,xs[i]);In[i]=Iof(o)/I0;if(D.env)D.env[i]=(Math.hypot(o[0],o[1])+Math.hypot(o[2],o[3]))**2/I0}
      D.vs=KEXP*I0/REF[g.mode];D.hue=hue(g.lam*1e9);
      D.meas=g.mode==='double'?measDouble(sr,L,g.lam,g.d,R):measSingle(sr,L,g.lam,g.a,R);
      if(show==='rv'){const l2=400e-9,c0=Iat(sr,L,l2,0);D.In2=new Float64Array(n);for(let i=0;i<n;i++)D.In2[i]=Iat(sr,L,l2,xs[i])/c0;
        D.vs2=KEXP*c0/REF.double;D.hue2=hue(400);D.meas2=measDouble(sr,L,l2,g.d,R)}
      if(show==='cmp'){const s2=srcs('double',3e-4,g.a),c0=Iat(s2,L,g.lam,0);D.Icmp=new Float64Array(n);for(let i=0;i<n;i++)D.Icmp[i]=Iat(s2,L,g.lam,xs[i])/c0}
    }else{
      // 白光：各波长分别叠加，按波长颜色加权求和；三个通道各自以 O 点为 1（O 点为白色）
      const nl=LAMS.length,HU=LAMS.map(l=>hue(l)),acc=new Float64Array(nl*4);
      const comp=x=>{acc.fill(0);
        for(let s=0;s<sr.ns;s++)for(let j=0;j<NSUB;j++){const dx=x-sr.ys[s*NSUB+j],r=Math.sqrt(L*L+dx*dx),A0=sr.w/Math.sqrt(r),rho=dx*dx/(r+L);
          for(let q=0;q<nl;q++){const lam=LAMS[q]*1e-9,A=A0/Math.sqrt(lam),ph=2*Math.PI*rho/lam;acc[4*q+2*s]+=A*Math.cos(ph);acc[4*q+2*s+1]+=A*Math.sin(ph)}}
        let tot=0,cr=0,cg=0,cb=0;
        for(let q=0;q<nl;q++){const I=(acc[4*q]+acc[4*q+2])**2+(acc[4*q+1]+acc[4*q+3])**2;tot+=I;cr+=I*HU[q][0];cg+=I*HU[q][1];cb+=I*HU[q][2]}
        return[tot,cr,cg,cb]};
      const c0=comp(0);D.I0=c0[0];D.comp=comp;D.Ch=[new Float64Array(n),new Float64Array(n),new Float64Array(n)];
      for(let i=0;i<n;i++){const c=comp(xs[i]);In[i]=c[0]/c0[0];for(let ch=0;ch<3;ch++)D.Ch[ch][i]=c[ch+1]/c0[ch+1]}
      D.vs=KEXP*(c0[0]/nl)/REF[g.mode];
      D.meas=g.mode==='double'?{v:measDouble(sr,L,400e-9,g.d,R),r:measDouble(sr,L,700e-9,g.d,R)}:{v:measSingle(sr,L,400e-9,g.a,R),r:measSingle(sr,L,700e-9,g.a,R)};
    }
    let nb=0;for(let i=1;i<n-1;i++)if(In[i]>In[i-1]&&In[i]>=In[i+1]&&In[i]>.01)nb++;D.nBright=nb;   // 可见范围内的明纹（局部极大，I > 1% I₀）
    PC.key=key;PC.val=D;return D}

  /* ---------- 示意图（单位 u，与画布大小无关）：纵向 d 放大、横向 L 压缩 ---------- */
  // 双缝：示意波长 λ示 = d示·sin θ示₁，波峰与波峰的交点正好落在通往各级明纹的加强线（双曲线 r₂ − r₁ = kλ示）上
  function schem(g){const lam6=g.white?600e-9:g.lam,Ls=330*Math.pow(g.L,.3),xds=170,o={xds,Ls,xscr:xds+Ls};
    if(g.mode==='double'){const dx=g.L*lam6/g.d*1e3;o.ds=Math.min(135,Math.max(76,100*Math.pow(g.d/3e-4,.25)));
      o.ls=Math.max(11,Math.min(.21,Math.max(.07,.14*Math.sqrt(dx/2)))*o.ds)}
    else{o.x1=g.L*lam6/g.a*1e3;o.as=10+30*(g.a*1e3-.02)/.18;o.ls=14*Math.sqrt(lam6/600e-9);o.y1=Math.min(112,Math.max(34,70*Math.sqrt(o.x1/6)))}

  // 示意屏上与 δ/λ = m（双缝）或位置 xmm（单缝）对应的高度，向上为正（u）
  function ySch(sc,m,xmm){if(sc.ds){const A=m*sc.ls/2,B2=sc.ds*sc.ds/4-A*A;return B2<=0?Math.sign(m)*1e9:A*Math.sqrt(1+sc.Ls*sc.Ls/B2)}return xmm/sc.x1*sc.y1}

  /* ---------- 显示档位：拖动参数时不换档；条纹太密（每个间隔 < 6 CSS px）或太疏（< 2 个间隔）才换；加载预设、变式按参数选档 ---------- */
  const unitMM=g=>{const l=g.white?600e-9:g.lam;return(g.mode==='double'?g.L*l/g.d:g.L*l/g.a)*1e3};
  const cssW=()=>{const c=document.getElementById('cv');return(c&&c.clientWidth||640)*592/720};
  const pxOf=(g,R)=>unitMM(g)*cssW()/(2*R),cntOf=(g,R)=>2*R/unitMM(g),valid=(g,R)=>pxOf(g,R)>=6&&cntOf(g,R)>=2;
  function pick(g,xP){const lo=g.mode==='double'?4:3,ord=ORDER[g.mode];

    for(const R of ord)if(valid(g,R))return R;
    return pxOf(g,2)<6?2:50}
  function adjust(g,R){const i0=RANGES.indexOf(R);
    if(pxOf(g,R)<6){for(let i=i0-1;i>=0;i--)if(valid(g,RANGES[i]))return RANGES[i];return 2}
    if(cntOf(g,R)<2){for(let i=i0+1;i<RANGES.length;i++)if(valid(g,RANGES[i]))return RANGES[i];return 50}
    return R}
  let EP=null,Rcur=10,lastSnap='',lastMode='',fresh=true,swFlag=false,GEO=null;   // EP：引擎自己的参数对象
  function rangeLive(P,g){const snap=JSON.stringify([g.mode,g.white,+P.lam,+P.d,+P.L,+P.a]);
    if(fresh||g.mode!==lastMode){Rcur=pick(g,+P.xP);swFlag=false}
    else if(snap!==lastSnap){const r=adjust(g,Rcur);swFlag=r!==Rcur;Rcur=r}

  // a ≤ d/2、|x_P| ≤ 档位：先改参数对象，再让引擎重新同步滑块与题干；x_P 滑块的范围随档位截取
  function fixLive(P,g,R){const Rx=Math.min(20,R),inX=document.getElementById('in-xP'),fx=[];
    if(inX){inX.min=-Rx;inX.max=Rx;inX.step=R<=2?.01:R<=5?.02:.05}
    if(g.lim){P.a=+(P.d/2).toFixed(4);fx.push(['a',P.a])}
    if(Math.abs(P.xP)>Rx+1e-9){P.xP=Math.sign(P.xP)*Rx;fx.push(['xP',P.xP])}
    if(fx.length)queueMicrotask(()=>fx.forEach(([k,v])=>{const n=document.getElementById('num-'+k);if(n){n.value=String(v);n.dispatchEvent(new Event('change'))}}))}
  // 预设里的对照显示（红紫两条图样 / 叠画双缝曲线）：参数与该预设完全一致时才显示
  function showOf(P){const s=P.show;if(!s)return '';const pr=DATA.presets.find(p=>p.load.show===s);if(!pr)return '';
    return Object.entries(pr.load).every(([k,v])=>typeof v==='number'?Math.abs(+P[k]-v)<1e-9:P[k]===v)?s:''}
  // 选项参数的 when（引擎只处理数值参数）与页脚
  function liveDom(P){
    DATA.problem.params.forEach(p=>{if(p.type!=='choice'||!p.when)return;const b=document.getElementById(`opt-${p.key}-${p.options[0].value}`);
      if(b)b.parentElement.hidden=!Object.entries(p.when).every(([k,v])=>[].concat(v).includes(P[k]))});
    const f=document.getElementById('foot');if(f&&!f.dataset.c){f.dataset.c='1';f.textContent=`格物 Gewu · ${DATA.id} · ${DATA.version} · c 取 3.0×10⁸ m/s`}}

  /* ---------- P 点 ---------- */
  function pInfo(S,P){const g=S.g,D=S.D,Rx=Math.min(20,S.R),xmm=Math.max(-Rx,Math.min(Rx,+P.xP)),x=xmm*1e-3,lam6=g.white?600e-9:g.lam;
    let I=g.white?D.comp(x)[0]/D.I0:Iat(D.sr,g.L,g.lam,x)/D.I0;if(g.pol)I*=.5;
    const dl=g.mode==='double'?delta(g.d,g.L,x):NaN,m=dl/lam6,y=ySch(S.sc,m,xmm);
    return{xmm,x,I,dl,m,y,lit:S.preview||S.done||S.tau>=tArr(S.sc,S.T,Math.max(-260,Math.min(260,y)))}}
  function judge(m){const k=Math.round(m),f=m-k,side=m>0?'O 上方':'O 下方';
    if(Math.abs(f)<.03)return k===0?{t:'中央明纹（零级）',kind:'b'}:{t:`第 ${Math.abs(k)} 级明纹（${side}）`,kind:'b'};
    if(Math.abs(Math.abs(f)-.5)<.03)return{t:`暗纹（${side}第 ${Math.floor(Math.abs(m))+1} 条）`,kind:'d'};

  function phase(S){const T=S.T,g=S.g,dbl=g.mode==='double';
    if(S.tau<T.ts)return{text:g.white?(dbl?'白光经单缝 S 照到双缝':'白光射向单缝'):(dbl?'激光射向双缝':'激光射向单缝'),cls:''};
    if(S.tau<T.tc)return{text:`${dbl?'光波从 S₁、S₂ 传向光屏':'光波从单缝传向光屏'}：t = ${fmt((S.tau-T.ts)/(T.tc-T.ts)*g.L/C*1e9,2)} ns`,cls:''};
    return{text:'光到达光屏，条纹由暗到亮逐渐显现',cls:''}}
  function final(S){const g=S.g,D=S.D,m=D.meas;
    if(g.white)return{text:g.mode==='double'?'白光条纹：中央白色，两侧彩色':'白光单缝衍射：中央白色，边缘彩色',cls:'ok'};
    if(g.mode==='single')return{text:m?`中央亮纹宽 ${fmt(m.w*1e3,2)} mm（数值实测）`:'图样已稳定',cls:'ok'};
    if(S.show==='rv')return{text:`Δx：红光 ${m?fmt(m.dx*1e3,3):'—'} mm，紫光 ${D.meas2?fmt(D.meas2.dx*1e3,3):'—'} mm`,cls:'ok'};
    return{text:m?`条纹稳定：Δx = ${fmt(m.dx*1e3,3)} mm（数值实测）`:'图样已稳定',cls:'ok'}}

  /* ---------- 页面接线（引擎之外的补充，只作用于引擎自己的参数对象 EP） ---------- */
  // ① 预设按「显示」分组：引擎只列出与所有选项都一致的预设，这里把同一显示下的其余预设补齐（点击时由引擎照常加载）
  const pbox=document.getElementById('presets');
  if(pbox&&typeof MutationObserver==='function')new MutationObserver(()=>{if(!EP)return;
    const want=DATA.presets.map((p,i)=>i).filter(i=>(DATA.presets[i].load.mode||'double')===EP.mode),have=[...pbox.querySelectorAll('[data-preset]')];
    if(have.length===want.length&&have.every((b,j)=>+b.dataset.preset===want[j]))return;
    const old=new Map(have.map(b=>[+b.dataset.preset,b]));
    pbox.replaceChildren(...want.map(i=>{if(old.has(i))return old.get(i);const p=DATA.presets[i],b=document.createElement('button');
      b.dataset.preset=i;b.setAttribute('aria-pressed','false');b.title=p.note||'';b.textContent=p.label;return b}))}).observe(pbox,{childList:true});
  // ② 点预设或变式的「加载到动画」时，按加载的参数重新选显示档位
  document.addEventListener('click',e=>{if(e.target&&e.target.closest&&e.target.closest('[data-preset],[data-load]'))fresh=true},true);
  // ③ 在画布上拖动 P（示意图的光屏上，或光强图、条纹带上），同步改 x_P
  const cvs=document.getElementById('cv');let drag=null;
  const cxy=ev=>{const r=cvs.getBoundingClientRect(),k=cvs.width/r.width;return[(ev.clientX-r.left)*k,(ev.clientY-r.top)*k]};
  function hit(x,y,touch){const G=GEO;if(!G)return null;const tol=(touch?22:12)*G.dp;
    if(G.pS&&Math.hypot(x-G.pS[0],y-G.pS[1])<tol*1.3)return 'scr';
    if(!touch&&Math.abs(x-G.xscr)<tol&&Math.abs(y-G.y0)<G.Hs)return 'scr';
    if(y>=G.gTop&&y<=G.sB&&x>=G.gx0-tol&&x<=G.gx1+tol&&(!touch||Math.abs(x-G.pG)<tol*1.3))return 'graph';
    return null}
  function setXP(kind,x,y){const G=GEO;if(!G)return;let v=kind==='graph'?(x-G.xc)/G.sx:G.y2x(y);if(!isFinite(v))return;
    const Rx=Math.min(20,G.R);v=Math.max(-Rx,Math.min(Rx,Math.round(v*100)/100));
    const n=document.getElementById('num-xP');if(!n||Math.abs(+n.value-v)<1e-9)return;n.value=String(v);n.dispatchEvent(new Event('change'))}
  if(cvs){
    cvs.addEventListener('mousedown',e=>{const[x,y]=cxy(e),k=hit(x,y,false);if(k){drag=k;setXP(k,x,y);e.preventDefault()}});
    addEventListener('mousemove',e=>{if(drag){const[x,y]=cxy(e);setXP(drag,x,y)}else if(e.target===cvs){const[x,y]=cxy(e),k=hit(x,y,false);cvs.style.cursor=k==='scr'?'ns-resize':k==='graph'?'ew-resize':''}});
    addEventListener('mouseup',()=>{drag=null});
    cvs.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;const[x,y]=cxy(e.touches[0]),k=hit(x,y,true);if(k){drag=k;e.preventDefault();setXP(k,x,y)}},{passive:false});

  }
  let OFF=null;   // 条纹带：先画到 n×1 的离屏画布，再拉伸到条纹带
  function strip(ctx,n,fill,x,y,w,h){if(!OFF)OFF=document.createElement('canvas');if(OFF.width!==n){OFF.width=n;OFF.height=1}

    oc.putImageData(im,0,0);ctx.save();ctx.imageSmoothingEnabled=true;ctx.drawImage(OFF,0,0,n,1,x,y,w,h);ctx.restore()}

  return{
    legend:[{label:'装置、光强曲线（墨线）',color:'--fig-ink'},{label:'波峰实线 / 波谷虚线、加强线、包络（细线）',color:'--fig-aux'}],
    init(P){
      const live=P===EP;let g=geo(P);
      const R=live?rangeLive(P,g):pick(g,+P.xP);
      if(live){fixLive(P,g,R);g=geo(P)}
      const sc=schem(g),T=timeline(g,sc),show=showOf(P),D=pattern(g,R,show);
      return{g,sc,T,D,R,show,sw:live&&swFlag,tau:0,t:0,preview:true,done:false,status:{text:'稳定图样：点 ▶ 发射 看光波传播',cls:''}};
    },
    step(S,P,dt){
      if(S.done)return;
      if(S.preview){S.preview=false;S.tau=0}
      S.tau+=dt;S.t=S.tau;
      if(S.tau>=S.T.end){S.done=true;S.status=final(S)}else S.status=phase(S);
    },
    readouts(S,P){
      const g=S.g,D=S.D,pi=pInfo(S,P),T=S.T,mm=v=>fmt(v*1e3,3)+' mm',r=[],Lc=g.L/C*1e9;
      if(g.white)r.push(['光源','白光 380–760 nm']);
      else{const ls=S.show==='rv'?[g.lam,400e-9]:[g.lam];
        r.push(['波长 λ',ls.map(l=>fmt(l*1e9,0)).join(' / ')+' nm'],['频率 ν',ls.map(l=>sci(C/l,2)).join(' / ')+' Hz'],['光子能量 E',ls.map(l=>fmt(HP*C/l/QE,2)).join(' / ')+' eV'])}
      if(g.mode==='double'){
        if(g.white){const m=D.meas;
          r.push(['紫光 400 nm Δx 理论 / 实测',`${fmt(g.L*400e-9/g.d*1e3,3)} / ${m.v?fmt(m.v.dx*1e3,3):'—'} mm`],
            ['红光 700 nm Δx 理论 / 实测',`${fmt(g.L*700e-9/g.d*1e3,3)} / ${m.r?fmt(m.r.dx*1e3,3):'—'} mm`],['中央明纹','白色（δ = 0，各色都加强）'])}
        else if(S.show==='rv'){const m=D.meas,m2=D.meas2;
          r.push(['Δx 理论 Lλ/d（红 / 紫）',`${fmt(g.L*g.lam/g.d*1e3,3)} / ${fmt(g.L*400e-9/g.d*1e3,3)} mm`],['Δx 实测（红 / 紫）',`${m?fmt(m.dx*1e3,3):'—'} / ${m2?fmt(m2.dx*1e3,3):'—'} mm`])}
        else{const m=D.meas,th=g.L*g.lam/g.d;

          const w=zw('中央亮纹',13);if(xb+6*u+w<W-6*u)F.zh('中央亮纹',xb+6*u,yd,{align:'left',size:13});else F.zh('中央亮纹',xa-6*u,yd,{align:'right',size:13})}}
      // P：曲线上的点 + 竖直投影线
      const xPp=X(pi.xmm);
      if(xPp>=gx0-1&&xPp<=gx1+1){const yv=Yg(pi.I);F.aux(xPp,gy1,xPp,pi.lit?yv:gy1-8*u,{dash:[3,3]});if(pi.lit)F.dot(xPp,yv,3);
        const rt=xPp>gx1-40*u;F.label('P',xPp+(rt?-10:10)*t,(pi.lit?yv:gy1)-12*t,{size:17})}
      /* ---------- 条纹图样：黑底（深浅色都一样，像试卷里的照片），每列按光强与曝光着色 ---------- */
      const tone=v=>1-Math.exp(-v);
      const rows=two?[[sT,22*u,D.In,D.vs,D.hue,'700 nm'],[sT+28*u,22*u,D.In2,D.vs2,D.hue2,'400 nm']]:[[sT,sh,D.In,D.vs,D.hue,'']];
      for(const[y,h,a,vs,hu,lab]of rows){
        if(g.white)strip(ctx,n,i=>{const e=ex(i)*pol*vs;return[g8(tone(D.Ch[0][i]*e)),g8(tone(D.Ch[1][i]*e)),g8(tone(D.Ch[2][i]*e))]},gx0,y,gx1-gx0,h);
        else strip(ctx,n,i=>{const b=tone(a[i]*vs*pol*ex(i));return[g8(hu[0]*b),g8(hu[1]*b),g8(hu[2]*b)]},gx0,y,gx1-gx0,h);
        F.rect(gx0,y,gx1-gx0,h,{w:1});if(lab)F.label(lab,gx0-5*u,y+h/2,{italic:false,size:13,align:'right'})}
      // 供拖动 P 用的几何（只记引擎自己的状态）
      if(P===EP)GEO={dp,R,xc,sx,gx0,gx1,gTop:gyT-10*u,sB,xscr,y0,Hs,pS:onSch?[xscr,pY]:null,pG:xPp,
        y2x:py=>{const Y=(y0-py)/u;if(!dbl)return Y/sc.y1*sc.x1;const m=(Math.hypot(sc.Ls,Y+sc.ds/2)-Math.hypot(sc.Ls,Y-sc.ds/2))/sc.ls;return xOfM(g.d,g.L,g.white?600e-9:g.lam,m)*1e3}};
    },
    verdict(P){
      if(!EP)EP=P;if(P===EP)liveDom(P);
      const g=geo(P),L=g.L,mm=(v,d=2)=>fmt(v*1e3,d)+' mm',sh=showOf(P);let h='';
      if(g.mode==='double'){
        if(g.white){const dv=L*400e-9/g.d,dr=L*700e-9/g.d;
          h+=`白光：各色 Δx = Lλ/d 不同，紫光（400 nm）<b>${mm(dv,3)}</b>，红光（700 nm）<b>${mm(dr,3)}</b>，波长越长条纹越宽（C6）。<br>`;
          h+=`只有 δ = 0 的中央明纹各色都加强，重合为<b>白色</b>；其余各级内侧偏紫、外侧偏红。红光第 2 级在 ${mm(2*dr)}，${2*dr>3*dv?'已超过':'接近'}紫光第 3 级 ${mm(3*dv)}，所以从第 2 级起颜色互相重叠。这是「单色光」条件的边界。`;
          if(g.pol)h+='<br>加偏振片：光强 ×½，条纹位置不变（C6）。';
        }else{const dx=L*g.lam/g.d,xm=+P.xP*1e-3,dA=g.d*xm/L,m=dA/g.lam,j=judge(m);
          h+=`Δx = Lλ/d = <b>${mm(dx,3)}</b>（C4）；第 1 条暗纹 x = Lλ/(2d) = <b>${mm(dx/2,3)}</b>（C3）。`;
          if(sh==='rv')h+=`紫光 400 nm：Δx = <b>${mm(L*400e-9/g.d,3)}</b>，红宽紫窄（C6）。`;
          h+=`<br>P 点：δ ≈ d·x_P/L = <b>${fmt(dA*1e9,1)} nm = ${fmt(m,2)}λ</b>（C1），${j.kind==='b'?'是波长的整数倍':j.kind==='d'?'是半波长的奇数倍':'既不是波长的整数倍，也不是半波长的奇数倍'} → <b>${j.t}</b>（C2）。`;
          h+=`<br>缝宽 a = ${fmt(g.a*1e3,3)} mm${Math.abs(+P.a-P.d/2)<1e-9||g.lim?'（已到上限 a = d/2）':''}：每条缝的单缝衍射使明纹亮度由中间向两侧减弱，包络第 1 个零点在 Lλ/a = ${mm(L*g.lam/g.a,1)}（C7），不改变暗纹位置和间距。`;
          const Fn=g.a*g.a/(g.lam*L);if(Fn>.1)h+=`<br><b>注意</b>：a²/(λL) = ${fmt(Fn,2)}，缝太宽、光屏太近，每条缝自身不满足远场条件，它的衍射会使条纹位置偏离 Lλ/d（超出适用边界），以数值读数为准。`;
          if(g.pol)h+='<br>加偏振片：光强 ×½（按自然光计；激光本身是偏振光时，减弱多少取决于透振方向），条纹位置和 Δx 都不变（C6）。';
          h+=`<br>ν = c/λ = ${sci(C/g.lam,2)} Hz，E = hc/λ = ${fmt(HP*C/g.lam/QE,2)} eV（C6）。`;
        }
      }else{const lam=g.white?600e-9:g.lam,x1=L*lam/g.a,Fn=g.a*g.a/(lam*L);
        if(g.white)h+=`白光单缝：各色中央亮纹宽 2Lλ/a 不同（紫 400 nm：<b>${mm(2*L*4e-7/g.a)}</b>，红 700 nm：<b>${mm(2*L*7e-7/g.a)}</b>），中央白色、边缘带彩色（C7）。<br>`;
        else h+=`中央亮纹宽 ≈ 2Lλ/a = <b>${mm(2*x1)}</b>，两侧亮纹宽 ≈ Lλ/a = <b>${mm(x1)}</b>，第 1 条暗纹 x₁ ≈ Lλ/a = <b>${mm(x1)}</b>（C7）。<br>`;
        h+=`a²/(λL) = ${fmt(Fn,3)}，${Fn<.1?'远小于 1，远场近似成立，上式可用':'不够小，不完全满足远场条件，上式只作估计（以数值读数为准）'}。缝越窄，中央亮纹越宽、整体越暗；缝越宽，越接近光沿直线传播的几何投影。`;
        if(!g.white){const r=Math.abs(+P.xP*1e-3/x1);h+=`<br>P 点：|x_P|/x₁ = ${fmt(r,2)}，${r<.97?'在中央亮纹内':r<=1.03?'约在第 1 条暗纹处':'在中央亮纹之外'}。`}
        if(sh==='cmp')h+=`<br>对照：同一 λ、L、a 的双缝（d = 0.30 mm）Δx = Lλ/d = ${mm(L*lam/3e-4)}，等间距；它的各级明纹都落在单缝曲线之下（单缝衍射包络）。`;
      }
      return h;
    }
  };
})();

/* ================= 通用渲染引擎（所有母题共用，不改） ================= */
(()=>{
const D=JSON.parse(document.getElementById('data').textContent);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const root=document.documentElement;
const tok=n=>getComputedStyle(root).getPropertyValue(n).trim();
const PS=D.problem.params;
const P={};PS.forEach(p=>P[p.key]=p.def);
const unitSep=u=>/^[°′″]/.test(u)?'':' ';   // 角度单位紧贴数字：90°
const fmtP=p=>p.type==='choice'?p.options.find(o=>o.value===P[p.key]).label:(+P[p.key]).toFixed(p.dec??2)+(p.unit?unitSep(p.unit)+p.unit:'');

/* 静态内容 */
document.title=`格物 ${D.id} ${D.name.replace(/（.*）/,'')}`;
$('hName').textContent=D.name;
$('hSub').textContent=`${D.module} · ${D.chapter}　关联：${D.related.join('、')}`;
$('hTable').innerHTML=`<tr><th>编号</th><th>考查频率</th><th>难度</th><th>版本</th></tr>
<tr><td class="code">${esc(D.id)}</td><td>${esc(D.freq)}</td><td title="${D.difficulty} / 5">${'●'.repeat(D.difficulty)}${'○'.repeat(5-D.difficulty)}</td><td>${esc(D.version)}</td></tr>`;
$('foot').textContent=`格物 Gewu · ${D.id} · ${D.version} · ${D.footer??'g 取 10 m/s²'}`;   // 数据里可用 footer 改写页脚常量
$('tags').innerHTML=D.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('');
$('stemNote').textContent=D.problem.note||'';
$('bCond').innerHTML=D.boundary.conditions.map(c=>`<li><span>${esc(c)}</span></li>`).join('');
$('bBack').innerHTML=D.boundary.fallback.map(c=>`<li><span>${esc(c)}</span></li>`).join('');
$('legend').innerHTML=SIM.legend.map(l=>`<span><i style="background:var(${l.color})"></i>${esc(l.label)}</span>`).join('');
$('concl').innerHTML=D.conclusions.map(c=>`<details><summary><span class="badge">${c.id}</span><span class="t">${esc(c.title)}</span><span class="f">${esc(c.formula)}</span><span class="chev" aria-hidden="true"></span></summary><div class="deriv">${esc(c.derivation)}</div></details>`).join('');
const qCard=(q,isVar)=>`<article class="q">
  <div class="head"><span class="badge">${q.id}</span><h3>${esc(q.title)}</h3>${isVar?q.cs.map(c=>`<span class="chip">${c}</span>`).join(''):`<span class="chip">${q.anim?'计划做动画':'不做动画'}</span>`}</div>
  <p>${esc(q.stem)}</p>
  ${isVar?'':`<p class="map">映射：<b>${esc(q.map)}</b></p>`}
  <details><summary><span class="chev" aria-hidden="true"></span>答案与解析</summary><div class="ans"><p class="a">答案：${esc(q.answer)}</p><p>${esc(q.analysis)}</p></div></details>
  <div class="foot"><span class="src">${esc(q.source)}</span>${isVar?`<button data-load="${q.id}">加载到动画 ↑</button>`:''}</div>
</article>`;
$('variants').innerHTML=D.variants.map(v=>qCard(v,true)).join('');
$('reskins').innerHTML=D.reskins.map(r=>qCard(r,false)).join('');
$('sources').innerHTML=D.sources.map(s=>`<li><b>${esc(s.src)}</b><span>${esc(s.desc)}</span></li>`).join('');

/* 参数控件 */
const box=$('params');
PS.forEach(p=>{
  if(p.type==='choice'){
    const d=document.createElement('div');d.className='seg';d.id=`f-${p.key}`;d.setAttribute('role','group');d.setAttribute('aria-label',p.label);
    d.innerHTML=p.options.map(o=>`<button id="opt-${p.key}-${o.value}" data-k="${p.key}" data-v="${o.value}">${esc(o.label)}${o.hint?`<small>${esc(o.hint)}</small>`:""}</button>`).join('');
    box.appendChild(d);
  }else{
    const d=document.createElement('div');d.className='field';d.id=`f-${p.key}`;
    d.innerHTML=`<label for="num-${p.key}"><span class="s">${esc(p.sym)}</span><span class="note">${esc(p.label)}</span></label><span class="numin"><input type="number" id="num-${p.key}" min="${p.min}" max="${p.max}" step="any" inputmode="decimal" aria-label="${esc(p.label)}"><span class="u">${esc(p.unit||'')}</span></span><input type="range" id="in-${p.key}" min="${p.min}" max="${p.max}" step="${p.step}" value="${p.def}" aria-label="${esc(p.label)} 滑块">`;
    box.appendChild(d);
    d.querySelector('input[type=range]').addEventListener('input',e=>{P[p.key]=+e.target.value;active=-1;sync();reset()});
    const num=d.querySelector('input[type=number]');
    num.addEventListener('change',()=>{let v=parseFloat(num.value);
      if(Number.isFinite(v)){v=Math.min(p.max,Math.max(p.min,v));P[p.key]=v;active=-1;reset()}sync()});
    num.addEventListener('keydown',e=>{if(e.key==='Enter')num.blur()});
  }
});
box.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;P[b.dataset.k]=b.dataset.v;active=-1;sync();reset()});
let active=-1;
const shown=w=>!w||Object.entries(w).every(([k,v])=>[].concat(v).includes(P[k]));
const CH0=PS.find(p=>p.type==='choice');   // 预设只按第一个选项参数（情境 / 模式）分组，其余选项由预设的 load 带过去
const chosen=o=>!CH0||o[CH0.key]===undefined||o[CH0.key]===P[CH0.key];
const numTxt=(p,v)=>String(+(+v).toFixed(Math.max(p.dec??2,4)));
function sync(){
  PS.forEach(p=>{
    if(p.type==='choice'){p.options.forEach(o=>$(`opt-${p.key}-${o.value}`).setAttribute('aria-pressed',P[p.key]===o.value));if(p.when)$(`f-${p.key}`).hidden=!shown(p.when)}
    else{$(`in-${p.key}`).value=P[p.key];const n=$(`num-${p.key}`);if(document.activeElement!==n)n.value=numTxt(p,P[p.key]);$(`f-${p.key}`).hidden=!shown(p.when)}
  });
  const fill=s=>esc(s).replace(/\{(\w+)\}/g,(m,k)=>{
    if(k==='constraint'){const p=PS.find(x=>x.type==='choice');return esc(p.options.find(o=>o.value===P[p.key]).text)}
    const p=PS.find(x=>x.key===k);return p?`<span class="num">${esc(fmtP(p))}</span>`:m});
  const [lead,ask='']=D.problem.stem.split(/问[:：]/);
  $('stem').innerHTML=fill(lead.trim());
  const qs=ask.split(/[①②③④⑤⑥]/).map(s=>s.trim()).filter(Boolean);
  $('asks').innerHTML=qs.map((q,i)=>`<li><b>${i+1}</b><span>${fill(q)}</span></li>`).join('');
  $('asks').hidden=!qs.length;
  $('verdict').innerHTML=SIM.verdict(P);
  const ch=PS.find(p=>p.type==='choice');
  $('presetMode').textContent=ch?`· ${ch.options.find(o=>o.value===P[ch.key]).label}`:'';
  $('presets').innerHTML=D.presets.map((p,i)=>chosen(p.load)?`<button data-preset="${i}" aria-pressed="${i===active}" title="${esc(p.note||'')}">${esc(p.label)}</button>`:'').join('');
  const pn=$('pnote'),ap=D.presets[active];pn.hidden=!(ap&&ap.note);if(ap&&ap.note)pn.innerHTML=`<b>${esc(ap.label)}</b>：${esc(ap.note)}`;
}
function load(o,i=-1){Object.assign(P,o);active=i;sync();reset()}
$('presets').addEventListener('click',e=>{const b=e.target.closest('[data-preset]');if(b)load(D.presets[+b.dataset.preset].load,+b.dataset.preset)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-load]');if(!b)return;
  load(D.variants.find(v=>v.id===b.dataset.load).load);
  show('pane-lab');document.querySelector('.board').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})});

/* 画布与循环 */
const cv=$('cv'),ctx=cv.getContext('2d');let S,running=false,speed=1,lastT=0;
function size(){const r=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);const w=Math.max(200,Math.round(r.width*dpr));if(cv.width!==w){cv.width=w;cv.height=w}}
function render(){size();SIM.draw(ctx,S,P,cv.width,cv.height,tok);
  $('readout').innerHTML=SIM.readouts(S,P).map(([k,v])=>`<div class="ro"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('');
  const st=$('status');st.textContent=S.status.text;st.className='status '+S.status.cls}
function reset(){running=false;S=SIM.init(P);$('play').textContent='▶ 发射';render()}
function loop(t){if(!running)return;const real=Math.min(.05,(t-lastT)/1000);lastT=t;
  const sim=real*speed,n=Math.max(1,Math.ceil(sim/5e-4));for(let i=0;i<n;i++)SIM.step(S,P,sim/n);
  render();if(S.done){running=false;$('play').textContent='▶ 再发射';return}requestAnimationFrame(loop)}
$('play').onclick=()=>{if(running){running=false;$('play').textContent='▶ 继续';return}
  if(S.done)S=SIM.init(P);running=true;$('play').textContent='❚❚ 暂停';lastT=performance.now();requestAnimationFrame(loop)};
$('reset').onclick=reset;
$('slow').onclick=()=>{speed=speed===1?.25:1;$('slow').textContent=speed===1?'慢放 ×0.25':'正常速度'};
new ResizeObserver(render).observe(cv);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);
new MutationObserver(render).observe(root,{attributes:true,attributeFilter:['data-theme']});
/* 选项卡 */
const tabs=[...document.querySelectorAll('[role=tab]')];
function show(id){tabs.forEach(t=>{const on=t.dataset.pane===id;t.setAttribute('aria-selected',on);t.tabIndex=on?0:-1;$(t.dataset.pane).hidden=!on});
  if(id==='pane-lab')requestAnimationFrame(render)}
tabs.forEach((t,i)=>{t.addEventListener('click',()=>show(t.dataset.pane));
  t.addEventListener('keydown',e=>{const d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;if(!d)return;e.preventDefault();
    const n=tabs[(i+d+tabs.length)%tabs.length];n.focus();show(n.dataset.pane)})});
$('nConcl').textContent=D.conclusions.length;$('nVar').textContent=D.variants.length;$('nSkin').textContent=D.reskins.length;$('nSrc').textContent=D.sources.length;
show('pane-lab');
sync();reset();
})();
</script>
