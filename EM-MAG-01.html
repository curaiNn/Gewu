:root{
  --paper:#f2f4f3; --grid:#e4e9e6; --card:#ffffff; --sunk:#f6f8f7;
  --ink:#142030; --muted:#5b6979; --faint:#8a96a3; --line:#d6dedA; --hair:#e7ece9;
  --accent:#2443a6; --accent-soft:#e9eefb; --mark:#f7e9b0;
  --g:#c0502a; --n:#17806a; --v:#2f62b3; --a:#a0661a; --track:#34404f; --fig-ink:#1d232b; --fig-aux:#75808c; --warn:#a85a14; --ok:#18845a;
  --shadow:0 1px 0 rgba(20,32,48,.04),0 10px 28px -18px rgba(20,32,48,.28);
  --f-display:"Noto Serif SC","Songti SC","STSong",serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#10161d; --grid:#18202a; --card:#171f28; --sunk:#131a22;
  --ink:#e4e9ef; --muted:#9aa7b6; --faint:#6f7d8c; --line:#2a3542; --hair:#212b36;
  --accent:#93acff; --accent-soft:#1f2a44; --mark:#4a4020;
  --g:#ef8f6e; --n:#5cc7a0; --v:#8db0ef; --a:#e3ac5c; --track:#c3ccd8; --fig-ink:#dde3ea; --fig-aux:#8794a2; --warn:#f0a35a; --ok:#52d39c;
  --shadow:0 1px 0 rgba(0,0,0,.25),0 12px 30px -20px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#10161d; --grid:#18202a; --card:#171f28; --sunk:#131a22;
  --ink:#e4e9ef; --muted:#9aa7b6; --faint:#6f7d8c; --line:#2a3542; --hair:#212b36;
  --accent:#93acff; --accent-soft:#1f2a44; --mark:#4a4020;
  --g:#ef8f6e; --n:#5cc7a0; --v:#8db0ef; --a:#e3ac5c; --track:#c3ccd8; --fig-ink:#dde3ea; --fig-aux:#8794a2; --warn:#f0a35a; --ok:#52d39c;
  --shadow:0 1px 0 rgba(0,0,0,.25),0 12px 30px -20px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;background-position:-1px -1px}
.wrap{max-width:1160px;margin:0 auto;padding-inline:16px;padding-block:16px 56px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:800}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 22px;min-width:0;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
@media (max-width:520px){.panel{padding:16px;border-radius:12px}}
.sh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sh h2{font-size:20px;letter-spacing:.02em}
.sh small{font-size:13px;color:var(--muted)}
.sh::after{content:"";flex:1 1 40px;height:1px;background:var(--hair);align-self:center}
.label{font-size:12px;letter-spacing:.12em;color:var(--faint);font-weight:700}
.note{font-size:13px;color:var(--muted)}

/* 题头：标题 + 图纸标题栏 */
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 28px;align-items:end;padding-bottom:6px}
@media (max-width:760px){.top{grid-template-columns:1fr}}
.brand{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-bottom:6px}
.seal{font-family:var(--f-display);font-weight:800;font-size:13px;color:var(--card);background:var(--ink);padding:2px 8px;border-radius:3px;letter-spacing:.18em}
.top h1{font-size:clamp(22px,3vw,30px);line-height:1.2;letter-spacing:.01em}
.top .sub{margin-top:4px;color:var(--muted);font-size:14px}
.tb{border-collapse:collapse;font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);min-width:0}
.tb th,.tb td{border:1px solid var(--hair);padding:6px 12px;text-align:left;white-space:nowrap}
.tb th{color:var(--faint);font-weight:500;font-size:12px;letter-spacing:.06em;background:var(--sunk)}
.tb td{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tb td.code{color:var(--accent);font-weight:600}
.tbwrap{overflow-x:auto;max-width:100%}

/* 母题 */
.problem{display:flex;flex-direction:column;gap:10px;min-width:0}
.lead{font-family:var(--f-display);font-size:clamp(16px,1.7vw,17px);line-height:1.8;font-weight:600}
.num{font-family:var(--f-mono);font-weight:600;font-size:.92em;color:var(--ink);white-space:nowrap;
  background:linear-gradient(transparent 55%,var(--mark) 55%);padding:0 2px;transition:background-color .2s}
.asks{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 26px}
.asks li{display:flex;gap:8px;align-items:baseline;min-width:0}
.asks li b{flex:none}
.asks li b{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-family:var(--f-mono);font-size:13px}
.given{background:var(--sunk);border:1px solid var(--hair);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.given dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:14px}
.given dt{font-family:var(--f-mono);color:var(--muted)}
.given dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}

/* 考点 + 边界 */
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:28px;align-items:start}
@media (max-width:860px){.row2{grid-template-columns:1fr}}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:14px;border:1px solid var(--line);background:var(--sunk);padding:4px 12px;border-radius:999px}
.bnd{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:620px){.bnd{grid-template-columns:1fr}}
.bnd ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.bnd li{display:grid;grid-template-columns:1.2em minmax(0,1fr);gap:6px}
.bnd .ok li::before{content:"✓";color:var(--ok);font-weight:700}
.bnd .back li::before{content:"→";color:var(--accent);font-weight:700}

/* 选项卡 */
.board{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0;overflow:hidden}
.tabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--line);background:var(--sunk);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:none;border-radius:0;background:none;padding:13px 14px 11px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-size:15px}
.tab:hover{color:var(--ink);border-color:transparent;border-bottom-color:var(--line)}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.tab .n{font-family:var(--f-mono);font-size:11px;color:var(--faint);margin-left:5px;font-weight:500}
.pane{padding:16px 22px 22px;display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:520px){.pane{padding:16px}}
.hint{font-size:13px;color:var(--muted)}

/* 动画区 */
.lab{display:flex;flex-wrap:wrap;gap:22px 28px;align-items:flex-start}
.stage{flex:0 1 auto;width:min(100%,max(300px,calc(100vh - 430px)),640px);display:flex;flex-direction:column;gap:10px;min-width:0}
.canvas-box{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
canvas{width:100%;max-width:100%;aspect-ratio:1/1;display:block}
.status{position:absolute;left:12px;top:12px;max-width:calc(100% - 24px);display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;
  padding:5px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.status.warn{color:var(--warn)} .status.warn::before{background:var(--warn)}
.status.ok{color:var(--ok)} .status.ok::before{background:var(--ok)}
@media (max-width:640px){.status{position:static;margin:8px 10px 10px;max-width:none}}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:16px;height:3px;vertical-align:middle;margin-right:6px;border-radius:2px}
.readout{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.ro{padding:7px 12px;min-width:0;box-shadow:1px 0 0 var(--hair),0 1px 0 var(--hair)}
.ro span{display:block;font-size:12px;color:var(--faint)}
.ro b{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums;font-size:15px;overflow-wrap:anywhere}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 16px;border-radius:999px;cursor:pointer;transition:border-color .15s,background-color .15s,color .15s}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--card);border-color:var(--accent);font-weight:700;padding-inline:22px}
.ctrl{flex:1 1 300px;display:flex;flex-direction:column;gap:18px;min-width:0}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.group{display:flex;flex-direction:column;gap:10px}
.field{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"l o" "r r";gap:2px 10px;align-items:baseline}
.field label{grid-area:l;font-size:14px}
.field label .s{font-family:var(--f-mono);font-weight:600;margin-right:6px}
.field label .note{font-size:12px}
.numin{grid-area:o;display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:1px 8px 1px 2px;background:var(--sunk)}
.numin:focus-within{border-color:var(--accent)}
.numin input{width:6.2em;border:none;background:transparent;color:var(--accent);font:600 14px var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;padding:3px 2px;outline:none;-moz-appearance:textfield}
.numin input::-webkit-outer-spin-button,.numin input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.numin .u{font:500 12px var(--f-mono);color:var(--muted);min-width:1.5em}
.presets button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.pnote{font-size:13px;color:var(--muted);border-left:2px solid var(--accent-soft);padding:2px 0 2px 10px}
.pnote b{color:var(--ink);font-weight:600}
.field input{grid-area:r}
input[type=range]{width:100%;accent-color:var(--accent);margin:4px 0}
.seg{display:flex;padding:3px;gap:3px;border-radius:999px;background:var(--sunk);border:1px solid var(--line)}
.seg button{flex:1;border:none;padding:6px 10px;background:transparent;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.seg button small{display:block;font-size:12px;font-weight:400;color:var(--faint);line-height:1.4}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{font-size:13px;padding:4px 12px;background:var(--sunk)}
.verdict{background:var(--sunk);border:1px solid var(--hair);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.8}
.verdict b{color:var(--accent);font-family:var(--f-mono)}

/* 结论 */
.cl{display:flex;flex-direction:column}
.cl details{border-top:1px solid var(--hair)}
.cl details:last-child{border-bottom:1px solid var(--hair)}
.cl summary{display:grid;grid-template-columns:2.6em minmax(0,1fr) minmax(0,auto) 1em;gap:6px 14px;align-items:center;padding:12px 4px;cursor:pointer;list-style:none}
.cl summary::-webkit-details-marker{display:none}
.cl summary:hover .t{color:var(--accent)}
.badge{display:inline-grid;place-items:center;min-width:2.3em;height:1.7em;padding:0 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-family:var(--f-mono);font-weight:600;font-size:13px}
.cl .f{font-family:var(--f-mono);font-size:14px;background:var(--sunk);border:1px solid var(--hair);border-radius:6px;padding:2px 10px;justify-self:end;text-align:right}
.chev{width:8px;height:8px;border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);transform:rotate(45deg);transition:transform .2s;justify-self:center}
details[open]>summary .chev{transform:rotate(225deg)}
@media (max-width:640px){.cl summary{grid-template-columns:2.6em minmax(0,1fr) 1em}.cl .f{grid-column:2;grid-row:2;justify-self:start;text-align:left}.chev{grid-column:3;grid-row:1}}
.deriv{margin:0 4px 14px calc(2.6em + 18px);padding:4px 0 4px 14px;border-left:2px solid var(--accent-soft);white-space:pre-line;font-size:14px;color:var(--ink)}
@media (max-width:640px){.deriv{margin-left:4px}}

/* 变式 / 换皮题 */
.qs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px}
.q{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--card);min-width:0}
.q .head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.q h3{font-size:16px;margin-right:auto}
.chip{font-size:12px;font-family:var(--f-mono);border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--muted)}
.src{font-size:12px;color:var(--faint)}
.map{font-size:13px;color:var(--muted)}
.map b{font-weight:500;color:var(--ink)}
.q details{border-top:1px dashed var(--line);padding-top:8px}
.q details summary{cursor:pointer;color:var(--accent);font-size:14px;font-weight:500;list-style:none;display:flex;align-items:center;gap:8px;width:fit-content}
.q details summary::-webkit-details-marker{display:none}
.ans{margin-top:8px;display:flex;flex-direction:column;gap:6px;font-size:14px;background:var(--sunk);border-radius:8px;padding:10px 12px}
.ans .a{font-weight:700}
.q .foot{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.q .foot button{font-size:13px;padding:4px 14px;color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft)}
.srcs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.srcs li{display:grid;grid-template-columns:minmax(0,15em) minmax(0,1fr);gap:4px 16px;padding:8px 0;border-top:1px solid var(--hair);font-size:14px}
.srcs li b{font-family:var(--f-mono);font-weight:500;font-size:13px}
.srcs li span{color:var(--muted)}
@media (max-width:620px){.srcs li{grid-template-columns:1fr}}
footer{font-size:12px;color:var(--faint);text-align:center}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

<div class="wrap" id="app">
  <header class="top">
    <div>
      <div class="brand"><span class="seal">格物</span><span>Gewu · 高中物理母题</span></div>
      <h1 id="hName"></h1>
      <p class="sub" id="hSub"></p>
    </div>
    <div class="tbwrap"><table class="tb" id="hTable"></table></div>
  </header>

  <section class="panel">
    <div class="sh"><h2>母题</h2><small>题干数字随动画参数实时变化</small></div>
    <div class="problem">
      <p class="lead" id="stem"></p>
      <ol class="asks" id="asks"></ol>
      <p class="note" id="stemNote"></p>
    </div>
  </section>

  <div class="board">
    <nav class="tabs" role="tablist" aria-label="母题内容">
      <button class="tab" role="tab" id="tab-lab" aria-controls="pane-lab" data-pane="pane-lab">动画实验</button>
      <button class="tab" role="tab" id="tab-scope" aria-controls="pane-scope" data-pane="pane-scope">考点与边界</button>
      <button class="tab" role="tab" id="tab-concl" aria-controls="pane-concl" data-pane="pane-concl">结论<span class="n" id="nConcl"></span></button>
      <button class="tab" role="tab" id="tab-var" aria-controls="pane-var" data-pane="pane-var">变式<span class="n" id="nVar"></span></button>
      <button class="tab" role="tab" id="tab-skin" aria-controls="pane-skin" data-pane="pane-skin">换皮题<span class="n" id="nSkin"></span></button>
      <button class="tab" role="tab" id="tab-src" aria-controls="pane-src" data-pane="pane-src">题源<span class="n" id="nSrc"></span></button>
    </nav>

    <section class="pane" role="tabpanel" id="pane-lab" aria-labelledby="tab-lab">
      <div class="lab">
        <div class="stage">
          <div class="legend" id="legend"></div>
          <div class="canvas-box">
            <canvas id="cv" aria-label="母题动画画布"></canvas>
            <div class="status" id="status" role="status">准备就绪</div>
          </div>
          <div class="btns">
            <button class="primary" id="play">▶ 发射</button>
            <button id="reset">重置</button>
            <button id="slow">慢放 ×0.25</button>
          </div>
        </div>
        <div class="ctrl">
          <div class="group"><div class="label">参数</div><div id="params" class="group"></div></div>
          <div class="group"><div class="label">预设情形 <span id="presetMode"></span></div><div class="presets" id="presets"></div><p class="pnote" id="pnote" hidden></p></div>
          <div class="group"><div class="label">理论预判</div><div class="verdict" id="verdict"></div></div>
        </div>
      </div>
      <div class="group"><div class="label">实时读数</div><div class="readout" id="readout"></div></div>
    </section>

    <section class="pane" role="tabpanel" id="pane-scope" aria-labelledby="tab-scope" hidden>
      <div class="row2">
        <div class="group"><div class="label">核心考点</div><div class="tags" id="tags"></div></div>
        <div class="group"><div class="label">适用边界</div>
          <div class="bnd">
            <div><div class="hint">结论成立条件</div><ul class="ok" id="bCond"></ul></div>
            <div><div class="hint">超出边界时回到</div><ul class="back" id="bBack"></ul></div>
          </div>
        </div>
      </div>
    </section>

    <section class="pane" role="tabpanel" id="pane-concl" aria-labelledby="tab-concl" hidden>
      <p class="hint">点开每条结论看推导。</p>
      <div class="cl" id="concl"></div>
    </section>

    <section class="pane" role="tabpanel" id="pane-var" aria-labelledby="tab-var" hidden>
      <p class="hint">同一骨架，换条件或问法。点「加载到动画」可直接在动画里验证。</p>
      <div class="qs" id="variants"></div>
    </section>

    <section class="pane" role="tabpanel" id="pane-skin" aria-labelledby="tab-skin" hidden>
      <p class="hint">同一骨架，换情境外形。</p>
      <div class="qs" id="reskins"></div>
    </section>

    <section class="pane" role="tabpanel" id="pane-src" aria-labelledby="tab-src" hidden>
      <ul class="srcs" id="sources"></ul>
    </section>
  </div>

  <footer id="foot"></footer>
</div>

<script>
/* ================= 线稿绘图工具 FIG（所有母题共用，不改） =================
   画法照试卷插图：装置用墨线，固定面画斜线阴影，辅助线用虚线，物理量和点的字母用斜体衬线；
   只有矢量带颜色（--g 重力/外力，--n 弹力/约束力，--v 速度，--a 其他矢量）。
   用法：SIM.draw 里 const F=FIG(ctx,W,tok)；坐标是画布像素，F.u = W/720 是线宽与几何的基准单位，
   F.ut 是字号单位（窄屏时不再随画布缩小，保证字母不小于约 11 CSS 像素；自写文字函数也要用 F.ut 算字号）。
   颜色：F.ink 墨线、F.auxColor 辅助线、F.paper 纸色（F.aux 是画辅助线的方法，不是颜色）。 */
const FIG=(ctx,W,tok)=>{
  const u=W/720,ink=tok('--fig-ink'),aux=tok('--fig-aux'),paper=tok('--card');
  const dp=W/(ctx.canvas.clientWidth||W),ut=Math.max(u,dp*11/19);   // dp：每 CSS 像素的画布像素数
  const SERIF='"Times New Roman","STIX Two Text",Times,serif',SANS=tok('--f-body');
  const path=(fn,{w=1.6,color=ink,dash=null,fill=null}={})=>{ctx.save();ctx.beginPath();fn();
    if(fill){ctx.fillStyle=fill;ctx.fill()}
    if(w>0){ctx.lineWidth=w*u;ctx.strokeStyle=color;ctx.setLineDash(dash?dash.map(d=>d*u):[]);ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}
    ctx.restore()};
  // 文字先描一圈底色再填色，压在线条上也清楚
  const text=(t,x,y,font,color,align,base)=>{ctx.save();ctx.font=font;ctx.textAlign=align;ctx.textBaseline=base;
    ctx.lineJoin="round";ctx.lineWidth=5*ut;ctx.strokeStyle=paper;ctx.strokeText(t,x,y);ctx.fillStyle=color;ctx.fillText(t,x,y);ctx.restore()};
  const F={u,ut,ink,auxColor:aux,paper,
    clear(){ctx.save();ctx.setLineDash([]);ctx.fillStyle=paper;ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height);ctx.restore()},
    line(x1,y1,x2,y2,o){path(()=>{ctx.moveTo(x1,y1);ctx.lineTo(x2,y2)},o)},
    poly(pts,o){path(()=>pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y)),o)},
    circle(x,y,r,o){path(()=>ctx.arc(x,y,r,0,2*Math.PI),o)},
    arc(x,y,r,a0,a1,o){path(()=>ctx.arc(x,y,r,a0,a1),o)},
    rect(x,y,w,h,o){path(()=>ctx.rect(x,y,w,h),o)},
    // 辅助线（中心线、投影线等）
    aux(x1,y1,x2,y2,o={}){F.line(x1,y1,x2,y2,{w:1,color:aux,dash:[6,5],...o})},
    // 运动轨迹：细虚线
    trail(pts,o={}){if(pts.length>1)F.poly(pts,{w:1.3,color:aux,dash:[5,5],...o})},
    // 固定面斜线：沿 (x1,y1)→(x2,y2) 的直线，画在 side 一侧（屏幕坐标下，1 = 前进方向右手侧）
    hatch(x1,y1,x2,y2,side=1,{gap=12,len=10}={}){const L=Math.hypot(x2-x1,y2-y1),n=Math.max(1,Math.round(L/(gap*u)));
      const tx=(x2-x1)/L,ty=(y2-y1)/L,nx=-ty*side,ny=tx*side,ox=(nx-tx)*len*u/Math.SQRT2,oy=(ny-ty)*len*u/Math.SQRT2;
      path(()=>{for(let i=0;i<=n;i++){const x=x1+(x2-x1)*i/n,y=y1+(y2-y1)*i/n;ctx.moveTo(x,y);ctx.lineTo(x+ox,y+oy)}},{w:1,color:aux})},
    // 圆弧形固定面的斜线：out = true 画在圆外侧
    hatchArc(cx,cy,r,a0,a1,out=true,{gap=12,len=10}={}){const n=Math.max(1,Math.round(r*Math.abs(a1-a0)/(gap*u))),s=out?1:-1;
      path(()=>{for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n,c=Math.cos(a),si=Math.sin(a),x=cx+r*c,y=cy+r*si;
        const nx=c*s,ny=si*s,tx=-si,ty=c;ctx.moveTo(x,y);ctx.lineTo(x+(nx-tx)*len*u/Math.SQRT2,y+(ny-ty)*len*u/Math.SQRT2)}},{w:1,color:aux})},
    // 矢量：从 (x,y) 画到 (x+dx,y+dy)，细杆 + 窄实心箭头；label 用斜体写在箭头外侧，
    // 与别的矢量共线时用 off=[dx,dy]（单位 u，相对箭头尖）把标注挪到旁边
    arrow(x,y,dx,dy,color,label,{w=2,head=12,size=19,off=null}={}){const L=Math.hypot(dx,dy);if(L<2*u)return;
      const ux=dx/L,uy=dy/L,h=Math.min(head*u,L*.6),hw=h*.34,tx=x+dx,ty=y+dy;
      F.line(x,y,tx-ux*h*.7,ty-uy*h*.7,{w,color});
      path(()=>{ctx.moveTo(tx,ty);ctx.lineTo(tx-ux*h-uy*hw,ty-uy*h+ux*hw);ctx.lineTo(tx-ux*h+uy*hw,ty-uy*h-ux*hw);ctx.closePath()},{w:0,fill:color});
      if(label)F.label(label,off?tx+off[0]*u:tx+ux*14*u,off?ty+off[1]*u:ty+uy*14*u,{color,size})},
    // 斜体衬线字母（物理量、点名）
    label(t,x,y,{color=ink,size=19,align='center',base='middle',italic=true}={}){text(t,x,y,`${italic?'italic ':''}${size*ut}px ${SERIF}`,color,align,base)},
    // 中文小注
    zh(t,x,y,{color=aux,size=14,align='center',base='middle'}={}){text(t,x,y,`${size*ut}px ${SANS}`,color,align,base)},
    dot(x,y,r=2.6,color=ink){F.circle(x,y,r*u,{w:0,fill:color})},
    // 带名字的点：实心小点 + 斜体字母（dx、dy 为字母相对点的偏移，单位 u）
    point(x,y,name,dx=-13,dy=13){F.dot(x,y);if(name)F.label(name,x+dx*u,y+dy*u)},
    // 小球：空心圆，球心另用 F.dot 标出（矢量画完后再点，表示力作用在重心）
    ball(x,y,r){F.circle(x,y,r,{w:1.6,fill:paper})},
    // 尺寸标注：两端带箭头的细线，文字写在中点外侧 off（单位 u）
    dim(x1,y1,x2,y2,t,{off=14,color=ink}={}){const L=Math.hypot(x2-x1,y2-y1);if(L<4*u)return;const ux=(x2-x1)/L,uy=(y2-y1)/L,h=Math.min(8*u,L/3),hw=h*.38;
      F.line(x1,y1,x2,y2,{w:1,color});
      for(const[px,py,sx]of[[x1,y1,1],[x2,y2,-1]])path(()=>{ctx.moveTo(px,py);ctx.lineTo(px+sx*ux*h-uy*hw,py+sx*uy*h+ux*hw);ctx.lineTo(px+sx*ux*h+uy*hw,py+sx*uy*h-ux*hw);ctx.closePath()},{w:0,fill:color});
      if(t)F.label(t,(x1+x2)/2-uy*off*u,(y1+y2)/2+ux*off*u,{color})},
  };
  return F;
};

/* ================= SIM 模块：每个母题替换这一段 =================
   约定接口：
   SIM.legend            [{label, color(CSS 变量名)}]
   SIM.init(P)           → 状态 S（含 S.done、S.status={text,cls}）
   SIM.step(S,P,dt)      推进 dt 秒（引擎保证 dt ≤ 0.5 ms）
   SIM.readouts(S,P)     → [[标签, 带单位的值]]
   SIM.draw(ctx,S,P,W,H,tok)  tok(name) 取主题色
   SIM.verdict(P)        → 理论预判 HTML
*/
const SIM=(()=>{
  /* 带电粒子在有界匀强磁场中的圆周运动。
     物理：对每个粒子的 (x, y, vx, vy) 做 RK4，a = (q/m) v × B，B 只有 z 分量，按区域取 +B、−B 或 0（不用预设轨迹）。
     越过边界的那一步在步内二分定位交点，交点处换用新区域的磁场继续积分。
     时间：真实周期是 10⁻⁷ s 量级，动画把引擎给的时间步乘以放大倍数 S.TS 再推进，积分子步长 h ≤ T_min/20000；读数显示真实时间。
     坐标：直线、平行、圆形边界以入射点 A 为原点（圆形边界圆心 O 在 (0, R)），环形边界以 O 为原点；x 向右、y 向上、z 垂直纸面向外，单位 m。
     页面引擎的预设按第一个选项参数（边界）分组：预设的 load 用 opts 打包其余选项（显示、磁场方向、电性等），
     SIM 在 P 上装一个 opts 访问器，引擎 Object.assign(P, load) 时就地展开，题干、按钮、参数显隐都照常由引擎同步。 */
  const TAU=2*Math.PI,RAD=Math.PI/180,DEG=180/Math.PI;
  const SUP={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
  const ok=x=>typeof x==='number'&&isFinite(x);
  const fmt=(x,d=2)=>{if(!ok(x))return'—';return(Math.abs(x)<.5*Math.pow(10,-d)?0:x).toFixed(d).replace('-','−')};
  const exp10=x=>{let e=Math.floor(Math.log10(Math.abs(x))),m=x/Math.pow(10,e);return[m,e]};
  const sci=(x,d=2)=>{if(!ok(x))return'—';if(x===0)return'0';let[m,e]=exp10(x);if(Math.abs(+m.toFixed(d))>=10){m/=10;e++}
    return m.toFixed(d).replace('-','−')+'×10'+String(e).replace(/./g,c=>SUP[c])};
  // 题干用的写法：1.0×10⁸、4.8×10⁷、5.77×10⁵（三位有效数字，整数补一位小数）
  const sciS=x=>{if(!ok(x)||x<=0)return String(x);let[m,e]=exp10(x);m=+m.toPrecision(3);if(m>=10){m/=10;e++}
    return(Number.isInteger(m)?m.toFixed(1):String(m))+'×10'+String(e).replace(/./g,c=>SUP[c])};
  // 输入框里的写法：1e8、4.8e7（引擎用 parseFloat 读回）
  const sciIn=x=>{if(!ok(x)||x<=0)return String(x);let[m,e]=exp10(x);m=+m.toPrecision(5);if(m>=10){m=+(m/10).toPrecision(5);e++}return m+'e'+e};
  const cm=(x,d=2)=>fmt(x*100,d)+' cm',ns=t=>fmt(t*1e9,1)+' ns',dg=a=>fmt(a,1)+'°',vs=v=>sci(v,3)+' m/s';
  const sub=['₀','₁','₂','₃','₄','₅','₆','₇','₈','₉'];

  /* ---------- 参数整理：选项宏 opts、不兼容组合 ---------- */
  function norm(P){
    if(P.opts&&typeof P.opts==='object'){const o=P.opts;delete P.opts;Object.assign(P,o)}
    const d=Object.getOwnPropertyDescriptor(P,'opts');
    if(!d||!d.set)try{Object.defineProperty(P,'opts',{configurable:true,enumerable:false,get(){return undefined},set(o){if(o&&typeof o==='object')Object.assign(P,o)}})}catch(e){}
    if(P.show==='beam'&&P.bnd!=='circle')P.show='single';      // 平行束只用于圆形边界
  }
  // 引擎每次同步参数后都会调用 verdict，这里顺带处理引擎不支持的界面细节
  function ui(P){
    if(typeof document==='undefined')return;
    const seg=k=>{const b=document.querySelector(`.seg [data-k="${k}"]`);return b&&b.parentElement};
    const vis=(el,on)=>{if(el)el.hidden=!on};
    vis(seg('outer'),P.bnd==='circle');vis(seg('sign2'),P.show==='duo');
    vis(document.getElementById('opt-show-beam'),P.bnd==='circle');
    document.querySelectorAll('.seg [data-k="show"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===P.show));
    // q/m、v 的数值很大：输入框改用科学计数，题干改用 ×10ⁿ
    for(const k of['qm','v','qm2','v2']){const n=document.getElementById('num-'+k);if(n&&document.activeElement!==n)n.value=sciIn(P[k])}
    document.querySelectorAll('#stem .num,#asks .num').forEach(s=>{const m=s.textContent.match(/^(\d{5,}(?:\.\d+)?) (C\/kg|m\/s)$/);if(m)s.textContent=sciS(+m[1])+' '+m[2];else s.textContent=s.textContent.replace(/ °$/,'°')});
  }

  /* ---------- 区域 ---------- */
  // 区域代号：F 有磁场；直线边界 N（MN 下方）；平行边界 L（MN 下方）、U（PQ 上方）；圆形边界 X（圆外）；环形边界 I（内圆）、X（外圆外）
  function cls(G,x,y){
    switch(G.bnd){
      case'line':return y>0?'F':'N';
      case'strip':return y<0?'L':y>G.d?'U':'F';
      case'circle':return Math.hypot(x,y-G.R)<G.R?'F':'X';
      default:{const r=Math.hypot(x,y);return r<G.R1?'I':r<G.R2?'F':'X'}
    }
  }
  // 是否仍在区域 reg 内（向外放宽 e，用于判定越界和防止在边界上来回抖动）
  function inR(G,reg,x,y,e){
    switch(G.bnd){
      case'line':return reg==='F'?y>-e:y<e;
      case'strip':return reg==='F'?y>-e&&y<G.d+e:reg==='L'?y<e:y>G.d-e;
      case'circle':{const r=Math.hypot(x,y-G.R);return reg==='F'?r<G.R+e:r>G.R-e}
      default:{const r=Math.hypot(x,y);return reg==='I'?r<G.R1+e:reg==='F'?r>G.R1-e&&r<G.R2+e:r>G.R2-e}
    }
  }
  const fac=(G,reg)=>reg==='F'?1:(G.outer&&reg==='X'?-1:0);
  const where=(G,from,to)=>G.bnd==='line'?'MN':G.bnd==='strip'?(to==='U'?'PQ':'MN'):G.bnd==='circle'?'圆周':(to==='X'?'外圆':'内圆');

  /* ---------- 粒子与理论值 ---------- */
  function setup(P){
    const ring=P.bnd==='ring',G={bnd:P.bnd,show:P.show,B:P.B,outer:P.bnd==='circle'&&P.outer==='rev',
      d:P.d/100,R:P.R/100,R1:P.R1/100,R2:Math.max(P.R2,P.R1+2)/100,adj:ring&&P.R2<P.R1+2};
    G.O=P.bnd==='circle'?[0,G.R]:[0,0];
    const bd=P.Bdir==='out'?-1:1,s1=P.sign==='neg'?-1:1,s2=P.sign2==='neg'?-1:1,a0=ring?P.phi:P.beta;
    // sig：转向，+1 逆时针（向左偏），−1 顺时针；w = (q/m)·Bz（带符号），a = w·(vy, −vx)
    const mk=(sg,qm,v,ang,x0=0,y0=0)=>{qm=Math.abs(qm);const om=qm*P.B,p={sg,qm,v,ang,x0,y0,sig:sg*bd,om,r:v/om,T:TAU/om};p.w=-p.sig*om;return p};
    const ps=[];
    if(G.show==='duo')ps.push(mk(s1,P.qm,P.v,a0),mk(s2,P.qm2,P.v2,a0));
    else if(G.show==='rot'){if(ring)for(let a=0;a<360;a+=30)ps.push(mk(s1,P.qm,P.v,a));else for(let a=10;a<=170;a+=10)ps.push(mk(s1,P.qm,P.v,a))}
    else if(G.show==='zoom')for(let i=1;i<=10;i++)ps.push(mk(s1,P.qm,P.v*i/5,a0));
    else if(G.show==='beam')for(let i=0;i<9;i++)ps.push(mk(s1,P.qm,P.v,90,G.R*(i-4)/4.5,-.3*G.R));
    else ps.push(mk(s1,P.qm,P.v,a0));
    ps.forEach(p=>p.th=theo(G,p));
    return{G,ps};
  }
  // 圆周上速度方向为 f 的点：c + sig·r·(sin f, −cos f)
  const onC=(c,r,s,f)=>[c[0]+s*r*Math.sin(f),c[1]-s*r*Math.cos(f)];
  const refl=(O,c,q)=>{const dx=c[0]-O[0],dy=c[1]-O[1],L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,qx=q[0]-O[0],qy=q[1]-O[1],k=qx*ux+qy*uy;return[O[0]+2*k*ux-qx,O[1]+2*k*uy-qy]};
  const sweep=(c,s,p,q)=>{let a=s*(Math.atan2(q[1]-c[1],q[0]-c[0])-Math.atan2(p[1]-c[1],p[0]-c[0]));a=((a%TAU)+TAU)%TAU;return a<1e-9?TAU:a};
  // 第一段磁场中圆弧的理论值（只用于理论预判、取景与动画节奏，运动本身由 RK4 积分）
  function theo(G,p){
    const{r,sig:s,om}=p,a=p.ang*RAD,o={a};
    let ex=p.x0,ey=p.y0,t0=0;
    if(G.bnd==='ring'){ex=G.R1*Math.cos(a);ey=G.R1*Math.sin(a);t0=G.R1/p.v}
    else if(p.y0<0){ey=G.R-Math.sqrt(Math.max(0,G.R*G.R-p.x0*p.x0));t0=(ey-p.y0)/p.v}
    const c=[ex-s*r*Math.sin(a),ey+s*r*Math.cos(a)];Object.assign(o,{ex,ey,t0,c});
    const out=(th,x,y,wh,more)=>Object.assign(o,{th,x,y,wh,t:t0+th*RAD/om,ve:a+s*th*RAD},more);
    const lineExit=more=>out(s>0?360-2*p.ang:2*p.ang,-s*2*r*Math.sin(a),0,'MN',more);
    if(G.bnd==='line')lineExit({gam:s>0?180-p.ang:p.ang});
    else if(G.bnd==='strip'){
      const top=c[1]+r,d=G.d,gam=s>0?180-p.ang:p.ang;o.v0=p.qm*G.B*d/(1-Math.cos(gam*RAD));
      if(top-d>1e-6*r){let ph,x;
        if(s>0){ph=Math.acos(Math.max(-1,Math.cos(a)-d/r));x=c[0]+r*Math.sin(ph)}else{ph=Math.acos(Math.min(1,Math.cos(a)+d/r));x=c[0]-r*Math.sin(ph)}
        out(Math.abs(ph-a)*DEG,x,d,'PQ',{gam,near:top-d<.005*r})}
      else lineExit({gam,tan:d-top<.005*r});
    }else if(G.bnd==='circle'){
      const O=G.O;
      if(Math.hypot(c[0]-O[0],c[1]-O[1])<1e-12*r)o.none=true;
      else{const C=refl(O,c,[ex,ey]);out(sweep(c,s,[ex,ey],C)*DEG,C[0],C[1],'圆周',{radial:Math.abs(p.ang-90)<1e-9&&p.y0===0})}
      if(G.outer&&!o.none){
        // 圆外反向：转向相反、半径相同；每段都全等，只是绕 O 转过一个角度
        const c2=[o.x+s*r*Math.sin(o.ve),o.y-s*r*Math.cos(o.ve)],P2=refl(O,c2,[o.x,o.y]);
        o.rOut=Math.hypot(c2[0]-O[0],c2[1]-O[1])+r;o.thOut=sweep(c2,-s,[o.x,o.y],P2)*DEG;
        const ang=q=>Math.atan2(q[1]-O[1],q[0]-O[0]);let a1=ang([o.x,o.y])-ang([ex,ey]),a2=ang(P2)-ang([o.x,o.y]);
        const wrap=x=>Math.atan2(Math.sin(x),Math.cos(x));a1=wrap(a1);a2=wrap(a2);o.al1=a1*DEG;o.al2=a2*DEG;
        // 找第一次回到 A：累计转角为 360° 的整数倍
        let cum=0,tt=0;for(let n=1;n<=36;n++){const inn=n%2===1;cum+=inn?a1:a2;tt+=(inn?o.th:o.thOut)*RAD/om;
          if(Math.abs(wrap(cum))<1e-6){o.back={n,t:tt,enter:!inn};break}}
      }
    }else{
      const L=Math.hypot(c[0],c[1]);o.rho=L+r;o.esc=o.rho-G.R2>1e-6*r;o.tan=!o.esc&&G.R2-o.rho<.005*r;
      o.doe=2*Math.atan(r/G.R1)*DEG;o.lobe=180+o.doe;o.tl=o.lobe*RAD/om;o.vm=p.qm*G.B*(G.R2*G.R2-G.R1*G.R1)/(2*G.R2);
    }
    return o;
  }
  // 取景框（世界坐标）：边界区域 + 轨迹圆；轨迹半径远大于区域时只取区域内的那段弧（接近直线）
  function frame(G,ps){
    const b={x0:Infinity,x1:-Infinity,y0:Infinity,y1:-Infinity},add=(x,y)=>{if(!ok(x)||!ok(y))return;b.x0=Math.min(b.x0,x);b.x1=Math.max(b.x1,x);b.y0=Math.min(b.y0,y);b.y1=Math.max(b.y1,y)};
    const disk=(x,y,r)=>{add(x-r,y-r);add(x+r,y+r)};
    let size=Infinity;add(0,0);
    if(G.bnd==='strip'){size=G.d;add(0,G.d)}
    if(G.bnd==='circle'){size=2*G.R;disk(0,G.R,G.R)}
    if(G.bnd==='ring'){size=2*G.R2;disk(0,0,G.R2)}
    for(const p of ps){const t=p.th;add(p.x0,p.y0);if(G.bnd==='ring')continue;
      if(2*p.r<=3*size)disk(t.c[0],t.c[1],p.r);
      else if(t.th!==undefined){const n=48;for(let i=0;i<=n;i++){const q=onC(t.c,p.r,p.sig,t.a+p.sig*t.th*RAD*i/n);add(q[0],q[1])}
        add(t.x+Math.cos(t.ve)*size*.4,t.y+Math.sin(t.ve)*size*.4)}
      if(t.rOut)disk(G.O[0],G.O[1],t.rOut);
    }
    let w=b.x1-b.x0,h=b.y1-b.y0,L=Math.max(w,h,1e-6);
    if(G.bnd==='line'||G.bnd==='strip')b.y0=Math.min(b.y0,-.12*L);
    w=b.x1-b.x0;h=b.y1-b.y0;L=Math.max(w,h);
    if(w<.55*L){const e=(.55*L-w)/2;b.x0-=e;b.x1+=e}
    if(h<.55*L){const e=(.55*L-h)/2;b.y0-=e;b.y1+=e}
    const m=.04*L;b.x0-=m;b.x1+=m;b.y0-=m;b.y1+=m;b.L=L+2*m;
    return b;
  }

  // 圆形 / 环形边界的半径标注方向：按理论轨迹（环形边界的后续各段与直径、圆外反向的后续各段）数一数每个候选方向的射线
  // 与轨迹相交几次，取相交最少的（射线与直线段重合时记大数）
  function radDir(G,ps){
    if(G.bnd!=='circle'&&G.bnd!=='ring')return[];
    const lines=[],O=G.O,rot=(q,a)=>{const x=q[0]-O[0],y=q[1]-O[1],c=Math.cos(a),s=Math.sin(a);return[O[0]+x*c-y*s,O[1]+x*s+y*c]};
    for(const p of ps){const t=p.th;if(t.c===undefined||!ok(p.r))continue;
      const arc=(c,s,a0,sw)=>{const out=[];for(let i=0;i<=48;i++)out.push(onC(c,p.r,s,a0+s*sw*i/48));return out};
      if(G.bnd==='ring'){const lobe=arc(t.c,p.sig,t.a,(t.esc?90:t.lobe)*RAD),D=[t.ex,t.ey],E=refl([0,0],t.c,D),step=Math.atan2(E[1],E[0])-Math.atan2(D[1],D[0])+Math.PI;
        for(let k=0;k<(t.esc?1:6);k++){lines.push(lobe.map(q=>rot(q,k*step)));lines.push([[0,0],rot(D,k*step)],[[0,0],rot(E,k*step)])}}
      else if(t.th!==undefined){const a1=arc(t.c,p.sig,t.a,t.th*RAD);lines.push(a1);
        if(G.outer&&t.rOut){const c2=[t.x+p.sig*p.r*Math.sin(t.ve),t.y-p.sig*p.r*Math.cos(t.ve)],a2=arc(c2,-p.sig,t.ve,t.thOut*RAD),st=(t.al1+t.al2)*RAD;
          for(let k=1;k<6;k++)lines.push(a1.map(q=>rot(q,k*st)));for(let k=0;k<6;k++)lines.push(a2.map(q=>rot(q,k*st)))}}}
    const Rm=G.bnd==='circle'?G.R:G.R2,cand=[-35,-145,35,145,-60,-120,60,120,0,180,-90,90,-15,-165,15,165];
    const wrap=a=>((a+180)%360+360)%360-180,inside=q=>Math.hypot(q[0]-O[0],q[1]-O[1])<=Rm*1.02;
    const score=c=>{let n=0;for(const L of lines)for(let i=1;i<L.length;i++){const p=L[i-1],q=L[i];if(!inside(p)&&!inside(q))continue;
      const d1=wrap(Math.atan2(p[1]-O[1],p[0]-O[0])*DEG-c),d2=wrap(Math.atan2(q[1]-O[1],q[0]-O[0])*DEG-c);
      if(L.length===2){if(Math.abs(d2)<4)n+=20}else if(Math.abs(d1)<90&&Math.abs(d2)<90&&(d1<0)!==(d2<0))n++}return n};
    const best=cand.map((c,i)=>[score(c)+i*.01,c]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
    return[best[0],best.find(c=>{let d=Math.abs(c-best[0])%360;if(d>180)d=360-d;return d>=25})];
  }

  /* ---------- 积分 ---------- */
  // RK4：a = w·(vy, −vx)
  function rk(x,y,vx,vy,h,w){
    const a1x=w*vy,a1y=-w*vx,u2=vx+a1x*h/2,v2=vy+a1y*h/2,a2x=w*v2,a2y=-w*u2;
    const u3=vx+a2x*h/2,v3=vy+a2y*h/2,a3x=w*v3,a3y=-w*u3,u4=vx+a3x*h,v4=vy+a3y*h,a4x=w*v4,a4y=-w*u4;
    return[x+h/6*(vx+2*u2+2*u3+u4),y+h/6*(vy+2*v2+2*v3+v4),vx+h/6*(a1x+2*a2x+2*a3x+a4x),vy+h/6*(a1y+2*a2y+2*a3y+a4y)];
  }
  const center=(o,f)=>{const W=o.w*f;return[o.x+o.vy/W,o.y-o.vx/W]};   // 速度垂线上距粒子 r 的点（Ω = −W）
  function adv(S,o,span){
    const G=S.G;let rem=span,guard=0;
    while(rem>0&&!o.fin&&guard++<100000){
      if(!inR(G,o.reg,o.x,o.y,S.eps))o.reg=cls(G,o.x,o.y);
      const f=fac(G,o.reg),w=o.w*f,h=Math.min(rem,S.h);
      let n=rk(o.x,o.y,o.vx,o.vy,h,w),dt=h,cross=false,to=o.reg;
      if(!inR(G,o.reg,n[0],n[1],S.eps)&&(to=cls(G,n[0],n[1]))!==o.reg){                     // 本步越过边界（超出 eps 才算，擦边相切不算）：二分定位到真实边界上的交点
        let lo=0,hi=h;for(let i=0;i<60;i++){const m=(lo+hi)/2,q=rk(o.x,o.y,o.vx,o.vy,m,w);if(inR(G,o.reg,q[0],q[1],0))lo=m;else hi=m}
        n=rk(o.x,o.y,o.vx,o.vy,hi,w);dt=hi;cross=true}
      const dph=Math.atan2(o.vx*n[3]-o.vy*n[2],o.vx*n[2]+o.vy*n[3]),px=o.x,py=o.y,pvx=o.vx,pvy=o.vy;
      o.cum+=dph;o.turn+=Math.abs(dph);if(f)o.tf+=dt;o.s+=Math.hypot(n[0]-px,n[1]-py);

      watch(S,o,px,py,pvx,pvy,dt);
      if(cross){event(S,o,o.reg,to);o.reg=to}   // 新区域按本步终点判定（交点正好在边界上，判不出在哪一侧）
      const L=o.trail[o.trail.length-1];if(cross||Math.hypot(o.x-L[0],o.y-L[1])>S.res){o.trail.push([o.x,o.y]);if(o.trail.length>9000)o.trail.splice(1,1)}
      const b=S.ob;if(!fac(G,o.reg)&&(o.x<b.x0||o.x>b.x1||o.y<b.y0||o.y>b.y1)){o.gone=o.fin=true;o.trail.push([o.x,o.y])}

  }
  function watch(S,o,px,py,pvx,pvy,dt){
    const G=S.G;
    if(o.reg==='F'){
      if(G.bnd==='strip'){const dd=G.d-o.y;if(dd<o.minD){o.minD=dd;o.tanPt=[o.x,o.y]}}
      if(G.bnd==='ring'){const r=Math.hypot(o.x,o.y);if(G.R2-r<o.minD){o.minD=G.R2-r;o.tanPt=[o.x,o.y]}}
    }
    if(G.bnd==='ring'){o.rmax=Math.max(o.rmax,Math.hypot(o.x,o.y));
      if(o.reg==='I'){const d0=px*pvx+py*pvy,d1=o.x*o.vx+o.y*o.vy;
        if(d0<0&&d1>=0){const lam=-d0/(d1-d0),dist=Math.abs(o.x*o.vy-o.y*o.vx)/Math.hypot(o.vx,o.vy);   // 最近点：线性插值
          if(dist<1e-3*G.R1){const ds=Math.hypot(o.x-px,o.y-py),e={t:o.t-dt*(1-lam),s:o.s-ds*(1-lam)};o.passO.push(e);

  function event(S,o,from,to){
    const G=S.G,ff=fac(G,from),ft=fac(G,to),e={t:o.t,x:o.x,y:o.y,vx:o.vx,vy:o.vy,turn:o.turn,tf:o.tf,from,to,wh:where(G,from,to)};
    o.ev.push(e);

      if(!o.ex){o.ex=e;S.firstEx=S.firstEx||{who:o,others:S.ps.map(q=>q.turn+(fac(G,q.reg)&&!q.fin?q.om*(e.t-q.t):0))}}}

  /* ---------- 状态文字 ---------- */
  function status(S){
    const G=S.G,ps=S.ps,o=ps[0],n=ps.length,out=ps.filter(q=>q.ex).length;
    if(S.t===0)return{text:'准备就绪',cls:''};
    if(G.show==='rot'||G.show==='zoom'||G.show==='beam'){
      const nm={rot:'旋转圆',zoom:'放缩圆',beam:'平行束'}[G.show];
      if(G.bnd==='ring'){const e=ps.filter(q=>q.esc).length;return{text:`${nm}：${e} / ${n} 穿出外圆`,cls:S.done?(e?'warn':'ok'):''}}
      if(G.outer)return{text:`${nm}：圆内外交替偏转`,cls:''};
      return{text:`${nm}：已射出 ${out} / ${n}`,cls:out===n?'ok':''};
    }
    if(G.show==='duo'){const a=ps[0].ex,b=ps[1].ex;
      if(G.bnd==='ring')return{text:`粒子 1 ${ps[0].esc?'穿出外圆':'未穿出'}，粒子 2 ${ps[1].esc?'穿出外圆':'未穿出'}`,cls:''};
      return{text:a&&b?'两种粒子都已射出':a?'粒子 1 已射出，粒子 2 偏转中':b?'粒子 2 已射出，粒子 1 偏转中':'两种粒子在磁场中偏转',cls:a&&b?'ok':''}}
    if(G.bnd==='ring'){
      if(o.esc)return{text:`穿出外圆：离 O 最远 ${cm(o.rmax,1)}，未被约束`,cls:'warn'};
      if(o.fin)return{text:o.minD<.005*o.r?'恰好被约束：轨迹与外圆内切':`被约束：已 ${o.lobes} 次进出磁场`,cls:'ok'};
      if(o.reg==='I')return{text:o.lobes?`第 ${o.lobes} 次回到内圆，穿过 O`:'从 O 沿直线飞向内圆',cls:''};
      return{text:`在磁场中偏转（第 ${o.lobes+1} 段）`,cls:''};
    }
    if(G.outer){
      if(o.passA.length){const a=o.passA[o.passA.length-1];return{text:`${a.enter?'回到 A 射入':'经过 A 射出'}：t = ${fmt(a.t/o.T,3)} T`,cls:'ok'}}
      return{text:`${o.reg==='F'?'圆内':'圆外'}偏转：第 ${o.nseg+1} 段`,cls:''};
    }
    if(!o.ex)return{text:o.reg==='F'?`在磁场中偏转：θ = ${dg(o.turn*DEG)}`:'飞向磁场',cls:''};
    const tan=G.bnd==='strip'&&o.ex.to==='L'&&o.minD<.005*o.r;
    return{text:`${tan?'与 PQ 相切，':''}从 ${o.ex.wh} 射出：θ = ${dg(o.ex.turn*DEG)}`,cls:'ok'};
  }

  /* ---------- 画图工具 ---------- */
  const nice=x=>{const p=Math.pow(10,Math.floor(Math.log10(x))),n=x/p;return(n<1.5?1:n<3.5?2:n<7.5?5:10)*p};
  const lenTxt=x=>x<1?`${+(x*100).toPrecision(3)} cm`:`${+x.toPrecision(3)} m`;

  return{
    legend:[{label:'速度 v',color:'--v'},{label:'洛伦兹力 F',color:'--n'}],
    init(P){
      norm(P);
      const{G,ps}=setup(P);
      if(ps.some(p=>!ok(p.r)||p.r<=0))return{G,ps:[],t:0,done:true,box:{x0:-1,x1:1,y0:-1,y1:1,L:2},status:{text:'参数无效',cls:'warn'}};
      const b=frame(G,ps),S={G,t:0,done:false,box:b};
      const vmax=Math.max(...ps.map(p=>p.v)),vmin=Math.min(...ps.map(p=>p.v)),Tmin=Math.min(...ps.map(p=>p.T)),Tmax=Math.max(...ps.map(p=>p.T));
      // 动画节奏：粒子在画面上约以半个取景框每秒的速度运动，且周期最短的粒子转一圈不少于 2.5 s；
      // 所有粒子都在无磁场区域（直线段）时只按前一条，免得半径很小时直线段走得太慢

      const m=.1*b.L;S.ob={x0:b.x0-m,x1:b.x1+m,y0:b.y0-m,y1:b.y1+m};
      S.ps=ps.map(p=>{const a=p.ang*RAD,vx=p.v*Math.cos(a),vy=p.v*Math.sin(a);
        const o={...p,x:p.x0,y:p.y0,vx,vy,v0:[vx,vy],t:0,cum:0,turn:0,tf:0,s:0,trail:[[p.x0,p.y0]],ev:[],arc:null,first:null,last:null,ex:null,
          gone:false,fin:false,minD:Infinity,tanPt:null,rmax:Math.hypot(p.x0,p.y0),passO:[],passA:[],lobes:0,nseg:0,esc:null,rep:null};
        o.reg=(G.bnd!=='ring'&&p.y0===0&&p.x0===0)?'F':cls(G,p.x0,p.y0);
        if(fac(G,o.reg)){o.arc={x:o.x,y:o.y,vx,vy,turn:0};o.first=o.arc}

    },
    step(S,P,dt){
      if(S.done)return;
      const G=S.G,span=dt*(S.ps.some(o=>!o.fin&&fac(G,o.reg))?S.TS:S.TSf);
      for(const o of S.ps)if(!o.fin)adv(S,o,span);
      S.t+=span;
      // 全部粒子离开磁场（不会再回来）后，再走约 1.2 s 画面时间就结束，不必等慢粒子飞出画面
      const away=o=>o.fin||(o.ex&&!fac(G,o.reg)&&(G.bnd!=='ring'||o.reg==='X'));
      if(S.tAway===undefined&&S.ps.every(away))S.tAway=S.t;
      if(S.ps.every(o=>o.fin)||S.t>=S.tMax||(S.tAway!==undefined&&S.t-S.tAway>=1.2*S.TSf))S.done=true;

    },
    readouts(S,P){

      const pos=q=>`(${fmt(q.x*100,2)}, ${fmt(q.y*100,2)}) cm`;
      const AC=e=>Math.hypot(e.x-(G.bnd==='ring'?0:o.x0),e.y-(G.bnd==='ring'?0:o.y0));
      if(G.show==='single'){
        R.push(['半径 r（公式）',cm(o.r)],['周期 T',ns(o.T)],['已运动时间 t',ns(o.t)],['磁场中时间 t磁',ns(o.tf)],
          ['t磁 / T',fmt(o.tf/o.T,4)],['偏转角 θ（实测累计）',dg(o.turn*DEG)],['θ / 360°',fmt(o.turn/TAU,4)],
          ['速率 v（实测）',vs(Math.hypot(o.vx,o.vy))],[G.bnd==='ring'?'位置 (x, y)，O 为原点':'位置 (x, y)，A 为原点',pos(o)]);
        if(G.bnd==='ring'){R.push(['离 O 最远',cm(o.rmax)],['路程 s',fmt(o.s,4)+' m'],['进出磁场',`${o.lobes} 次`+(o.esc?'，已穿出':'')]);
          if(o.rep)R.push(['轨迹重复一次：路程',fmt(o.rep.s,4)+' m'],['轨迹重复一次：时间',ns(o.rep.t)]);
          return R}
        if(G.outer){o.passA.forEach((a,i)=>R.push([`第 ${i+1} 次${a.enter?'回到 A 射入':'经过 A'}`,`${ns(a.t)}（${fmt(a.t/o.T,3)} T）`]));
          if(o.passA.length>1)R.push(['两次间隔 Δt',ns(o.passA[1].t-o.passA[0].t)]);
          if(o.ex)R.push(['第一次射出圆 C',pos(o.ex)],['圆内一段 θ',dg(o.ex.turn*DEG)]);
          return R}
        if(o.ex){const e=o.ex;R.push(['出射边界',e.wh+(G.bnd==='strip'&&e.to==='L'&&o.minD<.005*o.r?'（与 PQ 相切）':'')],['出射点 C',pos(e)],['AC',cm(AC(e))],['出射时 θ',dg(e.turn*DEG)],['出射时 t',ns(e.t)])}
        if(G.bnd==='strip')R.push(['离 PQ 最近',cm(Math.max(0,o.minD))]);
        return R;
      }
      if(G.show==='duo'){const[a,b]=ps;
        R.push(['半径 r₁',cm(a.r)],['半径 r₂',cm(b.r)],['周期 T₁',ns(a.T)],['周期 T₂',ns(b.T)],['已运动时间 t',ns(S.t)],
          ['偏转角 θ₁',dg(a.turn*DEG)],['偏转角 θ₂',dg(b.turn*DEG)]);
        if(G.bnd==='ring'){R.push(['离 O 最远（1）',cm(a.rmax)],['离 O 最远（2）',cm(b.rmax)]);return R}
        [a,b].forEach((q,i)=>{if(q.ex)R.push([`粒子 ${i+1} 出射时 t`,ns(q.ex.t)],[`粒子 ${i+1} 出射时 θ`,dg(q.ex.turn*DEG)],[`AC${sub[i+1]}（${q.ex.wh}）`,cm(AC(q.ex))])});
        const fe=S.firstEx;if(fe){const i=ps.indexOf(fe.who),j=1-i;R.push([`粒子 ${i+1} 射出时 θ${sub[j+1]}`,dg(fe.others[j]*DEG)])}
        return R;
      }
      // 多粒子
      const rs=ps.map(q=>q.r),ex=ps.filter(q=>q.ex);

      if(G.bnd==='ring'){R.push(['穿出外圆',`${ps.filter(q=>q.esc).length} / ${ps.length}`],['离 O 最远',cm(Math.max(...ps.map(q=>q.rmax)))]);return R}

        const rng=(a,f)=>{const lo=Math.min(...a),hi=Math.max(...a);return hi-lo<=1e-6*Math.max(Math.abs(lo),Math.abs(hi))?`均为 ${f(lo)}`:`${f(lo)} ~ ${f(hi)}`};
        R.push(['出射偏转角 θ',rng(th,dg)],['磁场中时间',rng(tt,ns)]);

          R.push(['出射点分布范围',cm(sp,3)],['出射点（平均）',`(${fmt(xs.reduce((a,b)=>a+b)/xs.length*100,2)}, ${fmt(ys.reduce((a,b)=>a+b)/ys.length*100,2)}) cm`])}
        else R.push(['AC（到 A 的距离）',rng(ac,x=>cm(x))]);
        if(G.show==='rot'&&G.bnd==='circle'){const d=ex.map(q=>{const a=Math.atan2(q.ex.vy,q.ex.vx)*DEG;return Math.abs(Math.abs(a)-180)<1e-6?180:(a+360)%360});R.push(['出射速度方向（与 +x 夹角）',rng(d,dg)])}
      }

    },
    draw(ctx,S,P,W,H,tok){
      // 试卷线稿：边界墨线，× / · 辅助色小号点阵，轨迹细虚线，完整轨迹圆更淡；只有 v（--v）与洛伦兹力 F（--n）带颜色
      const F=FIG(ctx,W,tok),u=F.u,ut=F.ut,G=S.G,ps=S.ps,cV=tok('--v'),cN=tok('--n'),AUX=F.auxColor,INK=F.ink;
      const css=ctx.canvas.clientWidth||W,px=W/css,wide=!matchMedia('(max-width:640px)').matches;
      const SERIF='"Times New Roman","STIX Two Text",Times,serif',SANS=tok('--f-body');

      // —— 防叠字：每个字给几个候选位置，取第一个不出界、不压已占位置的 ——
      const obs=[],todo=[],segs=[],rings=[],meet=(a,c)=>a.x<c.x+c.w&&c.x<a.x+a.w&&a.y<c.y+c.h&&c.y<a.y+a.h;

      const put=(sg,cands,o={})=>{const sz=o.size||19,w=wid(sg,sz),h=sz*ut*.95,bx=([x,y])=>({x:x-w/2-2*ut,y:y-h/2-2*ut,w:w+4*ut,h:h+4*ut});

      // 粒子与矢量（v 沿速度，F 指向圆心）

      // 速度垂线：入射点 → 圆心（单个粒子第一段；放缩圆画出所有圆心所在的那条线）

      if(G.show==='zoom'&&G.bnd!=='ring'){const far=ps[ps.length-1],c=SX(far.th.c),a=SX([far.th.ex,far.th.ey]);perp=[a[0],a[1],a[0]+(c[0]-a[0])*1.12,a[1]+(c[1]-a[1])*1.12]}

          if(th>3&&th<177&&Math.abs(den)>1e-12){const dx=e.x-f.x,dy=e.y-f.y,s1=(dx*a2[1]-dy*a2[0])/den,q=SX([f.x+a1[0]*s1,f.y+a1[1]*s1]);
            if(s1>0&&q[0]>0&&q[0]<W&&q[1]>top&&q[1]<H){const L=34*u,b1=Math.atan2(-a1[1],a1[0]),b2=Math.atan2(-a2[1],a2[0]),fp=SX([f.x,f.y]),ep=SX([e.x,e.y]);
              defl={Q:q,th,s:o.last?o.last.sig:o.sig,a1:b1,l1:[fp[0],fp[1],q[0]+Math.cos(b1)*L,q[1]+Math.sin(b1)*L],l2:[ep[0],ep[1],q[0]-Math.cos(b2)*L*.4,q[1]-Math.sin(b2)*L*.4]};

      if(G.show==='beam'&&ps.every(o=>o.ex)){const xs=ps.map(o=>o.ex.x),ys=ps.map(o=>o.ex.y);

      {const c=[];

      {const p=44*u,e=3.4*u,inS=P.Bdir!=='out';

      /* ===== 4. 辅助线：完整轨迹圆、速度垂线、半径、圆心角、偏转角 ===== */
      const angArc=(c,a0,turn,sig,rr)=>{if(turn<1e-3)return;const tt=Math.min(turn,TAU-1e-3);

      arcs.forEach(({arc,c,st,en,a0,rr})=>{
        F.circle(c[0],c[1],arc.r*sc,{w:.9,color:AUX,dash:[2,5]});
        F.aux(c[0],c[1],st[0],st[1],{dash:[4,4]});F.aux(c[0],c[1],en[0],en[1],{dash:[4,4]});
        if(single)angArc(c,a0,arc.turn,arc.sig,rr)});
      // 速度垂线：入射点 → 圆心（单个粒子第一段；放缩圆画出所有圆心所在的那条线）
      if(perp)F.aux(...perp);
      if(G.show==='zoom'&&G.bnd!=='ring')ps.forEach(q=>{const cc=SX(q.th.c);F.dot(cc[0],cc[1],1.8,AUX)});
      if(defl){F.aux(...defl.l1);F.aux(...defl.l2);angArc(defl.Q,defl.a1,defl.th*RAD,defl.s,20*u)}

      /* ===== 5. 轨迹 ===== */
      parts.forEach(({o},i)=>{const pts2=o.trail.map(SX);pts2.push(SX([o.x,o.y]));
        if(multi){F.poly(pts2,{w:.9,color:INK});return}
        F.poly(pts2,{w:3.2,color:F.paper});F.trail(pts2,i?{dash:[9,3,1.5,3]}:{})});

      /* ===== 6. 矢量、粒子、点 ===== */
      vecs.forEach(([p,dx,dy,col])=>F.arrow(p[0],p[1],dx,dy,col,null));
      parts.forEach(({o,p})=>{
        if(multi){F.dot(p[0],p[1],2.4);return}
        F.ball(p[0],p[1],rb);const e=3.6*u;F.line(p[0]-e,p[1],p[0]+e,p[1],{w:1.3});if(o.sg>0)F.line(p[0],p[1]-e,p[0],p[1]+e,{w:1.3});
        F.dot(p[0],p[1],1.6)});
      pts.forEach(q=>F.dot(q[0],q[1],2.4));arcs.forEach(({c})=>F.dot(c[0],c[1],2.4));
      if(G.bnd==='circle'||G.bnd==='ring')F.dot(O[0],O[1],2.4);
      if(tanAt)F.dot(tanAt[0],tanAt[1],2.2);

      /* ===== 7. 文字 ===== */
      todo.forEach(([sg,x,y,o])=>rich(sg,x,y,o));
      ctx.restore();

      /* ===== 8. 比例尺（右下角） ===== */
      {const len=nice((xR-xL)*.2/sc),Lp=len*sc,x2=W-14*u,x1=x2-Lp,y=H-10*u-4*ut;
        F.rect(x1-6*u,y-22*ut,Lp+12*u,22*ut+8*u,{w:0,fill:F.paper});F.line(x1,y,x2,y,{w:1.2});F.line(x1,y-4*u,x1,y+4*u,{w:1.2});F.line(x2,y-4*u,x2,y+4*u,{w:1.2});
        F.label(lenTxt(len),(x1+x2)/2,y-11*ut,{italic:false,size:14})}
    },
    verdict(P){
      norm(P);ui(P);
      const{G,ps}=setup(P),B=x=>`<b>${x}</b>`;
      const dir=p=>`${p.sg>0?'正':'负'}电荷、B ${P.Bdir==='out'?'向外':'向里'}：粒子${p.sig>0?'逆时针转（向左偏）':'顺时针转（向右偏）'}`;
      const head=(p,k='')=>`r${k} = v${k}/((q/m)${k}B) = ${B(cm(p.r))}，T${k} = 2π/((q/m)${k}B) = ${B(sci(p.T)+' s')}（${fmt(p.T*1e9,1)} ns）`;
      const side=x=>x<0?'左':'右';
      const one=(p,k='')=>{const t=p.th;let h=head(p,k)+'。'+dir(p);
        if(G.bnd==='line')return h+`，γ = ${fmt(t.gam,1)}°（C6）：从 MN 射出，C 在 A ${side(t.x)}侧 AC = 2r sin γ = ${B(cm(Math.abs(t.x)))}，θ = 2γ = ${B(dg(t.th))}，t = θT/360° = ${B(sci(t.t-t.t0)+' s')}。`;
        if(G.bnd==='strip'){h+=`，γ = ${fmt(t.gam,1)}°。`;const cr=p.r*(1-Math.cos(t.gam*RAD));
          h+=t.wh==='PQ'?`r(1 − cos γ) = ${cm(cr)} > d：从 ${B('PQ')} 射出，出射点在 A ${side(t.x)}侧 ${B(cm(Math.abs(t.x)))} 处，θ = ${B(dg(t.th))}，t = ${B(sci(t.t)+' s')}（C4、C5）。`
            :`r(1 − cos γ) = ${cm(cr)} ${t.tan?'≈':'<'} d：${t.tan?B('恰好与 PQ 相切')+'，':''}从 ${B('MN')} 射出，AC = ${B(cm(Math.abs(t.x)))}，θ = ${B(dg(t.th))}，t = ${B(sci(t.t)+' s')}（C6）。`;
          return h+`恰好不从 PQ 射出的速率 v₀ = (q/m)Bd/(1 − cos γ) = ${B(vs(t.v0))}（C8）。`}
        if(G.bnd==='circle'){if(t.none)return h+'。';
          h+=`：从圆周上 C 点射出，C 在 (${fmt(t.x*100,2)}, ${fmt(t.y*100,2)}) cm，θ = ${B(dg(t.th))}，t = ${B(sci(t.t-t.t0)+' s')}`;
          if(t.radial)h+=`；径向射入必径向射出，tan(θ/2) = R/r = ${fmt(G.R/p.r,3)}（C7）`;
          h+='。';
          if(G.outer){h+=`<br>圆外反向：圆外每段转 ${B(dg(t.thOut))}，每段弦对 O 张开 ${fmt(Math.abs(t.al1),1)}°。`;
            h+=t.back?`经 ${t.back.n} 段${t.back.enter?'回到 A 射入':'从 A 穿出'}，用时 ${B(sci(t.back.t)+' s')}（${fmt(t.back.t/p.T,3)} T）。`:'转角不是 360° 的整数分之一，不会恰好回到 A。'}
          return h}
        // 环形
        h+=`。粒子沿半径从内圆 D 点进入磁场，离 O 最远 √(R₁² + r²) + r = ${B(cm(t.rho))} ${t.esc?'&gt;':t.tan?'≈':'&lt;'} R₂ = ${cm(G.R2)}：${t.esc?B('穿出外圆，未被约束'):B(t.tan?'恰好被约束（与外圆内切）':'被约束')}。`;
        h+=`被约束的最大速率 v_m = (q/m)B(R₂² − R₁²)/(2R₂) = ${B(vs(t.vm))}（C8）。`;
        if(!t.esc){h+=`每段圆弧 180° + 2arctan(r/R₁) = ${B(dg(t.lobe))}，用时 ${sci(t.tl)} s；下一次进入磁场的位置绕 O 转过 ${dg(180+t.doe)}。`;
          if(Math.abs(p.r-G.R1)<.005*G.R1)h+=`r = R₁：4 段后回到原位置、原方向，路程 (8 + 6π)R₁ = ${B(fmt((8+6*Math.PI)*G.R1,3)+' m')}，时间 ${B(sci((8+6*Math.PI)*G.R1/p.v)+' s')}。`}
        return h};
      let h='';
      if(G.adj)h+=`R₂ 至少比 R₁ 大 2 cm，动画按 R₂ = ${cm(G.R2,1)} 计算。<br>`;
      if(G.show==='single')return h+one(ps[0]);
      if(G.show==='duo'){const[a,b]=ps;h+=`粒子 1：${one(a,'₁')}<br>粒子 2：${one(b,'₂')}`;
        if(G.bnd!=='ring'&&a.th.th!==undefined&&b.th.th!==undefined){const ta=a.th.t-a.th.t0,tb=b.th.t-b.th.t0;
          h+=`<br>r₁ : r₂ = ${fmt(a.r/b.r,3)}，T₁ : T₂ = ${fmt(a.T/b.T,3)}，磁场中时间 t₁ : t₂ = ${fmt(ta/tb,3)}。`;
          const[f,g]=ta<=tb?[a,b]:[b,a],k=f===a?1:2;h+=`粒子 ${k} 先射出，此时粒子 ${3-k} 已转过 ${B(dg((Math.min(ta,tb))/g.T*360))}。`}
        return h}
      const p=ps[0],t=p.th;
      if(G.show==='rot'){h+=`旋转圆：${ps.length} 个粒子速率相同，r = ${B(cm(p.r))}，T = ${sci(p.T)} s。`;
        if(G.bnd==='line')h+=`出射点都在 A 的${p.sig>0?'左':'右'}侧，AC = 2r sin γ，β = 90° 时最远，为 2r = ${B(cm(2*p.r))}（C6）。`;
        if(G.bnd==='strip')h+=`d ${p.r*2>G.d?'&lt;':'≥'} 2r：β 不同，有的从 PQ 射出、有的从 MN 射出，分界是与 PQ 相切（C8）。`;
        if(G.bnd==='circle')h+=Math.abs(p.r-G.R)<.005*G.R?`r = R：${B('磁发散')}，出射速度全部${p.sig>0?'水平向左':'水平向右'}，彼此平行（C7）。`:`r ≠ R：出射方向不平行；r = R 时才是磁发散（C7）。`;
        if(G.bnd==='ring')h+=`各方向的轨迹旋转对称：${t.esc?'都穿出外圆':'都被约束'}（离 O 最远 ${cm(t.rho)}，v_m = ${vs(t.vm)}）。`;
        return h}
      if(G.show==='zoom'){h+=`放缩圆：方向不变，10 个速率 0.2v ~ 2.0v，r = ${cm(ps[0].r)} ~ ${cm(ps[9].r)}，T = ${sci(p.T)} s 都相同，圆心都在入射速度的垂线上。`;
        if(G.bnd==='line')h+=`γ 不变：θ = ${B(dg(t.th))}、t = ${B(sci(t.t)+' s')} 都相同，出射速度平行，AC ∝ v（C6）。`;
        if(G.bnd==='strip')h+=`v₀ = ${B(vs(t.v0))}：速率 ≤ v₀ 的从 MN 射出，θ = ${dg(t.wh==='MN'?t.th:(p.sig>0?360-2*p.ang:2*p.ang))}；大于 v₀ 的从 PQ 射出，v 越大 θ、t 越小（C8）。`;
        if(G.bnd==='circle')h+=t.radial?'径向射入：tan(θ/2) = R/r，v 越大 θ、t 越小（C7）。':'v 越大 r 越大，θ、t 越小。';
        if(G.bnd==='ring')h+=`v_m = ${B(vs(t.vm))}：速率大于它的穿出外圆（C8）。`;
        return h}
      // 平行束
      return h+`平行束：9 个粒子竖直向上射入，r = ${B(cm(p.r))}，R = ${cm(G.R)}。`+(Math.abs(p.r-G.R)<.005*G.R?`r = R：${B('磁聚焦')}，全部会聚到圆的${p.sig>0?'最左点':'最右点'}（C7）。`:'r ≠ R：不会聚于一点；调 v 使 r = R 再看（C7）。');
    },
    _setup:setup
  };
})();

/* ================= 通用渲染引擎（所有母题共用，不改） ================= */
(()=>{
const D=JSON.parse(document.getElementById('data').textContent);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const root=document.documentElement;
const tok=n=>getComputedStyle(root).getPropertyValue(n).trim();
const PS=D.problem.params;
const P={};PS.forEach(p=>P[p.key]=p.def);
const unitSep=u=>/^[°′″]/.test(u)?'':' ';   // 角度单位紧贴数字：90°
const fmtP=p=>p.type==='choice'?p.options.find(o=>o.value===P[p.key]).label:(+P[p.key]).toFixed(p.dec??2)+(p.unit?unitSep(p.unit)+p.unit:'');

/* 静态内容 */
document.title=`格物 ${D.id} ${D.name.replace(/（.*）/,'')}`;
$('hName').textContent=D.name;
$('hSub').textContent=`${D.module} · ${D.chapter}　关联：${D.related.join('、')}`;
$('hTable').innerHTML=`<tr><th>编号</th><th>考查频率</th><th>难度</th><th>版本</th></tr>
<tr><td class="code">${esc(D.id)}</td><td>${esc(D.freq)}</td><td title="${D.difficulty} / 5">${'●'.repeat(D.difficulty)}${'○'.repeat(5-D.difficulty)}</td><td>${esc(D.version)}</td></tr>`;
$('foot').textContent=`格物 Gewu · ${D.id} · ${D.version} · ${D.footer??'g 取 10 m/s²'}`;   // 数据里可用 footer 改写页脚常量
$('tags').innerHTML=D.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('');
$('stemNote').textContent=D.problem.note||'';
$('bCond').innerHTML=D.boundary.conditions.map(c=>`<li><span>${esc(c)}</span></li>`).join('');
$('bBack').innerHTML=D.boundary.fallback.map(c=>`<li><span>${esc(c)}</span></li>`).join('');
$('legend').innerHTML=SIM.legend.map(l=>`<span><i style="background:var(${l.color})"></i>${esc(l.label)}</span>`).join('');
$('concl').innerHTML=D.conclusions.map(c=>`<details><summary><span class="badge">${c.id}</span><span class="t">${esc(c.title)}</span><span class="f">${esc(c.formula)}</span><span class="chev" aria-hidden="true"></span></summary><div class="deriv">${esc(c.derivation)}</div></details>`).join('');
const qCard=(q,isVar)=>`<article class="q">
  <div class="head"><span class="badge">${q.id}</span><h3>${esc(q.title)}</h3>${isVar?q.cs.map(c=>`<span class="chip">${c}</span>`).join(''):`<span class="chip">${q.anim?'计划做动画':'不做动画'}</span>`}</div>
  <p>${esc(q.stem)}</p>
  ${isVar?'':`<p class="map">映射：<b>${esc(q.map)}</b></p>`}
  <details><summary><span class="chev" aria-hidden="true"></span>答案与解析</summary><div class="ans"><p class="a">答案：${esc(q.answer)}</p><p>${esc(q.analysis)}</p></div></details>
  <div class="foot"><span class="src">${esc(q.source)}</span>${isVar?`<button data-load="${q.id}">加载到动画 ↑</button>`:''}</div>
</article>`;
$('variants').innerHTML=D.variants.map(v=>qCard(v,true)).join('');
$('reskins').innerHTML=D.reskins.map(r=>qCard(r,false)).join('');
$('sources').innerHTML=D.sources.map(s=>`<li><b>${esc(s.src)}</b><span>${esc(s.desc)}</span></li>`).join('');

/* 参数控件 */
const box=$('params');
PS.forEach(p=>{
  if(p.type==='choice'){
    const d=document.createElement('div');d.className='seg';d.id=`f-${p.key}`;d.setAttribute('role','group');d.setAttribute('aria-label',p.label);
    d.innerHTML=p.options.map(o=>`<button id="opt-${p.key}-${o.value}" data-k="${p.key}" data-v="${o.value}">${esc(o.label)}${o.hint?`<small>${esc(o.hint)}</small>`:""}</button>`).join('');
    box.appendChild(d);
  }else{
    const d=document.createElement('div');d.className='field';d.id=`f-${p.key}`;
    d.innerHTML=`<label for="num-${p.key}"><span class="s">${esc(p.sym)}</span><span class="note">${esc(p.label)}</span></label><span class="numin"><input type="number" id="num-${p.key}" min="${p.min}" max="${p.max}" step="any" inputmode="decimal" aria-label="${esc(p.label)}"><span class="u">${esc(p.unit||'')}</span></span><input type="range" id="in-${p.key}" min="${p.min}" max="${p.max}" step="${p.step}" value="${p.def}" aria-label="${esc(p.label)} 滑块">`;
    box.appendChild(d);
    d.querySelector('input[type=range]').addEventListener('input',e=>{P[p.key]=+e.target.value;active=-1;sync();reset()});
    const num=d.querySelector('input[type=number]');
    num.addEventListener('change',()=>{let v=parseFloat(num.value);
      if(Number.isFinite(v)){v=Math.min(p.max,Math.max(p.min,v));P[p.key]=v;active=-1;reset()}sync()});
    num.addEventListener('keydown',e=>{if(e.key==='Enter')num.blur()});
  }
});
box.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;P[b.dataset.k]=b.dataset.v;active=-1;sync();reset()});
let active=-1;
const shown=w=>!w||Object.entries(w).every(([k,v])=>[].concat(v).includes(P[k]));
const CH0=PS.find(p=>p.type==='choice');   // 预设只按第一个选项参数（情境 / 模式）分组，其余选项由预设的 load 带过去
const chosen=o=>!CH0||o[CH0.key]===undefined||o[CH0.key]===P[CH0.key];
const numTxt=(p,v)=>String(+(+v).toFixed(Math.max(p.dec??2,4)));
function sync(){
  PS.forEach(p=>{
    if(p.type==='choice'){p.options.forEach(o=>$(`opt-${p.key}-${o.value}`).setAttribute('aria-pressed',P[p.key]===o.value));if(p.when)$(`f-${p.key}`).hidden=!shown(p.when)}
    else{$(`in-${p.key}`).value=P[p.key];const n=$(`num-${p.key}`);if(document.activeElement!==n)n.value=numTxt(p,P[p.key]);$(`f-${p.key}`).hidden=!shown(p.when)}
  });
  const fill=s=>esc(s).replace(/\{(\w+)\}/g,(m,k)=>{
    if(k==='constraint'){const p=PS.find(x=>x.type==='choice');return esc(p.options.find(o=>o.value===P[p.key]).text)}
    const p=PS.find(x=>x.key===k);return p?`<span class="num">${esc(fmtP(p))}</span>`:m});
  const [lead,ask='']=D.problem.stem.split(/问[:：]/);
  $('stem').innerHTML=fill(lead.trim());
  const qs=ask.split(/[①②③④⑤⑥]/).map(s=>s.trim()).filter(Boolean);
  $('asks').innerHTML=qs.map((q,i)=>`<li><b>${i+1}</b><span>${fill(q)}</span></li>`).join('');
  $('asks').hidden=!qs.length;
  $('verdict').innerHTML=SIM.verdict(P);
  const ch=PS.find(p=>p.type==='choice');
  $('presetMode').textContent=ch?`· ${ch.options.find(o=>o.value===P[ch.key]).label}`:'';
  $('presets').innerHTML=D.presets.map((p,i)=>chosen(p.load)?`<button data-preset="${i}" aria-pressed="${i===active}" title="${esc(p.note||'')}">${esc(p.label)}</button>`:'').join('');
  const pn=$('pnote'),ap=D.presets[active];pn.hidden=!(ap&&ap.note);if(ap&&ap.note)pn.innerHTML=`<b>${esc(ap.label)}</b>：${esc(ap.note)}`;
}
function load(o,i=-1){Object.assign(P,o);active=i;sync();reset()}
$('presets').addEventListener('click',e=>{const b=e.target.closest('[data-preset]');if(b)load(D.presets[+b.dataset.preset].load,+b.dataset.preset)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-load]');if(!b)return;
  load(D.variants.find(v=>v.id===b.dataset.load).load);
  show('pane-lab');document.querySelector('.board').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})});

/* 画布与循环 */
const cv=$('cv'),ctx=cv.getContext('2d');let S,running=false,speed=1,lastT=0;
function size(){const r=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);const w=Math.max(200,Math.round(r.width*dpr));if(cv.width!==w){cv.width=w;cv.height=w}}
function render(){size();SIM.draw(ctx,S,P,cv.width,cv.height,tok);
  $('readout').innerHTML=SIM.readouts(S,P).map(([k,v])=>`<div class="ro"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('');
  const st=$('status');st.textContent=S.status.text;st.className='status '+S.status.cls}
function reset(){running=false;S=SIM.init(P);$('play').textContent='▶ 发射';render()}
function loop(t){if(!running)return;const real=Math.min(.05,(t-lastT)/1000);lastT=t;
  const sim=real*speed,n=Math.max(1,Math.ceil(sim/5e-4));for(let i=0;i<n;i++)SIM.step(S,P,sim/n);
  render();if(S.done){running=false;$('play').textContent='▶ 再发射';return}requestAnimationFrame(loop)}
$('play').onclick=()=>{if(running){running=false;$('play').textContent='▶ 继续';return}
  if(S.done)S=SIM.init(P);running=true;$('play').textContent='❚❚ 暂停';lastT=performance.now();requestAnimationFrame(loop)};
$('reset').onclick=reset;
$('slow').onclick=()=>{speed=speed===1?.25:1;$('slow').textContent=speed===1?'慢放 ×0.25':'正常速度'};
new ResizeObserver(render).observe(cv);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);
new MutationObserver(render).observe(root,{attributes:true,attributeFilter:['data-theme']});
/* 选项卡 */
const tabs=[...document.querySelectorAll('[role=tab]')];
function show(id){tabs.forEach(t=>{const on=t.dataset.pane===id;t.setAttribute('aria-selected',on);t.tabIndex=on?0:-1;$(t.dataset.pane).hidden=!on});
  if(id==='pane-lab')requestAnimationFrame(render)}
tabs.forEach((t,i)=>{t.addEventListener('click',()=>show(t.dataset.pane));
  t.addEventListener('keydown',e=>{const d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;if(!d)return;e.preventDefault();
    const n=tabs[(i+d+tabs.length)%tabs.length];n.focus();show(n.dataset.pane)})});
$('nConcl').textContent=D.conclusions.length;$('nVar').textContent=D.variants.length;$('nSkin').textContent=D.reskins.length;$('nSrc').textContent=D.sources.length;
show('pane-lab');
sync();reset();
})();
</script>
