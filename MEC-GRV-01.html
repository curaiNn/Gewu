<script>
/* ================= SIM 模块：每个母题替换这一段 =================
   约定接口：
   SIM.legend            [{label, color(CSS 变量名)}]
   SIM.init(P)           → 状态 S（含 S.done、S.status={text,cls}）
   SIM.step(S,P,dt)      推进 dt 秒（引擎保证 dt ≤ 0.5 ms）
   SIM.readouts(S,P)     → [[标签, 带单位的值]]
   SIM.draw(ctx,S,P,W,H,tok)  tok(name) 取主题色
   SIM.verdict(P)        → 理论预判 HTML
*/
const SIM=(()=>{
  const g=10,RE=6.4e6,GM=g*RE*RE,TAU=2*Math.PI;
  const fmt=(x,d=2)=>(Math.abs(x)<1e-12?0:x).toFixed(d);
  const SUP={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
  const sci=(x,d=2)=>{if(!isFinite(x))return'—';if(Math.abs(x)<1e-300)return'0';let e=Math.floor(Math.log10(Math.abs(x))),m=x/Math.pow(10,e);
    if(Math.abs(+m.toFixed(d))>=10){m/=10;e++}return m.toFixed(d).replace('-','−')+'×10'+String(e).replace(/./g,c=>SUP[c])};
  const km=r=>fmt(r/1e3,0)+' km',kms=v=>fmt(v/1e3,2)+' km/s',ms2=a=>(a>=1?fmt(a,2):fmt(a,3))+' m/s²';
  const tfmt=s=>!isFinite(s)?'—':s<7200?fmt(s/60,1)+' min':fmt(s/3600,2)+' h';
  const vc=r=>Math.sqrt(GM/r),Tc=r=>TAU*Math.sqrt(r*r*r/GM);
  const sat=(r,v)=>({x:r,y:0,vx:0,vy:v,cum:0,last:0,T1:null,rmin:r,rmax:r,trail:[[r,0]]});
  const acc=(x,y)=>{const r2=x*x+y*y,k=-GM/(r2*Math.sqrt(r2));return[k*x,k*y]};
  function rk4(o,h){                                   // 对 (x,y,vx,vy) 做一步 RK4
    const{x,y,vx,vy}=o,a1=acc(x,y);
    const x2=x+vx*h/2,y2=y+vy*h/2,u2=vx+a1[0]*h/2,w2=vy+a1[1]*h/2,a2=acc(x2,y2);
    const x3=x+u2*h/2,y3=y+w2*h/2,u3=vx+a2[0]*h/2,w3=vy+a2[1]*h/2,a3=acc(x3,y3);
    const x4=x+u3*h,y4=y+w3*h,u4=vx+a3[0]*h,w4=vy+a3[1]*h,a4=acc(x4,y4);
    o.x=x+h/6*(vx+2*u2+2*u3+u4);o.y=y+h/6*(vy+2*w2+2*w3+w4);
    o.vx=vx+h/6*(a1[0]+2*a2[0]+2*a3[0]+a4[0]);o.vy=vy+h/6*(a1[1]+2*a2[1]+2*a3[1]+a4[1]);
  }
  const q=o=>{const r=Math.hypot(o.x,o.y),v=Math.hypot(o.vx,o.vy);return{r,v,T:TAU*r/v,a:GM/(r*r)}};
  const cmp=(a,b)=>a>b*(1+1e-9)?'&gt;':a<b*(1-1e-9)?'&lt;':'=';
  const orbitOf=(rA,k)=>{const k2=k*k,bound=k2<2-1e-12,other=bound?rA*k2/(2-k2):Infinity;
    return{bound,other,rp:Math.min(rA,other),ra:Math.max(rA,other),a:bound?(rA+other)/2:Infinity}};
  return{
    legend:[{label:'卫星 A',color:'--v'},{label:'卫星 B',color:'--warn'},{label:'速度 v',color:'--n'},{label:'加速度 a（指向地心）',color:'--g'}],
    init(P){
      const one=P.mode==='one',rA=P.rA*1e3,rB=P.rB*1e3,S={t:0,done:false,one,status:{text:'准备就绪',cls:''}};
      if(!one){
        S.sats=[sat(rA,vc(rA)),sat(rB,vc(rB))];
        const Tmin=Tc(Math.min(rA,rB));S.TS=Tmin/5;S.h=Tmin/20000;S.view=Math.max(rA,rB);
      }else{
        const O=orbitOf(rA,P.k),T0=Tc(rA),Tell=O.bound?Tc(O.a):Infinity;
        S.sats=[sat(rA,P.k*vc(rA))];Object.assign(S,O);
        S.TS=Math.max(T0/5,Math.min(Tell,20*T0)/10);
        S.h=Tc(Math.max(RE,Math.min(rA,O.rp)))/20000;
        S.view=O.bound?Math.max(rA,Math.min(O.ra,12*rA)):6*rA;
      }
      return S;
    },
    step(S,P,dt){
      if(S.done)return;
      const span=dt*S.TS,n=Math.max(1,Math.ceil(span/S.h-1e-9)),h=span/n;
      for(const o of S.sats){
        let tt=S.t;
        for(let i=0;i<n;i++){
          rk4(o,h);tt+=h;
          const r=Math.hypot(o.x,o.y),ang=Math.atan2(o.y,o.x);let d=ang-o.last;
          if(d>Math.PI)d-=TAU;else if(d<-Math.PI)d+=TAU;
          if(o.T1===null&&o.cum<TAU&&o.cum+d>=TAU)o.T1=tt-h+h*(TAU-o.cum)/d;   // 首次转满一圈的时刻（线性插值）
          o.cum+=d;o.last=ang;o.rmin=Math.min(o.rmin,r);o.rmax=Math.max(o.rmax,r);
          if(S.one&&r<RE){o.x*=RE/r;o.y*=RE/r;S.done=true;S.t=tt;
            S.status={text:`撞上地球表面（近地点地心距 ${km(S.rp)} < R地）`,cls:'warn'};o.trail.push([o.x,o.y]);return}
          if(S.one&&r>S.view*1.04){S.done=true;S.t=tt;
            S.status=S.bound?{text:`飞出画面（远地点 ${sci(S.ra/1e3)} km），动画到此结束`,cls:''}:{text:'k² ≥ 2：卫星逃逸，不再回来（→ MEC-GRV-02）',cls:'warn'};return}
        }
        const L=o.trail[o.trail.length-1];
        if(Math.hypot(o.x-L[0],o.y-L[1])>S.view*0.006){o.trail.push([o.x,o.y]);if(o.trail.length>4000)o.trail.shift()}
      }
      S.t+=span;
      const lA=S.sats[0].cum/TAU;
      if(!S.one){const lB=S.sats[1].cum/TAU;
        S.status={text:`A ${fmt(lA,2)} 圈 · B ${fmt(lB,2)} 圈${Math.abs(P.rA-P.rB)<1e-9?'（同轨道）':P.rA<P.rB?'（内侧 A 快）':'（内侧 B 快）'}`,cls:lA>=1?'ok':''};
      }else{
        const c=q(S.sats[0]);
        S.status={text:Math.abs(P.k-1)<1e-9?`圆轨道 · ${fmt(lA,2)} 圈`:S.bound?`椭圆轨道 · ${fmt(lA,2)} 圈`:`逃逸中 · r = ${km(c.r)}`,cls:lA>=1?'ok':''};
      }
    },
    readouts(S,P){
      if(!S.one){
        const A=q(S.sats[0]),B=q(S.sats[1]);
        return[['r_A',km(A.r)],['r_B',km(B.r)],['v_A',kms(A.v)],['v_B',kms(B.v)],['T_A',tfmt(A.T)],['T_B',tfmt(B.T)],
          ['a_A',ms2(A.a)],['a_B',ms2(B.a)],['已运行 t',fmt(S.t/3600,2)+' h'],['A 转过圈数',fmt(Math.max(0,S.sats[0].cum/TAU),2)+' 圈']];
      }
      const o=S.sats[0],c=q(o),ek=.5*P.m*c.v*c.v,ep=-GM*P.m/c.r;
      return[['地心距 r',km(c.r)],['速度 v',kms(c.v)],['近地点 r近（实测）',km(o.rmin)],['远地点 r远（实测）',km(o.rmax)],
        ['已运行 t',fmt(S.t/3600,2)+' h'],['转过圈数',fmt(Math.max(0,o.cum/TAU),2)+' 圈'],
        ['动能 Ek',sci(ek)+' J'],['势能 Ep',sci(ep)+' J'],['机械能 E',sci(ek+ep)+' J']];
    },
    draw(ctx,S,P,W,H,tok){
      const u=W/720,css=(ctx.canvas&&ctx.canvas.clientWidth)||W,px=W/css,fz=Math.max(15*u,11*px);
      const fb=tok('--f-body'),fm=tok('--f-mono');
      ctx.clearRect(0,0,W,H);ctx.fillStyle=tok('--card');ctx.fillRect(0,0,W,H);
      // 底部对比条形图占一条，轨道画在其上方
      const Hs=5.4*fz,top=0,avail=H-Hs-14*u;
      const cx=W/2,cy=top+avail/2+8*u,Rv=Math.min(W*0.46,avail/2-6*u),sc=Rv/S.view,X=x=>cx+x*sc,Y=y=>cy-y*sc;
      // 刻度圈：R地 的整数倍
      const nmax=S.view/RE,steps=[1,2,5,10,20,50,100,200];let st=steps.find(s=>nmax/s<=7)||500;
      ctx.setLineDash([4*u,7*u]);ctx.lineWidth=1.2*u;ctx.strokeStyle=tok('--line');ctx.font=`${Math.max(12*u,10*px)}px ${fb}`;ctx.fillStyle=tok('--faint');
      for(let n=st===1?2:st;n*RE<=S.view*1.06;n+=st){const rr=n*RE*sc;ctx.beginPath();ctx.arc(cx,cy,rr,0,TAU);ctx.stroke();
        if(rr>22*u)ctx.fillText(`${n}R地`,cx-rr*0.707-8*u,cy+rr*0.707+14*u)}
      ctx.setLineDash([]);
      // 地球
      const re=Math.max(RE*sc,5*u);ctx.fillStyle=tok('--accent-soft');ctx.strokeStyle=tok('--accent');ctx.lineWidth=2*u;
      ctx.beginPath();ctx.arc(cx,cy,re,0,TAU);ctx.fill();ctx.stroke();
      ctx.globalAlpha=.3;ctx.lineWidth=1*u;ctx.beginPath();ctx.ellipse(cx,cy,re,re*.35,0,0,TAU);ctx.moveTo(cx,cy-re);ctx.lineTo(cx,cy+re);ctx.stroke();ctx.globalAlpha=1;
      if(re>26*u){ctx.fillStyle=tok('--accent');ctx.font=`600 ${Math.max(14*u,11*px)}px ${fb}`;ctx.textAlign='center';ctx.fillText('地球',cx,cy+re*0.62+5*u);ctx.textAlign='left'}
      const cols=S.one?['--v']:['--v','--warn'];
      // 轨道
      if(!S.one){S.sats.forEach((o,i)=>{const r0=(i?P.rB:P.rA)*1e3;ctx.strokeStyle=tok(cols[i]);ctx.globalAlpha=.55;ctx.lineWidth=2.2*u;ctx.beginPath();ctx.arc(cx,cy,r0*sc,0,TAU);ctx.stroke();ctx.globalAlpha=1})}
      else{ctx.setLineDash([3*u,6*u]);ctx.strokeStyle=tok('--muted');ctx.lineWidth=1.5*u;ctx.beginPath();ctx.arc(cx,cy,P.rA*1e3*sc,0,TAU);ctx.stroke();ctx.setLineDash([]);
        const tr=S.sats[0].trail;if(tr.length>1){ctx.strokeStyle=tok('--v');ctx.lineWidth=2.5*u;ctx.beginPath();tr.forEach(([x,y],i)=>i?ctx.lineTo(X(x),Y(y)):ctx.moveTo(X(x),Y(y)));
          const o=S.sats[0];ctx.lineTo(X(o.x),Y(o.y));ctx.stroke()}}
      // 矢量
      const arrow=(bx,by,dx,dy,col,lab)=>{const Lg=Math.hypot(dx,dy);if(Lg<3*u)return;ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=3*u;ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx+dx,by+dy);ctx.stroke();const a=Math.atan2(dy,dx),hs=10*u;
        ctx.beginPath();ctx.moveTo(bx+dx,by+dy);ctx.lineTo(bx+dx-hs*Math.cos(a-.4),by+dy-hs*Math.sin(a-.4));ctx.lineTo(bx+dx-hs*Math.cos(a+.4),by+dy-hs*Math.sin(a+.4));ctx.closePath();ctx.fill();
        ctx.font=`600 ${Math.max(16*u,11*px)}px ${fm}`;ctx.fillText(lab,bx+dx+10*u*Math.cos(a)-5*u,by+dy+10*u*Math.sin(a)+6*u)};
      const Q=S.sats.map(q);
      const vref=S.one?vc(P.rA*1e3):Math.max(...Q.map(c=>c.v)),aref=S.one?GM/Math.pow(P.rA*1e3,2):Math.max(...Q.map(c=>c.a));
      S.sats.forEach((o,i)=>{const c=Q[i],bx=X(o.x),by=Y(o.y);
        const Lv=Math.max(10*u,Math.min(200*u,80*u*c.v/vref)),La=Math.max(10*u,Math.min(160*u,70*u*c.a/aref));   // 按两星之比画，过小时取最短 10 单位以便看见
        arrow(bx,by,-o.x/c.r*La,o.y/c.r*La,tok('--g'),'a');
        arrow(bx,by,o.vx/c.v*Lv,-o.vy/c.v*Lv,tok('--n'),'v');
        ctx.fillStyle=tok(cols[i]);ctx.strokeStyle=tok('--card');ctx.lineWidth=2.5*u;ctx.beginPath();ctx.arc(bx,by,9*u,0,TAU);ctx.fill();ctx.stroke();
        ctx.font=`700 ${Math.max(17*u,12*px)}px ${fm}`;ctx.fillText(S.one?'A':(i?'B':'A'),bx+o.x/c.r*20*u-6*u,by-o.y/c.r*20*u+6*u)});
      // 对比条形图
      const x0=10*u,y0=H-Hs-4*u,w=W-20*u;
      ctx.fillStyle=tok('--sunk');ctx.strokeStyle=tok('--line');ctx.lineWidth=1*u;ctx.beginPath();
      if(ctx.roundRect)ctx.roundRect(x0,y0,w,Hs,8*u);else ctx.rect(x0,y0,w,Hs);ctx.fill();ctx.stroke();
      let groups;
      if(!S.one){const[A,B]=Q;
        groups=[{h:'线速度 v（km/s）',rows:[['A',A.v/1e3,'--v'],['B',B.v/1e3,'--warn']],d:2},
          {h:'周期 T（'+(Math.max(A.T,B.T)<7200?'min':'h')+'）',rows:[['A',A.T,'--v'],['B',B.T,'--warn']],T:Math.max(A.T,B.T)<7200?60:3600,d:Math.max(A.T,B.T)<7200?1:2},
          {h:'加速度 a（m/s²）',rows:[['A',A.a,'--v'],['B',B.a,'--warn']],d:Math.min(A.a,B.a)<1?3:2}];
      }else{const c=Q[0],v1=vc(c.r);
        groups=[{h:'当前 v（km/s）',rows:[['v',c.v/1e3,'--n']],d:2,max:Math.SQRT2*v1/1e3},
          {h:'该处 v圆（km/s）',rows:[['v圆',v1/1e3,'--v']],d:2,max:Math.SQRT2*v1/1e3},
          {h:'该处 v逃 = √2 v圆',rows:[['v逃',Math.SQRT2*v1/1e3,'--g']],d:2,max:Math.SQRT2*v1/1e3}];}
      const gw=w/3,pad=0.6*fz;
      groups.forEach((G,gi)=>{const gx=x0+gi*gw+pad,gW=gw-1.6*pad;let yy=y0+pad+fz*0.85;
        ctx.fillStyle=tok('--muted');ctx.font=`600 ${fz*0.92}px ${fb}`;ctx.fillText(G.h,gx,yy,gW);
        const vals=G.rows.map(r=>r[1]/(G.T||1)),mx=G.max||Math.max(...vals),lw=(S.one?2.4:1.1)*fz,vw=3.3*fz,bw=Math.max(4*u,gW-lw-vw);
        G.rows.forEach((r,ri)=>{yy=y0+pad+fz*(2.05+ri*1.45);const val=vals[ri];
          ctx.fillStyle=tok(r[2]);ctx.font=`700 ${fz*0.9}px ${fm}`;ctx.fillText(r[0],gx,yy);
          ctx.fillStyle=tok('--hair');ctx.fillRect(gx+lw,yy-fz*0.72,bw,fz*0.8);
          ctx.fillStyle=tok(r[2]);ctx.fillRect(gx+lw,yy-fz*0.72,Math.max(1.5*u,bw*Math.min(1,val/mx)),fz*0.8);
          ctx.fillStyle=tok('--ink');ctx.font=`600 ${fz*0.9}px ${fm}`;ctx.fillText(fmt(val,G.d),gx+lw+bw+0.35*fz,yy)});
      });
    },
    verdict(P){
      const rA=P.rA*1e3,rB=P.rB*1e3,m=P.m;
      if(P.mode==='one'){
        const O=orbitOf(rA,P.k),v1=vc(rA),k=P.k;
        let h=`单星模式：A 处 v圆 = √(GM/r_A) = <b>${kms(v1)}</b>，v逃 = √2·v圆 = <b>${kms(Math.SQRT2*v1)}</b>，发射速度 v = k·v圆 = <b>${kms(k*v1)}</b>。<br>`;
        if(Math.abs(k-1)<1e-9)h+=`k = 1：圆轨道，T = <b>${tfmt(Tc(rA))}</b>（C2）。`;
        else if(!O.bound)h+=`k² = ${fmt(k*k)} ≥ 2：机械能 E = ½mv² − GMm/r ≥ 0，卫星逃逸，不再回来（MEC-GRV-02）。`;
        else{
          h+=k>1?`1 &lt; k &lt; √2：椭圆轨道，A 处为近地点，远地点地心距 r远 = r_A·k²/(2 − k²) = <b>${km(O.other)}</b>。`
                 :`k &lt; 1：椭圆轨道，A 处为远地点，近地点地心距 r近 = r_A·k²/(2 − k²) = <b>${km(O.other)}</b>。`;
          if(O.rp<RE)h+=` 近地点低于地面（R地 = 6400 km），会<b>撞上地球</b>。`;
          else h+=` 半长轴 a = <b>${km(O.a)}</b>，按开普勒第三定律 T = 2π√(a³/GM) = <b>${tfmt(Tc(O.a))}</b>。`;
        }
        const E=.5*m*k*k*v1*v1-GM*m/rA;
        h+=`<br>机械能 E = <b>${sci(E)} J</b>（圆轨道时 E = −GMm/(2r) = ${sci(-GM*m/(2*rA))} J）。以上为椭圆拓展，本母题结论以圆轨道（k = 1）为准。`;
        return h;
      }
      const f=r=>({v:vc(r),w:Math.sqrt(GM/(r*r*r)),T:Tc(r),a:GM/(r*r),Ek:GM*m/(2*r),Ep:-GM*m/r,E:-GM*m/(2*r)});
      const A=f(rA),B=f(rB);
      let h=`r_B / r_A = <b>${fmt(rB/rA,3)}</b>。`;
      h+=rA<rB?'A 在内侧，由 C4：v、ω、a 都是 A 大，T 是 B 大。':rA>rB?'B 在内侧，由 C4：v、ω、a 都是 B 大，T 是 A 大。':'两星同轨道，各量相等。';
      h+=`<br>v（C1）：v_A = <b>${kms(A.v)}</b> ${cmp(A.v,B.v)} v_B = <b>${kms(B.v)}</b>`;
      h+=`<br>ω（C2）：ω_A = <b>${sci(A.w)} rad/s</b> ${cmp(A.w,B.w)} ω_B = <b>${sci(B.w)} rad/s</b>`;
      h+=`<br>T（C2）：T_A = <b>${tfmt(A.T)}</b> ${cmp(A.T,B.T)} T_B = <b>${tfmt(B.T)}</b>`;
      h+=`<br>a（C3）：a_A = <b>${ms2(A.a)}</b> ${cmp(A.a,B.a)} a_B = <b>${ms2(B.a)}</b>`;
      h+=`<br>Ek（C6）：<b>${sci(A.Ek)} J</b> ${cmp(A.Ek,B.Ek)} <b>${sci(B.Ek)} J</b>`;
      h+=`<br>Ep（C6）：<b>${sci(A.Ep)} J</b> ${cmp(A.Ep,B.Ep)} <b>${sci(B.Ep)} J</b>`;
      h+=`<br>E（C6）：<b>${sci(A.E)} J</b> ${cmp(A.E,B.E)} <b>${sci(B.E)} J</b>`;
      h+=`<br>r³/T²（C5）：两星都等于 GM/(4π²) = <b>${sci(GM/(TAU*TAU))} m³/s²</b>。`;
      return h;
    },
    _q:q,_GM:GM,_Tc:Tc,_vc:vc
  };
})();

/* ================= 通用渲染引擎（所有母题共用，不改） ================= */
(()=>{
const D=JSON.parse(document.getElementById('data').textContent);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const root=document.documentElement;
const tok=n=>getComputedStyle(root).getPropertyValue(n).trim();
const PS=D.problem.params;
const P={};PS.forEach(p=>P[p.key]=p.def);
const fmtP=p=>p.type==='choice'?p.options.find(o=>o.value===P[p.key]).label:(+P[p.key]).toFixed(p.dec??2)+(p.unit?' '+p.unit:'');

/* 静态内容 */
document.title=`格物 ${D.id} ${D.name.replace(/（.*）/,'')}`;
$('hName').textContent=D.name;
$('hSub').textContent=`${D.module} · ${D.chapter}　关联：${D.related.join('、')}`;
$('hTable').innerHTML=`<tr><th>编号</th><th>考查频率</th><th>难度</th><th>版本</th></tr>
<tr><td class="code">${esc(D.id)}</td><td>${esc(D.freq)}</td><td title="${D.difficulty} / 5">${'●'.repeat(D.difficulty)}${'○'.repeat(5-D.difficulty)}</td><td>${esc(D.version)}</td></tr>`;
$('foot').textContent=`格物 Gewu · ${D.id} · ${D.version} · g 取 10 m/s²`;
$('tags').innerHTML=D.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('');
$('stemNote').textContent=D.problem.note||'';
$('bCond').innerHTML=D.boundary.conditions.map(c=>`<li><span>${esc(c)}</span></li>`).join('');
$('bBack').innerHTML=D.boundary.fallback.map(c=>`<li><span>${esc(c)}</span></li>`).join('');
$('legend').innerHTML=SIM.legend.map(l=>`<span><i style="background:var(${l.color})"></i>${esc(l.label)}</span>`).join('');
$('concl').innerHTML=D.conclusions.map(c=>`<details><summary><span class="badge">${c.id}</span><span class="t">${esc(c.title)}</span><span class="f">${esc(c.formula)}</span><span class="chev" aria-hidden="true"></span></summary><div class="deriv">${esc(c.derivation)}</div></details>`).join('');
const qCard=(q,isVar)=>`<article class="q">
  <div class="head"><span class="badge">${q.id}</span><h3>${esc(q.title)}</h3>${isVar?q.cs.map(c=>`<span class="chip">${c}</span>`).join(''):`<span class="chip">${q.anim?'计划做动画':'不做动画'}</span>`}</div>
  <p>${esc(q.stem)}</p>
  ${isVar?'':`<p class="map">映射：<b>${esc(q.map)}</b></p>`}
  <details><summary><span class="chev" aria-hidden="true"></span>答案与解析</summary><div class="ans"><p class="a">答案：${esc(q.answer)}</p><p>${esc(q.analysis)}</p></div></details>
  <div class="foot"><span class="src">${esc(q.source)}</span>${isVar?`<button data-load="${q.id}">加载到动画 ↑</button>`:''}</div>
</article>`;
$('variants').innerHTML=D.variants.map(v=>qCard(v,true)).join('');
$('reskins').innerHTML=D.reskins.map(r=>qCard(r,false)).join('');
$('sources').innerHTML=D.sources.map(s=>`<li><b>${esc(s.src)}</b><span>${esc(s.desc)}</span></li>`).join('');

/* 参数控件 */
const box=$('params');
PS.forEach(p=>{
  if(p.type==='choice'){
    const d=document.createElement('div');d.className='seg';d.setAttribute('role','group');d.setAttribute('aria-label',p.label);
    d.innerHTML=p.options.map(o=>`<button id="opt-${p.key}-${o.value}" data-k="${p.key}" data-v="${o.value}">${esc(o.label)}</button>`).join('');
    box.appendChild(d);
  }else{
    const d=document.createElement('div');d.className='field';d.id=`f-${p.key}`;
    d.innerHTML=`<label for="num-${p.key}"><span class="s">${esc(p.sym)}</span><span class="note">${esc(p.label)}</span></label><span class="numin"><input type="number" id="num-${p.key}" min="${p.min}" max="${p.max}" step="any" inputmode="decimal" aria-label="${esc(p.label)}"><span class="u">${esc(p.unit||'')}</span></span><input type="range" id="in-${p.key}" min="${p.min}" max="${p.max}" step="${p.step}" value="${p.def}" aria-label="${esc(p.label)} 滑块">`;
    box.appendChild(d);
    d.querySelector('input[type=range]').addEventListener('input',e=>{P[p.key]=+e.target.value;active=-1;sync();reset()});
    const num=d.querySelector('input[type=number]');
    num.addEventListener('change',()=>{let v=parseFloat(num.value);
      if(Number.isFinite(v)){v=Math.min(p.max,Math.max(p.min,v));P[p.key]=v;active=-1;reset()}sync()});
    num.addEventListener('keydown',e=>{if(e.key==='Enter')num.blur()});
  }
});
box.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;P[b.dataset.k]=b.dataset.v;active=-1;sync();reset()});
let active=-1;
const shown=w=>!w||Object.entries(w).every(([k,v])=>[].concat(v).includes(P[k]));
const chosen=o=>PS.every(p=>p.type!=='choice'||o[p.key]===undefined||o[p.key]===P[p.key]);
const numTxt=(p,v)=>String(+(+v).toFixed(Math.max(p.dec??2,4)));
function sync(){
  PS.forEach(p=>{
    if(p.type==='choice')p.options.forEach(o=>$(`opt-${p.key}-${o.value}`).setAttribute('aria-pressed',P[p.key]===o.value));
    else{$(`in-${p.key}`).value=P[p.key];const n=$(`num-${p.key}`);if(document.activeElement!==n)n.value=numTxt(p,P[p.key]);$(`f-${p.key}`).hidden=!shown(p.when)}
  });
  const fill=s=>esc(s).replace(/\{(\w+)\}/g,(m,k)=>{
    if(k==='constraint'){const p=PS.find(x=>x.type==='choice');return esc(p.options.find(o=>o.value===P[p.key]).text)}
    const p=PS.find(x=>x.key===k);return p?`<span class="num">${esc(fmtP(p))}</span>`:m});
  const [lead,ask='']=D.problem.stem.split(/问[:：]/);
  $('stem').innerHTML=fill(lead.trim());
  const qs=ask.split(/[①②③④⑤⑥]/).map(s=>s.trim()).filter(Boolean);
  $('asks').innerHTML=qs.map((q,i)=>`<li><b>${i+1}</b><span>${fill(q)}</span></li>`).join('');
  $('asks').hidden=!qs.length;
  $('verdict').innerHTML=SIM.verdict(P);
  const ch=PS.find(p=>p.type==='choice');
  $('presetMode').textContent=ch?`· ${ch.options.find(o=>o.value===P[ch.key]).label}`:'';
  $('presets').innerHTML=D.presets.map((p,i)=>chosen(p.load)?`<button data-preset="${i}" aria-pressed="${i===active}" title="${esc(p.note||'')}">${esc(p.label)}</button>`:'').join('');
  const pn=$('pnote'),ap=D.presets[active];pn.hidden=!(ap&&ap.note);if(ap&&ap.note)pn.innerHTML=`<b>${esc(ap.label)}</b>：${esc(ap.note)}`;
}
function load(o,i=-1){Object.assign(P,o);active=i;sync();reset()}
$('presets').addEventListener('click',e=>{const b=e.target.closest('[data-preset]');if(b)load(D.presets[+b.dataset.preset].load,+b.dataset.preset)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-load]');if(!b)return;
  load(D.variants.find(v=>v.id===b.dataset.load).load);
  show('pane-lab');document.querySelector('.board').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})});

/* 画布与循环 */
const cv=$('cv'),ctx=cv.getContext('2d');let S,running=false,speed=1,lastT=0;
function size(){const r=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);const w=Math.max(200,Math.round(r.width*dpr));if(cv.width!==w){cv.width=w;cv.height=w}}
function render(){size();SIM.draw(ctx,S,P,cv.width,cv.height,tok);
  $('readout').innerHTML=SIM.readouts(S,P).map(([k,v])=>`<div class="ro"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('');
  const st=$('status');st.textContent=S.status.text;st.className='status '+S.status.cls}
function reset(){running=false;S=SIM.init(P);$('play').textContent='▶ 发射';render()}
function loop(t){if(!running)return;const real=Math.min(.05,(t-lastT)/1000);lastT=t;
  const sim=real*speed,n=Math.max(1,Math.ceil(sim/5e-4));for(let i=0;i<n;i++)SIM.step(S,P,sim/n);
  render();if(S.done){running=false;$('play').textContent='▶ 再发射';return}requestAnimationFrame(loop)}
$('play').onclick=()=>{if(running){running=false;$('play').textContent='▶ 继续';return}
  if(S.done)S=SIM.init(P);running=true;$('play').textContent='❚❚ 暂停';lastT=performance.now();requestAnimationFrame(loop)};
$('reset').onclick=reset;
$('slow').onclick=()=>{speed=speed===1?.25:1;$('slow').textContent=speed===1?'慢放 ×0.25':'正常速度'};
new ResizeObserver(render).observe(cv);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);
new MutationObserver(render).observe(root,{attributes:true,attributeFilter:['data-theme']});
/* 选项卡 */
const tabs=[...document.querySelectorAll('[role=tab]')];
function show(id){tabs.forEach(t=>{const on=t.dataset.pane===id;t.setAttribute('aria-selected',on);t.tabIndex=on?0:-1;$(t.dataset.pane).hidden=!on});
  if(id==='pane-lab')requestAnimationFrame(render)}
tabs.forEach((t,i)=>{t.addEventListener('click',()=>show(t.dataset.pane));
  t.addEventListener('keydown',e=>{const d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;if(!d)return;e.preventDefault();
    const n=tabs[(i+d+tabs.length)%tabs.length];n.focus();show(n.dataset.pane)})});
$('nConcl').textContent=D.conclusions.length;$('nVar').textContent=D.variants.length;$('nSkin').textContent=D.reskins.length;$('nSrc').textContent=D.sources.length;
show('pane-lab');
sync();reset();
})();
</script>
