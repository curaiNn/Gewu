<script>
/* ================= 线稿绘图工具 FIG（所有母题共用，不改） =================
   画法照试卷插图：装置用墨线，固定面画斜线阴影，辅助线用虚线，物理量和点的字母用斜体衬线；
   只有矢量带颜色（--g 重力/外力，--n 弹力/约束力，--v 速度，--a 其他矢量）。
   用法：SIM.draw 里 const F=FIG(ctx,W,tok)；坐标是画布像素，F.u = W/720 是线宽与几何的基准单位，
   F.ut 是字号单位（窄屏时不再随画布缩小，保证字母不小于约 11 CSS 像素；自写文字函数也要用 F.ut 算字号）。
   颜色：F.ink 墨线、F.auxColor 辅助线、F.paper 纸色（F.aux 是画辅助线的方法，不是颜色）。 */
const FIG=(ctx,W,tok)=>{
  const u=W/720,ink=tok('--fig-ink'),aux=tok('--fig-aux'),paper=tok('--card');
  const dp=W/(ctx.canvas.clientWidth||W),ut=Math.max(u,dp*11/19);   // dp：每 CSS 像素的画布像素数
  const SERIF='"Times New Roman","STIX Two Text",Times,serif',SANS=tok('--f-body');
  const path=(fn,{w=1.6,color=ink,dash=null,fill=null}={})=>{ctx.save();ctx.beginPath();fn();
    if(fill){ctx.fillStyle=fill;ctx.fill()}
    if(w>0){ctx.lineWidth=w*u;ctx.strokeStyle=color;ctx.setLineDash(dash?dash.map(d=>d*u):[]);ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}
    ctx.restore()};
  // 文字先描一圈底色再填色，压在线条上也清楚
  const text=(t,x,y,font,color,align,base)=>{ctx.save();ctx.font=font;ctx.textAlign=align;ctx.textBaseline=base;
    ctx.lineJoin="round";ctx.lineWidth=5*ut;ctx.strokeStyle=paper;ctx.strokeText(t,x,y);ctx.fillStyle=color;ctx.fillText(t,x,y);ctx.restore()};
  const F={u,ut,ink,auxColor:aux,paper,
    clear(){ctx.save();ctx.setLineDash([]);ctx.fillStyle=paper;ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height);ctx.restore()},
    line(x1,y1,x2,y2,o){path(()=>{ctx.moveTo(x1,y1);ctx.lineTo(x2,y2)},o)},
    poly(pts,o){path(()=>pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y)),o)},
    circle(x,y,r,o){path(()=>ctx.arc(x,y,r,0,2*Math.PI),o)},
    arc(x,y,r,a0,a1,o){path(()=>ctx.arc(x,y,r,a0,a1),o)},
    rect(x,y,w,h,o){path(()=>ctx.rect(x,y,w,h),o)},
    // 辅助线（中心线、投影线等）
    aux(x1,y1,x2,y2,o={}){F.line(x1,y1,x2,y2,{w:1,color:aux,dash:[6,5],...o})},
    // 运动轨迹：细虚线
    trail(pts,o={}){if(pts.length>1)F.poly(pts,{w:1.3,color:aux,dash:[5,5],...o})},
    // 固定面斜线：沿 (x1,y1)→(x2,y2) 的直线，画在 side 一侧（屏幕坐标下，1 = 前进方向右手侧）
    hatch(x1,y1,x2,y2,side=1,{gap=12,len=10}={}){const L=Math.hypot(x2-x1,y2-y1),n=Math.max(1,Math.round(L/(gap*u)));
      const tx=(x2-x1)/L,ty=(y2-y1)/L,nx=-ty*side,ny=tx*side,ox=(nx-tx)*len*u/Math.SQRT2,oy=(ny-ty)*len*u/Math.SQRT2;
      path(()=>{for(let i=0;i<=n;i++){const x=x1+(x2-x1)*i/n,y=y1+(y2-y1)*i/n;ctx.moveTo(x,y);ctx.lineTo(x+ox,y+oy)}},{w:1,color:aux})},
    // 圆弧形固定面的斜线：out = true 画在圆外侧
    hatchArc(cx,cy,r,a0,a1,out=true,{gap=12,len=10}={}){const n=Math.max(1,Math.round(r*Math.abs(a1-a0)/(gap*u))),s=out?1:-1;
      path(()=>{for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n,c=Math.cos(a),si=Math.sin(a),x=cx+r*c,y=cy+r*si;
        const nx=c*s,ny=si*s,tx=-si,ty=c;ctx.moveTo(x,y);ctx.lineTo(x+(nx-tx)*len*u/Math.SQRT2,y+(ny-ty)*len*u/Math.SQRT2)}},{w:1,color:aux})},
    // 矢量：从 (x,y) 画到 (x+dx,y+dy)，细杆 + 窄实心箭头；label 用斜体写在箭头外侧，
    // 与别的矢量共线时用 off=[dx,dy]（单位 u，相对箭头尖）把标注挪到旁边
    arrow(x,y,dx,dy,color,label,{w=2,head=12,size=19,off=null}={}){const L=Math.hypot(dx,dy);if(L<2*u)return;
      const ux=dx/L,uy=dy/L,h=Math.min(head*u,L*.6),hw=h*.34,tx=x+dx,ty=y+dy;
      F.line(x,y,tx-ux*h*.7,ty-uy*h*.7,{w,color});
      path(()=>{ctx.moveTo(tx,ty);ctx.lineTo(tx-ux*h-uy*hw,ty-uy*h+ux*hw);ctx.lineTo(tx-ux*h+uy*hw,ty-uy*h-ux*hw);ctx.closePath()},{w:0,fill:color});
      if(label)F.label(label,off?tx+off[0]*u:tx+ux*14*u,off?ty+off[1]*u:ty+uy*14*u,{color,size})},
    // 斜体衬线字母（物理量、点名）
    label(t,x,y,{color=ink,size=19,align='center',base='middle',italic=true}={}){text(t,x,y,`${italic?'italic ':''}${size*ut}px ${SERIF}`,color,align,base)},
    // 中文小注
    zh(t,x,y,{color=aux,size=14,align='center',base='middle'}={}){text(t,x,y,`${size*ut}px ${SANS}`,color,align,base)},
    dot(x,y,r=2.6,color=ink){F.circle(x,y,r*u,{w:0,fill:color})},
    // 带名字的点：实心小点 + 斜体字母（dx、dy 为字母相对点的偏移，单位 u）
    point(x,y,name,dx=-13,dy=13){F.dot(x,y);if(name)F.label(name,x+dx*u,y+dy*u)},
    // 小球：空心圆，球心另用 F.dot 标出（矢量画完后再点，表示力作用在重心）
    ball(x,y,r){F.circle(x,y,r,{w:1.6,fill:paper})},
    // 尺寸标注：两端带箭头的细线，文字写在中点外侧 off（单位 u）
    dim(x1,y1,x2,y2,t,{off=14,color=ink}={}){const L=Math.hypot(x2-x1,y2-y1);if(L<4*u)return;const ux=(x2-x1)/L,uy=(y2-y1)/L,h=Math.min(8*u,L/3),hw=h*.38;
      F.line(x1,y1,x2,y2,{w:1,color});
      for(const[px,py,sx]of[[x1,y1,1],[x2,y2,-1]])path(()=>{ctx.moveTo(px,py);ctx.lineTo(px+sx*ux*h-uy*hw,py+sx*uy*h+ux*hw);ctx.lineTo(px+sx*ux*h+uy*hw,py+sx*uy*h-ux*hw);ctx.closePath()},{w:0,fill:color});
      if(t)F.label(t,(x1+x2)/2-uy*off*u,(y1+y2)/2+ux*off*u,{color})},
  };
  return F;
};

/* ================= SIM 模块：每个母题替换这一段 =================
   约定接口：
   SIM.legend            [{label, color(CSS 变量名)}]
   SIM.init(P)           → 状态 S（含 S.done、S.status={text,cls}）
   SIM.step(S,P,dt)      推进 dt 秒（引擎保证 dt ≤ 0.5 ms）
   SIM.readouts(S,P)     → [[标签, 带单位的值]]
   SIM.draw(ctx,S,P,W,H,tok)  tok(name) 取主题色
   SIM.verdict(P)        → 理论预判 HTML
*/
const SIM=(()=>{
  /* 带电粒子在匀强电场中的偏转：示波管（先加速后偏转）/ 类平抛（以 v₀ 射入）/ 液滴穿过竖直板（计重力）。
     物理：对每个粒子的 (x, y, vx, vy) 做 RK4，加速度按所在区域取值，不用预设轨迹：
       示波管加速段 a = ((q/m)U₀/s₀, 0)（s₀ = L/4 是画出的加速板间距，只用于播放，出加速板时 v₀ = √(2(q/m)U₀)）；
       偏转板间 a = (0, −(q/m)U/d)；其余区域 a = 0。液滴：板间 a = (−(q/m)U/d, −g)，板外 a = (0, −g)。
     事件：出加速板、进入 / 离开偏转板、打在极板上、到达荧光屏；液滴进入 / 离开两板、碰左板、到达 b 所在水平面。
       都在该步内二分定位，交点处换用新区域的加速度继续积分；打在板上后停在板上，不反弹。
     临界容差：出射点离板不到 0.2% d，或打板点离板右端不到 0.2% L，判为「恰好从板边飞出」（粒子继续飞出）；
       液滴落点离 b 不到 1 mm 判为「落到 b 点」；两种粒子在出口处偏移相差不到 0.1% d 判为「轨迹重合」。
     时间：微观粒子穿过偏转板约 10⁻⁷ s。动画把引擎给的时间步乘以放大倍数再推进：有粒子在偏转板间时，第一种粒子穿过偏转板约用 2 s；
       粒子都在板外时换用较大的倍数（板外各段合计约 1.4 s）。积分子步长 h ≤ (L/v₀)/20000，读数显示真实时间。
       液滴按真实时间计算，全程不到 1 s 时 0.25 倍速慢放，子步长 ≤ 0.25 ms。
     坐标：示波管 / 类平抛以偏转板入口中心为原点，x 沿板向右、y 向上；液滴以 a 点为原点，x 向右、y 向上；单位 m。
     引擎不支持的界面细节放在 verdict 里处理（引擎每次同步参数都会调用它）：
       ① q/m、v₀ 和液滴比荷用对数滑块：把滑块改成以 10 为底的对数刻度，在外层捕获它的 input 事件，换算成真值后交给数字输入框的
          change 事件，由引擎照常同步；输入框和题干里的这几个数改用科学计数；
       ② y₀ 自动限制在 ±d/2 内，H 自动保持不小于 h + L：越界时改写对应的输入框并触发 change（同 MEC-PRJ-01 的 d < L）。 */
  const g=10,RAD=Math.PI/180,DEG=180/Math.PI,PI=Math.PI,C0=3e8,T_IN=2,T_OUT=1.4;
  const SUP={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
  const ok=x=>typeof x==='number'&&isFinite(x);
  const fmt=(x,d=2)=>{if(!ok(x))return'—';return(Math.abs(x)<.5*Math.pow(10,-d)?0:x).toFixed(d).replace('-','−')};
  const exp10=x=>{const e=Math.floor(Math.log10(Math.abs(x)));return[x/Math.pow(10,e),e]};
  // 科学计数（d 位小数）：6.32×10⁵
  const sci=(x,d=2)=>{if(!ok(x))return'—';if(x===0)return'0';let[m,e]=exp10(x);if(Math.abs(+m.toFixed(d))>=10){m/=10;e++}
    return m.toFixed(d).replace('-','−')+'×10'+String(e).replace(/./g,c=>SUP[c])};
  // 三位有效数字；很大或很小时用科学计数
  const num=(x,sig=3)=>{if(!ok(x))return'—';if(x===0)return'0';const a=Math.abs(x);
    if(a>=1e-3&&a<1e5){const e=Math.floor(Math.log10(a));return fmt(x,Math.max(0,sig-1-e))}return sci(x,sig-1)};
  // 题干用的写法：1.0×10⁸、8.39×10⁵（三位有效数字，整数补一位小数）
  const sciS=x=>{if(!ok(x)||x<=0)return String(x);let[m,e]=exp10(x);m=+m.toPrecision(3);if(m>=10){m/=10;e++}
    return(Number.isInteger(m)?m.toFixed(1):String(m))+'×10'+String(e).replace(/./g,c=>SUP[c])};
  // 输入框里的写法：1e8、1.76e11、1e-4（引擎用 parseFloat 读回）
  const sci2=x=>{let[m,e]=exp10(x);m=+m.toPrecision(2);if(m>=10){m/=10;e++}return m.toFixed(1)+'×10'+String(e).replace(/./g,c=>SUP[c])};
  const sciIn=x=>{if(!ok(x)||x<=0)return String(x);let[m,e]=exp10(x);m=+m.toPrecision(5);if(m>=10){m=+(m/10).toPrecision(5);e++}return m+'e'+e};
  const NB=' ';   // 数字与单位之间用不换行空格
  const cmv=x=>{const c=Math.abs(x*100);return fmt(x*100,c>=100?2:c>=.1||c===0?3:4)};   // m → cm 的数字部分
  const cm=x=>ok(x)?cmv(x)+NB+'cm':'—';
  const ms=v=>ok(v)?num(v)+NB+'m/s':'—',sec=t=>ok(t)?num(t)+NB+'s':'—',volt=x=>ok(x)?num(x,4)+NB+'V':'—',dg=a=>ok(a)?fmt(a,2)+'°':'—';
  const sub=['₀','₁','₂'];

  /* ---------- 参数整理与理论值（只用于取景、动画节奏和理论预判；运动本身由 RK4 积分） ---------- */
  function geom(P){return P.scene==='drop'?geoDrop(P):geoMic(P,P.scene==='flat'?'flat':'osc')}
  function geoMic(P,sc){
    const osc=sc==='osc',L=Math.max(+P.L,.01)/100,d=Math.max(+P.d,.01)/100,D=Math.max(0,+P.D||0)/100,U=Math.max(0,+P.U||0),U0=Math.max(1e-9,+P.U0||0);
    const y0=Math.max(-d/2,Math.min(d/2,(+P.y0||0)/100)),E=U/d,s=d/2+y0;   // s：入射点到下板的距离
    const k1=Math.max(+P.km||0,1e-12),r2=Math.max(0,+P.r2||0);
    const K={sc,osc,L,d,D,U,U0,E,y0,s};
    const mk=(k,i)=>{const v0=osc?Math.sqrt(2*k*U0):Math.max(+P.v0||0,1e-9),a=k*E,tL=L/v0,p={i,k,v0,a,tL};
      p.y=.5*a*tL*tL;p.vyL=a*tL;p.tan=p.vyL/v0;
      p.xh=a>0?v0*Math.sqrt(2*s/a):Infinity;   // 打在下板时离入口的距离（= 当前 U 下能飞出的最大板长）
      if(p.y<=s)p.kind=s-p.y<.002*d?'graze':'out';else p.kind=L-p.xh<=.002*L?'graze':'hit';
      p.Yp=y0-p.y-D*p.tan;                     // 打到屏上的位置（以中心线为零，向上为正）
      p.Ek0=v0*v0/(2*k);p.Ek1=p.Ek0+E*Math.min(p.y,s);   // 单位电荷的动能 Ek/q（V）
      p.Umax=osc?4*s*d*U0/(L*L):2*s*d*v0*v0/(k*L*L);   // 恰好打到下板右端的偏转电压（从中线射入时 2d²U₀/L² 或 md²v₀²/(qL²)）
      return p};
    K.ps=[mk(k1,0)];if(r2>0)K.ps.push(mk(k1*r2,1));
    K.s0=L/4;K.gap=.12*L;K.hA=Math.min(Math.max(K.s0,.8*d),1.6*d);
    K.xs=osc?-(K.gap+K.s0):-.22*L;K.xEnd=D>0?L+D:1.14*L;
    // 取景（世界坐标）：x 从起点到荧光屏（或板外一小段），y 包住极板、荧光屏和轨迹
    const fly=K.ps.filter(p=>p.kind!=='hit');
    let y0w=-d/2,y1w=d/2;
    if(osc){y0w=Math.min(y0w,y0-K.hA/2);y1w=Math.max(y1w,y0+K.hA/2)}
    if(D>0){const reach=d/2+2*D*(d/2+Math.abs(y0))/L,need=Math.max(0,...fly.map(p=>Math.abs(p.Yp)));
      K.Hs=Math.max(.575*d,need*1.12,Math.min(reach*1.04,.45*(K.xEnd-K.xs)));y0w=Math.min(y0w,-K.Hs);y1w=Math.max(y1w,K.Hs)}
    else fly.forEach(p=>{y0w=Math.min(y0w,y0-Math.min(p.y,s)-(K.xEnd-L)*p.tan)});
    K.box={x0:K.xs,x1:K.xEnd,y0:y0w,y1:y1w};
    // 动画节奏
    const p1=K.ps[0],vSlow=Math.min(...K.ps.map(p=>p.v0));
    K.fIn=Math.max(p1.tL/T_IN,(L/vSlow)/(2*T_IN));
    const outPhys=(osc?(2*K.s0+K.gap)/p1.v0:-K.xs/p1.v0)+(K.xEnd-L)/p1.v0;
    K.fOut=Math.max(K.fIn,outPhys/T_OUT);
    K.h=Math.min(...K.ps.map(p=>p.tL))/20000;
    K.coinT=K.ps.length>1&&Math.abs(K.ps[0].y-K.ps[1].y)<.001*d;
    return K;
  }
  function geoDrop(P){
    const kd=Math.max(+P.kd||0,0),h=Math.max(0,+P.hg||0)/100,L=Math.max(.01,+P.Lg||0)/100,d=Math.max(.001,+P.dg||0)/100,U=Math.max(0,+P.Ug||0);
    const H=Math.max((+P.Hg||0)/100,h+L),xb=Math.max(0,+P.xb||0)/100,E=U/d,ax=kd*E;
    const K={sc:'drop',kd,h,L,d,U,H,xb,E,ax,ratio:ax/g};
    K.t1=Math.sqrt(2*h/g);K.t2=Math.sqrt(2*(h+L)/g);K.t3=Math.sqrt(2*H/g);K.dt=K.t2-K.t1;
    K.x1=.5*ax*K.dt*K.dt;K.vx1=ax*K.dt;
    if(ax>0&&K.x1>=d/2){K.wall=true;K.tw=K.t1+Math.sqrt(d/ax);K.dw=.5*g*K.tw*K.tw-h}   // 碰左板：时刻、板上端以下的深度
    else{K.wall=false;K.xl=K.x1+K.vx1*(K.t3-K.t2)}   // 落点偏左多少
    K.T=K.wall?K.tw:K.t3;K.slow=K.T<1?.25:1;
    const xl=K.wall?d/2:K.xl;
    K.box={x0:-Math.max(d/2,xb,xl),x1:d/2,y0:-H,y1:0};
    K.vmax=Math.hypot(K.wall?ax*(K.tw-K.t1):K.vx1,g*K.T);
    return K;
  }

  /* ---------- 积分 ---------- */
  const add=(a,b,c)=>a.map((x,i)=>x+b[i]*c);
  const rk4=(s,h,a)=>{const f=q=>[q[2],q[3],a[0],a[1]],k1=f(s),k2=f(add(s,k1,h/2)),k3=f(add(s,k2,h/2)),k4=f(add(s,k3,h));
    return s.map((x,i)=>x+h/6*(k1[i]+2*k2[i]+2*k3[i]+k4[i]))};
  // 步内二分：fn 由正变为 ≤ 0 的时刻（相对步首）
  const root=(s0,h,a,fn)=>{let lo=0,hi=h;for(let i=0;i<64;i++){const m=(lo+hi)/2;if(fn(rk4(s0,m,a))>0)lo=m;else hi=m}return hi};
  // 推进 span 秒：每个子步先算本区域的加速度和要盯的边界，越界就二分到交点，处理事件后换区域继续
  function advance(o,span,hmax,accel,bounds,onEvent){
    let rem=span,guard=0;
    while(rem>0&&!o.fin&&guard++<200000){
      const h=Math.min(rem,hmax),a=accel(o),s0=[o.x,o.y,o.vx,o.vy],s1=rk4(s0,h,a);

    }
  }
  // 示波管 / 类平抛：区域 A 加速板间，G 加速板与偏转板之间（或入口之前），F 偏转板间，O 偏转板之后
  const accM=(K,o)=>o.reg==='A'?[o.k*K.U0/K.s0,0]:o.reg==='F'?[0,-o.k*K.E]:[0,0];
  function bndM(K,o){
    if(o.reg==='A')return[['acc',q=>-K.gap-q[0]]];
    if(o.reg==='G')return[['enter',q=>-q[0]]];
    if(o.reg==='F'){const b=[['exit',q=>K.L-q[0]]];if(!o.graze)b.push(['low',q=>q[1]+K.d/2],['up',q=>K.d/2-q[1]]);return b}
    return[['end',q=>K.xEnd-q[0]]];
  }
  function evM(K,o,ev){
    const rel=()=>({t:o.t-o.te,x:o.x,y:o.y,vx:o.vx,vy:o.vy});
    if(ev==='acc'){o.x=-K.gap;o.reg='G'}

      if(K.E>0&&o.y<=-K.d/2+1e-12*K.d){o.y=-K.d/2;o.hit={...rel(),side:'low'};o.fin=true}}   // 贴着下板射入：一进板就打在板上
    else if(ev==='exit'){o.x=K.L;o.reg='O';o.ex=rel();if(!o.graze&&o.y+K.d/2<.002*K.d)o.graze=true}

      else{o.y=ev==='low'?-K.d/2:K.d/2;o.hit={...rel(),side:ev};o.fin=true}}
    else if(ev==='end'){o.x=K.xEnd;o.fin=true;if(K.D>0)o.scr={t:o.t-o.te,y:o.y,vx:o.vx,vy:o.vy}}

  // 液滴：区域 A 两板上方，F 两板之间，B 两板下方
  const accD=(K,o)=>o.reg==='F'?[-K.ax,-g]:[0,-g];
  function bndD(K,o){
    if(o.reg==='A')return[['in',q=>q[1]+K.h]];

  }

    else if(ev==='land'){o.y=-K.H;o.land={t:o.t,x:o.x,vx:o.vx,vy:o.vy};o.fin=true}
  }

  /* ---------- 判定与状态文字 ---------- */
  const offY=(K,o)=>K.y0-o.y;   // 沿电场方向的偏移（向下为正）
  function brief(K,o){
    if(o.hit)return o.hit.side==='low'?`打在下板 x${NB}=${NB}${cm(o.hit.x)}`:`打在上板 x${NB}=${NB}${cm(o.hit.x)}`;
    if(o.scr)return`Y${NB}=${NB}${cm(Math.abs(o.scr.y))}`;

  }
  function judgeM(S){
    const K=S.K,ps=S.ps,o=ps[0];

      if(o.hit)return{text:`打在${o.hit.side==='low'?'下':'上'}板上：离入口 ${cm(o.hit.x)}`,cls:'warn'};
      const tail=o.scr?`，屏上 Y${NB}=${NB}${cm(Math.abs(o.scr.y))}`:`，y${NB}=${NB}${cm(offY(K,o.ex))}`;
      if(o.graze)return{text:`恰好从板边飞出${tail}`,cls:'ok'};
      return o.scr?{text:`打在荧光屏上：Y${NB}=${NB}${cm(Math.abs(o.scr.y))}`,cls:'ok'}
        :{text:`飞出偏转板：y${NB}=${NB}${cm(offY(K,o.ex))}，tanθ${NB}=${NB}${fmt(-o.ex.vy/o.ex.vx,3)}`,cls:'ok'};
    }

  }
  function statusM(S){

    if(S.done)return judgeM(S);
    if(ps.length>1){const inF=ps.filter(q=>q.reg==='F'&&!q.fin).length;
      return{text:inF?'两种粒子在偏转板间偏转':ps.some(q=>q.reg==='A')?'两种粒子在加速电场中加速':ps.every(q=>q.te===null)?'两种粒子飞向偏转板':'两种粒子已射出偏转板',cls:''}}
    if(o.reg==='A')return{text:'在加速电场中加速',cls:''};

  }
  function statusD(S){
    const o=S.o;
    if(S.t===0)return{text:'准备就绪：点「发射」',cls:''};
    if(S.done)return judgeD(S);

  }

  /* ---------- 引擎不支持的界面细节（见文件头） ---------- */
  const LOGK=['km','v0','kd'];
  let fixing=false;
  function setNum(P,key,val){P[key]=val;if(typeof document==='undefined'||fixing)return;const n=document.getElementById('num-'+key);
    if(n){fixing=true;try{n.value=String(val);n.dispatchEvent(new Event('change'))}finally{fixing=false}}}
  function keep(P){
    const d=+P.d;if(Math.abs(+P.y0)>d/2+1e-9)setNum(P,'y0',+(Math.sign(+P.y0)*d/2).toFixed(4));
    const need=(+P.hg)+(+P.Lg);if(+P.Hg<need-1e-9)setNum(P,'Hg',Math.ceil(need*10-1e-6)/10);
  }
  function ui(P){
    if(typeof document==='undefined')return;

      if(!r.dataset.log){r.dataset.log='1';r.min=String(Math.log10(+n.min));r.max=String(Math.log10(+n.max));r.step='0.005';

      if(+P[k]>0)r.value=String(Math.log10(+P[k]));
      if(document.activeElement!==n)n.value=sciIn(+P[k])}
    document.querySelectorAll('#stem .num,#asks .num').forEach(s=>{const m=s.textContent.match(/^(-?\d+(?:\.\d+)?) (C\/kg|m\/s)$/);
      if(m&&+m[1]>0)s.textContent=sciS(+m[1])+' '+m[2];else if(/^-/.test(s.textContent))s.textContent='−'+s.textContent.slice(1)});
  }

  /* ---------- 画图工具 ---------- */
  const nice=x=>{const p=Math.pow(10,Math.floor(Math.log10(x))),n=x/p;return(n<1.5?1:n<3.5?2:n<7.5?5:10)*p};
  const lenTxt=x=>x<.01?`${+(x*1000).toPrecision(3)} mm`:x<1?`${+(x*100).toPrecision(3)} cm`:`${+x.toPrecision(3)} m`;

  return{
    legend:[{label:'速度 v 及其分速度',color:'--v'},{label:'电场力 qE',color:'--n'},{label:'重力 mg（液滴）',color:'--g'}],
    init(P){
      const K=geom(P);
      if(K.sc==='drop'){const o={x:0,y:0,vx:0,vy:0,t:0,reg:K.h>0?'A':'F',tin:K.h>0?null:0,out:null,wall:null,land:null,fin:false,

    readouts(S,P){
      const K=S.K;

        const stage=o.wall?'打在左板':o.land?'到达 b 所在平面':o.reg==='A'?'两板上方':o.reg==='F'?'两板之间':'已穿出';
        R.push(['时间 t',sec(o.t)],['下落高度',cm(-o.y)],['水平偏移 x（偏左为正）',cm(-o.x)],['水平分速度 v_x（向左为正）',ms(-o.vx)],
          ['竖直分速度 v_y（向下）',ms(-o.vy)],['速度 v',ms(Math.hypot(o.vx,o.vy))],['qE/(mg)',num(K.ratio)],['离左板（水平距离）',cm(o.x+K.d/2)],['所处阶段',stage],
          ['离开两板时 x₁ 实测 / 理论',o.out?`${cmv(-o.out.x)} / ${K.wall?'—':cmv(K.x1)} cm`:K.wall?'—（碰左板）':`— / ${cmv(K.x1)} cm`],
          ['离开两板时 v_x',o.out?ms(-o.out.vx):'—'],
          ['到达 b 平面时 x 实测 / 理论',o.land?`${cmv(-o.land.x)} / ${cmv(K.xl)} cm`:K.wall?'—（碰左板）':`— / ${cmv(K.xl)} cm`],
          ['落点与 b',o.land?(()=>{const dx=o.land.x+K.xb;return Math.abs(dx)<1e-3?`落到 b 点（相差 ${fmt(Math.abs(dx)*1000,2)} mm）`:`b 点${dx>0?'右':'左'}侧 ${cm(Math.abs(dx))}`})():'—'],
          ['碰左板处（板上端以下）',o.wall?cm(-o.wall.y-K.h):'—']);
        return R}
      const ps=S.ps,duo=ps.length>1;
      // 每个量：[标签, 取值函数(粒子) → 数字串, 单位]；两种粒子时并排写成「a / b 单位」
      const row=(lab,f,unit='')=>{const vs=ps.map(f);if(vs.every(v=>v==='—'))return[lab,'—'];return[lab,vs.join(' / ')+(unit?NB+unit:'')]};
      const inF=o=>o.te!==null;
      const tt=o=>!inF(o)?'—':num(o.t-o.te);
      const sv=x=>Math.abs(x)<1e-9?'0':sci(x,2);   // 速度一律科学计数
      const dy=o=>inF(o)?cmv(offY(K,o)):'—';
      const tanN=o=>o.vx>0?-o.vy/o.vx:NaN;
      // 板间用当前值；出板后用出口处的值（板间 tanθ ÷ (2Δy/x) 恒为 1，出板后照出口算）
      const ref=o=>o.ex||(o.reg==='F'||o.hit?{x:o.x,y:o.y,vx:o.vx,vy:o.vy}:null);
      const ratio=o=>{const r=ref(o);if(!r||r.x<=1e-12||K.E===0)return'—';const t=-r.vy/r.vx,dyv=K.y0-r.y;return dyv>0?fmt(t/(2*dyv/r.x),4):'—'};
      const xq=o=>{const r=ref(o);if(!r||K.E===0||r.vy>=0)return NaN;return r.x-(K.y0-r.y)/(-r.vy/r.vx)};
      const R=[];
      // 单位写在标签里，读数只写数字（读数格较窄，数字和单位写在一起容易折行）
      R.push(row('时间 t（s，进入偏转板起）',tt),row('位置 x（cm，从入口量起）',o=>cmv(o.x)),row('偏移 Δy（cm，沿电场方向）',dy),
        row('v_x（m/s）',o=>sv(o.vx)),row('v_y（m/s，沿电场方向）',o=>sv(-o.vy)),row('速度 v（m/s）',o=>sv(Math.hypot(o.vx,o.vy))),
        duo?row('tanθ',o=>o.vx>0?fmt(tanN(o),4):'—'):['tanθ（θ）',ps[0].vx>0?`${fmt(tanN(ps[0]),4)}（${fmt(Math.atan(tanN(ps[0]))*DEG,2)}°）`:'—'],
        row('tanθ ÷ (2Δy/x)',ratio));
      // 反向延长线与入射线的交点：板间应为 x/2，出板后为 L/2
      {const q=ps.map(xq),o=ps[0];
        R.push(['反向延长线交点到入口（cm）',q.every(x=>!ok(x))?'—':q.map(x=>ok(x)?cmv(x):'—').join(' / ')+(duo||!ok(q[0])?'':`（= ${o.ex?'L':'x'}/2）`)])}
      R.push(row('单位电荷的动能 Ek/q（V）',o=>num((o.vx*o.vx+o.vy*o.vy)/(2*o.k),4)),
        row('电场力做功 W/q = E·Δy（V）',o=>inF(o)?num(K.E*(K.y0-(o.ex||o.hit||o).y),4):'—'),
        row('所在处电势 φ（V，下板为零）',o=>o.reg==='F'||o.hit?num(K.U*(o.y+K.d/2)/K.d,4):'—'),
        ['入射点电势 φ₀（V）',num(K.U*(K.y0+K.d/2)/K.d,4)],

          row('出射偏移 y（cm）',o=>o.ex?cmv(offY(K,o.ex)):'—'),row('出射 tanθ',o=>o.ex?fmt(-o.ex.vy/o.ex.vx,4):'—'));

    draw(ctx,S,P,W,H,tok){
      const F=FIG(ctx,W,tok),u=F.u,ut=F.ut,K=S.K,cV=tok('--v'),cN=tok('--n'),cG=tok('--g'),INK=F.ink,AUX=F.auxColor;
      const narrow=typeof matchMedia==='function'&&matchMedia('(max-width:640px)').matches,dp=W/(ctx.canvas.clientWidth||W);

      // —— 版面：桌面宽度时状态条（约 46 CSS px）浮在左上角，图从它下面开始；窄屏时状态条在画布下方，不用让 ——
      const top=narrow?6*u:46*dp+4*u,pad=14*u;
      // —— 带下标的文字：sg = [[文字, 类型]]，i 斜体、r 正体、s 斜体下标、n 正体下标、z 中文 ——
      const fsz=kd=>kd==='s'||kd==='n'?.68:1;
      const font=(kd,sz)=>kd==='z'?`${sz*ut}px ${SANS}`:`${kd==='r'||kd==='n'?'':'italic '}${fsz(kd)*sz*ut}px ${SERIF}`;
      const adv_=(t,kd,sz)=>{ctx.save();ctx.font=font(kd,sz);const w=ctx.measureText(t).width;ctx.restore();return w};
      const wid=(sg,sz)=>sg.reduce((w,[t,kd])=>w+adv_(t,kd,sz),0);
      const rich=(sg,x,y,{color=INK,size=19}={})=>{let xx=x-wid(sg,size)/2;
        for(const[t,kd]of sg){const yy=y+(kd==='s'||kd==='n'?.3*size*ut:0);
          if(kd==='z')F.zh(t,xx,yy,{color,size,align:'left'});else F.label(t,xx,yy,{color,size:fsz(kd)*size,align:'left',italic:!(kd==='r'||kd==='n')});xx+=adv_(t,kd,size)}};
      // —— 防叠字：每个字给几个候选位置，取第一个不出界、不压已占位置（且尽量不压线）的 ——
      const obs=[],todo=[],segs=[];
      const meet=(a,c)=>a.x<c.x+c.w&&c.x<a.x+a.w&&a.y<c.y+c.h&&c.y<a.y+a.h;
      const segBox=(b,[x1,y1,x2,y2])=>{let t0=0,t1=1;const dx=x2-x1,dy=y2-y1;
        for(const[p,q]of[[-dx,x1-b.x],[dx,b.x+b.w-x1],[-dy,y1-b.y],[dy,b.y+b.h-y1]]){if(p===0){if(q<0)return false}else{const r=q/p;if(p<0){if(r>t1)return false;if(r>t0)t0=r}else{if(r<t0)return false;if(r<t1)t1=r}}}return true};
      const hit=q=>q.x<2*u||q.x+q.w>W-2*u||q.y<top+2*u||q.y+q.h>H-2*u||obs.some(c=>meet(q,c));

      const box=(sg,sz,[x,y])=>{const w=wid(sg,sz),h=sz*ut*.95;return{x:x-w/2-2*ut,y:y-h/2-2*ut,w:w+4*ut,h:h+4*ut}};
      const put=(sg,cands,o={})=>{const sz=o.size||19,c=cands.filter(p=>ok(p[0])&&ok(p[1]));if(!c.length)return null;
        const p=c.find(q=>!hit(box(sg,sz,q))&&!soft(box(sg,sz,q)))||c.find(q=>!hit(box(sg,sz,q)))||(o.must?c[0]:null);

      const around=(sg,x,y,dirs,gap=4*ut,sz=19)=>{const w=wid(sg,sz)+4*ut,h=sz*ut*.95+4*ut;
        return dirs.map(([dx,dy])=>{const n=Math.hypot(dx,dy)||1;dx/=n;dy/=n;const e=Math.abs(dx)*w/2+Math.abs(dy)*h/2+gap;return[x+dx*e,y+dy*e]})};
      const block=(x,y,r)=>obs.push({x:x-r,y:y-r,w:2*r,h:2*r});
      const blockSeg=(x1,y1,x2,y2,r)=>{const n=Math.max(1,Math.ceil(Math.hypot(x2-x1,y2-y1)/(1.5*r)));for(let i=0;i<=n;i++)block(x1+(x2-x1)*i/n,y1+(y2-y1)*i/n,r)};
      const D8=[[0,-1],[1,-1],[-1,-1],[1,0],[-1,0],[0,1],[1,1],[-1,1]];
      const I=s=>[[s,'i']],Z=s=>[[s,'z']],R_=s=>[[s,'r']],SUB=(a,b,kd='n')=>[[a,'i'],[b,kd]];
      const zh=(t,cands,o={})=>put(Z(t),cands,{color:AUX,size:14,...o});

      // 小球：空心圆，圆内写 + 或 −，圆心点在矢量画完后再点
      const charge=(x,y,r,pos)=>{F.ball(x,y,r);const e=Math.min(3.6*u,r*.55);F.line(x-e,y,x+e,y,{w:1.3});if(pos)F.line(x,y-e,x,y+e,{w:1.3})};

      const fit=(b,mL,mR,mT,mB)=>{const aw=W-2*pad-mL-mR,ah=H-top-mT-mB;

      const rowB=8*u+24*ut;   // 底部一行留给比例尺

      const scaleBar=(s,y,x2=W-14*u)=>{const len=nice((W-2*pad)*.18/s),Lp=len*s,x1=x2-Lp;
        F.rect(x1-6*u,y-22*ut,Lp+12*u,22*ut+8*u,{w:0,fill:F.paper});F.line(x1,y,x2,y,{w:1.2});F.line(x1,y-4*u,x1,y+4*u,{w:1.2});F.line(x2,y-4*u,x2,y+4*u,{w:1.2});
        F.label(lenTxt(len),(x1+x2)/2,y-11*ut,{italic:false,size:14})};
      if(slowTxt){const w=wid(Z(slowTxt),14);obs.push({x:W-pad-w-2*ut,y:top,w:w+4*ut,h:18*ut})}
      if(K.sc==='drop')drawDrop();else drawMic();
      if(slowTxt)F.zh(slowTxt,W-pad,top+9*ut,{align:'right',color:INK});

      /* ===================== 示波管 / 类平抛 =====================
         板间距在全景里太小时（矢量和标注挤不下），全景下方另画一幅「偏转板间放大」：同一比例放大 x、y，偏转角不变；
         全景画装置、轨迹和 L、D、U₀、O、P、Y，放大图画矢量、偏移、反向延长线、θ 与 d、y₀、x/2（L/2）等标注。
         放得下时只画一幅，两类内容都画在全景里。 */
      function drawMic(){
        const osc=K.osc,ps=S.ps,duo=ps.length>1,L=K.L,d=K.d,D=K.D,y0=K.y0,notes=[];
        const avail=H-top-rowB,aw=W-2*pad;
        const fL=osc?14*ut+6*u:8*u,fR=D>0?18*u+14*ut:16*u+12*ut,fT=8*u+24*ut,fB=14*u+22*ut;
        const bF=K.box,wF=bF.x1-bF.x0,hF=bF.y1-bF.y0;
        // 放大图的取景：入口到板外一小段；纵向包住两板和射出后的一小段轨迹
        let zy0=-d/2;ps.forEach(o=>{const p=K.ps[o.i];if(p.kind!=='hit')zy0=Math.min(zy0,y0-Math.min(p.y,K.s)-.1*L*p.tan)});
        const bZ={x0:-.03*L,x1:1.1*L,y0:Math.max(zy0,-d/2-.7*d),y1:d/2};
        const zL=22*u+12*ut,zR=16*u+14*ut,zT=14*u+40*ut,zB=12*u+30*ut;
        const view=(b,x0,y0_,x1,y1)=>{const s=Math.min((x1-x0)/(b.x1-b.x0),(y1-y0_)/(b.y1-b.y0)),cx=(x0+x1)/2-(b.x0+b.x1)/2*s,cy=(y0_+y1)/2+(b.y0+b.y1)/2*s;
          return{sc:s,X:x=>cx+x*s,Y:y=>cy-y*s,r:[x0,y0_,x1,y1]}};
        let vF,vZ=null,ySep=0,yBarF=0;
        const sc1=Math.min((aw-fL-fR)/wF,(avail-fT-fB)/hF);
        if(d*sc1<110*u||L*sc1<340*u){
          const fB2=fB+24*ut,scU=Math.min((aw-fL-fR)/wF,(avail*.52-fT-fB2)/hF),hU=fT+hF*scU+fB2,zTop=top+hU+4*u;
          const scZ=Math.min((aw-zL-zR)/(bZ.x1-bZ.x0),(H-rowB-zTop-zT-zB)/(bZ.y1-bZ.y0));
          if(scZ>1.4*scU){vF=view(bF,pad+fL,top+fT,W-pad-fR,top+fT+hF*scU);vZ=view(bZ,pad+zL,zTop+zT,W-pad-zR,H-rowB-zB);ySep=zTop;yBarF=zTop-8*u}}
        if(!vZ)vF=view(bF,pad+fL,top+fT,W-pad-fR,top+avail-fB);
        const zoom=!!vZ,vD=zoom?vZ:vF;   // vD：画矢量与构造线的那一幅
        sc=vD.sc;
        const tP=Math.max(4*u,3*ut),Lf=32*u;
        // 每一幅的板位置
        const pl=v=>({x0:v.X(0),xL:v.X(L),yUp:v.Y(d/2),yLo:v.Y(-d/2),yIn:v.Y(y0),yC:v.Y(0),gap:d*v.sc});
        const PF=pl(vF),PD=pl(vD);
        if(zoom){obs.push({x:0,y:ySep-2*u,w:W,h:4*u});
          const t=`偏转板间放大 ×${fmt(vZ.sc/vF.sc,1)}（等比例）`,w=wid(Z(t),14);obs.push({x:pad,y:ySep+4*u,w:w+4*ut,h:18*ut})}
        const rbOf=v=>Math.max(3.5*u,Math.min(7*u,d*v.sc/5));
        const vmax=Math.max(...K.ps.map(p=>Math.hypot(p.v0,p.kind==='hit'?p.a*p.xh/p.v0:p.vyL)),1e-9),vs=54*u/vmax;
        const inZ=o=>o.x>=bZ.x0-1e-12&&o.x<=bZ.x1+1e-12;
        /* ----- 1. 粒子与矢量先登记为排字障碍（到达荧光屏或飞出画面后不再画小球） ----- */
        const shown=ps.filter(o=>!(o.fin&&!o.hit));
        const partsOf=v=>shown.filter(o=>v===vF&&zoom?true:inZ(o)||!zoom).map(o=>{const i=ps.indexOf(o);return{o,i,bx:v.X(o.x),by:v.Y(o.y),Vx:o.vx*vs,Vy:-o.vy*vs,inF:o.reg==='F'&&!o.fin}});
        const partsD=partsOf(vD),partsF=zoom?partsOf(vF):[];
        partsD.forEach(({bx,by,Vx,Vy,inF})=>{block(bx,by,rbOf(vD)+3*u);blockSeg(bx,by,bx+Vx,by+Vy,3*u);
          if(inF){blockSeg(bx,by,bx,by+Lf,3*u);if(Vy>3*u){blockSeg(bx,by,bx,by+Vy,2*u);blockSeg(bx,by,bx+Vx,by,2*u)}}});
        partsF.forEach(({bx,by})=>block(bx,by,rbOf(vF)+2*u));
        /* ----- 2. 装置登记：极板、加速板、荧光屏、轨迹 ----- */
        for(const P_ of zoom?[PF,PD]:[PF]){const{x0,xL,yUp,yLo}=P_;
          segs.push([x0,yUp,xL,yUp],[x0,yLo,xL,yLo],[x0,yUp-tP,xL,yUp-tP],[x0,yLo+tP,xL,yLo+tP]);obs.push({x:x0,y:yUp-tP,w:xL-x0,h:tP},{x:x0,y:yLo,w:xL-x0,h:tP})}
        const X=vF.X,Y=vF.Y;

          segs.push([xA1,pA1,xA1,pA2],[xA2,pA1,xA2,pA2]);obs.push({x:xA1-2*u,y:pA1,w:4*u,h:pA2-pA1},{x:xA2-2*u,y:pA1,w:4*u,h:pA2-pA1})}

        const trOf=v=>ps.map(o=>{const t=o.trail.map(([x,y])=>[v.X(x),v.Y(y)]);t.push([v.X(o.x),v.Y(o.y)]);return t});
        const trF=trOf(vF),trD=zoom?trOf(vD):trF;

        const regTr=(tr,clip)=>{const st=Math.max(1,Math.floor(tr.length/60));

        /* ----- 3. 偏移与反向延长线的构造（每个粒子） ----- */
        const consOf=v=>ps.map(o=>{const r=o.ex||(o.reg==='F'||o.hit?{x:o.x,y:o.y,vx:o.vx,vy:o.vy}:null);
          if(!r||r.x<=0)return null;const dyv=y0-r.y,tn=-r.vy/r.vx,c={r,dyv,tn,ex:!!o.ex};
          if(tn>1e-9&&dyv>1e-12){c.xq=r.x-dyv/tn;c.Q=[v.X(c.xq),v.Y(y0)];c.E=[v.X(r.x),v.Y(r.y)];c.ang=Math.atan2(c.E[1]-c.Q[1],c.E[0]-c.Q[0])}

        const consD=consOf(vD),consF=zoom?consOf(vF):consD;
        for(const cs of zoom?[consF,consD]:[consD])cs.forEach(c=>{if(c&&c.Q){segs.push([c.Q[0],c.Q[1],c.E[0],c.E[1]]);block(c.Q[0],c.Q[1],3*u)}});
        const c1=consD[0];let qDim=null;
        {const{x0,yIn,yUp}=PD;
          if(c1&&c1.Q&&c1.Q[0]-x0>14*u){const room=yIn-yUp,yq=room>26*u+14*ut?yIn-Math.min(16*u,room/2):yUp-tP-8*u-2*ut;
            qDim={y:yq,x1:x0,x2:c1.Q[0]};segs.push([x0,yq,c1.Q[0],yq])}}
        /* ----- 4. 排字 ----- */
        const plus=R_('+'),minus=R_('−');
        // 放大图（或单幅）：极板正负号、U、d、y₀
        {const{x0,xL,yUp,yLo,yIn,yC}=PD;
          const sy=12*ut;
          put(plus,[[x0+10*ut,yUp-tP-sy],[x0+30*ut,yUp-tP-sy],[(x0+xL)/2,yUp-tP-sy],[xL-10*ut,yUp-tP-sy],[x0-10*ut,yUp-tP/2]],{size:17,must:true});
          put(minus,[[x0+10*ut,yLo+tP+sy],[x0+30*ut,yLo+tP+sy],[(x0+xL)/2,yLo+tP+sy],[xL-10*ut,yLo+tP+sy],[x0-10*ut,yLo+tP/2]],{size:17,must:true})}
        // 矢量标注
        partsD.forEach(({o,i,bx,by,Vx,Vy,inF})=>{
          const nm=duo?SUB('v',String(i+1)):(S.t===0&&!osc?SUB('v','0'):I('v'));
          if(Math.hypot(Vx,Vy)>4*u)put(nm,tipL(nm,bx+Vx,by+Vy,Vx,Vy),{color:cV,must:true});
          if(inF){const fn=duo?[['q','i'],[String(i+1),'n'],['E','i']]:I('qE');

            if(i===0&&Vy>3*u){const vx=SUB('v','x','s'),vy=SUB('v','y','s');

        if(osc){put(plus,[[xA1-9*ut,pA1+9*ut],[xA1-9*ut,PF.yIn-12*ut]],{size:17,must:true});

      /* ===================== 液滴穿过竖直板（计重力） ===================== */

      if(K.sc==='drop'){
        let s=`qE/(mg) = (q/m)(U/d)/g = ${b(num(K.ratio))}${K.ratio<10?'，与重力同一量级，不能不计重力':''}；水平加速度 a_x = (q/m)U/d = ${b(num(K.ax)+' m/s²')}。<br>`;
        s+=`竖直方向全程自由落体：t₁ = √(2h/g) = ${b(sec(K.t1))} 进入，t₂ = √(2(h + L)/g) = ${b(sec(K.t2))} 离开，t₃ = √(2H/g) = ${b(sec(K.t3))} 到达 b 所在平面。<br>`;
        if(K.wall)s+=`板间水平偏移 ½a_x(t₂ − t₁)² = ${cm(K.x1)} ≥ d/2 = ${cm(K.d/2)}：${b('打在左板')}，t = ${sec(K.tw)}，在板上端以下 ${b(cm(K.dw))}。`;
        else{const dx=K.xb-K.xl;
          s+=`离开两板时偏左 x₁ = ½a_x(t₂ − t₁)² = ${b(cm(K.x1))}，v_x = ${ms(K.vx1)}；落点偏左 x = a_x(t₂ − t₁)[t₃ − (t₁ + t₂)/2] = ${b(cm(K.xl))}，`;
          s+=Math.abs(dx)<1e-3?b('落到 b 点')+'。':`在 b 点${dx>0?'右':'左'}侧 ${b(cm(Math.abs(dx)))}。`}
        return s}
      const p=K.ps[0],osc=K.osc,cen=Math.abs(K.y0)<1e-12;
      let s='';
      if(osc)s+=`v₀ = √(2(q/m)U₀) = ${b(ms(p.v0))}（Ek/q = U₀ = ${volt(K.U0)}），`;
      else s+=`射入时 Ek/q = v₀²/(2(q/m)) = ${volt(p.Ek0)}，`;
      s+=`在偏转板间 t = L/v₀ = ${b(sec(p.tL))}；a = (q/m)U/d = ${num(p.a)} m/s²。`;
      if(osc&&p.v0>.05*C0)s+=`（v₀ ≈ ${fmt(p.v0/C0,2)}c，经典公式算出的速度偏大约 ${fmt(37.5*(p.v0/C0)**2,1)}%）`;
      s+='<br>';
      s+=`${osc?'y = UL²/(4dU₀)':'y = (q/m)UL²/(2dv₀²)'} = ${b(cm(p.y))}${cen?'':`（入射点离下板 s = d/2 + y₀ = ${cm(K.s)}）`}，tanθ = ${osc?'UL/(2dU₀)':'2y/L'} = ${b(fmt(p.tan,4))}，反向延长线交入射线于 L/2 = ${cm(K.L/2)} 处。<br>`;
      s+=`恰好打到下板右端的电压 U<sub>max</sub> = ${osc?(cen?'2d²U₀/L²':'4sdU₀/L²'):(cen?'md²v₀²/(qL²)':'2smdv₀²/(qL²)')} = ${b(volt(p.Umax))}；当前 U 下能飞出的最大板长 ${ok(p.xh)?cm(p.xh):'—（U = 0）'}。<br>`;
      if(p.kind==='hit')s+=`判定：y > ${cen?'d/2':'s'}，${b('打在下板上')}，离入口 x = v₀√(2${cen?'(d/2)':'s'}/a) = ${b(cm(p.xh))}${K.D>0?'，到不了荧光屏':''}。`;
      else{s+=`判定：${p.kind==='graze'?b('恰好从板边飞出'):b('飞出偏转板')}，射出时 Ek/q = ${osc?'U₀':'v₀²/(2(q/m))'} + Uy/d = ${b(volt(p.Ek1))}`;
        if(K.D>0)s+=`，荧光屏上 Y = ${cen?'(L/2 + D)tanθ':'|y₀ − (L/2 + D)tanθ|'} = ${b(cm(Math.abs(p.Yp)))}（O ${p.Yp<0?'下':'上'}方）`;s+='。'}
      if(K.ps.length>1){const q=K.ps[1];
        s+=`<br>粒子 2（比荷 ${sciS(q.k)} C/kg）：`;
        s+=osc?`v₀₂ = ${ms(q.v0)}，板间 t₂ = ${b(sec(q.tL))}（t₂ − t₁ = ${sec(q.tL-p.tL)}）；y、tanθ、Y 与粒子 1 ${K.coinT?b('相同，轨迹重合'):'不同'}（先加速后偏转与 q、m 无关，C4）。`
          :`同速射入，y ∝ q/m：y₂ = ${b(cm(q.y))}${q.kind==='hit'?`（打在下板，x = ${cm(q.xh)}）`:''}，tanθ₂ = ${fmt(q.tan,4)}${K.coinT?'，轨迹重合':'，轨迹不重合'}${K.D>0&&q.kind!=='hit'?`，屏上 Y₂ = ${cm(Math.abs(q.Yp))}`:''}。`}
      return s;
    },
    _geom:geom
  };
})();

/* ================= 通用渲染引擎（所有母题共用，不改） ================= */
(()=>{
const D=JSON.parse(document.getElementById('data').textContent);
const PLAY=D.playLabel||'发射';   // 播放按钮上的动词，数据里可用 playLabel 改写（如「碰撞」「转动」）
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const root=document.documentElement;
const tok=n=>getComputedStyle(root).getPropertyValue(n).trim();
const PS=D.problem.params;
const P={};PS.forEach(p=>P[p.key]=p.def);
const unitSep=u=>/^[°′″]/.test(u)?'':' ';   // 角度单位紧贴数字：90°
const fmtP=p=>p.type==='choice'?p.options.find(o=>o.value===P[p.key]).label:(+P[p.key]).toFixed(p.dec??2)+(p.unit?unitSep(p.unit)+p.unit:'');

/* 静态内容 */
document.title=`格物 ${D.id} ${D.name.replace(/（.*）/,'')}`;
$('hName').textContent=D.name;
$('hSub').textContent=`${D.module} · ${D.chapter}　关联：${D.related.join('、')}`;
$('hTable').innerHTML=`<tr><th>编号</th><th>考查频率</th><th>难度</th><th>版本</th></tr>
<tr><td class="code">${esc(D.id)}</td><td>${esc(D.freq)}</td><td title="${D.difficulty} / 5">${'●'.repeat(D.difficulty)}${'○'.repeat(5-D.difficulty)}</td><td>${esc(D.version)}</td></tr>`;
$('foot').textContent=`格物 Gewu · ${D.id} · ${D.version} · ${D.footer??'g 取 10 m/s²'}`;   // 数据里可用 footer 改写页脚常量
$('tags').innerHTML=D.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('');
$('stemNote').textContent=D.problem.note||'';
$('bCond').innerHTML=D.boundary.conditions.map(c=>`<li><span>${esc(c)}</span></li>`).join('');
$('bBack').innerHTML=D.boundary.fallback.map(c=>`<li><span>${esc(c)}</span></li>`).join('');
$('legend').innerHTML=SIM.legend.map(l=>`<span><i style="background:var(${l.color})"></i>${esc(l.label)}</span>`).join('');
$('concl').innerHTML=D.conclusions.map(c=>`<details><summary><span class="badge">${c.id}</span><span class="t">${esc(c.title)}</span><span class="f">${esc(c.formula)}</span><span class="chev" aria-hidden="true"></span></summary><div class="deriv">${esc(c.derivation)}</div></details>`).join('');
const qCard=(q,isVar)=>`<article class="q">
  <div class="head"><span class="badge">${q.id}</span><h3>${esc(q.title)}</h3>${isVar?q.cs.map(c=>`<span class="chip">${c}</span>`).join(''):`<span class="chip">${q.anim?'计划做动画':'不做动画'}</span>`}</div>
  <p>${esc(q.stem)}</p>
  ${isVar?'':`<p class="map">映射：<b>${esc(q.map)}</b></p>`}
  <details><summary><span class="chev" aria-hidden="true"></span>答案与解析</summary><div class="ans"><p class="a">答案：${esc(q.answer)}</p><p>${esc(q.analysis)}</p></div></details>
  <div class="foot"><span class="src">${esc(q.source)}</span>${isVar?`<button data-load="${q.id}">加载到动画 ↑</button>`:''}</div>
</article>`;
$('variants').innerHTML=D.variants.map(v=>qCard(v,true)).join('');
$('reskins').innerHTML=D.reskins.map(r=>qCard(r,false)).join('');
$('sources').innerHTML=D.sources.map(s=>`<li><b>${esc(s.src)}</b><span>${esc(s.desc)}</span></li>`).join('');

/* 参数控件 */
const box=$('params');
PS.forEach(p=>{
  if(p.type==='choice'){
    const d=document.createElement('div');d.className='seg';d.id=`f-${p.key}`;d.setAttribute('role','group');d.setAttribute('aria-label',p.label);
    d.innerHTML=p.options.map(o=>`<button id="opt-${p.key}-${o.value}" data-k="${p.key}" data-v="${o.value}">${esc(o.label)}${o.hint?`<small>${esc(o.hint)}</small>`:""}</button>`).join('');
    box.appendChild(d);
  }else{
    const d=document.createElement('div');d.className='field';d.id=`f-${p.key}`;
    d.innerHTML=`<label for="num-${p.key}"><span class="s">${esc(p.sym)}</span><span class="note">${esc(p.label)}</span></label><span class="numin"><input type="number" id="num-${p.key}" min="${p.min}" max="${p.max}" step="any" inputmode="decimal" aria-label="${esc(p.label)}"><span class="u">${esc(p.unit||'')}</span></span><input type="range" id="in-${p.key}" min="${p.min}" max="${p.max}" step="${p.step}" value="${p.def}" aria-label="${esc(p.label)} 滑块">`;
    box.appendChild(d);
    d.querySelector('input[type=range]').addEventListener('input',e=>{P[p.key]=+e.target.value;active=-1;sync();reset()});
    const num=d.querySelector('input[type=number]');
    num.addEventListener('change',()=>{let v=parseFloat(num.value);
      if(Number.isFinite(v)){v=Math.min(p.max,Math.max(p.min,v));P[p.key]=v;active=-1;reset()}sync()});
    num.addEventListener('keydown',e=>{if(e.key==='Enter')num.blur()});
  }
});
box.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;P[b.dataset.k]=b.dataset.v;active=-1;sync();reset()});
let active=-1;
const shown=w=>!w||Object.entries(w).every(([k,v])=>[].concat(v).includes(P[k]));
const CH0=PS.find(p=>p.type==='choice');   // 预设只按第一个选项参数（情境 / 模式）分组，其余选项由预设的 load 带过去
const chosen=o=>!CH0||o[CH0.key]===undefined||o[CH0.key]===P[CH0.key];
const numTxt=(p,v)=>String(+(+v).toFixed(Math.max(p.dec??2,4)));
function sync(){
  PS.forEach(p=>{
    if(p.type==='choice'){p.options.forEach(o=>$(`opt-${p.key}-${o.value}`).setAttribute('aria-pressed',P[p.key]===o.value));if(p.when)$(`f-${p.key}`).hidden=!shown(p.when)}
    else{$(`in-${p.key}`).value=P[p.key];const n=$(`num-${p.key}`);if(document.activeElement!==n)n.value=numTxt(p,P[p.key]);$(`f-${p.key}`).hidden=!shown(p.when)}
  });
  const fill=s=>esc(s).replace(/\{(\w+)\}/g,(m,k)=>{
    if(k==='constraint'){const p=PS.find(x=>x.type==='choice');return esc(p.options.find(o=>o.value===P[p.key]).text)}
    const p=PS.find(x=>x.key===k);return p?`<span class="num">${esc(fmtP(p))}</span>`:m});
  const [lead,ask='']=D.problem.stem.split(/问[:：]/);
  $('stem').innerHTML=fill(lead.trim());
  const qs=ask.split(/[①②③④⑤⑥]/).map(s=>s.trim()).filter(Boolean);
  $('asks').innerHTML=qs.map((q,i)=>`<li><b>${i+1}</b><span>${fill(q)}</span></li>`).join('');
  $('asks').hidden=!qs.length;
  $('verdict').innerHTML=SIM.verdict(P);
  const ch=PS.find(p=>p.type==='choice');
  $('presetMode').textContent=ch?`· ${ch.options.find(o=>o.value===P[ch.key]).label}`:'';
  $('presets').innerHTML=D.presets.map((p,i)=>chosen(p.load)?`<button data-preset="${i}" aria-pressed="${i===active}" title="${esc(p.note||'')}">${esc(p.label)}</button>`:'').join('');
  const pn=$('pnote'),ap=D.presets[active];pn.hidden=!(ap&&ap.note);if(ap&&ap.note)pn.innerHTML=`<b>${esc(ap.label)}</b>：${esc(ap.note)}`;
}
function load(o,i=-1){Object.assign(P,o);active=i;sync();reset()}
$('presets').addEventListener('click',e=>{const b=e.target.closest('[data-preset]');if(b)load(D.presets[+b.dataset.preset].load,+b.dataset.preset)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-load]');if(!b)return;
  load(D.variants.find(v=>v.id===b.dataset.load).load);
  show('pane-lab');document.querySelector('.board').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})});

/* 画布与循环 */
const cv=$('cv'),ctx=cv.getContext('2d');let S,running=false,speed=1,lastT=0;
function size(){const r=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);const w=Math.max(200,Math.round(r.width*dpr));if(cv.width!==w){cv.width=w;cv.height=w}}
function render(){size();SIM.draw(ctx,S,P,cv.width,cv.height,tok);
  $('readout').innerHTML=SIM.readouts(S,P).map(([k,v])=>`<div class="ro"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('');
  const st=$('status');st.textContent=S.status.text;st.className='status '+S.status.cls}
function reset(){running=false;S=SIM.init(P);$('play').textContent=`▶ ${PLAY}`;render()}
function loop(t){if(!running)return;const real=Math.min(.05,(t-lastT)/1000);lastT=t;
  const sim=real*speed,n=Math.max(1,Math.ceil(sim/5e-4));for(let i=0;i<n;i++)SIM.step(S,P,sim/n);
  render();if(S.done){running=false;$('play').textContent=`▶ 再${PLAY}`;return}requestAnimationFrame(loop)}
$('play').onclick=()=>{if(running){running=false;$('play').textContent='▶ 继续';return}
  if(S.done)S=SIM.init(P);running=true;$('play').textContent='❚❚ 暂停';lastT=performance.now();requestAnimationFrame(loop)};
$('reset').onclick=reset;
$('slow').onclick=()=>{speed=speed===1?.25:1;$('slow').textContent=speed===1?'慢放 ×0.25':'正常速度'};
new ResizeObserver(render).observe(cv);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);
new MutationObserver(render).observe(root,{attributes:true,attributeFilter:['data-theme']});
/* 选项卡 */
const tabs=[...document.querySelectorAll('[role=tab]')];
function show(id){tabs.forEach(t=>{const on=t.dataset.pane===id;t.setAttribute('aria-selected',on);t.tabIndex=on?0:-1;$(t.dataset.pane).hidden=!on});
  if(id==='pane-lab')requestAnimationFrame(render)}
tabs.forEach((t,i)=>{t.addEventListener('click',()=>show(t.dataset.pane));
  t.addEventListener('keydown',e=>{const d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;if(!d)return;e.preventDefault();
    const n=tabs[(i+d+tabs.length)%tabs.length];n.focus();show(n.dataset.pane)})});
$('nConcl').textContent=D.conclusions.length;$('nVar').textContent=D.variants.length;$('nSkin').textContent=D.reskins.length;$('nSrc').textContent=D.sources.length;
show('pane-lab');
sync();reset();
})();
</script>
