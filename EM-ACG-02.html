<script>
/* ================= 线稿绘图工具 FIG（所有母题共用，不改） =================
   画法照试卷插图：装置用墨线，固定面画斜线阴影，辅助线用虚线，物理量和点的字母用斜体衬线；
   只有矢量带颜色（--g 重力/外力，--n 弹力/约束力，--v 速度，--a 其他矢量）。
   用法：SIM.draw 里 const F=FIG(ctx,W,tok)；坐标是画布像素，F.u = W/720 是线宽与几何的基准单位，
   F.ut 是字号单位（窄屏时不再随画布缩小，保证字母不小于约 11 CSS 像素；自写文字函数也要用 F.ut 算字号）。
   颜色：F.ink 墨线、F.auxColor 辅助线、F.paper 纸色（F.aux 是画辅助线的方法，不是颜色）。 */
const FIG=(ctx,W,tok)=>{
  const u=W/720,ink=tok('--fig-ink'),aux=tok('--fig-aux'),paper=tok('--card');
  const dp=W/(ctx.canvas.clientWidth||W),ut=Math.max(u,dp*11/19);   // dp：每 CSS 像素的画布像素数
  const SERIF='"Times New Roman","STIX Two Text",Times,serif',SANS=tok('--f-body');
  const path=(fn,{w=1.6,color=ink,dash=null,fill=null}={})=>{ctx.save();ctx.beginPath();fn();
    if(fill){ctx.fillStyle=fill;ctx.fill()}
    if(w>0){ctx.lineWidth=w*u;ctx.strokeStyle=color;ctx.setLineDash(dash?dash.map(d=>d*u):[]);ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}
    ctx.restore()};
  // 文字先描一圈底色再填色，压在线条上也清楚
  const text=(t,x,y,font,color,align,base)=>{ctx.save();ctx.font=font;ctx.textAlign=align;ctx.textBaseline=base;
    ctx.lineJoin="round";ctx.lineWidth=5*ut;ctx.strokeStyle=paper;ctx.strokeText(t,x,y);ctx.fillStyle=color;ctx.fillText(t,x,y);ctx.restore()};
  const F={u,ut,ink,auxColor:aux,paper,
    clear(){ctx.save();ctx.setLineDash([]);ctx.fillStyle=paper;ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height);ctx.restore()},
    line(x1,y1,x2,y2,o){path(()=>{ctx.moveTo(x1,y1);ctx.lineTo(x2,y2)},o)},
    poly(pts,o){path(()=>pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y)),o)},
    circle(x,y,r,o){path(()=>ctx.arc(x,y,r,0,2*Math.PI),o)},
    arc(x,y,r,a0,a1,o){path(()=>ctx.arc(x,y,r,a0,a1),o)},
    rect(x,y,w,h,o){path(()=>ctx.rect(x,y,w,h),o)},
    // 辅助线（中心线、投影线等）
    aux(x1,y1,x2,y2,o={}){F.line(x1,y1,x2,y2,{w:1,color:aux,dash:[6,5],...o})},
    // 运动轨迹：细虚线
    trail(pts,o={}){if(pts.length>1)F.poly(pts,{w:1.3,color:aux,dash:[5,5],...o})},
    // 固定面斜线：沿 (x1,y1)→(x2,y2) 的直线，画在 side 一侧（屏幕坐标下，1 = 前进方向右手侧）
    hatch(x1,y1,x2,y2,side=1,{gap=12,len=10}={}){const L=Math.hypot(x2-x1,y2-y1),n=Math.max(1,Math.round(L/(gap*u)));
      const tx=(x2-x1)/L,ty=(y2-y1)/L,nx=-ty*side,ny=tx*side,ox=(nx-tx)*len*u/Math.SQRT2,oy=(ny-ty)*len*u/Math.SQRT2;
      path(()=>{for(let i=0;i<=n;i++){const x=x1+(x2-x1)*i/n,y=y1+(y2-y1)*i/n;ctx.moveTo(x,y);ctx.lineTo(x+ox,y+oy)}},{w:1,color:aux})},
    // 圆弧形固定面的斜线：out = true 画在圆外侧
    hatchArc(cx,cy,r,a0,a1,out=true,{gap=12,len=10}={}){const n=Math.max(1,Math.round(r*Math.abs(a1-a0)/(gap*u))),s=out?1:-1;
      path(()=>{for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n,c=Math.cos(a),si=Math.sin(a),x=cx+r*c,y=cy+r*si;
        const nx=c*s,ny=si*s,tx=-si,ty=c;ctx.moveTo(x,y);ctx.lineTo(x+(nx-tx)*len*u/Math.SQRT2,y+(ny-ty)*len*u/Math.SQRT2)}},{w:1,color:aux})},
    // 矢量：从 (x,y) 画到 (x+dx,y+dy)，细杆 + 窄实心箭头；label 用斜体写在箭头外侧，
    // 与别的矢量共线时用 off=[dx,dy]（单位 u，相对箭头尖）把标注挪到旁边
    arrow(x,y,dx,dy,color,label,{w=2,head=12,size=19,off=null}={}){const L=Math.hypot(dx,dy);if(L<2*u)return;
      const ux=dx/L,uy=dy/L,h=Math.min(head*u,L*.6),hw=h*.34,tx=x+dx,ty=y+dy;
      F.line(x,y,tx-ux*h*.7,ty-uy*h*.7,{w,color});
      path(()=>{ctx.moveTo(tx,ty);ctx.lineTo(tx-ux*h-uy*hw,ty-uy*h+ux*hw);ctx.lineTo(tx-ux*h+uy*hw,ty-uy*h-ux*hw);ctx.closePath()},{w:0,fill:color});
      if(label)F.label(label,off?tx+off[0]*u:tx+ux*14*u,off?ty+off[1]*u:ty+uy*14*u,{color,size})},
    // 斜体衬线字母（物理量、点名）
    label(t,x,y,{color=ink,size=19,align='center',base='middle',italic=true}={}){text(t,x,y,`${italic?'italic ':''}${size*ut}px ${SERIF}`,color,align,base)},
    // 中文小注
    zh(t,x,y,{color=aux,size=14,align='center',base='middle'}={}){text(t,x,y,`${size*ut}px ${SANS}`,color,align,base)},
    dot(x,y,r=2.6,color=ink){F.circle(x,y,r*u,{w:0,fill:color})},
    // 带名字的点：实心小点 + 斜体字母（dx、dy 为字母相对点的偏移，单位 u）
    point(x,y,name,dx=-13,dy=13){F.dot(x,y);if(name)F.label(name,x+dx*u,y+dy*u)},
    // 小球：空心圆，球心另用 F.dot 标出（矢量画完后再点，表示力作用在重心）
    ball(x,y,r){F.circle(x,y,r,{w:1.6,fill:paper})},
    // 尺寸标注：两端带箭头的细线，文字写在中点外侧 off（单位 u）
    dim(x1,y1,x2,y2,t,{off=14,color=ink}={}){const L=Math.hypot(x2-x1,y2-y1);if(L<4*u)return;const ux=(x2-x1)/L,uy=(y2-y1)/L,h=Math.min(8*u,L/3),hw=h*.38;
      F.line(x1,y1,x2,y2,{w:1,color});
      for(const[px,py,sx]of[[x1,y1,1],[x2,y2,-1]])path(()=>{ctx.moveTo(px,py);ctx.lineTo(px+sx*ux*h-uy*hw,py+sx*uy*h+ux*hw);ctx.lineTo(px+sx*ux*h+uy*hw,py+sx*uy*h-ux*hw);ctx.closePath()},{w:0,fill:color});
      if(t)F.label(t,(x1+x2)/2-uy*off*u,(y1+y2)/2+ux*off*u,{color})},
  };
  return F;
};

/* ================= SIM 模块：每个母题替换这一段 =================
   约定接口：
   SIM.legend            [{label, color(CSS 变量名)}]
   SIM.init(P)           → 状态 S（含 S.done、S.status={text,cls}）
   SIM.step(S,P,dt)      推进 dt 秒（引擎保证 dt ≤ 0.5 ms）
   SIM.readouts(S,P)     → [[标签, 带单位的值]]
   SIM.draw(ctx,S,P,W,H,tok)  tok(name) 取主题色
   SIM.verdict(P)        → 理论预判 HTML
*/
const SIM=(()=>{
  /* 远距离输电：发电机 → 升压变压器 T₁（n₁∶n₂ = 1∶k₁）→ 输电线 r → 降压变压器 T₂（n₃∶n₄ = k₂∶1）→ 用户。
     物理：交流各量都用有效值，按稳态代数关系逐级求出（理想变压器 C1，输电回路串联 C2、C3）：
       输送功率一定：U₂ = k₁U₁，I₁ = P/U₁，I₂ = P/U₂，U损 = I₂r，P损 = I₂²r，U₃ = U₂ − U损，U₄ = U₃/k₂，I₄ = k₂I₂，P₄ = U₄I₄；
         要求 P < U₂²/r，否则无解（C4，母题 ③）。
       用户负载变化：把降压变压器和用户折算成输电回路中的电阻 R′ = k₂²R，I₂ = U₂/(r + R′)，U₃ = I₂R′，U₄ = U₃/k₂，
         I₁ = k₁I₂，I₄ = k₂I₂，P₁ = U₁I₁，P₄ = U₄I₄（C6）。
     随时间变化的部分：模型时间 t = 画面时间 × 600（画面 6 s = 1 h），t 到 1 h 结束；用户负载变化时 1/R 随 t 线性地由 1/R 变到 1/R末
       （相当于并联的用电器均匀增减），每一步按新的稳态重算。电能 W₁、W损、W₄ 用 RK4 积分 dW/dt = P(t)，
       模型步长 ≤ 0.3 s（引擎步长 0.5 ms × 600）。理论值（预判中的 1 h 电能用解析积分）只用于对照，不参与积分。
     交流示意：电流箭头（--a）方向每 0.5 s（画面时间）同时翻转一次，长度与该回路电流的有效值成正比。
     引擎不支持的界面细节放在 verdict 里处理（引擎每次同步参数都会调用它）：
       ① U₁、P、k₁、k₂、R、R末 用对数滑块，r 用最左端为 0 的对数滑块：把滑块改成以 10 为底的对数刻度，在外层捕获它的 input 事件，
          换算成真值后交给数字输入框的 change 事件，由引擎照常同步（做法同 MEC-ENG-01）；
       ② k₁、k₂ 的标签旁显示 n₁∶n₂、n₃∶n₄；题干中的数按 2 ~ 3 位有效数字显示，大数、小数用科学计数。 */
  const PI=Math.PI,T=3600,RATE=600,HMAX=0.3;
  const SUP={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
  const sup=n=>String(n).replace(/./g,c=>SUP[c]);
  const ok=x=>typeof x==='number'&&isFinite(x);
  // n 位有效数字；|x| < 10⁻³ 或 ≥ 10⁵ 写成 a×10ⁿ；负号用 −
  const sf=(x,n=3)=>{if(!ok(x))return'—';const a=Math.abs(x),sg=x<0?'−':'';if(a<1e-300)return'0';
    let p=Math.floor(Math.log10(a)),m=+(a/Math.pow(10,p)).toPrecision(n);if(m>=10){m/=10;p++}
    if(p<-3||p>=5)return sg+m.toFixed(n-1)+'×10'+sup(p);
    return sg+(m*Math.pow(10,p)).toFixed(Math.max(0,n-1-p))};
  // 自动选词头：先按 n 位有效数字舍入再选（999.96 V 写成 1.00 kV）
  const PF={V:[['M',1e6],['k',1e3],['',1],['m',1e-3],['μ',1e-6]],A:[['k',1e3],['',1],['m',1e-3],['μ',1e-6]],
    W:[['G',1e9],['M',1e6],['k',1e3],['',1],['m',1e-3],['μ',1e-6]],'W·h':[['G',1e9],['M',1e6],['k',1e3],['',1],['m',1e-3],['μ',1e-6]]};
  const pre=(x,un,n=3)=>{const a=Math.abs(+(+x).toPrecision(n)),L=PF[un];if(!(a>0))return['',1];for(const q of L)if(a>=q[1]*(1-1e-12))return q;return L[L.length-1]};
  const fu=(x,un,n=3)=>{if(!ok(x))return'—';if(x===0)return'0 '+un;const[p,v]=pre(x,un,n);return sf(x/v,n)+' '+p+un};
  const V=x=>fu(x,'V'),A=x=>fu(x,'A'),Wt=x=>fu(x,'W'),E=J=>fu(J/3600,'W·h'),Om=x=>sf(x,3)+' Ω';
  const pct=x=>{if(!ok(x))return'—';const v=100*x;let s=v>=99.95&&v<100?v.toFixed(3):v>=99.5&&v<100?v.toFixed(2):sf(v,3);if(/^100\.0+$/.test(s))s='100';return s+'%'};
  // 题干、匝数比中的数：2 ~ 3 位有效数字；≥ 10⁴ 或 < 10⁻² 写成 a×10ⁿ（6.6×10⁵、4.94×10⁻³）
  const stemNum=x=>{if(!ok(x))return'—';if(x===0)return'0';const a=Math.abs(x);
    if(a>=9999.5||a<.00995){let p=Math.floor(Math.log10(a)+1e-12),m=+(x/Math.pow(10,p)).toPrecision(3);if(Math.abs(m)>=10){m/=10;p++}
      let s=String(m);if(!s.includes('.'))s+='.0';return s+'×10'+sup(p)}
    return String(+x.toPrecision(3))};
  const ratio=(a,b)=>a>=b?`${stemNum(a/b)}∶1`:`1∶${stemNum(b/a)}`;

  /* ---------- 参数与稳态解 ---------- */
  function cfg(P){
    const mode=P.mode==='load'?'load':'power';
    const U1=Math.max(1e-12,+P.U1),k1=Math.max(1e-12,+P.k1),k2=Math.max(1e-12,+P.k2),r=Math.max(0,+P.r||0);
    const Pw=1e3*Math.max(1e-12,+P.P),R0=Math.max(1e-12,+P.R),Rb=Math.max(1e-12,+P.Rb),U2=k1*U1;
    return{mode,U1,k1,k2,r,Pw,R0,Rb,U2,G0:1/R0,Gb:1/Rb,same:Math.abs(R0-Rb)<=1e-12*R0,
      Plim:r>0?U2*U2/r:Infinity,P4max:r>0?U2*U2/(4*r):Infinity,Umin:Math.sqrt(Pw*r)};
  }
  // 输送功率一定（C1–C4）：P ≥ U₂²/r 时无解
  function ssP(K){
    const{U1,U2,k2,r,Pw:P}=K,I1=P/U1,I2=P/U2,dU=I2*r,dP=I2*I2*r;
    if(!(P*r<U2*U2))return{ok:false,U1,U2,I1,I2,dU,dP,P1:P};
    const U3=U2-dU,U4=U3/k2,I4=k2*I2,P1=U1*I1,P4=U4*I4;
    return{ok:true,U1,U2,I1,I2,dU,dP,U3,U4,I4,P1,P4,R:U4/I4,Rp:U3/I2,G:I4/U4,eta:P4/P1,eu:U3/U2};
  }
  // 用户负载变化（C6）：G = 1/R
  function ssL(K,G){
    const{U1,U2,k1,k2,r}=K,R=1/G,Rp=k2*k2*R,I2=U2/(r+Rp),I1=k1*I2,I4=k2*I2,dU=I2*r,dP=I2*I2*r,U3=I2*Rp,U4=U3/k2,P1=U1*I1,P4=U4*I4;
    return{ok:true,U1,U2,I1,I2,dU,dP,U3,U4,I4,P1,P4,R,Rp,G,eta:P4/P1,eu:U3/U2};
  }
  const Gat=(K,t)=>K.G0+(K.Gb-K.G0)*Math.min(1,Math.max(0,t/T));
  const ss=(K,t)=>K.mode==='power'?ssP(K):ssL(K,Gat(K,t));
  const pows=(K,t)=>{const s=ss(K,t);return s.ok?[s.P1,s.dP,s.P4]:[0,0,0]};
  // 1/R 由 G₀ 线性变到 G_b 的 1 h 内的电能（解析积分，只用于预判对照）：P₁ = U₂²G/(rG + k₂²)，P损 = rU₂²G²/(rG + k₂²)²
  function Wtheory(K){
    const{U2,r,k2,G0,Gb}=K,b=k2*k2,dG=Gb-G0;
    if(K.mode==='power'){const s=ssP(K);return s.ok?[s.P1*T,s.dP*T,s.P4*T]:null}
    if(r===0||Math.abs(dG)<=1e-9*Math.max(G0,Gb)){const a=ssL(K,G0),c=ssL(K,Gb);if(r===0)return[T*U2*U2*(G0+Gb)/(2*b),0,T*U2*U2*(G0+Gb)/(2*b)];
      return[T*(a.P1+c.P1)/2,T*(a.dP+c.dP)/2,T*(a.P4+c.P4)/2]}
    const F1=G=>G/r-b/(r*r)*Math.log(r*G+b),FL=G=>G-2*b/r*Math.log(r*G+b)-b*b/(r*(r*G+b));
    const W1=T*U2*U2/dG*(F1(Gb)-F1(G0)),WL=T*U2*U2/(r*dG)*(FL(Gb)-FL(G0));
    return[W1,WL,W1-WL];
  }

  /* ---------- 状态条 ---------- */
  const trend=(a,b)=>Math.abs(b-a)<=1e-9*Math.max(Math.abs(a),Math.abs(b))?'不变':b>a?'增大':'减小';
  function stat(S){
    const K=S.K,s=ss(K,S.t),h=(S.t/3600).toFixed(2);
    if(!s.ok)return{text:'无解：P ≥ U₂²/r，这一输电电压下送不出这么大的功率',cls:'warn'};
    if(K.mode==='load'&&K.r>0){const q=s.Rp/K.r;
      if(q<.995)return{text:'R′ < r：用户端接近短路，用户功率已越过最大值',cls:'warn'};
      if(q<=1.005)return{text:'R′ = r：用户功率最大，η = 50%',cls:'ok'}}
    if(S.done){
      if(K.mode==='load'&&!K.same)return{text:`1 h 后：I₂ ${trend(S.s0.I2,S.s1.I2)}、U₄ ${trend(S.s0.U4,S.s1.U4)}，见读数对照`,cls:'ok'};
      return{text:`送电 1 h：W₁ = ${E(S.W[0])}，W损 = ${E(S.W[1])}`,cls:'ok'}}
    if(!S.started)return{text:K.mode==='load'&&!K.same?`准备就绪：1 h 内 R 由 ${stemNum(K.R0)} Ω 变为 ${stemNum(K.Rb)} Ω`:'准备就绪：按「送电」累计 1 h 的电能',cls:''};
    if(K.mode==='load'&&!K.same)return{text:`用电器${K.Gb>K.G0?'增多':'减少'}：t = ${h} h，R = ${sf(s.R,3)} Ω`,cls:''};
    return{text:`送电中：t = ${h} h`,cls:''};
  }

  /* ---------- 页面增强：对数滑块、匝数比、题干数字 ---------- */
  let cur=null,curP=null,ui=null,DATA=null;
  const LOGK=['U1','P','k1','k2','R','Rb','r'];
  function enhance(){
    if(ui||typeof document==='undefined')return;
    if(!document.getElementById('in-U1'))return;
    ui={};
    for(const k of LOGK){const r=document.getElementById('in-'+k),n=document.getElementById('num-'+k);if(!r||!n)continue;
      const zero=k==='r',lo=zero?-2.2:Math.log10(+n.min),hi=Math.log10(+n.max);
      r.min=String(lo);r.max=String(hi);r.step='0.005';r.dataset.log='1';
      // 在外层捕获滑块的 input，不让它到达引擎（引擎会把对数值当真值），改由输入框的 change 交给引擎
      r.parentElement.addEventListener('input',e=>{if(e.target!==r)return;e.stopPropagation();const s=+r.value;
        n.value=zero&&s<-2?'0':String(+Math.pow(10,s).toPrecision(3));n.dispatchEvent(new Event('change'))},true)}
    for(const k of['k1','k2']){const lab=document.querySelector(`label[for="num-${k}"]`);if(!lab)continue;
      const sp=document.createElement('span');sp.className='note';lab.appendChild(sp);ui['n'+k]=sp}
  }
  function refreshUI(P){
    if(typeof document==='undefined')return;
    try{enhance();curP=curP||P;
      for(const k of LOGK){const r=document.getElementById('in-'+k);if(!r||!r.dataset.log)continue;const v=+P[k];
        r.value=String(k==='r'&&!(v>0)?-2.2:Math.log10(Math.max(v,1e-12)))}
      if(ui&&ui.nk1)ui.nk1.textContent=` → n₁∶n₂ = 1∶${stemNum(+P.k1)}`;
      if(ui&&ui.nk2)ui.nk2.textContent=` → n₃∶n₄ = ${stemNum(+P.k2)}∶1`;
      if(!DATA)DATA=JSON.parse(document.getElementById('data').textContent);
      const keys=[...DATA.problem.stem.matchAll(/\{(\w+)\}/g)].map(m=>m[1]).filter(k=>k!=='constraint');
      const U=Object.fromEntries(DATA.problem.params.map(p=>[p.key,p.unit]));
      document.querySelectorAll('#stem .num, #asks .num').forEach((sp,i)=>{const k=keys[i];if(k&&U[k]!==undefined)sp.textContent=stemNum(+P[k])+(U[k]?' '+U[k]:'')});
    }catch(e){}
  }

  return{
    legend:[{label:'电流 I（箭头长短表示有效值，方向周期性改变）',color:'--a'}],
    init(P){
      const K=cfg(P),s0=ss(K,0);
      const S={K,t:0,W:[0,0,0],ok:s0.ok,started:false,done:!s0.ok,s0,s1:K.mode==='load'?ssL(K,K.Gb):s0};
      S.status=stat(S);cur=S;curP=P;return S;
    },
    step(S,P,dt){
      if(S.done)return;cur=S;curP=P;S.started=true;
      const K=S.K;let rem=dt*RATE,n=0;
      while(rem>1e-12&&!S.done&&n++<1e5){
        const h=Math.min(rem,HMAX,T-S.t);if(!(h>0)){S.t=T;S.done=true;break}
        // RK4：dW/dt = P(t)（右端只含 t，k₂ = k₃）
        const a=pows(K,S.t),b=pows(K,S.t+h/2),d=pows(K,S.t+h);
        for(let i=0;i<3;i++)S.W[i]+=h/6*(a[i]+4*b[i]+d[i]);
        S.t+=h;rem-=h;if(S.t>=T*(1-1e-12)){S.t=T;S.done=true}
      }
      S.status=stat(S);
    },
    readouts(S,P){
      const K=S.K,s=ss(K,S.t),load=K.mode==='load';
      if(!s.ok)return[['状态','无解：P ≥ U₂²/r'],['发电机输出电压 U₁',V(K.U1)],['输送功率 P',Wt(K.Pw)],['输电电压 U₂',V(K.U2)],
        ['所需 I₁ = P/U₁',A(s.I1)],['所需 I₂ = P/U₂',A(s.I2)],['所需 U损 = I₂r',V(s.dU)],['U损 − U₂（> 0 做不到）',V(s.dU-K.U2)],
        ['输送功率上限 U₂²/r',Wt(K.Plim)],['用户最多得到 U₂²/(4r)',Wt(K.P4max)],['U₂ 至少应大于 √(Pr)',V(K.Umin)]];
      const r=[['发电机输出电压 U₁',V(s.U1)],['T₁ 原线圈电流 I₁',A(s.I1)],['发电机输出功率 P₁',Wt(s.P1)],
        ['输电电压 U₂ = k₁U₁',V(s.U2)],['输电线电流 I₂（= I₃）',A(s.I2)],['电压损失 U损 = I₂r',V(s.dU)],['功率损失 P损 = I₂²r',Wt(s.dP)],['损耗率 P损/P₁',pct(s.dP/s.P1)],
        ['T₂ 输入电压 U₃',V(s.U3)],['用户电压 U₄',V(s.U4)],['用户电流 I₄',A(s.I4)],['用户功率 P₄',Wt(s.P4)],
        [load?'用户等效电阻 R（当前）':'用户等效电阻 R（推算 U₄/I₄）',Om(s.R)],['折算电阻 R′ = k₂²R',Om(s.Rp)],
        ['效率 η = P₄/P₁',pct(s.eta)],['U₃/U₂',pct(s.eu)],['P₁ − P损 − P₄（应为 0）',sf(s.P1-s.dP-s.P4,2)+' W'],['U₂ − U损 − U₃（应为 0）',sf(s.U2-s.dU-s.U3,2)+' V'],
        ['模型时间 t',`${(S.t/3600).toFixed(3)} h（${(S.t/60).toFixed(1)} min）`],['W₁（发电机输出）',E(S.W[0])],['W损（输电线发热）',E(S.W[1])],['W₄（用户得到）',E(S.W[2])],
        ['W₁ − W损 − W₄（应为 0）',sf((S.W[0]-S.W[1]-S.W[2])/3600,2)+' W·h']];
      if(load)r.push(['用户功率最大值 P₄max = U₂²/(4r)',Wt(K.P4max)],['R′/r',K.r>0?sf(s.Rp/K.r,3):'—（r = 0）']);
      else r.push(['输送功率上限 U₂²/r',Wt(K.Plim)],['使 U₄ = 220 V 的 k₂ = U₃/220 V',stemNum(s.U3/220)]);
      r.push(['状态',S.status.cls==='warn'?S.status.text.split('：')[0]:'正常'],['画面倍速','快放 ×600（画面 6 s = 1 h）']);
      if(load&&!K.same&&S.done){const a=S.s0,b=S.s1;
        for(const[n,f,k]of[['U₁',V,'U1'],['I₁',A,'I1'],['P₁',Wt,'P1'],['U₂',V,'U2'],['I₂',A,'I2'],['U损',V,'dU'],['P损',Wt,'dP'],['U₃',V,'U3'],['U₄',V,'U4'],['I₄',A,'I4'],['P₄',Wt,'P4'],['η',pct,'eta']])
          r.push([`${n}：初 → 末`,`${f(a[k])} → ${f(b[k])}，${trend(a[k],b[k])}`])}
      return r;
    },
    draw(ctx,S,P,W,H,tok){
      const K=S.K,F=FIG(ctx,W,tok),u=F.u,t=F.ut,ink=F.ink,cX=F.auxColor,paper=F.paper,cA=tok('--a'),cW=tok('--warn');
      F.clear();
      // 字号、测宽和跟文字大小有关的偏移都用 F.ut（窄屏时字不随画布缩小），几何仍用 u
      const SERIF='"Times New Roman","STIX Two Text",Times,serif',SANS=tok('--f-body');
      const wid=(str,s,o={})=>{ctx.save();ctx.font=o.zh?`${s*t}px ${SANS}`:`${o.i===false?'':'italic '}${s*t}px ${SERIF}`;const w=ctx.measureText(str).width;ctx.restore();return w};
      const sz=o=>(o.s||19)*(o.sub?.66:1);
      const pw=parts=>parts.reduce((a,[str,o={}])=>a+wid(str,sz(o),o),0);
      // 一行文字避让：items = [{c 期望中心, p 文字}]，按 c 排序后前后几遍推开，间距 ≥ gap，限制在 [lo, hi] 内
      const lay=(items,y,lo,hi,gap)=>{items.forEach(it=>{it.w=pw(it.p);it.l=it.c-it.w/2});items.sort((a,b)=>a.c-b.c);
        for(let k=0;k<4;k++){for(let i=0;i<items.length;i++){const it=items[i];it.l=Math.max(it.l,i?items[i-1].l+items[i-1].w+gap:lo)}
          for(let i=items.length-1;i>=0;i--){const it=items[i],lim=i===items.length-1?hi:items[i+1].l-gap;if(it.l+it.w>lim)it.l=lim-it.w}}
        items.forEach(it=>run(it.p,it.l,y,{color:it.color||ink}))};
      // 一行混排：parts = [[文字, {i:false 正体, s 字号, sub 下标, zh 中文}]]，按 align 对齐到 (x,y)
      const run=(parts,x,y,{color=ink,align='left'}={})=>{
        let cx=x-(align==='center'?.5:align==='right'?1:0)*pw(parts);
        for(const[str,o={}]of parts){const s=sz(o),w=wid(str,s,o),y1=y+(o.sub?(o.s||19)*.3*t:0);
          if(o.zh)F.zh(str,cx,y1,{color,size:s,align:'left'});else F.label(str,cx,y1,{color,size:s,align:'left',italic:o.i!==false});cx+=w}};
      const sym=(b,sub,s=19)=>{const p=[[b,{s}]];if(sub)p.push([sub,{s,sub:1,i:false,zh:/[一-鿿]/.test(sub)}]);return p};
      const Rm=(str,s=15)=>[str,{i:false,s}],Z=(str,s=13)=>[str,{zh:1,s}];
      const narrow=typeof matchMedia==='function'&&matchMedia('(max-width:640px)').matches,cw=ctx.canvas.clientWidth||640;
      // 桌面宽度时状态条（一行，底边约 46 CSS px）浮在画布左上角，图从它下面开始；窄屏（≤ 640px）时状态条排在画布下方
      const y0=narrow?8*u:(46*720/cw+8)*u;
      const s=ss(K,S.t),feas=s.ok,load=K.mode==='load';

      /* ---------- 上部：输电电路图 ---------- */
      const yA=y0+9*u+58*t,yB=yA+132*u,ym=(yA+yB)/2,yI=yA-10*u-11*t,yU=yI-19*t,yPl=yU-18*t;
      const yN=yB+8*u+13*t,yZ=yN+19*t,yAC=yZ+19*t;
      const xG=34*u,rG=17*u,ra=5.5*u,X1=168*u,X2=448*u,xr=330*u,rw=17*u,xbk=395*u;
      const wire=pts=>F.poly(pts,{w:1.6});
      // 变压器：原、副线圈画成相对的两串半圆弧，中间两条竖直墨线为铁芯；弧数随匝数比变化（匝数多的一侧多画）；k = 1 时不画变压器，直接连通
      const xfmr=(xc,k)=>{const xp=xc-16*u,xs=xc+16*u;
        if(Math.abs(k-1)<1e-9){wire([[xp,yA],[xs,yA]]);wire([[xp,yB],[xs,yB]]);return{xp,xs,direct:true}}
        const ex=Math.max(1,Math.min(6,Math.round(2.2*Math.abs(Math.log10(k))))),np=3+(k<1?ex:0),ns=3+(k>1?ex:0);
        const coil=(x,n,dir)=>{const L=n*2*ra,y1=ym-L/2;wire([[x,yA],[x,y1]]);wire([[x,y1+L],[x,yB]]);
          for(let j=0;j<n;j++){const yc=y1+ra+2*ra*j;if(dir>0)F.arc(x,yc,ra,-PI/2,PI/2,{w:1.6});else F.arc(x,yc,ra,PI/2,3*PI/2,{w:1.6})}return L};
        const Lc=Math.max(coil(xp,np,1),coil(xs,ns,-1))+12*u;
        for(const dx of[-6*u,6*u])F.line(xc+dx,ym-Lc/2,xc+dx,ym+Lc/2,{w:1.6});
        return{xp,xs,direct:false}};
      // 发电机：圆圈内画「~」
      F.circle(xG,ym,rG,{w:1.8,fill:paper});
      {const pts=[];for(let j=0;j<=24;j++){const a=j/24;pts.push([xG-9*u+18*u*a,ym-4.5*u*Math.sin(2*PI*a)])}F.poly(pts,{w:1.6})}
      const T1=xfmr(X1,K.k1),T2=xfmr(X2,K.k2);
      wire([[xG,ym-rG],[xG,yA],[T1.xp,yA]]);wire([[xG,ym+rG],[xG,yB],[T1.xp,yB]]);
      // 输电线：上方导线串电阻 r，两根导线中段各有一小段间断（细虚线），表示距离很远
      wire([[T1.xs,yA],[xr-rw,yA]]);wire([[xr+rw,yA],[xbk-12*u,yA]]);wire([[xbk+12*u,yA],[T2.xp,yA]]);
      wire([[T1.xs,yB],[xbk-12*u,yB]]);wire([[xbk+12*u,yB],[T2.xp,yB]]);
      for(const y of[yA,yB])F.aux(xbk-12*u,y,xbk+12*u,y,{w:1.4,dash:[4,4]});
      F.rect(xr-rw,yA-6*u,2*rw,12*u,{w:1.6,fill:paper});
      const row=[{c:xr,p:[['r',{s:18}]]}];
      F.zh('输电线总电阻',xr,yA+6*u+9*t,{size:13});
      // 电压：每个线圈两端的引线旁画两端带箭头的竖直细线，标 U 与数值（两行）
      const vlab=(x,sub,val,side)=>{F.dim(x,yA+5*u,x,yB-5*u,null);const al=side<0?'right':'left',xx=x+side*6*u;
        run(sym('U',sub,18),xx,ym-11*t,{align:al});run([Rm(val,15)],xx,ym+10*t,{align:al});
        return Math.max(pw(sym('U',sub,18)),pw([Rm(val,15)]))};
      const dash='—';
      vlab(T1.xp-14*u,'1',V(K.U1),-1);vlab(T1.xs+14*u,'2',V(K.U2),1);
      vlab(T2.xp-14*u,'3',feas?V(s.U3):dash,-1);
      const wU4=vlab(T2.xs+14*u,'4',feas?V(s.U4):dash,1);

      h=`U₂ = k₁U₁ = ${b(V(a.U2))}，与负载无关（C1）。R′ = k₂²R = ${b(Om(a.Rp))}：I₂ = U₂/(r + R′) = ${b(A(a.I2))}，I₁ = k₁I₂ = ${b(A(a.I1))}，I₄ = k₂I₂ = ${b(A(a.I4))}；`+
        `U损 = ${b(V(a.dU))}，P损 = ${b(Wt(a.dP))}；U₃ = U₂R′/(r + R′) = ${b(V(a.U3))}，U₄ = U₃/k₂ = ${b(V(a.U4))}；P₁ = U₂I₂ = ${b(Wt(a.P1))}，P₄ = ${b(Wt(a.P4))}，η = R′/(r + R′) = ${b(pct(a.eta))}（C3、C6）。<br>`;
      if(!K.same){const more=K.Gb>K.G0,up=more?'增大':'减小',dn=more?'减小':'增大';
        h+=`R末 = ${Om(K.Rb)}：R′ = ${b(Om(c.Rp))}，I₂ = ${b(A(c.I2))}，U₄ = ${b(V(c.U4))}，P损 = ${b(Wt(c.dP))}，P₁ = ${b(Wt(c.P1))}，P₄ = ${b(Wt(c.P4))}，η = ${b(pct(c.eta))}。`+
          (K.r>0?`用电器${more?'增多':'减少'}：I₁、I₂、I₄、U损、P损、P₁ ${up}，U₃、U₄、η ${dn}，U₁、U₂ 不变（C6）；P₄ ${trend(a.P4,c.P4)}`:`r = 0：U₂、U₃、U₄ 不变，I₁、I₂、I₄、P₁、P₄ ${up}`)+
          (K.r>0?(Math.min(a.Rp,c.Rp)>K.r?'（R′ > r，正常工作区：用户功率随用电器增多而增大）':Math.max(a.Rp,c.Rp)<K.r?'（R′ < r：已越过最大值，用电器增多用户功率反而减小）':'（R′ 越过 r，P₄ 先增后减）'):'')+'。<br>'}
      h+=K.r>0?`用户功率最大值 P₄max = U₂²/(4r) = ${b(Wt(K.P4max))}（R′ = r 时，η = 50%）；开始时 R′/r = ${b(sf(a.Rp/K.r,3))}${a.Rp>K.r*1.005?'，在正常工作区':a.Rp<K.r*.995?'，用户端接近短路':'，正好是最大值'}。<br>`:'r = 0：没有损耗，U₄ = U₂/k₂。<br>';
      h+=`1 h 内${K.same?'':'（1/R 均匀变化，解析积分）'}：W₁ = ${b(E(Wth[0]))}，W损 = ${b(E(Wth[1]))}，W₄ = ${b(E(Wth[2]))}，播放结束时与读数对照。`;
      return h;
    },
    _cfg:cfg,_ssP:ssP,_ssL:ssL,_W:Wtheory,_cur:()=>cur
  };
})();

/* ================= 通用渲染引擎（所有母题共用，不改） ================= */
(()=>{
const D=JSON.parse(document.getElementById('data').textContent);
const PLAY=D.playLabel||'发射';   // 播放按钮上的动词，数据里可用 playLabel 改写（如「碰撞」「转动」）
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const root=document.documentElement;
const tok=n=>getComputedStyle(root).getPropertyValue(n).trim();
const PS=D.problem.params;
const P={};PS.forEach(p=>P[p.key]=p.def);
const unitSep=u=>/^[°′″]/.test(u)?'':' ';   // 角度单位紧贴数字：90°
const fmtP=p=>p.type==='choice'?p.options.find(o=>o.value===P[p.key]).label:(+P[p.key]).toFixed(p.dec??2)+(p.unit?unitSep(p.unit)+p.unit:'');

/* 静态内容 */
document.title=`格物 ${D.id} ${D.name.replace(/（.*）/,'')}`;
$('hName').textContent=D.name;
$('hSub').textContent=`${D.module} · ${D.chapter}　关联：${D.related.join('、')}`;
$('hTable').innerHTML=`<tr><th>编号</th><th>考查频率</th><th>难度</th><th>版本</th></tr>
<tr><td class="code">${esc(D.id)}</td><td>${esc(D.freq)}</td><td title="${D.difficulty} / 5">${'●'.repeat(D.difficulty)}${'○'.repeat(5-D.difficulty)}</td><td>${esc(D.version)}</td></tr>`;
$('foot').textContent=`格物 Gewu · ${D.id} · ${D.version} · ${D.footer??'g 取 10 m/s²'}`;   // 数据里可用 footer 改写页脚常量
$('tags').innerHTML=D.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('');
$('stemNote').textContent=D.problem.note||'';
$('bCond').innerHTML=D.boundary.conditions.map(c=>`<li><span>${esc(c)}</span></li>`).join('');
$('bBack').innerHTML=D.boundary.fallback.map(c=>`<li><span>${esc(c)}</span></li>`).join('');
$('legend').innerHTML=SIM.legend.map(l=>`<span><i style="background:var(${l.color})"></i>${esc(l.label)}</span>`).join('');
$('concl').innerHTML=D.conclusions.map(c=>`<details><summary><span class="badge">${c.id}</span><span class="t">${esc(c.title)}</span><span class="f">${esc(c.formula)}</span><span class="chev" aria-hidden="true"></span></summary><div class="deriv">${esc(c.derivation)}</div></details>`).join('');
const qCard=(q,isVar)=>`<article class="q">
  <div class="head"><span class="badge">${q.id}</span><h3>${esc(q.title)}</h3>${isVar?q.cs.map(c=>`<span class="chip">${c}</span>`).join(''):`<span class="chip">${q.anim?'计划做动画':'不做动画'}</span>`}</div>
  <p>${esc(q.stem)}</p>
  ${isVar?'':`<p class="map">映射：<b>${esc(q.map)}</b></p>`}
  <details><summary><span class="chev" aria-hidden="true"></span>答案与解析</summary><div class="ans"><p class="a">答案：${esc(q.answer)}</p><p>${esc(q.analysis)}</p></div></details>
  <div class="foot"><span class="src">${esc(q.source)}</span>${isVar?`<button data-load="${q.id}">加载到动画 ↑</button>`:''}</div>
</article>`;
$('variants').innerHTML=D.variants.map(v=>qCard(v,true)).join('');
$('reskins').innerHTML=D.reskins.map(r=>qCard(r,false)).join('');
$('sources').innerHTML=D.sources.map(s=>`<li><b>${esc(s.src)}</b><span>${esc(s.desc)}</span></li>`).join('');

/* 参数控件 */
const box=$('params');
PS.forEach(p=>{
  if(p.type==='choice'){
    const d=document.createElement('div');d.className='seg';d.id=`f-${p.key}`;d.setAttribute('role','group');d.setAttribute('aria-label',p.label);
    d.innerHTML=p.options.map(o=>`<button id="opt-${p.key}-${o.value}" data-k="${p.key}" data-v="${o.value}">${esc(o.label)}${o.hint?`<small>${esc(o.hint)}</small>`:""}</button>`).join('');
    box.appendChild(d);
  }else{
    const d=document.createElement('div');d.className='field';d.id=`f-${p.key}`;
    d.innerHTML=`<label for="num-${p.key}"><span class="s">${esc(p.sym)}</span><span class="note">${esc(p.label)}</span></label><span class="numin"><input type="number" id="num-${p.key}" min="${p.min}" max="${p.max}" step="any" inputmode="decimal" aria-label="${esc(p.label)}"><span class="u">${esc(p.unit||'')}</span></span><input type="range" id="in-${p.key}" min="${p.min}" max="${p.max}" step="${p.step}" value="${p.def}" aria-label="${esc(p.label)} 滑块">`;
    box.appendChild(d);
    d.querySelector('input[type=range]').addEventListener('input',e=>{P[p.key]=+e.target.value;active=-1;sync();reset()});
    const num=d.querySelector('input[type=number]');
    num.addEventListener('change',()=>{let v=parseFloat(num.value);
      if(Number.isFinite(v)){v=Math.min(p.max,Math.max(p.min,v));P[p.key]=v;active=-1;reset()}sync()});
    num.addEventListener('keydown',e=>{if(e.key==='Enter')num.blur()});
  }
});
box.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;P[b.dataset.k]=b.dataset.v;active=-1;sync();reset()});
let active=-1;
const shown=w=>!w||Object.entries(w).every(([k,v])=>[].concat(v).includes(P[k]));
const CH0=PS.find(p=>p.type==='choice');   // 预设只按第一个选项参数（情境 / 模式）分组，其余选项由预设的 load 带过去
const chosen=o=>!CH0||o[CH0.key]===undefined||o[CH0.key]===P[CH0.key];
const numTxt=(p,v)=>String(+(+v).toFixed(Math.max(p.dec??2,4)));
function sync(){
  PS.forEach(p=>{
    if(p.type==='choice'){p.options.forEach(o=>$(`opt-${p.key}-${o.value}`).setAttribute('aria-pressed',P[p.key]===o.value));if(p.when)$(`f-${p.key}`).hidden=!shown(p.when)}
    else{$(`in-${p.key}`).value=P[p.key];const n=$(`num-${p.key}`);if(document.activeElement!==n)n.value=numTxt(p,P[p.key]);$(`f-${p.key}`).hidden=!shown(p.when)}
  });
  const fill=s=>esc(s).replace(/\{(\w+)\}/g,(m,k)=>{
    if(k==='constraint'){const p=PS.find(x=>x.type==='choice');return esc(p.options.find(o=>o.value===P[p.key]).text)}
    const p=PS.find(x=>x.key===k);return p?`<span class="num">${esc(fmtP(p))}</span>`:m});
  const [lead,ask='']=D.problem.stem.split(/问[:：]/);
  $('stem').innerHTML=fill(lead.trim());
  const qs=ask.split(/[①②③④⑤⑥]/).map(s=>s.trim()).filter(Boolean);
  $('asks').innerHTML=qs.map((q,i)=>`<li><b>${i+1}</b><span>${fill(q)}</span></li>`).join('');
  $('asks').hidden=!qs.length;
  $('verdict').innerHTML=SIM.verdict(P);
  const ch=PS.find(p=>p.type==='choice');
  $('presetMode').textContent=ch?`· ${ch.options.find(o=>o.value===P[ch.key]).label}`:'';
  $('presets').innerHTML=D.presets.map((p,i)=>chosen(p.load)?`<button data-preset="${i}" aria-pressed="${i===active}" title="${esc(p.note||'')}">${esc(p.label)}</button>`:'').join('');
  const pn=$('pnote'),ap=D.presets[active];pn.hidden=!(ap&&ap.note);if(ap&&ap.note)pn.innerHTML=`<b>${esc(ap.label)}</b>：${esc(ap.note)}`;
}
function load(o,i=-1){Object.assign(P,o);active=i;sync();reset()}
$('presets').addEventListener('click',e=>{const b=e.target.closest('[data-preset]');if(b)load(D.presets[+b.dataset.preset].load,+b.dataset.preset)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-load]');if(!b)return;
  load(D.variants.find(v=>v.id===b.dataset.load).load);
  show('pane-lab');document.querySelector('.board').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})});

/* 画布与循环 */
const cv=$('cv'),ctx=cv.getContext('2d');let S,running=false,speed=1,lastT=0;
function size(){const r=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);const w=Math.max(200,Math.round(r.width*dpr));if(cv.width!==w){cv.width=w;cv.height=w}}
function render(){size();SIM.draw(ctx,S,P,cv.width,cv.height,tok);
  $('readout').innerHTML=SIM.readouts(S,P).map(([k,v])=>`<div class="ro"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('');
  const st=$('status');st.textContent=S.status.text;st.className='status '+S.status.cls}
function reset(){running=false;S=SIM.init(P);$('play').textContent=`▶ ${PLAY}`;render()}
function loop(t){if(!running)return;const real=Math.min(.05,(t-lastT)/1000);lastT=t;
  const sim=real*speed,n=Math.max(1,Math.ceil(sim/5e-4));for(let i=0;i<n;i++)SIM.step(S,P,sim/n);
  render();if(S.done){running=false;$('play').textContent=`▶ 再${PLAY}`;return}requestAnimationFrame(loop)}
$('play').onclick=()=>{if(running){running=false;$('play').textContent='▶ 继续';return}
  if(S.done)S=SIM.init(P);running=true;$('play').textContent='❚❚ 暂停';lastT=performance.now();requestAnimationFrame(loop)};
$('reset').onclick=reset;
$('slow').onclick=()=>{speed=speed===1?.25:1;$('slow').textContent=speed===1?'慢放 ×0.25':'正常速度'};
new ResizeObserver(render).observe(cv);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);
new MutationObserver(render).observe(root,{attributes:true,attributeFilter:['data-theme']});
/* 选项卡 */
const tabs=[...document.querySelectorAll('[role=tab]')];
function show(id){tabs.forEach(t=>{const on=t.dataset.pane===id;t.setAttribute('aria-selected',on);t.tabIndex=on?0:-1;$(t.dataset.pane).hidden=!on});
  if(id==='pane-lab')requestAnimationFrame(render)}
tabs.forEach((t,i)=>{t.addEventListener('click',()=>show(t.dataset.pane));
  t.addEventListener('keydown',e=>{const d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;if(!d)return;e.preventDefault();
    const n=tabs[(i+d+tabs.length)%tabs.length];n.focus();show(n.dataset.pane)})});
$('nConcl').textContent=D.conclusions.length;$('nVar').textContent=D.variants.length;$('nSkin').textContent=D.reskins.length;$('nSrc').textContent=D.sources.length;
show('pane-lab');
sync();reset();
})();
</script>
