<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>格物 Gewu 母题库</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;800&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: 与母题页同一套实验报告风格；题头 + 按模块分组的母题卡片目录 */
:root{
  --paper:#f2f4f3; --grid:#e4e9e6; --card:#ffffff; --sunk:#f6f8f7;
  --ink:#142030; --muted:#5b6979; --faint:#8a96a3; --line:#d6deda; --hair:#e7ece9;
  --accent:#2443a6; --accent-soft:#e9eefb; --ok:#18845a;
  --shadow:0 1px 0 rgba(20,32,48,.04),0 10px 28px -18px rgba(20,32,48,.28);
  --f-display:"Noto Serif SC","Songti SC","STSong",serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#10161d; --grid:#18202a; --card:#171f28; --sunk:#131a22;
  --ink:#e4e9ef; --muted:#9aa7b6; --faint:#6f7d8c; --line:#2a3542; --hair:#212b36;
  --accent:#93acff; --accent-soft:#1f2a44; --ok:#52d39c;
  --shadow:0 1px 0 rgba(0,0,0,.25),0 12px 30px -20px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#10161d; --grid:#18202a; --card:#171f28; --sunk:#131a22;
  --ink:#e4e9ef; --muted:#9aa7b6; --faint:#6f7d8c; --line:#2a3542; --hair:#212b36;
  --accent:#93acff; --accent-soft:#1f2a44; --ok:#52d39c;
  --shadow:0 1px 0 rgba(0,0,0,.25),0 12px 30px -20px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:32px 64px;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;font-weight:800}
p{margin:0}
.brand{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-bottom:10px}
.seal{font-family:var(--f-display);font-weight:800;font-size:13px;color:var(--card);background:var(--ink);padding:2px 8px;border-radius:3px;letter-spacing:.18em}
h1{font-size:clamp(28px,5vw,42px)}
.sub{margin-top:8px;color:var(--muted);max-width:40em}
.stats{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:14px;font-size:13px;color:var(--muted)}
.stats b{font-family:var(--f-mono);color:var(--ink)}
.group{display:flex;flex-direction:column;gap:12px}
.gh{display:flex;align-items:baseline;gap:12px}
.gh h2{font-size:19px}
.gh small{font-family:var(--f-mono);font-size:12px;color:var(--faint)}
.gh::after{content:"";flex:1;height:1px;background:var(--hair);align-self:center}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
a.card{display:flex;flex-direction:column;gap:10px;padding:18px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  color:inherit;text-decoration:none;transition:border-color .15s,transform .15s;min-width:0}
a.card:hover{border-color:var(--accent);transform:translateY(-2px)}
a.card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.code{font-family:var(--f-mono);font-weight:600;font-size:13px;color:var(--accent);background:var(--accent-soft);padding:1px 8px;border-radius:6px}
.st{font-size:12px;color:var(--ok);display:inline-flex;align-items:center;gap:6px}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.card h3{font-size:18px}
.kind{margin-top:2px;font-size:13px;color:var(--muted)}
.card p{font-size:14px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.tag{font-size:12px;border:1px solid var(--hair);background:var(--sunk);padding:1px 9px;border-radius:999px;color:var(--muted)}
.go{font-size:14px;font-weight:500;color:var(--accent)}
.next{font-size:14px;color:var(--muted);border:1px dashed var(--line);border-radius:14px;padding:16px 18px;background:var(--card)}
.next b{font-weight:500;color:var(--ink)}
footer{font-size:12px;color:var(--faint);text-align:center}
@media (prefers-reduced-motion: reduce){a.card{transition:none}a.card:hover{transform:none}}
</style>

<div class="wrap">
  <header>
    <div class="brand"><span class="seal">格物</span><span>Gewu · 高中物理母题</span></div>
    <h1>母题库</h1>
    <p class="sub">每道母题一个可调参数的动画模型，配核心考点、结论推导、变式和换皮题。题源以 2022–2026 上海卷为主。</p>
    <div class="stats" id="stats"></div>
  </header>
  <div id="list" class="wrap" style="padding:0;gap:28px"></div>
  <div class="next" id="next"></div>
  <footer>格物 Gewu · 更新于 2026-10-14 · g 取 10 m/s²</footer>
</div>

<script>
const ITEMS=[
  {mod:'力学',id:'MEC-CIR-01',name:'轻绳模型与轻杆模型',sub:'竖直面内圆周运动',desc:'小球能不能转过最高点？脱轨位置、两点弹力差 6mg、轻杆模型推拉判断。',tags:['最高点临界','脱轨判断','机械能守恒'],url:'https://claude.ai/artifact/VZ4UGrUj6Y2LJkEAcXcCMw',file:'MEC-CIR-01.html'},
  {mod:'力学',id:'MEC-GRV-01',name:'卫星运行参量的比较',sub:'高轨低速长周期',desc:'两颗卫星同屏对比 v、ω、T、a 与能量；高轨低速长周期，可切到椭圆与逃逸。',tags:['万有引力','黄金代换','开普勒第三定律'],url:'https://claude.ai/artifact/1KPpyax8eazq7WgP7hsobL',file:'MEC-GRV-01.html'},
  {mod:'力学',id:'MEC-GRV-02',name:'卫星变轨问题',sub:'霍曼转移、椭圆轨道与逃逸',desc:'点火加速离心、减速近心；近地点与远地点速度、开普勒第二与第三定律；两次点火转移与对接，第二宇宙速度。',tags:['霍曼转移','面积定律','逃逸速度'],url:'',file:'MEC-GRV-02.html'},
  {mod:'力学',id:'MEC-PRJ-01',name:'平抛运动的临界问题',sub:'过网不出界 / 斜面上的平抛',desc:'擦网与压线定出 v₀ 的范围，落回斜面与离斜面最远，垂直打在斜面上；tanα = 2tanφ。',tags:['x = v₀t','速度偏角与位移偏角','临界轨迹'],url:'',file:'MEC-PRJ-01.html'},
  {mod:'力学',id:'MEC-MOM-01',name:'碰撞模型',sub:'弹性碰撞与完全非弹性碰撞',desc:'一动碰一静：等质量交换速度，大碰小、小碰大；完全非弹性共速、动能损失最大；判断碰撞的可能性。',tags:['动量守恒','交换速度','碰撞三原则'],url:'',file:'MEC-MOM-01.html'},
  {mod:'力学',id:'MEC-MOM-02',name:'动量定理的应用',sub:'流体类问题（柱体模型）',desc:'取 Δt 内的柱体求冲击力，停住还是反弹；喷气悬停的推力；落地缓冲的平均力，重力何时不能略。',tags:['FΔt = Δp','柱体微元','平均作用力'],url:'',file:'MEC-MOM-02.html'},
  {mod:'力学',id:'MEC-MOM-03',name:'反冲与人船模型',sub:'含爆炸、某一方向的动量守恒',desc:'人在船上走，人与船的位移之比等于质量反比，与走法无关；弧形槽上滑下的小球只有水平方向动量守恒；空中爆炸两块飞开，质心沿原轨迹运动。',tags:['m₁x₁ = m₂x₂','水平方向动量守恒','反冲与爆炸'],url:'',file:'MEC-MOM-03.html'},
  {mod:'力学',id:'MEC-SHM-01',name:'简谐运动的判定与周期',sub:'弹簧振子、单摆',desc:'回复力 F = −kx 判定简谐运动；水平、竖直、斜面弹簧振子与单摆的周期；x–t 图与能量转换，大摆角时周期变长。',tags:['F回 = −kx','T = 2π√(m/k)','单摆测 g'],url:'',file:'MEC-SHM-01.html'},
  {mod:'力学',id:'MEC-ENG-01',name:'机车启动问题',sub:'恒定功率 / 恒定加速度启动',desc:'P = Fv：牵引力随速度减小，加速度逐渐减小到 vm；先匀加速再恒功率的两阶段；阻力恒定、∝ v、∝ v² 三种情形。',tags:['P = Fv','最大速度 vm','动能定理求位移'],url:'',file:'MEC-ENG-01.html'},
  {mod:'电磁学',id:'EM-IND-01',name:'电磁感应中的单杆模型',sub:'阻尼式 / 发电式',desc:'阻尼式（初速度滑行）与发电式（恒力拉动）：收尾速度、滑行距离、电量与焦耳热，实时 v–t 图。',tags:['E = BLv','安培力','动量定理求电量'],url:'https://claude.ai/artifact/EJetaamUEirvKzTJKYrYni',file:'EM-IND-01.html'},
  {mod:'电磁学',id:'EM-ACG-01',name:'交变电流的产生',sub:'线圈在匀强磁场中转动',desc:'线圈转动与 e–t 图同步：峰值、有效值、平均值各管什么；转 90° 的电量与热量，经理想变压器接负载。',tags:['Em = NBSω','中性面','有效值与平均值'],url:'',file:'EM-ACG-01.html'},
  {mod:'电磁学',id:'EM-ACG-02',name:'远距离输电',sub:'升压、降压变压器与输电线损耗',desc:'输送功率一定时升高电压，输电线电流减小、损耗按平方减小；用户用电器增多时 I₂ 增大、U₄ 降低，读数逐项对照。',tags:['P损 = I²r','U损 = Ir','动态分析'],url:'',file:'EM-ACG-02.html'},
  {mod:'电磁学',id:'EM-MAG-01',name:'带电粒子在有界匀强磁场中的圆周运动',sub:'直线 / 平行 / 圆形边界',desc:'定圆心、求半径、算偏转角与时间；临界相切、旋转圆与放缩圆、径向进出与磁聚焦。',tags:['r = mv/(qB)','定圆心','临界相切'],url:'',file:'EM-MAG-01.html'},
  {mod:'电磁学',id:'EM-ESF-01',name:'带电粒子在匀强电场中的偏转',sub:'类平抛 / 示波管',desc:'先加速后偏转：偏移 y = UL²/(4dU₀) 与粒子无关，出射方向反向延长线过板长中点；恰好从板边飞出；计重力的液滴。',tags:['类平抛','加速与偏转','示波管'],url:'',file:'EM-ESF-01.html'},
  {mod:'电磁学',id:'EM-EMW-01',name:'LC 振荡电路',sub:'电场能与磁场能',desc:'充电与放电交替，q 与 i 错开 1/4 周期；T = 2π√(LC)，调谐改变频率；与弹簧振子类比。',tags:['T = 2π√(LC)','电磁振荡','调谐'],url:'',file:'EM-EMW-01.html'},
  {mod:'热学',id:'THM-GAS-01',name:'气缸活塞类问题',sub:'气体实验定律',desc:'等温加砝码、等压变温、卡口等容三种过程，活塞动画与实时 p–V 图。',tags:['玻意耳定律','盖–吕萨克定律','热力学第一定律'],url:'https://claude.ai/artifact/Ft3k7dnsFGaEsbRw7w5YG1',file:'THM-GAS-01.html'},
  {mod:'光学',id:'OPT-LGT-01',name:'双缝干涉',sub:'杨氏双缝实验',desc:'由光程差判断明暗纹，Δx = Lλ/d；数条纹测波长，换单缝看衍射，红光与紫光对比。',tags:['Δx = Lλ/d','光程差','单缝衍射对照'],url:'',file:'OPT-LGT-01.html'},
  {mod:'光学',id:'OPT-LGT-02',name:'光的折射与全反射',sub:'玻璃砖、光导纤维',desc:'折射定律与 n = c/v；光密到光疏、入射角达到临界角时全反射；半圆形与平行玻璃砖、光导纤维、圆筒，色散。',tags:['折射定律','临界角','全反射'],url:'',file:'OPT-LGT-02.html'},
];
const NEXT=['EM-MAG-02 回旋加速器','MEC-NEW-01 牛顿第二定律的多过程问题（含传送带）','MEC-ENG-02 动能定理的多过程问题'];
// 在 claude.ai 上打开时用发布链接（没有发布链接的用同目录文件）；从代码仓本地打开或在自建服务器上时用同目录文件
const SELF_HOSTS=['8.133.160.230'];
const local=location.protocol==='file:'||/github\.io$/.test(location.hostname)||SELF_HOSTS.includes(location.hostname);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mods=[...new Set(ITEMS.map(i=>i.mod))];
document.getElementById('stats').innerHTML=`<span>已完成 <b>${ITEMS.length}</b> 道</span>`+mods.map(m=>`<span>${m} <b>${ITEMS.filter(i=>i.mod===m).length}</b></span>`).join('');
document.getElementById('list').innerHTML=mods.map(m=>`<section class="group"><div class="gh"><h2>${m}</h2><small>${ITEMS.filter(i=>i.mod===m).length} 道</small></div><div class="cards">${
  ITEMS.filter(i=>i.mod===m).map(i=>`<a class="card" href="${local||!i.url?i.file:i.url}" target="_blank" rel="noopener">
    <div class="top"><span class="code">${i.id}</span><span class="st">页面完成</span></div>
    <div><h3>${esc(i.name)}</h3><div class="kind">${esc(i.sub)}</div></div>
    <p>${esc(i.desc)}</p>
    <div class="tags">${i.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
    <span class="go">打开母题 →</span></a>`).join('')}</div></section>`).join('');
document.getElementById('next').innerHTML='<b>下一批：</b>'+NEXT.map(esc).join('　·　');
</script>
