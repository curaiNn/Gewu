<script>
/* ================= SIM 模块：每个母题替换这一段 =================
   约定接口：
   SIM.legend            [{label, color(CSS 变量名)}]
   SIM.init(P)           → 状态 S（含 S.done、S.status={text,cls}）
   SIM.step(S,P,dt)      推进 dt 秒（引擎保证 dt ≤ 0.5 ms）
   SIM.readouts(S,P)     → [[标签, 带单位的值]]
   SIM.draw(ctx,S,P,W,H,tok)  tok(name) 取主题色
   SIM.verdict(P)        → 理论预判 HTML
*/
const SIM=(()=>{
  const g=10,p0=1.0e5,TR=3;                       // TR：变温用时 3 s（T 线性变到目标）
  const fmt=(x,d=2)=>(Math.abs(x)<1e-12?0:x).toFixed(d);
  const fp=p=>fmt(p/1e5,3)+' ×10⁵ Pa';
  const KPROC={iso:'等温加砝码',isobar:'等压变温',isochor:'等容变温（卡口）'};
  /* 参数换算为国际单位，并给出理论末态（只用于选阻尼、定画布比例和预判，不参与积分） */
  function cfg(P){
    const A=P.S*1e-4,h0=P.h0/100,iso=P.proc==='iso',stop=P.proc==='isochor';
    const p1=p0+(iso?P.M:P.M+P.m)*g/A;             // 初态压强（C1）
    const Mt=P.M+P.m;                              // 运动时活塞 + 砝码总质量
    const C=p1*h0/P.T0;                            // p·h/T 恒量（同一截面，C5）
    const Tf=iso?P.T0:P.T;
    let pf,hf,N=0;
    if(iso){pf=p1+P.m*g/A;hf=p1*h0/pf}                       // 玻意耳
    else if(!stop||P.T<P.T0){pf=p1;hf=h0*P.T/P.T0}           // 盖–吕萨克（卡口时降温也会离开卡口）
    else{pf=p1*P.T/P.T0;hf=h0;N=(pf-p1)*A}                   // 查理 + 卡口力
    const mi=Math.max(Mt,1);                       // 惯性质量下限 1 kg（轻活塞时防止除零，不影响平衡态）
    const k=pf*A/hf;                               // 平衡位置附近的等效劲度
    const c=1.2*Math.sqrt(k*mi);                   // 阻尼比约 0.6：先有一点振荡，再在 1–3 s 内稳定
    return{A,h0,p1,Mt,C,Tf,pf,hf,N,mi,c,iso,stop};
  }
  const Tat=(P,K,t)=>K.iso?P.T0:P.T0+(K.Tf-P.T0)*Math.min(t/TR,1);
  const pres=(K,T,x)=>K.C*T/x;
  function force(P,K,t,x,v){return(pres(K,Tat(P,K,t),x)-p0)*K.A-K.Mt*g-K.c*v}
  function rng(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}
  function mix(a,b,f){const h=s=>{s=s.replace('#','');if(s.length===3)s=s.split('').map(c=>c+c).join('');return[0,2,4].map(i=>parseInt(s.slice(i,i+2),16))};
    try{const A=h(a),B=h(b);return`rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*f)).join(',')})`}catch(e){return a}}
  function nice(x){const e=Math.pow(10,Math.floor(Math.log10(x))),f=x/e;return(f<=1?1:f<=2?2:f<=5?5:10)*e}
  return{
    legend:[{label:'气体（蓝冷 → 红热）',color:'--v'},{label:'活塞 / 气缸',color:'--track'},{label:'砝码 m',color:'--warn'},{label:'p–V 过程路径',color:'--accent'}],
    init(P){
      const K=cfg(P),r=rng(7),parts=[];
      for(let i=0;i<90;i++)parts.push([r(),r(),r()*6.283,0.6+r()]);
      const T=P.T0;
      return{t:0,x:K.h0,v:0,T,p:K.p1,W:0,loaded:!K.iso,onStop:false,Nstop:0,done:false,parts,
        path:[[K.h0*K.A*1e6,K.p1]],lastRec:0,K,status:{text:'准备就绪',cls:''}};
    },
    step(S,P,dt){
      if(S.done)return;
      const K=S.K;S.loaded=true;
      const x=S.x,pa=pres(K,Tat(P,K,S.t),x);
      // 卡口：活塞贴着卡口且合力向上时保持不动，卡口提供向下的力
      if(K.stop&&x>=K.h0-1e-9){
        const F0=(pres(K,Tat(P,K,S.t+dt),K.h0)-p0)*K.A-K.Mt*g;
        if(F0>=-1e-6&&S.v>=-1e-9){S.t+=dt;S.x=K.h0;S.v=0;S.onStop=true;S.Nstop=F0;S.T=Tat(P,K,S.t);S.p=pres(K,S.T,S.x);this._fin(S,P);return}
      }
      S.onStop=false;S.Nstop=0;
      const t=S.t,a=(tt,xx,vv)=>force(P,K,tt,xx,vv)/K.mi;
      const k1x=S.v,k1v=a(t,x,S.v);
      const k2x=S.v+k1v*dt/2,k2v=a(t+dt/2,x+k1x*dt/2,S.v+k1v*dt/2);
      const k3x=S.v+k2v*dt/2,k3v=a(t+dt/2,x+k2x*dt/2,S.v+k2v*dt/2);
      const k4x=S.v+k3v*dt,k4v=a(t+dt,x+k3x*dt,S.v+k3v*dt);
      let nx=x+dt/6*(k1x+2*k2x+2*k3x+k4x),nv=S.v+dt/6*(k1v+2*k2v+2*k3v+k4v);
      if(K.stop&&nx>K.h0){nx=K.h0;nv=Math.min(nv,0)}
      if(nx<1e-5){nx=1e-5;nv=Math.max(nv,0)}
      S.t+=dt;S.T=Tat(P,K,S.t);
      const pb=pres(K,S.T,nx);
      S.W-=0.5*(pa+pb)*K.A*(nx-x);                // 外界对气体做的功 W = −∫p dV
      S.x=nx;S.v=nv;S.p=pb;
      this._fin(S,P);
    },
    _fin(S,P){
      const K=S.K;
      if(S.t-S.lastRec>=0.004){S.path.push([S.x*K.A*1e6,S.p]);S.lastRec=S.t;if(S.path.length>4000)S.path.splice(1,1)}
      const tEnd=K.iso?0:TR;
      const F=S.onStop?0:(S.p-p0)*K.A-K.Mt*g;
      if(S.t>=tEnd&&Math.abs(S.v)<2e-6&&Math.abs(F)<1e-4*Math.max(K.Mt*g,1)){
        S.done=true;S.path.push([S.x*K.A*1e6,S.p]);
        S.status={text:`已平衡：h = ${fmt(S.x*100,2)} cm`,cls:'ok'};return}
      if(S.t>40){S.done=true;S.status={text:'演示超时（40 s），以当前状态为准',cls:'warn'};return}
      if(K.iso)S.status={text:S.t<0.02?'砝码放上活塞':(Math.abs(S.v)>1e-3?'活塞下移，振动在阻尼下衰减':'接近新平衡'),cls:''};
      else if(S.onStop)S.status={text:`活塞顶住卡口：体积不变，压强随 T 增大（T = ${fmt(S.T,0)} K）`,cls:'warn'};
      else if(S.t<TR)S.status={text:`${K.Tf>=P.T0?'加热':'降温'}中：T = ${fmt(S.T,0)} K，活塞${S.v>=0?'上移':'下移'}（近似等压）`,cls:''};
      else S.status={text:'温度已到目标值，活塞趋于平衡',cls:''};
    },
    readouts(S,P){
      const K=S.K,dT=S.T-P.T0,V=S.x*K.A*1e6;
      const dU=Math.abs(dT)<1e-6?'0（T 不变）':dT>0?'> 0（T 升高）':'< 0（T 降低）';
      let Q;
      if(Math.abs(dT)<1e-6)Q=Math.abs(S.W)<1e-6?'0 J':(S.W>0?`放热 ${fmt(S.W)} J`:`吸热 ${fmt(-S.W)} J`);
      else if(dT>0&&S.W<=1e-6)Q=Math.abs(S.W)<1e-6?'吸热（Q = ΔU）':`吸热（Q > ${fmt(-S.W)} J）`;
      else if(dT<0&&S.W>=-1e-6)Q=Math.abs(S.W)<1e-6?'放热（|Q| = |ΔU|）':`放热（|Q| > ${fmt(S.W)} J）`;
      else Q='需知 ΔU 数值';
      const r=[['压强 p',fp(S.p)],['气柱高度 h',fmt(S.x*100,2)+' cm'],['体积 V',fmt(V,1)+' cm³'],['温度 T',fmt(S.T,1)+' K'],
        ['pV/T',fmt(S.p*S.x*K.A/S.T,4)+' J/K'],['内能变化 ΔU',dU],['外界对气体做功 W',fmt(S.W)+' J'],['热量 Q',Q]];
      if(K.stop)r.push(['卡口对活塞的力',fmt(S.Nstop)+' N']);
      r.push(['时间 t',fmt(S.t,2)+' s']);
      return r;
    },
    draw(ctx,S,P,W,H,tok){
      const K=S.K,u=W/720,mono=tok('--f-mono'),body=tok('--f-body');
      ctx.clearRect(0,0,W,H);ctx.fillStyle=tok('--card');ctx.fillRect(0,0,W,H);
      const txt=(s,x,y,col,sz=18,al='left',w='')=>{ctx.fillStyle=col;ctx.font=`${w}${sz*u}px ${body}`;ctx.textAlign=al;ctx.fillText(s,x,y);ctx.textAlign='left'};
      const mtxt=(s,x,y,col,sz=17,al='left',w='')=>{ctx.fillStyle=col;ctx.font=`${w}${sz*u}px ${mono}`;ctx.textAlign=al;ctx.fillText(s,x,y);ctx.textAlign='left'};
      /* ---------- 左：气缸 ---------- */
      const hmax=Math.max(K.h0,K.hf)*1.15,yb=575*u,pt=22*u,cx0=118*u,cw=180*u,sc=(370*u)/hmax;
      const X=Math.min(S.x,hmax*1.08),yPb=yb-X*sc,yPt=yPb-pt,wallTop=Math.min(yPt-70*u,yb-hmax*sc-pt-70*u);
      // 温度颜色
      const f=Math.max(0,Math.min(1,(S.T-200)/400)),gc=mix(tok('--v'),tok('--g'),f);
      ctx.globalAlpha=.16;ctx.fillStyle=gc;ctx.fillRect(cx0,yPb,cw,yb-yPb);ctx.globalAlpha=1;
      ctx.fillStyle=gc;const amp=2.5*u*Math.sqrt(S.T/300);
      for(const[a,b,ph,sp]of S.parts){
        const px=cx0+7*u+a*(cw-14*u)+amp*Math.sin(S.t*40*sp+ph),py=yb-5*u-b*(yb-yPb-10*u)+amp*Math.cos(S.t*37*sp+ph*1.7);
        ctx.beginPath();ctx.arc(px,py,3.6*u,0,7);ctx.fill()}
      // 器壁
      ctx.strokeStyle=tok('--track');ctx.lineWidth=6*u;ctx.lineCap='square';ctx.beginPath();
      ctx.moveTo(cx0-3*u,wallTop);ctx.lineTo(cx0-3*u,yb+3*u);ctx.lineTo(cx0+cw+3*u,yb+3*u);ctx.lineTo(cx0+cw+3*u,wallTop);ctx.stroke();
      // 卡口
      if(K.stop){const ys=yb-K.h0*sc-pt;ctx.fillStyle=tok('--ink');
        ctx.fillRect(cx0,ys-12*u,14*u,12*u);ctx.fillRect(cx0+cw-14*u,ys-12*u,14*u,12*u);
        txt('卡口',cx0+cw+14*u,ys-2*u,tok('--ink'),16,'left','600 ')}
      // 活塞
      ctx.fillStyle=tok('--track');ctx.fillRect(cx0+1*u,yPt,cw-2*u,pt);
      txt('M',cx0+cw/2,yPt+pt-5*u,tok('--card'),16,'center','700 ');
      // 砝码
      if(P.m>0){const bw=cw*.55,bh=34*u,bx=cx0+(cw-bw)/2;
        if(S.loaded){ctx.fillStyle=tok('--warn');ctx.fillRect(bx,yPt-bh,bw,bh);txt('m',bx+bw/2,yPt-bh/2+6*u,tok('--card'),18,'center','700 ')}
        else{const by=yPt-bh-60*u;ctx.setLineDash([5*u,5*u]);ctx.strokeStyle=tok('--warn');ctx.lineWidth=2*u;ctx.strokeRect(bx,by,bw,bh);ctx.setLineDash([]);
          txt('m（待放）',bx+bw/2,by+bh/2+6*u,tok('--warn'),16,'center','600 ')}}
      // 大气压
      txt('p₀ = 1.0×10⁵ Pa',cx0+cw/2,Math.max(70*u,wallTop-14*u),tok('--muted'),16,'center');
      // 刻度尺（cm）
      const rx=cx0-34*u,hcm=hmax*100,st=nice(hcm/8),mn=st/5;
      ctx.strokeStyle=tok('--muted');ctx.fillStyle=tok('--muted');ctx.lineWidth=1.5*u;ctx.beginPath();ctx.moveTo(rx,yb);ctx.lineTo(rx,yb-hmax*sc);ctx.stroke();
      for(let v=0;v<=hcm+1e-9;v+=mn){const y=yb-v/100*sc,major=Math.abs(v/st-Math.round(v/st))<1e-6;
        ctx.beginPath();ctx.moveTo(rx,y);ctx.lineTo(rx+(major?12:6)*u,y);ctx.stroke();
        if(major)mtxt(String(+v.toFixed(2)),rx-6*u,y+5*u,tok('--muted'),14,'right')}
      txt('cm',rx,yb-hmax*sc-12*u,tok('--muted'),14,'center');
      // h₀ 虚线与当前 h 标注
      const y0=yb-K.h0*sc;ctx.setLineDash([6*u,6*u]);ctx.strokeStyle=tok('--faint');ctx.lineWidth=1.5*u;
      ctx.beginPath();ctx.moveTo(cx0,y0);ctx.lineTo(cx0+cw+26*u,y0);ctx.stroke();ctx.setLineDash([]);
      mtxt('h₀',cx0+cw+30*u,y0+5*u,tok('--faint'),15);
      const ax=cx0+cw+48*u;ctx.strokeStyle=tok('--accent');ctx.fillStyle=tok('--accent');ctx.lineWidth=2*u;
      ctx.beginPath();ctx.moveTo(ax,yb);ctx.lineTo(ax,yPb);ctx.stroke();
      for(const[yy,d]of[[yb,1],[yPb,-1]]){ctx.beginPath();ctx.moveTo(ax,yy);ctx.lineTo(ax-5*u,yy-d*9*u);ctx.lineTo(ax+5*u,yy-d*9*u);ctx.closePath();ctx.fill()}
      ctx.save();ctx.translate(ax+20*u,(yb+yPb)/2);ctx.rotate(-Math.PI/2);mtxt(`h = ${fmt(S.x*100,1)} cm`,0,0,tok('--accent'),16,'center','600 ');ctx.restore();
      // 底部热源
      const heat=!K.iso&&K.Tf!==P.T0,hc=!heat?tok('--track'):K.Tf>P.T0?tok('--g'):tok('--v');
      ctx.fillStyle=hc;ctx.globalAlpha=heat&&S.t<TR&&S.t>0?1:.45;ctx.fillRect(cx0-6*u,yb+10*u,cw+12*u,12*u);ctx.globalAlpha=1;
      txt(K.iso?'导热良好，T 保持 T₀':heat?(K.Tf>P.T0?'加热：T₀ → T':'降温：T₀ → T'):'温度不变',cx0+cw/2,yb+48*u,tok('--muted'),16,'center');
      txt(KPROC[P.proc],cx0+cw/2,yb+76*u,tok('--ink'),18,'center','700 ');
      /* ---------- 右：p–V 图 ---------- */
      const gx0=432*u,gx1=692*u,gy0=110*u,gy1=410*u;
      const V1=K.h0*K.A*1e6,Vf=K.hf*K.A*1e6;
      let Vm=Math.max(V1,Vf,S.x*K.A*1e6)*1.2,pm=Math.max(K.p1,K.pf,S.p)*1.2;
      const vs=nice(Vm/4),ps=nice(pm/1e5/4)*1e5;Vm=Math.ceil(Vm/vs)*vs;pm=Math.ceil(pm/ps)*ps;
      const GX=V=>gx0+V/Vm*(gx1-gx0),GY=p=>gy1-p/pm*(gy1-gy0);
      txt('p–V 图',gx0,gy0-42*u,tok('--ink'),22,'left','700 ');txt('虚线为等温线',gx1,gy0-42*u,tok('--faint'),15,'right');
      ctx.strokeStyle=tok('--hair');ctx.lineWidth=1*u;
      for(let v=vs;v<=Vm+1e-9;v+=vs){ctx.beginPath();ctx.moveTo(GX(v),gy0);ctx.lineTo(GX(v),gy1);ctx.stroke()}
      for(let p=ps;p<=pm+1e-9;p+=ps){ctx.beginPath();ctx.moveTo(gx0,GY(p));ctx.lineTo(gx1,GY(p));ctx.stroke()}
      ctx.strokeStyle=tok('--muted');ctx.lineWidth=1.8*u;ctx.beginPath();ctx.moveTo(gx0,gy0-8*u);ctx.lineTo(gx0,gy1);ctx.lineTo(gx1+8*u,gy1);ctx.stroke();
      for(let v=0;v<=Vm+1e-9;v+=vs)mtxt(String(+v.toFixed(1)),GX(v),gy1+22*u,tok('--muted'),16,'center');
      for(let p=ps;p<=pm+1e-9;p+=ps)mtxt((p/1e5).toFixed(ps<1e5?1:0),gx0-6*u,GY(p)+5*u,tok('--muted'),16,'right');
      txt('V / cm³',gx1,gy1+48*u,tok('--muted'),16,'right');
      txt('p / ×10⁵ Pa',gx0-6*u,gy0-16*u,tok('--muted'),16,'left');
      // 等温线（虚线）：T₀，及末温 T
      const iso=(T,lab)=>{const k=K.C*T*K.A*1e6;ctx.beginPath();let st=false;
        for(let i=0;i<=120;i++){const V=Vm*(0.02+0.98*i/120),p=k/V;if(p>pm){st=false;continue}st?ctx.lineTo(GX(V),GY(p)):ctx.moveTo(GX(V),GY(p));st=true}ctx.stroke();
        const Vl=Vm;mtxt(lab,GX(Vl)-2*u,GY(k/Vl)-8*u,tok('--faint'),16,'right')};
      ctx.setLineDash([5*u,5*u]);ctx.strokeStyle=tok('--faint');ctx.lineWidth=1.4*u;
      iso(P.T0,'T₀');if(!K.iso&&Math.abs(P.T-P.T0)>0.5)iso(P.T,'T');ctx.setLineDash([]);
      // 路径
      ctx.strokeStyle=tok('--accent');ctx.lineWidth=3*u;ctx.lineJoin='round';ctx.beginPath();
      S.path.forEach(([V,p],i)=>i?ctx.lineTo(GX(V),GY(p)):ctx.moveTo(GX(V),GY(p)));ctx.lineTo(GX(S.x*K.A*1e6),GY(S.p));ctx.stroke();
      ctx.lineWidth=2*u;ctx.fillStyle=tok('--card');ctx.beginPath();ctx.arc(GX(V1),GY(K.p1),6*u,0,7);ctx.fill();ctx.stroke();
      mtxt('1',GX(V1)-10*u,GY(K.p1)+20*u,tok('--accent'),18,'right','700 ');
      ctx.fillStyle=tok('--accent');ctx.beginPath();ctx.arc(GX(S.x*K.A*1e6),GY(S.p),6.5*u,0,7);ctx.fill();
      if(S.done)mtxt('2',GX(S.x*K.A*1e6)-10*u,GY(S.p)-10*u,tok('--accent'),18,'right','700 ');
      // 状态表
      const ty=500*u,lx=gx0-40*u;
      const row=(lab,p,V,T,y,col)=>{txt(lab,lx,y,col,17,'left','700 ');mtxt(`p ${fmt(p/1e5,3)} V ${fmt(V,1)} T ${fmt(T,0)}`,lx+62*u,y,col,17)};
      txt('单位：p ×10⁵ Pa，V cm³，T K',lx,ty-32*u,tok('--faint'),16);
      row('状态 1',K.p1,V1,P.T0,ty,tok('--muted'));
      row('当前',S.p,S.x*K.A*1e6,S.T,ty+34*u,tok('--ink'));
      mtxt(`pV/T：${fmt(K.p1*K.h0*K.A/P.T0,4)} → ${fmt(S.p*S.x*K.A/S.T,4)} J/K`,lx,ty+70*u,tok('--muted'),17);
      if(K.stop)mtxt(`卡口力 N = ${fmt(S.Nstop)} N`,lx,ty+104*u,tok('--ink'),17);
      ctx.lineCap='butt';
    },
    verdict(P){
      const K=cfg(P),V1=K.h0*K.A*1e6,Vf=K.hf*K.A*1e6,Sm=fmt(P.S*1e-4,4);
      let h=`初态（C1）：p₁ = p₀ + ${K.iso?'Mg':'(M+m)g'}/S = <b>${fp(K.p1)}</b>，V₁ = <b>${fmt(V1,1)} cm³</b>。<br>`;
      if(K.iso){
        const W=K.p1*K.h0*K.A*Math.log(K.h0/K.hf);
        h+=`等温加砝码（C2）：p = p₁ + mg/S = <b>${fp(K.pf)}</b>，h = p₁h₀/p = <b>${fmt(K.hf*100,2)} cm</b>。<br>`;
        h+=`ΔU = 0，外界做功 W ${P.m>0?'&gt; 0':'= 0'}，所以 Q = −W，气体${P.m>0?'<b>放热</b>':'不吸热也不放热'}（C6）。缓慢等温时 W = p₁V₁ ln(V₁/V₂) = <b>${fmt(W)} J</b>（超纲公式，仅供与读数对照）。`;
      }else if(!K.stop||P.T<P.T0){
        const W=-K.p1*K.A*(K.hf-K.h0);
        if(K.stop)h+=`T &lt; T₀：压强要减小，活塞离开卡口下移，实际是<b>等压降温</b>。<br>`;
        h+=`等压（C3）：h = h₀T/T₀ = <b>${fmt(K.hf*100,2)} cm</b>，p 保持 <b>${fp(K.pf)}</b>。<br>`;
        h+=`W = −pΔV = <b>${fmt(W)} J</b>；${P.T>P.T0?'T 升高 ΔU &gt; 0、W &lt; 0，所以 Q = ΔU − W &gt; 0，<b>吸热</b>且吸热多于对外做功':P.T<P.T0?'T 降低 ΔU &lt; 0、W &gt; 0，所以 Q &lt; 0，<b>放热</b>且放热多于外界做功':'状态不变'}（C6）。`;
      }else{
        h+=`卡口挡住，等容（C4）：p = p₁T/T₀ = <b>${fp(K.pf)}</b>，h 保持 <b>${fmt(K.h0*100,2)} cm</b>。<br>`;
        h+=`卡口对活塞向下的力 N = (p − p₁)S = <b>${fmt(K.N)} N</b>。W = 0，Q = ΔU ${P.T>P.T0?'&gt; 0，<b>吸热</b>':'= 0'}（C6）。`;
      }
      h+=`<br>温度一律用 K（C7）：T₀ = ${fmt(P.T0,0)} K = ${fmt(P.T0-273,0)} ℃${K.iso?'':`，T = ${fmt(P.T,0)} K = ${fmt(P.T-273,0)} ℃`}。S = ${Sm} m²。`;
      return h;
    },
    _cfg:cfg
  };
})();

$('bBack').innerHTML=D.boundary.fallback.map(c=>`<li><span>${esc(c)}</span></li>`).join('');
$('legend').innerHTML=SIM.legend.map(l=>`<span><i style="background:var(${l.color})"></i>${esc(l.label)}</span>`).join('');
$('concl').innerHTML=D.conclusions.map(c=>`<details><summary><span class="badge">${c.id}</span><span class="t">${esc(c.title)}</span><span class="f">${esc(c.formula)}</span><span class="chev" aria-hidden="true"></span></summary><div class="deriv">${esc(c.derivation)}</div></details>`).join('');
const qCard=(q,isVar)=>`<article class="q">
  <div class="head"><span class="badge">${q.id}</span><h3>${esc(q.title)}</h3>${isVar?q.cs.map(c=>`<span class="chip">${c}</span>`).join(''):`<span class="chip">${q.anim?'计划做动画':'不做动画'}</span>`}</div>
  <p>${esc(q.stem)}</p>
  ${isVar?'':`<p class="map">映射：<b>${esc(q.map)}</b></p>`}
  <details><summary><span class="chev" aria-hidden="true"></span>答案与解析</summary><div class="ans"><p class="a">答案：${esc(q.answer)}</p><p>${esc(q.analysis)}</p></div></details>
  <div class="foot"><span class="src">${esc(q.source)}</span>${isVar?`<button data-load="${q.id}">加载到动画 ↑</button>`:''}</div>
</article>`;
$('variants').innerHTML=D.variants.map(v=>qCard(v,true)).join('');
$('reskins').innerHTML=D.reskins.map(r=>qCard(r,false)).join('');
$('sources').innerHTML=D.sources.map(s=>`<li><b>${esc(s.src)}</b><span>${esc(s.desc)}</span></li>`).join('');

/* 参数控件 */
const box=$('params');
PS.forEach(p=>{
  if(p.type==='choice'){
    const d=document.createElement('div');d.className='seg';d.setAttribute('role','group');d.setAttribute('aria-label',p.label);
    d.innerHTML=p.options.map(o=>`<button id="opt-${p.key}-${o.value}" data-k="${p.key}" data-v="${o.value}">${esc(o.label)}</button>`).join('');
    box.appendChild(d);
  }else{
    const d=document.createElement('div');d.className='field';
    d.innerHTML=`<label for="in-${p.key}"><span class="s">${esc(p.sym)}</span><span class="note">${esc(p.label)}</span></label><input type="range" id="in-${p.key}" min="${p.min}" max="${p.max}" step="${p.step}" value="${p.def}"><output id="out-${p.key}"></output>`;
    box.appendChild(d);
    d.querySelector('input').addEventListener('input',e=>{P[p.key]=+e.target.value;sync();reset()});
  }
});
box.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;P[b.dataset.k]=b.dataset.v;sync();reset()});
function sync(){
  PS.forEach(p=>{
    if(p.type==='choice')p.options.forEach(o=>$(`opt-${p.key}-${o.value}`).setAttribute('aria-pressed',P[p.key]===o.value));
    else{$(`in-${p.key}`).value=P[p.key];$(`out-${p.key}`).textContent=fmtP(p)}
  });
  const fill=s=>esc(s).replace(/\{(\w+)\}/g,(m,k)=>{
    if(k==='constraint'){const p=PS.find(x=>x.type==='choice');return esc(p.options.find(o=>o.value===P[p.key]).text)}
    const p=PS.find(x=>x.key===k);return p?`<span class="num">${esc(fmtP(p))}</span>`:m});
  const [lead,ask='']=D.problem.stem.split(/问[:：]/);
  $('stem').innerHTML=fill(lead.trim());
  const qs=ask.split(/[①②③④⑤⑥]/).map(s=>s.trim()).filter(Boolean);
  $('asks').innerHTML=qs.map((q,i)=>`<li><b>${i+1}</b><span>${fill(q)}</span></li>`).join('');
  $('asks').hidden=!qs.length;
  $('given').innerHTML=PS.map(p=>`<dt>${esc(p.sym)}</dt><dd>${esc(fmtP(p))}</dd>`).join('');
  $('verdict').innerHTML=SIM.verdict(P);
}
function load(o){Object.assign(P,o);sync();reset()}
$('presets').innerHTML=D.presets.map((p,i)=>`<button data-preset="${i}">${esc(p.label)}</button>`).join('');
$('presets').addEventListener('click',e=>{const b=e.target.closest('[data-preset]');if(b)load(D.presets[+b.dataset.preset].load)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-load]');if(!b)return;
  load(D.variants.find(v=>v.id===b.dataset.load).load);
  $('labPanel').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})});

/* 画布与循环 */
const cv=$('cv'),ctx=cv.getContext('2d');let S,running=false,speed=1,lastT=0;
function size(){const r=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);const w=Math.max(200,Math.round(r.width*dpr));if(cv.width!==w){cv.width=w;cv.height=w}}
function render(){size();SIM.draw(ctx,S,P,cv.width,cv.height,tok);
  $('readout').innerHTML=SIM.readouts(S,P).map(([k,v])=>`<div class="ro"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('');
  const st=$('status');st.textContent=S.status.text;st.className='status '+S.status.cls}
function reset(){running=false;S=SIM.init(P);$('play').textContent='▶ 发射';render()}
function loop(t){if(!running)return;const real=Math.min(.05,(t-lastT)/1000);lastT=t;
  const sim=real*speed,n=Math.max(1,Math.ceil(sim/5e-4));for(let i=0;i<n;i++)SIM.step(S,P,sim/n);
  render();if(S.done){running=false;$('play').textContent='▶ 再发射';return}requestAnimationFrame(loop)}
$('play').onclick=()=>{if(running){running=false;$('play').textContent='▶ 继续';return}
  if(S.done)S=SIM.init(P);running=true;$('play').textContent='❚❚ 暂停';lastT=performance.now();requestAnimationFrame(loop)};
$('reset').onclick=reset;
$('slow').onclick=()=>{speed=speed===1?.25:1;$('slow').textContent=speed===1?'慢放 ×0.25':'正常速度'};
new ResizeObserver(render).observe(cv);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);
new MutationObserver(render).observe(root,{attributes:true,attributeFilter:['data-theme']});
sync();reset();
})();
</script>
