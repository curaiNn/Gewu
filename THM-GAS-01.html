<script>
/* ================= 线稿绘图工具 FIG（所有母题共用，不改） =================
   画法照试卷插图：装置用墨线，固定面画斜线阴影，辅助线用虚线，物理量和点的字母用斜体衬线；
   只有矢量带颜色（--g 重力/外力，--n 弹力/约束力，--v 速度，--a 其他矢量）。
   用法：SIM.draw 里 const F=FIG(ctx,W,tok)；坐标是画布像素，F.u = W/720 是线宽与几何的基准单位，
   F.ut 是字号单位（窄屏时不再随画布缩小，保证字母不小于约 11 CSS 像素；自写文字函数也要用 F.ut 算字号）。
   颜色：F.ink 墨线、F.auxColor 辅助线、F.paper 纸色（F.aux 是画辅助线的方法，不是颜色）。 */
const FIG=(ctx,W,tok)=>{
  const u=W/720,ink=tok('--fig-ink'),aux=tok('--fig-aux'),paper=tok('--card');
  const dp=W/(ctx.canvas.clientWidth||W),ut=Math.max(u,dp*11/19);   // dp：每 CSS 像素的画布像素数
  const SERIF='"Times New Roman","STIX Two Text",Times,serif',SANS=tok('--f-body');
  const path=(fn,{w=1.6,color=ink,dash=null,fill=null}={})=>{ctx.save();ctx.beginPath();fn();
    if(fill){ctx.fillStyle=fill;ctx.fill()}
    if(w>0){ctx.lineWidth=w*u;ctx.strokeStyle=color;ctx.setLineDash(dash?dash.map(d=>d*u):[]);ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}
    ctx.restore()};
  // 文字先描一圈底色再填色，压在线条上也清楚
  const text=(t,x,y,font,color,align,base)=>{ctx.save();ctx.font=font;ctx.textAlign=align;ctx.textBaseline=base;
    ctx.lineJoin="round";ctx.lineWidth=5*ut;ctx.strokeStyle=paper;ctx.strokeText(t,x,y);ctx.fillStyle=color;ctx.fillText(t,x,y);ctx.restore()};
  const F={u,ut,ink,auxColor:aux,paper,
    clear(){ctx.save();ctx.setLineDash([]);ctx.fillStyle=paper;ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height);ctx.restore()},
    line(x1,y1,x2,y2,o){path(()=>{ctx.moveTo(x1,y1);ctx.lineTo(x2,y2)},o)},
    poly(pts,o){path(()=>pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y)),o)},
    circle(x,y,r,o){path(()=>ctx.arc(x,y,r,0,2*Math.PI),o)},
    arc(x,y,r,a0,a1,o){path(()=>ctx.arc(x,y,r,a0,a1),o)},
    rect(x,y,w,h,o){path(()=>ctx.rect(x,y,w,h),o)},
    // 辅助线（中心线、投影线等）
    aux(x1,y1,x2,y2,o={}){F.line(x1,y1,x2,y2,{w:1,color:aux,dash:[6,5],...o})},
    // 运动轨迹：细虚线
    trail(pts,o={}){if(pts.length>1)F.poly(pts,{w:1.3,color:aux,dash:[5,5],...o})},
    // 固定面斜线：沿 (x1,y1)→(x2,y2) 的直线，画在 side 一侧（屏幕坐标下，1 = 前进方向右手侧）
    hatch(x1,y1,x2,y2,side=1,{gap=12,len=10}={}){const L=Math.hypot(x2-x1,y2-y1),n=Math.max(1,Math.round(L/(gap*u)));
      const tx=(x2-x1)/L,ty=(y2-y1)/L,nx=-ty*side,ny=tx*side,ox=(nx-tx)*len*u/Math.SQRT2,oy=(ny-ty)*len*u/Math.SQRT2;
      path(()=>{for(let i=0;i<=n;i++){const x=x1+(x2-x1)*i/n,y=y1+(y2-y1)*i/n;ctx.moveTo(x,y);ctx.lineTo(x+ox,y+oy)}},{w:1,color:aux})},
    // 圆弧形固定面的斜线：out = true 画在圆外侧
    hatchArc(cx,cy,r,a0,a1,out=true,{gap=12,len=10}={}){const n=Math.max(1,Math.round(r*Math.abs(a1-a0)/(gap*u))),s=out?1:-1;
      path(()=>{for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n,c=Math.cos(a),si=Math.sin(a),x=cx+r*c,y=cy+r*si;
        const nx=c*s,ny=si*s,tx=-si,ty=c;ctx.moveTo(x,y);ctx.lineTo(x+(nx-tx)*len*u/Math.SQRT2,y+(ny-ty)*len*u/Math.SQRT2)}},{w:1,color:aux})},
    // 矢量：从 (x,y) 画到 (x+dx,y+dy)，细杆 + 窄实心箭头；label 用斜体写在箭头外侧，
    // 与别的矢量共线时用 off=[dx,dy]（单位 u，相对箭头尖）把标注挪到旁边
    arrow(x,y,dx,dy,color,label,{w=2,head=12,size=19,off=null}={}){const L=Math.hypot(dx,dy);if(L<2*u)return;
      const ux=dx/L,uy=dy/L,h=Math.min(head*u,L*.6),hw=h*.34,tx=x+dx,ty=y+dy;
      F.line(x,y,tx-ux*h*.7,ty-uy*h*.7,{w,color});
      path(()=>{ctx.moveTo(tx,ty);ctx.lineTo(tx-ux*h-uy*hw,ty-uy*h+ux*hw);ctx.lineTo(tx-ux*h+uy*hw,ty-uy*h-ux*hw);ctx.closePath()},{w:0,fill:color});
      if(label)F.label(label,off?tx+off[0]*u:tx+ux*14*u,off?ty+off[1]*u:ty+uy*14*u,{color,size})},
    // 斜体衬线字母（物理量、点名）
    label(t,x,y,{color=ink,size=19,align='center',base='middle',italic=true}={}){text(t,x,y,`${italic?'italic ':''}${size*ut}px ${SERIF}`,color,align,base)},
    // 中文小注
    zh(t,x,y,{color=aux,size=14,align='center',base='middle'}={}){text(t,x,y,`${size*ut}px ${SANS}`,color,align,base)},
    dot(x,y,r=2.6,color=ink){F.circle(x,y,r*u,{w:0,fill:color})},
    // 带名字的点：实心小点 + 斜体字母（dx、dy 为字母相对点的偏移，单位 u）
    point(x,y,name,dx=-13,dy=13){F.dot(x,y);if(name)F.label(name,x+dx*u,y+dy*u)},
    // 小球：空心圆，球心另用 F.dot 标出（矢量画完后再点，表示力作用在重心）
    ball(x,y,r){F.circle(x,y,r,{w:1.6,fill:paper})},
    // 尺寸标注：两端带箭头的细线，文字写在中点外侧 off（单位 u）
    dim(x1,y1,x2,y2,t,{off=14,color=ink}={}){const L=Math.hypot(x2-x1,y2-y1);if(L<4*u)return;const ux=(x2-x1)/L,uy=(y2-y1)/L,h=Math.min(8*u,L/3),hw=h*.38;
      F.line(x1,y1,x2,y2,{w:1,color});
      for(const[px,py,sx]of[[x1,y1,1],[x2,y2,-1]])path(()=>{ctx.moveTo(px,py);ctx.lineTo(px+sx*ux*h-uy*hw,py+sx*uy*h+ux*hw);ctx.lineTo(px+sx*ux*h+uy*hw,py+sx*uy*h-ux*hw);ctx.closePath()},{w:0,fill:color});
      if(t)F.label(t,(x1+x2)/2-uy*off*u,(y1+y2)/2+ux*off*u,{color})},
  };
  return F;
};

/* ================= SIM 模块：每个母题替换这一段 =================
   约定接口：
   SIM.legend            [{label, color(CSS 变量名)}]
   SIM.init(P)           → 状态 S（含 S.done、S.status={text,cls}）
   SIM.step(S,P,dt)      推进 dt 秒（引擎保证 dt ≤ 0.5 ms）
   SIM.readouts(S,P)     → [[标签, 带单位的值]]
   SIM.draw(ctx,S,P,W,H,tok)  tok(name) 取主题色
   SIM.verdict(P)        → 理论预判 HTML
*/
const SIM=(()=>{
  const g=10,p0=1.0e5,TR=3;                       // TR：变温用时 3 s（T 线性变到目标）
  const fmt=(x,d=2)=>(Math.abs(x)<1e-12?0:x).toFixed(d);
  const fp=p=>fmt(p/1e5,3)+' ×10⁵ Pa';
  const KPROC={iso:'等温加砝码',isobar:'等压变温',isochor:'等容变温（卡口）'};
  /* 参数换算为国际单位，并给出理论末态（只用于选阻尼、定画布比例和预判，不参与积分） */
  function cfg(P){
    const A=P.S*1e-4,h0=P.h0/100,iso=P.proc==='iso',stop=P.proc==='isochor';
    const p1=p0+(iso?P.M:P.M+P.m)*g/A;             // 初态压强（C1）
    const Mt=P.M+P.m;                              // 运动时活塞 + 砝码总质量
    const C=p1*h0/P.T0;                            // p·h/T 恒量（同一截面，C5）
    const Tf=iso?P.T0:P.T;
    let pf,hf,N=0;
    if(iso){pf=p1+P.m*g/A;hf=p1*h0/pf}                       // 玻意耳
    else if(!stop||P.T<P.T0){pf=p1;hf=h0*P.T/P.T0}           // 盖–吕萨克（卡口时降温也会离开卡口）
    else{pf=p1*P.T/P.T0;hf=h0;N=(pf-p1)*A}                   // 查理 + 卡口力
    const mi=Math.max(Mt,1);                       // 惯性质量下限 1 kg（轻活塞时防止除零，不影响平衡态）
    const k=pf*A/hf;                               // 平衡位置附近的等效劲度
    const c=1.2*Math.sqrt(k*mi);                   // 阻尼比约 0.6：先有一点振荡，再在 1–3 s 内稳定
    return{A,h0,p1,Mt,C,Tf,pf,hf,N,mi,c,iso,stop};
  }
  const Tat=(P,K,t)=>K.iso?P.T0:P.T0+(K.Tf-P.T0)*Math.min(t/TR,1);
  const pres=(K,T,x)=>K.C*T/x;
  function force(P,K,t,x,v){return(pres(K,Tat(P,K,t),x)-p0)*K.A-K.Mt*g-K.c*v}
  function nice(x){const e=Math.pow(10,Math.floor(Math.log10(x))),f=x/e;return(f<=1?1:f<=2?2:f<=5?5:10)*e}
  return{
    legend:[{label:'砝码重力 mg',color:'--g'},{label:'卡口对活塞的力（卡口等容）',color:'--n'}],
    init(P){
      const K=cfg(P),T=P.T0;
      return{t:0,x:K.h0,v:0,T,p:K.p1,W:0,loaded:!K.iso,onStop:false,Nstop:0,done:false,
        path:[[K.h0*K.A*1e6,K.p1]],lastRec:0,K,status:{text:'准备就绪',cls:''}};
    },
    step(S,P,dt){
      if(S.done)return;
      const K=S.K;S.loaded=true;
      const x=S.x,pa=pres(K,Tat(P,K,S.t),x);
      // 卡口：活塞贴着卡口且合力向上时保持不动，卡口提供向下的力
      if(K.stop&&x>=K.h0-1e-9){
        const F0=(pres(K,Tat(P,K,S.t+dt),K.h0)-p0)*K.A-K.Mt*g;
        if(F0>=-1e-6&&S.v>=-1e-9){S.t+=dt;S.x=K.h0;S.v=0;S.onStop=true;S.Nstop=F0;S.T=Tat(P,K,S.t);S.p=pres(K,S.T,S.x);this._fin(S,P);return}
      }
      S.onStop=false;S.Nstop=0;
      const t=S.t,a=(tt,xx,vv)=>force(P,K,tt,xx,vv)/K.mi;
      const k1x=S.v,k1v=a(t,x,S.v);
      const k2x=S.v+k1v*dt/2,k2v=a(t+dt/2,x+k1x*dt/2,S.v+k1v*dt/2);
      const k3x=S.v+k2v*dt/2,k3v=a(t+dt/2,x+k2x*dt/2,S.v+k2v*dt/2);
      const k4x=S.v+k3v*dt,k4v=a(t+dt,x+k3x*dt,S.v+k3v*dt);
      let nx=x+dt/6*(k1x+2*k2x+2*k3x+k4x),nv=S.v+dt/6*(k1v+2*k2v+2*k3v+k4v);
      if(K.stop&&nx>K.h0){nx=K.h0;nv=Math.min(nv,0)}
      if(nx<1e-5){nx=1e-5;nv=Math.max(nv,0)}
      S.t+=dt;S.T=Tat(P,K,S.t);
      const pb=pres(K,S.T,nx);
      S.W-=0.5*(pa+pb)*K.A*(nx-x);                // 外界对气体做的功 W = −∫p dV
      S.x=nx;S.v=nv;S.p=pb;
      this._fin(S,P);
    },
    _fin(S,P){
      const K=S.K;
      if(S.t-S.lastRec>=0.004){S.path.push([S.x*K.A*1e6,S.p]);S.lastRec=S.t;if(S.path.length>4000)S.path.splice(1,1)}
      const tEnd=K.iso?0:TR;
      const F=S.onStop?0:(S.p-p0)*K.A-K.Mt*g;
      if(S.t>=tEnd&&Math.abs(S.v)<2e-6&&Math.abs(F)<1e-4*Math.max(K.Mt*g,1)){
        S.done=true;S.path.push([S.x*K.A*1e6,S.p]);
        S.status={text:`已平衡：h = ${fmt(S.x*100,2)} cm`,cls:'ok'};return}
      if(S.t>40){S.done=true;S.status={text:'演示超时（40 s），以当前状态为准',cls:'warn'};return}
      if(K.iso)S.status={text:S.t<0.02?'砝码放上活塞':(Math.abs(S.v)>1e-3?'活塞下移，振动在阻尼下衰减':'接近新平衡'),cls:''};
      else if(S.onStop)S.status={text:`活塞顶住卡口：体积不变，压强随 T 增大（T = ${fmt(S.T,0)} K）`,cls:'warn'};
      else if(S.t<TR)S.status={text:`${K.Tf>=P.T0?'加热':'降温'}中：T = ${fmt(S.T,0)} K，活塞${S.v>=0?'上移':'下移'}（近似等压）`,cls:''};
      else S.status={text:'温度已到目标值，活塞趋于平衡',cls:''};
    },
    readouts(S,P){
      const K=S.K,dT=S.T-P.T0,V=S.x*K.A*1e6;
      const dU=Math.abs(dT)<1e-6?'0（T 不变）':dT>0?'> 0（T 升高）':'< 0（T 降低）';
      let Q;
      if(Math.abs(dT)<1e-6)Q=Math.abs(S.W)<1e-6?'0 J':(S.W>0?`放热 ${fmt(S.W)} J`:`吸热 ${fmt(-S.W)} J`);
      else if(dT>0&&S.W<=1e-6)Q=Math.abs(S.W)<1e-6?'吸热（Q = ΔU）':`吸热（Q > ${fmt(-S.W)} J）`;
      else if(dT<0&&S.W>=-1e-6)Q=Math.abs(S.W)<1e-6?'放热（|Q| = |ΔU|）':`放热（|Q| > ${fmt(S.W)} J）`;
      else Q='需知 ΔU 数值';
      const r=[['压强 p',fp(S.p)],['气柱高度 h',fmt(S.x*100,2)+' cm'],['体积 V',fmt(V,1)+' cm³'],['温度 T',fmt(S.T,1)+' K'],
        ['pV/T',fmt(S.p*S.x*K.A/S.T,4)+' J/K'],['内能变化 ΔU',dU],['外界对气体做功 W',fmt(S.W)+' J'],['热量 Q',Q]];
      if(K.stop)r.push(['卡口对活塞的力',fmt(S.Nstop)+' N']);
      r.push(['时间 t',fmt(S.t,2)+' s']);
      return r;
    },
    draw(ctx,S,P,W,H,tok){
      // 几何用 u；文字字号、文字相关的偏移和行距用 t = F.ut（窄屏时 t > u，字不跟着画布缩小）
      const K=S.K,F=FIG(ctx,W,tok),u=F.u,t=F.ut,kt=t/u,SERIF='"Times New Roman","STIX Two Text",Times,serif',SANS=tok('--f-body');
      // 桌面宽度状态条浮在画布左上角，顶上留出它的高度；窄屏（≤ 640px）状态条排到画布下方，顶端空间还给图形
      const narrow=typeof matchMedia==='function'&&matchMedia('(max-width:640px)').matches;
      const dp=W/(ctx.canvas.clientWidth||W),top=narrow?6*u:Math.max(50*dp,40*u);
      F.clear();
      // 混排一行：segs=[[文字, 'i' 斜体字母 | 'r' 正体数字与单位 | 'z' 中文小注, 可选颜色]]；先给整行描底色再统一填字，相邻段的底色不会盖住前一段
      const fnt=(kind,size)=>kind==='z'?`${(size-2)*t}px ${SANS}`:`${kind==='i'?'italic ':''}${size*t}px ${SERIF}`;
      const widths=(segs,size)=>{ctx.save();const ws=segs.map(([s,kind])=>{ctx.font=fnt(kind,size);return ctx.measureText(s).width});ctx.restore();return ws};
      const width=(segs,size=17)=>widths(segs,size).reduce((a,b)=>a+b,0);
      const rich=(segs,x,y,{size=17,align='center',color=F.ink}={})=>{
        const ws=widths(segs,size),tw=ws.reduce((a,b)=>a+b,0);
        let x0=align==='left'?x:align==='right'?x-tw:x-tw/2;const xs=ws.map(w=>{const s=x0;x0+=w;return s});
        ctx.save();ctx.textAlign='left';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineWidth=5*t;ctx.strokeStyle=F.paper;
        for(const fill of[false,true])segs.forEach(([s,kind,c],i)=>{ctx.font=fnt(kind,size);ctx.fillStyle=c||color;fill?ctx.fillText(s,xs[i],y):ctx.strokeText(s,xs[i],y)});
        ctx.restore();return tw};
      const num=(s,x,y,o={})=>F.label(s,x,y,{size:16,italic:false,...o});
      /* ---------- 左：气缸（开口向上，壁和底外侧画斜线） ---------- */
      const L=100*u,R=310*u,cw=R-L,cxm=(L+R)/2,pt=14*u+10*t,bh=18*u+20*t,bw=cw*.46;
      const yb=H-36*u-48*t,capY=yb+18*u+12*t,noteY=capY+26*t;           // 底下两行图注
      const gh=Math.min((narrow?410:380)*u,(yb-(top+32*t)-pt-bh-8*u)/1.08);           // 气柱最大显示高度（活塞过冲上限 1.08 倍）
      const hmax=Math.max(K.h0,K.hf)*1.15,sc=gh/hmax;
      const X=Math.min(S.x,hmax*1.08),yPb=yb-X*sc,yPt=yPb-pt,y0=yb-K.h0*sc;
      const wallTop=yb-1.08*gh-pt-bh-8*u,moved=Math.abs(yPb-y0)>3*u;
      F.poly([[L,wallTop],[L,yb],[R,yb],[R,wallTop]],{w:2});
      F.hatch(L,wallTop,L,yb,1);F.hatch(L,yb,R,yb,1);F.hatch(R,yb,R,wallTop,1);
      rich([['p₀','i'],[' = 1.0×10⁵ Pa','r']],cxm,wallTop-20*t);
      // 卡口：初态活塞上表面处壁上的两个小挡块
      const sw=14*u,sh=10*u,ys=y0-pt;
      if(K.stop){F.rect(L,ys-sh,sw,sh,{w:1.4});F.rect(R-sw,ys-sh,sw,sh,{w:1.4});
        F.line(L,ys,L+sw,ys-sh,{w:1});F.line(R-sw,ys-sh,R,ys,{w:1});
        F.zh('卡口',R+16*u,ys-sh/2,{align:'left',size:15})}
      // 活塞初位置（离开后画虚线框）
      if(moved)F.rect(L,y0-pt,cw,pt,{w:1,color:F.auxColor,dash:[5,4]});
      // 气体：固定位置的稀疏小点（只随气柱整体伸缩，不变色、不抖动）+ 当前温度
      // 温度小注放在气柱中部；活塞初位置的虚线框挡住时，改放到虚线框上下较宽的那段气体中间
      let gy=(yb+yPb)/2;
      if(moved&&y0-pt<yb&&y0>yPb&&Math.abs(gy-(y0-pt/2))<pt/2+10*t){const a=Math.max(0,y0-pt-yPb),b=Math.max(0,yb-y0);gy=a>b?(yPb+y0-pt)/2:(y0+yb)/2}
      const Tlab=[['T','i'],[` = ${fmt(S.T,0)} K`,'r']],tw=width(Tlab,18);
      const fr=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)};
      for(let r=0;r<5;r++)for(let c=0;c<6;c++){const i=r*6+c,a=(c+.2+.6*fr(2*i))/6,b=(r+.2+.6*fr(2*i+1))/5;
        const px=L+9*u+a*(cw-18*u),py=yb-7*u-b*(yb-yPb-14*u);
        if(Math.abs(px-cxm)<tw/2+14*u&&Math.abs(py-gy)<5*u+10*t||moved&&py>y0-pt-4*u&&py<y0+4*u)continue;
        F.dot(px,py,2.1,F.auxColor)}
      rich(Tlab,cxm,gy,{size:18});
      // 活塞 M、砝码 m
      F.rect(L,yPt,cw,pt,{w:1.6,fill:F.paper});F.label('M',L+cw*.15,yPt+pt/2,{size:18});
      const bx=cxm-bw/2,fs=40*u/Math.max(P.m*g,10);let wc=null;
      if(P.m>0){
        if(S.loaded){const by=yPt-bh;F.rect(bx,by,bw,bh,{w:1.6,fill:F.paper});F.label('m',bx+bw*.24,by+bh/2,{size:18});wc=[cxm,by+bh/2]}
        else{const by=yPt-bh-46*u;F.rect(bx,by,bw,bh,{w:1.2,dash:[5,4]});F.label('m',bx+bw*.28,by+bh/2,{size:18});F.zh('待放',bx+bw*.68,by+bh/2)}}
      // 气柱高度：右侧 h（当前），离开初位置后左侧再标 h₀
      const xr=R+38*u;
      F.aux(R+3*u,yb,xr+7*u,yb);F.aux(R+3*u,yPb,xr+7*u,yPb);F.dim(xr,yb,xr,yPb,moved?'h':'h₀',{off:15*kt});
      if(moved){const xl=L-38*u;F.aux(L-3*u,yb,xl-7*u,yb);F.aux(L-3*u,y0,xl-7*u,y0);F.dim(xl,yb,xl,y0,'h₀',{off:-17*kt})}
      // 力：砝码重力 mg（--g）；卡口压活塞的力（--n，两个卡口各画一支）
      if(K.stop&&S.Nstop>1e-6){const Ln=Math.min(70*u,S.Nstop/2*fs);
        F.arrow(L+sw/2,ys,0,Ln,tok('--n'),null);F.arrow(R-sw/2,ys,0,Ln,tok('--n'),null)}
      if(wc){const Lg=P.m*g*fs;F.arrow(wc[0],wc[1],0,Lg,tok('--g'),'mg',{off:[(8*u+12*t)/u,(yPt+pt/2-wc[1]-Lg)/u]});F.dot(wc[0],wc[1],2.2)}
      // 图注：过程名 + 温度小注
      F.zh(KPROC[P.proc],cxm,capY,{color:F.ink,size:16});
      const dir=K.iso||Math.abs(P.T-P.T0)<0.5?'':P.T>P.T0?'加热':'降温';
      const note=!dir?[['导热良好，','z'],['T','i'],[' 保持不变','z']]
        :S.t<=0?[[`待${dir}：`,'z'],['T₀','i'],[' → ','r'],['T','i']]
        :S.t<TR?[[`缓慢${dir}中：`,'z'],['T₀','i'],[' → ','r'],['T','i']]
        :[[`已${dir}到 `,'z'],['T','i']];
      rich(note,cxm,noteY,{size:17});
      /* ---------- 右：p–V 图（试卷画法）+ 状态表；末行与左侧图注对齐 ---------- */
      const tx0=400*u,tx1=712*u,pvY=noteY,ty=pvY-102*t,VnY=ty-16*t,tickY=VnY-22*t;
      const gx0=448*u,gx1=670*u,gy1=tickY-6*u-10*t,gy0=Math.max(gy1-(narrow?340:320)*u,top+10*t+28*u);
      const V1=K.h0*K.A*1e6,Vc=S.x*K.A*1e6,Vf=K.hf*K.A*1e6;
      let Vm=Math.max(V1,Vf,Vc)*1.2,pm=Math.max(K.p1,K.pf,S.p)*1.2;
      const vs=nice(Vm/4),ps=nice(pm/1e5/4)*1e5;Vm=Math.ceil(Vm/vs)*vs;pm=Math.ceil(pm/ps)*ps;
      const GX=V=>gx0+V/Vm*(gx1-gx0),GY=p=>gy1-p/pm*(gy1-gy0);
      // 等温线：细虚线（T₀，变温时再画末温 T）
      const isoLine=T=>{const k=K.C*T*K.A*1e6,seg=[];let pts=[];
        for(let i=0;i<=160;i++){const V=Vm*(0.02+0.98*i/160),p=k/V;if(p>pm){if(pts.length>1)seg.push(pts);pts=[];continue}pts.push([GX(V),GY(p)])}
        if(pts.length>1)seg.push(pts);seg.forEach(s=>F.poly(s,{w:1.2,color:F.auxColor,dash:[6,5]}));return GY(k/Vm)};
      let yT0=isoLine(P.T0),yT=null;
      if(!K.iso&&Math.abs(P.T-P.T0)>0.5)yT=isoLine(P.T);
      const sep=19*t;if(yT!==null&&Math.abs(yT-yT0)<sep){const m=(yT+yT0)/2,s=yT<yT0?-1:1;yT=m+s*sep/2;yT0=m-s*sep/2}
      F.label('T₀',gx1+4*u,yT0-4*u-5*t,{size:17,color:F.auxColor,align:'left'});
      if(yT!==null)F.label('T',gx1+4*u,yT-4*u-5*t,{size:17,color:F.auxColor,align:'left'});
      // 坐标轴、刻度、轴名
      F.arrow(gx0,gy1,gx1+30*u-gx0,0,F.ink,null,{w:1.4,head:11});
      F.arrow(gx0,gy1,0,gy0-28*u-gy1,F.ink,null,{w:1.4,head:11});
      for(let v=vs;v<=Vm+1e-9;v+=vs){const x=GX(v);F.line(x,gy1,x,gy1-5*u,{w:1});num(String(+v.toFixed(1)),x,tickY)}
      for(let p=ps;p<=pm+1e-9;p+=ps){const y=GY(p);F.line(gx0,y,gx0+5*u,y,{w:1});num((p/1e5).toFixed(ps<1e5?1:0),gx0-4*u-4*t,y,{align:'right'})}
      F.label('O',gx0-4*u-6*t,gy1+4*u+8*t,{size:17});
      rich([['p','i'],['/(×10⁵ Pa)','r']],gx0+10*u,gy0-28*u,{align:'left'});
      rich([['V','i'],['/cm³','r']],gx1+32*u,VnY,{align:'right'});
      // 状态点投影线
      const p1x=GX(V1),p1y=GY(K.p1),pcx=GX(Vc),pcy=GY(S.p),far=Math.hypot(pcx-p1x,pcy-p1y)>4*u;
      F.aux(p1x,p1y,p1x,gy1,{dash:[3,4]});F.aux(p1x,p1y,gx0,p1y,{dash:[3,4]});
      if(far){F.aux(pcx,pcy,pcx,gy1,{dash:[3,4]});F.aux(pcx,pcy,gx0,pcy,{dash:[3,4]})}
      // 过程路径：墨线，中段加一个方向箭头
      const pts=S.path.map(([V,p])=>[GX(V),GY(p)]);pts.push([pcx,pcy]);
      F.poly(pts,{w:1.8});
      const d12=Math.hypot(pcx-p1x,pcy-p1y);
      if(d12>26*u){const dist=q=>Math.hypot(q[0]-p1x,q[1]-p1y);
        const i=pts.findIndex(q=>dist(q)>=d12/2),j=pts.findIndex(q=>dist(q)>=d12/2-10*u);
        if(i>0&&j>=0&&i!==j){let dx=pts[i][0]-pts[j][0],dy=pts[i][1]-pts[j][1];const l=Math.hypot(dx,dy);
          if(l>1e-6){dx/=l;dy/=l;const[hx,hy]=pts[i],a=9*u,b=3.4*u;
            F.poly([[hx+dx*a/2,hy+dy*a/2],[hx-dx*a/2-dy*b,hy-dy*a/2+dx*b],[hx-dx*a/2+dy*b,hy-dy*a/2-dx*b]],{w:0,fill:F.ink})}}}
      // 状态点：小实心点 + 编号，编号放在路径外侧（背离原点一侧），离点的距离随编号宽度加大
      let nx=1,ny=-1;
      if(d12>2*u){nx=(pcy-p1y)/d12;ny=-(pcx-p1x)/d12;if(nx*(p1x-gx0)+ny*(p1y-gy1)<0){nx=-nx;ny=-ny}}
      const nl=Math.hypot(nx,ny);nx/=nl;ny/=nl;
      const tag=(s,x,y)=>{const w=width([[s,'r']],17),d=6*u+Math.abs(nx)*w/2+Math.abs(ny)*6*t+3*t;num(s,x+nx*d,y+ny*d,{size:17})};
      F.dot(p1x,p1y,3);tag(S.done&&!far?'1(2)':'1',p1x,p1y);
      if(far){F.dot(pcx,pcy,3);if(S.done)tag('2',pcx,pcy)}
      // 状态表（三线表）：按实际字宽排列；放不下时先缩小字号，再改用短表头
      const lab=s=>s==='当前'?[[s,'z']]:[[s,'r']];
      const cells=[['1',K.p1,V1,P.T0],[S.done?'2':'当前',S.p,Vc,S.T]].map(([l,p,V,T])=>[lab(l),[[fmt(p/1e5,3),'r']],[[fmt(V,1),'r']],[[fmt(T,0),'r']]]);
      const hd=pu=>[[['状态','z']],[['p','i'],[pu,'r']],[['V','i'],['/cm³','r']],[['T','i'],['/K','r']]];
      let lay;
      for(const[hs,cs,hdr]of[[16,17,hd('/(×10⁵ Pa)')],[15,16,hd('/(×10⁵ Pa)')],[14,15,hd('/10⁵ Pa')],[13,14,hd('/10⁵Pa')]]){
        const ws=hdr.map((h,j)=>Math.max(width(h,hs),...cells.map(r=>width(r[j],cs)))),gap=(tx1-tx0-ws.reduce((a,b)=>a+b,0))/4;
        lay={hs,cs,hdr,ws,gap};if(gap>=12*t)break}
      let xc=tx0+lay.gap/2;const cx=lay.ws.map(w=>{const c=xc+w/2;xc+=w+lay.gap;return c});
      F.line(tx0,ty,tx1,ty,{w:1.4});F.line(tx0,ty+30*t,tx1,ty+30*t,{w:.9});F.line(tx0,ty+82*t,tx1,ty+82*t,{w:1.4});
      lay.hdr.forEach((h,j)=>rich(h,cx[j],ty+15*t,{size:lay.hs}));
      cells.forEach((r,i)=>r.forEach((c,j)=>rich(c,cx[j],ty+(44+24*i)*t,{size:lay.cs})));
      // pV/T 小注：放不下时省去「始终不变」
      const pv=[['pV','i'],['/','r'],['T','i'],[` = ${fmt(S.p*S.x*K.A/S.T,4)} J/K`,'r']],pvz=[...pv,['（始终不变）','z',F.auxColor]];
      rich(width(pvz,17)<=tx1-tx0?pvz:pv,(tx0+tx1)/2,pvY,{size:17});
    },
    verdict(P){
      const K=cfg(P),V1=K.h0*K.A*1e6,Vf=K.hf*K.A*1e6,Sm=fmt(P.S*1e-4,4);
      let h=`初态（C1）：p₁ = p₀ + ${K.iso?'Mg':'(M+m)g'}/S = <b>${fp(K.p1)}</b>，V₁ = <b>${fmt(V1,1)} cm³</b>。<br>`;
      if(K.iso){
        const W=K.p1*K.h0*K.A*Math.log(K.h0/K.hf);
        h+=`等温加砝码（C2）：p = p₁ + mg/S = <b>${fp(K.pf)}</b>，h = p₁h₀/p = <b>${fmt(K.hf*100,2)} cm</b>。<br>`;
        h+=`ΔU = 0，外界做功 W ${P.m>0?'&gt; 0':'= 0'}，所以 Q = −W，气体${P.m>0?'<b>放热</b>':'不吸热也不放热'}（C6）。缓慢等温时 W = p₁V₁ ln(V₁/V₂) = <b>${fmt(W)} J</b>（超纲公式，仅供与读数对照）。`;
      }else if(!K.stop||P.T<P.T0){
        const W=-K.p1*K.A*(K.hf-K.h0);
        if(K.stop)h+=`T &lt; T₀：压强要减小，活塞离开卡口下移，实际是<b>等压降温</b>。<br>`;
        h+=`等压（C3）：h = h₀T/T₀ = <b>${fmt(K.hf*100,2)} cm</b>，p 保持 <b>${fp(K.pf)}</b>。<br>`;
        h+=`W = −pΔV = <b>${fmt(W)} J</b>；${P.T>P.T0?'T 升高 ΔU &gt; 0、W &lt; 0，所以 Q = ΔU − W &gt; 0，<b>吸热</b>且吸热多于对外做功':P.T<P.T0?'T 降低 ΔU &lt; 0、W &gt; 0，所以 Q &lt; 0，<b>放热</b>且放热多于外界做功':'状态不变'}（C6）。`;
      }else{
        h+=`卡口挡住，等容（C4）：p = p₁T/T₀ = <b>${fp(K.pf)}</b>，h 保持 <b>${fmt(K.h0*100,2)} cm</b>。<br>`;
        h+=`卡口对活塞向下的力 N = (p − p₁)S = <b>${fmt(K.N)} N</b>。W = 0，Q = ΔU ${P.T>P.T0?'&gt; 0，<b>吸热</b>':'= 0'}（C6）。`;
      }
      h+=`<br>温度一律用 K（C7）：T₀ = ${fmt(P.T0,0)} K = ${fmt(P.T0-273,0)} ℃${K.iso?'':`，T = ${fmt(P.T,0)} K = ${fmt(P.T-273,0)} ℃`}。S = ${Sm} m²。`;
      return h;
    },
    _cfg:cfg
  };
})();

  ${isVar?'':`<p class="map">映射：<b>${esc(q.map)}</b></p>`}
  <details><summary><span class="chev" aria-hidden="true"></span>答案与解析</summary><div class="ans"><p class="a">答案：${esc(q.answer)}</p><p>${esc(q.analysis)}</p></div></details>
  <div class="foot"><span class="src">${esc(q.source)}</span>${isVar?`<button data-load="${q.id}">加载到动画 ↑</button>`:''}</div>
</article>`;

$('reskins').innerHTML=D.reskins.map(r=>qCard(r,false)).join('');
$('sources').innerHTML=D.sources.map(s=>`<li><b>${esc(s.src)}</b><span>${esc(s.desc)}</span></li>`).join('');

/* 参数控件 */
const box=$('params');
PS.forEach(p=>{
  if(p.type==='choice'){
    const d=document.createElement('div');d.className='seg';d.id=`f-${p.key}`;d.setAttribute('role','group');d.setAttribute('aria-label',p.label);
    d.innerHTML=p.options.map(o=>`<button id="opt-${p.key}-${o.value}" data-k="${p.key}" data-v="${o.value}">${esc(o.label)}${o.hint?`<small>${esc(o.hint)}</small>`:""}</button>`).join('');
    box.appendChild(d);
  }else{
    const d=document.createElement('div');d.className='field';d.id=`f-${p.key}`;
    d.innerHTML=`<label for="num-${p.key}"><span class="s">${esc(p.sym)}</span><span class="note">${esc(p.label)}</span></label><span class="numin"><input type="number" id="num-${p.key}" min="${p.min}" max="${p.max}" step="any" inputmode="decimal" aria-label="${esc(p.label)}"><span class="u">${esc(p.unit||'')}</span></span><input type="range" id="in-${p.key}" min="${p.min}" max="${p.max}" step="${p.step}" value="${p.def}" aria-label="${esc(p.label)} 滑块">`;
    box.appendChild(d);
    d.querySelector('input[type=range]').addEventListener('input',e=>{P[p.key]=+e.target.value;active=-1;sync();reset()});
    const num=d.querySelector('input[type=number]');
    num.addEventListener('change',()=>{let v=parseFloat(num.value);
      if(Number.isFinite(v)){v=Math.min(p.max,Math.max(p.min,v));P[p.key]=v;active=-1;reset()}sync()});
    num.addEventListener('keydown',e=>{if(e.key==='Enter')num.blur()});
  }
});
box.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;P[b.dataset.k]=b.dataset.v;active=-1;sync();reset()});
let active=-1;
const shown=w=>!w||Object.entries(w).every(([k,v])=>[].concat(v).includes(P[k]));
const CH0=PS.find(p=>p.type==='choice');   // 预设只按第一个选项参数（情境 / 模式）分组，其余选项由预设的 load 带过去
const chosen=o=>!CH0||o[CH0.key]===undefined||o[CH0.key]===P[CH0.key];
const numTxt=(p,v)=>String(+(+v).toFixed(Math.max(p.dec??2,4)));
function sync(){
  PS.forEach(p=>{
    if(p.type==='choice'){p.options.forEach(o=>$(`opt-${p.key}-${o.value}`).setAttribute('aria-pressed',P[p.key]===o.value));if(p.when)$(`f-${p.key}`).hidden=!shown(p.when)}
    else{$(`in-${p.key}`).value=P[p.key];const n=$(`num-${p.key}`);if(document.activeElement!==n)n.value=numTxt(p,P[p.key]);$(`f-${p.key}`).hidden=!shown(p.when)}
  });
  const fill=s=>esc(s).replace(/\{(\w+)\}/g,(m,k)=>{
    if(k==='constraint'){const p=PS.find(x=>x.type==='choice');return esc(p.options.find(o=>o.value===P[p.key]).text)}
    const p=PS.find(x=>x.key===k);return p?`<span class="num">${esc(fmtP(p))}</span>`:m});
  const [lead,ask='']=D.problem.stem.split(/问[:：]/);
  $('stem').innerHTML=fill(lead.trim());
  const qs=ask.split(/[①②③④⑤⑥]/).map(s=>s.trim()).filter(Boolean);
  $('asks').innerHTML=qs.map((q,i)=>`<li><b>${i+1}</b><span>${fill(q)}</span></li>`).join('');
  $('asks').hidden=!qs.length;
  $('verdict').innerHTML=SIM.verdict(P);
  const ch=PS.find(p=>p.type==='choice');
  $('presetMode').textContent=ch?`· ${ch.options.find(o=>o.value===P[ch.key]).label}`:'';
  $('presets').innerHTML=D.presets.map((p,i)=>chosen(p.load)?`<button data-preset="${i}" aria-pressed="${i===active}" title="${esc(p.note||'')}">${esc(p.label)}</button>`:'').join('');
  const pn=$('pnote'),ap=D.presets[active];pn.hidden=!(ap&&ap.note);if(ap&&ap.note)pn.innerHTML=`<b>${esc(ap.label)}</b>：${esc(ap.note)}`;
}
function load(o,i=-1){Object.assign(P,o);active=i;sync();reset()}
$('presets').addEventListener('click',e=>{const b=e.target.closest('[data-preset]');if(b)load(D.presets[+b.dataset.preset].load,+b.dataset.preset)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-load]');if(!b)return;
  load(D.variants.find(v=>v.id===b.dataset.load).load);
  show('pane-lab');document.querySelector('.board').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})});

/* 画布与循环 */
const cv=$('cv'),ctx=cv.getContext('2d');let S,running=false,speed=1,lastT=0;
function size(){const r=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);const w=Math.max(200,Math.round(r.width*dpr));if(cv.width!==w){cv.width=w;cv.height=w}}
function render(){size();SIM.draw(ctx,S,P,cv.width,cv.height,tok);
  $('readout').innerHTML=SIM.readouts(S,P).map(([k,v])=>`<div class="ro"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('');
  const st=$('status');st.textContent=S.status.text;st.className='status '+S.status.cls}
function reset(){running=false;S=SIM.init(P);$('play').textContent='▶ 发射';render()}
function loop(t){if(!running)return;const real=Math.min(.05,(t-lastT)/1000);lastT=t;
  const sim=real*speed,n=Math.max(1,Math.ceil(sim/5e-4));for(let i=0;i<n;i++)SIM.step(S,P,sim/n);
  render();if(S.done){running=false;$('play').textContent='▶ 再发射';return}requestAnimationFrame(loop)}
$('play').onclick=()=>{if(running){running=false;$('play').textContent='▶ 继续';return}
  if(S.done)S=SIM.init(P);running=true;$('play').textContent='❚❚ 暂停';lastT=performance.now();requestAnimationFrame(loop)};
$('reset').onclick=reset;
$('slow').onclick=()=>{speed=speed===1?.25:1;$('slow').textContent=speed===1?'慢放 ×0.25':'正常速度'};
new ResizeObserver(render).observe(cv);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);
new MutationObserver(render).observe(root,{attributes:true,attributeFilter:['data-theme']});
/* 选项卡 */
const tabs=[...document.querySelectorAll('[role=tab]')];
function show(id){tabs.forEach(t=>{const on=t.dataset.pane===id;t.setAttribute('aria-selected',on);t.tabIndex=on?0:-1;$(t.dataset.pane).hidden=!on});
  if(id==='pane-lab')requestAnimationFrame(render)}
tabs.forEach((t,i)=>{t.addEventListener('click',()=>show(t.dataset.pane));
  t.addEventListener('keydown',e=>{const d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;if(!d)return;e.preventDefault();
    const n=tabs[(i+d+tabs.length)%tabs.length];n.focus();show(n.dataset.pane)})});
$('nConcl').textContent=D.conclusions.length;$('nVar').textContent=D.variants.length;$('nSkin').textContent=D.reskins.length;$('nSrc').textContent=D.sources.length;
show('pane-lab');
sync();reset();
})();
</script>
