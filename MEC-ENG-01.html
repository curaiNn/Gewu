<script>
/* ================= 线稿绘图工具 FIG（所有母题共用，不改） =================
   画法照试卷插图：装置用墨线，固定面画斜线阴影，辅助线用虚线，物理量和点的字母用斜体衬线；
   只有矢量带颜色（--g 重力/外力，--n 弹力/约束力，--v 速度，--a 其他矢量）。
   用法：SIM.draw 里 const F=FIG(ctx,W,tok)；坐标是画布像素，F.u = W/720 是线宽与几何的基准单位，
   F.ut 是字号单位（窄屏时不再随画布缩小，保证字母不小于约 11 CSS 像素；自写文字函数也要用 F.ut 算字号）。
   颜色：F.ink 墨线、F.auxColor 辅助线、F.paper 纸色（F.aux 是画辅助线的方法，不是颜色）。 */
const FIG=(ctx,W,tok)=>{
  const u=W/720,ink=tok('--fig-ink'),aux=tok('--fig-aux'),paper=tok('--card');
  const dp=W/(ctx.canvas.clientWidth||W),ut=Math.max(u,dp*11/19);   // dp：每 CSS 像素的画布像素数
  const SERIF='"Times New Roman","STIX Two Text",Times,serif',SANS=tok('--f-body');
  const path=(fn,{w=1.6,color=ink,dash=null,fill=null}={})=>{ctx.save();ctx.beginPath();fn();
    if(fill){ctx.fillStyle=fill;ctx.fill()}
    if(w>0){ctx.lineWidth=w*u;ctx.strokeStyle=color;ctx.setLineDash(dash?dash.map(d=>d*u):[]);ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}
    ctx.restore()};
  // 文字先描一圈底色再填色，压在线条上也清楚
  const text=(t,x,y,font,color,align,base)=>{ctx.save();ctx.font=font;ctx.textAlign=align;ctx.textBaseline=base;
    ctx.lineJoin="round";ctx.lineWidth=5*ut;ctx.strokeStyle=paper;ctx.strokeText(t,x,y);ctx.fillStyle=color;ctx.fillText(t,x,y);ctx.restore()};
  const F={u,ut,ink,auxColor:aux,paper,
    clear(){ctx.save();ctx.setLineDash([]);ctx.fillStyle=paper;ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height);ctx.restore()},
    line(x1,y1,x2,y2,o){path(()=>{ctx.moveTo(x1,y1);ctx.lineTo(x2,y2)},o)},
    poly(pts,o){path(()=>pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y)),o)},
    circle(x,y,r,o){path(()=>ctx.arc(x,y,r,0,2*Math.PI),o)},
    arc(x,y,r,a0,a1,o){path(()=>ctx.arc(x,y,r,a0,a1),o)},
    rect(x,y,w,h,o){path(()=>ctx.rect(x,y,w,h),o)},
    // 辅助线（中心线、投影线等）
    aux(x1,y1,x2,y2,o={}){F.line(x1,y1,x2,y2,{w:1,color:aux,dash:[6,5],...o})},
    // 运动轨迹：细虚线
    trail(pts,o={}){if(pts.length>1)F.poly(pts,{w:1.3,color:aux,dash:[5,5],...o})},
    // 固定面斜线：沿 (x1,y1)→(x2,y2) 的直线，画在 side 一侧（屏幕坐标下，1 = 前进方向右手侧）
    hatch(x1,y1,x2,y2,side=1,{gap=12,len=10}={}){const L=Math.hypot(x2-x1,y2-y1),n=Math.max(1,Math.round(L/(gap*u)));
      const tx=(x2-x1)/L,ty=(y2-y1)/L,nx=-ty*side,ny=tx*side,ox=(nx-tx)*len*u/Math.SQRT2,oy=(ny-ty)*len*u/Math.SQRT2;
      path(()=>{for(let i=0;i<=n;i++){const x=x1+(x2-x1)*i/n,y=y1+(y2-y1)*i/n;ctx.moveTo(x,y);ctx.lineTo(x+ox,y+oy)}},{w:1,color:aux})},
    // 圆弧形固定面的斜线：out = true 画在圆外侧
    hatchArc(cx,cy,r,a0,a1,out=true,{gap=12,len=10}={}){const n=Math.max(1,Math.round(r*Math.abs(a1-a0)/(gap*u))),s=out?1:-1;
      path(()=>{for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n,c=Math.cos(a),si=Math.sin(a),x=cx+r*c,y=cy+r*si;
        const nx=c*s,ny=si*s,tx=-si,ty=c;ctx.moveTo(x,y);ctx.lineTo(x+(nx-tx)*len*u/Math.SQRT2,y+(ny-ty)*len*u/Math.SQRT2)}},{w:1,color:aux})},
    // 矢量：从 (x,y) 画到 (x+dx,y+dy)，细杆 + 窄实心箭头；label 用斜体写在箭头外侧，
    // 与别的矢量共线时用 off=[dx,dy]（单位 u，相对箭头尖）把标注挪到旁边
    arrow(x,y,dx,dy,color,label,{w=2,head=12,size=19,off=null}={}){const L=Math.hypot(dx,dy);if(L<2*u)return;
      const ux=dx/L,uy=dy/L,h=Math.min(head*u,L*.6),hw=h*.34,tx=x+dx,ty=y+dy;
      F.line(x,y,tx-ux*h*.7,ty-uy*h*.7,{w,color});
      path(()=>{ctx.moveTo(tx,ty);ctx.lineTo(tx-ux*h-uy*hw,ty-uy*h+ux*hw);ctx.lineTo(tx-ux*h+uy*hw,ty-uy*h-ux*hw);ctx.closePath()},{w:0,fill:color});
      if(label)F.label(label,off?tx+off[0]*u:tx+ux*14*u,off?ty+off[1]*u:ty+uy*14*u,{color,size})},
    // 斜体衬线字母（物理量、点名）
    label(t,x,y,{color=ink,size=19,align='center',base='middle',italic=true}={}){text(t,x,y,`${italic?'italic ':''}${size*ut}px ${SERIF}`,color,align,base)},
    // 中文小注
    zh(t,x,y,{color=aux,size=14,align='center',base='middle'}={}){text(t,x,y,`${size*ut}px ${SANS}`,color,align,base)},
    dot(x,y,r=2.6,color=ink){F.circle(x,y,r*u,{w:0,fill:color})},
    // 带名字的点：实心小点 + 斜体字母（dx、dy 为字母相对点的偏移，单位 u）
    point(x,y,name,dx=-13,dy=13){F.dot(x,y);if(name)F.label(name,x+dx*u,y+dy*u)},
    // 小球：空心圆，球心另用 F.dot 标出（矢量画完后再点，表示力作用在重心）
    ball(x,y,r){F.circle(x,y,r,{w:1.6,fill:paper})},
    // 尺寸标注：两端带箭头的细线，文字写在中点外侧 off（单位 u）
    dim(x1,y1,x2,y2,t,{off=14,color=ink}={}){const L=Math.hypot(x2-x1,y2-y1);if(L<4*u)return;const ux=(x2-x1)/L,uy=(y2-y1)/L,h=Math.min(8*u,L/3),hw=h*.38;
      F.line(x1,y1,x2,y2,{w:1,color});
      for(const[px,py,sx]of[[x1,y1,1],[x2,y2,-1]])path(()=>{ctx.moveTo(px,py);ctx.lineTo(px+sx*ux*h-uy*hw,py+sx*uy*h+ux*hw);ctx.lineTo(px+sx*ux*h+uy*hw,py+sx*uy*h-ux*hw);ctx.closePath()},{w:0,fill:color});
      if(t)F.label(t,(x1+x2)/2-uy*off*u,(y1+y2)/2+ux*off*u,{color})},
  };
  return F;
};

/* ================= SIM 模块：每个母题替换这一段 =================
   约定接口：
   SIM.legend            [{label, color(CSS 变量名)}]
   SIM.init(P)           → 状态 S（含 S.done、S.status={text,cls}）
   SIM.step(S,P,dt)      推进 dt 秒（引擎保证 dt ≤ 0.5 ms）
   SIM.readouts(S,P)     → [[标签, 带单位的值]]
   SIM.draw(ctx,S,P,W,H,tok)  tok(name) 取主题色
   SIM.verdict(P)        → 理论预判 HTML
*/
const SIM=(()=>{
  /* 机车启动：恒定功率启动 / 恒定加速度启动；阻力恒定、f = f₀ + kv、f = f₀ + kv²。
     物理：状态 (q, x, W牵, W阻)，q 按阶段取：
       恒定功率阶段 q = Ek，dEk/dt = P − f(v)·v，v = √(2Ek/m)（动能形式在 v = 0 处有限，避开起步时 F = P/v → ∞）；
       匀加速阶段 q = v，dv/dt = a，牵引力 F = f(v) + ma，dW牵/dt = Fv；
       关闭发动机后 q = v，dv/dt = −f(v)/m（停下后不再受阻力）。dx/dt = v，dW阻/dt = f(v)·v。
       RK4，步长 h ≤ min(1 ms, 特征时间/2000)：恒定功率阶段取 τ = m/(P/vm² + f′(vm))，匀加速阶段取 t₁，滑行取关闭时的 m/(f/v + f′)。
     事件（都在该步内二分定位）：匀加速结束（Fv 达到 P额）；v 达到 90%、99%、99.9% vm（v₀ > vm 时为降到 110%、101%、100.1% vm）；
       滑行停下（f(0) > 0 时 v = 0；否则 v 降到关闭时的 0.1%，f = kv² 时降到 1%：此时滑行距离随时间对数增长，没有上限）。
       到达 99.9% vm（或 100.1% vm）后再运行该时刻的 10% 结束；关闭发动机后到停下为止。
     公式值（vm、v₁、t₁、x₁、W₁、τ、C2 的 t(v)、滑行距离）只用于预判、读数对照和画面比例，不进入积分。
     时间：先用同一方程粗算（步长 τ/50）到达 99% vm 的时刻 T₉₉，画面倍速取 T₉₉/12 附近的整齐数，使「接近 vm」约在画面第 12 s；
       关闭发动机后按粗算的滑行时间改为约 10 s 演示完。每画面秒最多积分 4×10⁵ 步，超出时按上限播放。读数始终是真实时间。
     引擎不支持的界面细节放在 verdict 里处理（引擎每次同步参数都会调用它）：
       ① m、P、f、k 用对数滑块，f₀ 用最左端为 0 的对数滑块：把滑块改成以 10 为底的对数刻度，在外层捕获它的 input 事件，
          换算成真值后交给数字输入框的 change 事件，由引擎照常同步；题干中的数按 2 ~ 3 位有效数字显示，大数用科学计数；
       ② 播放按钮旁加「关闭发动机」「叠加另一种启动方式」「单步」，按钮下加右图切换（P–t / F–t / F–v / F–f），只改动画状态和画法，不重置；
       ③ 预设与变式的 load 另带 look（car 汽车 / plane 客机 / ebike 电动助力自行车 / bike 自行车）和 F0（电动助力自行车中人的恒定牵引力），
          只换示意图外形和箭头标注，不改物理：电动助力自行车按「阻力 f = f₀ − F₀ 的恒定功率启动」计算，画面与读数把 F₀ 加回牵引力和阻力。 */
  const SUP={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
  const sup=n=>String(n).replace(/./g,c=>SUP[c]);
  const ok=x=>typeof x==='number'&&isFinite(x);
  // n 位有效数字；|x| < 10⁻³ 或 ≥ 10⁵ 写成 a×10ⁿ；负号用 −
  const sf=(x,n=3)=>{if(!ok(x))return'—';const a=Math.abs(x),sg=x<0?'−':'';if(a<1e-300)return'0';
    let p=Math.floor(Math.log10(a)),m=+(a/Math.pow(10,p)).toPrecision(n);if(m>=10){m/=10;p++}
    if(p<-3||p>=5)return sg+m.toFixed(n-1)+'×10'+sup(p);
    return sg+(m*Math.pow(10,p)).toFixed(Math.max(0,n-1-p))};
  const sg=(x,n=3)=>ok(x)&&x>0?'+'+sf(x,n):sf(x,n);
  const tS=x=>!ok(x)?'—':x<1e4?x.toFixed(3):sf(x,6);                  // 时间读数
  const nice=x=>{if(!(x>0))return 1;const p=Math.pow(10,Math.floor(Math.log10(x))),r=x/p;return(r<1.5?1:r<3.5?2:r<7.5?5:10)*p};
  // 画面倍速：取 1、1.5、2、2.5、3、4、5、6、8 × 10ⁿ 中最接近的数（对数意义上）；小于 1 时按慢放倍数取整齐数
  const RT=[1,1.5,2,2.5,3,4,5,6,8,10];
  const niceRate=r=>{if(!(r>0))return 1;const inv=r<1,x=inv?1/r:r,p=Math.pow(10,Math.floor(Math.log10(x))),q=x/p;
    let best=1;for(const c of RT)if(Math.abs(Math.log(c/q))<Math.abs(Math.log(best/q)))best=c;const v=best*p;return inv?1/v:v};
  const NMAX=4e5;                                                     // 每画面秒最多积分的步数
  // 单调递增函数 g 的零点（g(0) < 0）
  const solve=(g,hi)=>{let lo=0;if(!(hi>0)){hi=1;while(g(hi)<0&&hi<1e30)hi*=2}for(let i=0;i<200;i++){const md=(lo+hi)/2;if(g(md)<0)lo=md;else hi=md}return(lo+hi)/2};

  /* ---------- 参数换算与公式值 ---------- */
  function cfg(P,over){
    const Q=over?{...P,...over}:P;
    const look=['plane','ebike','bike'].includes(Q.look)?Q.look:'car';
    const mode=Q.mode==='accel'?'accel':'power',drag=Q.drag==='lin'||Q.drag==='sq'?Q.drag:'const',n=drag==='lin'?1:drag==='sq'?2:0;
    const m=Math.max(1e-6,+Q.m),Pw=1e3*Math.max(1e-6,+Q.P),a=Math.max(1e-6,+Q.a);
    const f0=Math.max(0,n?+Q.f0:Math.max(1e-6,+Q.f)),k=n===1?Math.max(1e-9,+Q.k1):n===2?Math.max(1e-9,+Q.k2):0;
    const fd=n===1?v=>f0+k*v:n===2?v=>f0+k*v*v:()=>f0,fp=n===1?()=>k:n===2?v=>2*k*v:()=>0;

    const K={look,mode,drag,n,m,Pw,a,f0,k,fd,fp,v0,vm,tau,F0:look==='ebike'?Math.max(0,+Q.F0||0):0};
    K.hP=Math.min(1e-3,tau/2000);K.hA=K.hP;
    if(mode==='accel'){K.F1=f0+m*a;K.v1=solve(v=>(fd(v)+m*a)*v-Pw,vm);K.t1=K.v1/a;K.x1=K.v1*K.v1/(2*a);
      K.W1=(f0+m*a)*K.x1+(n?k*Math.pow(a,n+1)*Math.pow(K.t1,n+2)/(n+2):0);   // 匀加速阶段牵引力做的功 ∫Fv dt

    // 加速度的画图比例：恒定加速度取 a；由静止的恒定功率取 v = vm/3 时的 a；有初速度取 t = 0 时的 |a|
    K.aref=mode==='accel'?a:v0>0?Math.max(Math.abs(Pw/v0-fd(v0))/m,1e-12):(3*Pw/vm-fd(vm/3))/m;

  // 粗算（步长 τ/50）各阈值的时刻：只用于画面倍速与坐标轴范围
  function plan(K){
    const T=[null,null,null];let t=0,v=K.v0;

    else{const m=K.m,dE=E=>{const w=Math.sqrt(2*Math.max(0,E)/m);return K.Pw-K.fd(w)*w};let E=.5*m*v*v;
      for(let i=0;i<1e6&&T[2]===null;i++){const ac=Math.abs(dE(E))/Math.max(m*v,1e-300),h=Math.max(K.tau/50,.02*Math.abs(v-K.vm)/Math.max(ac,1e-300));

  // 滑行时间粗算（步长为特征时间的 1/50）
  function coastPlan(K,v0,frac){

  /* ---------- 积分 ---------- */
  const vOf=(K,ph,q)=>ph==='pow'?Math.sqrt(2*Math.max(0,q)/K.m):Math.max(0,q);

  const A1=[0,0,0,0],A2=[0,0,0,0],A3=[0,0,0,0],A4=[0,0,0,0];

  // 二分定位：从 y 出发，积分多长时间 g(q) 越过零点
  function root(K,ph,y,h,g,dir){const tmp=[0,0,0,0];let lo=0,hi=h;
    for(let i=0;i<54;i++){const md=(lo+hi)/2;rk(K,ph,y,md,tmp);if(crossed(g(y[0]),g(tmp[0]),dir))hi=md;else lo=md}return hi}
  // 当前阶段要检测的事件：[编号, g(q), 方向]
  function evs(S){

  // 叠加曲线：另一种启动方式（由静止开始），同样的方程推进到时刻 tt；只记 v

  /* ---------- 关闭发动机、状态文字 ---------- */
  function cutEngine(S){

    S.cut={t:S.t,v,x:S.x,Wt:S.Wt,Wf:S.Wf,frac,g:f00>0?q=>q:q=>q-frac*v,end:null};

  const NAMEM={power:'恒定功率启动',accel:'恒定加速度启动'};

  /* ---------- 引擎不支持的界面细节 ---------- */
  let cur=null,curP=null,ui=null,G='Pt',ovOn=false,DATA=null;

  return{
    legend:[{label:'牵引力（推力）F',color:'--g'},{label:'阻力 f',color:'--n'},{label:'速度 v',color:'--v'},{label:'加速度 a',color:'--a'}],

      const K=cfg(P);

$('hTable').innerHTML=`<tr><th>编号</th><th>考查频率</th><th>难度</th><th>版本</th></tr>
<tr><td class="code">${esc(D.id)}</td><td>${esc(D.freq)}</td><td title="${D.difficulty} / 5">${'●'.repeat(D.difficulty)}${'○'.repeat(5-D.difficulty)}</td><td>${esc(D.version)}</td></tr>`;
$('foot').textContent=`格物 Gewu · ${D.id} · ${D.version} · ${D.footer??'g 取 10 m/s²'}`;   // 数据里可用 footer 改写页脚常量
$('tags').innerHTML=D.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('');
$('stemNote').textContent=D.problem.note||'';
$('bCond').innerHTML=D.boundary.conditions.map(c=>`<li><span>${esc(c)}</span></li>`).join('');
$('bBack').innerHTML=D.boundary.fallback.map(c=>`<li><span>${esc(c)}</span></li>`).join('');
$('legend').innerHTML=SIM.legend.map(l=>`<span><i style="background:var(${l.color})"></i>${esc(l.label)}</span>`).join('');
$('concl').innerHTML=D.conclusions.map(c=>`<details><summary><span class="badge">${c.id}</span><span class="t">${esc(c.title)}</span><span class="f">${esc(c.formula)}</span><span class="chev" aria-hidden="true"></span></summary><div class="deriv">${esc(c.derivation)}</div></details>`).join('');
const qCard=(q,isVar)=>`<article class="q">
  <div class="head"><span class="badge">${q.id}</span><h3>${esc(q.title)}</h3>${isVar?q.cs.map(c=>`<span class="chip">${c}</span>`).join(''):`<span class="chip">${q.anim?'计划做动画':'不做动画'}</span>`}</div>
  <p>${esc(q.stem)}</p>
  ${isVar?'':`<p class="map">映射：<b>${esc(q.map)}</b></p>`}
  <details><summary><span class="chev" aria-hidden="true"></span>答案与解析</summary><div class="ans"><p class="a">答案：${esc(q.answer)}</p><p>${esc(q.analysis)}</p></div></details>
  <div class="foot"><span class="src">${esc(q.source)}</span>${isVar?`<button data-load="${q.id}">加载到动画 ↑</button>`:''}</div>
</article>`;
$('variants').innerHTML=D.variants.map(v=>qCard(v,true)).join('');
$('reskins').innerHTML=D.reskins.map(r=>qCard(r,false)).join('');
$('sources').innerHTML=D.sources.map(s=>`<li><b>${esc(s.src)}</b><span>${esc(s.desc)}</span></li>`).join('');

/* 参数控件 */
const box=$('params');
PS.forEach(p=>{
  if(p.type==='choice'){
    const d=document.createElement('div');d.className='seg';d.id=`f-${p.key}`;d.setAttribute('role','group');d.setAttribute('aria-label',p.label);
    d.innerHTML=p.options.map(o=>`<button id="opt-${p.key}-${o.value}" data-k="${p.key}" data-v="${o.value}">${esc(o.label)}${o.hint?`<small>${esc(o.hint)}</small>`:""}</button>`).join('');
    box.appendChild(d);
  }else{
    const d=document.createElement('div');d.className='field';d.id=`f-${p.key}`;
    d.innerHTML=`<label for="num-${p.key}"><span class="s">${esc(p.sym)}</span><span class="note">${esc(p.label)}</span></label><span class="numin"><input type="number" id="num-${p.key}" min="${p.min}" max="${p.max}" step="any" inputmode="decimal" aria-label="${esc(p.label)}"><span class="u">${esc(p.unit||'')}</span></span><input type="range" id="in-${p.key}" min="${p.min}" max="${p.max}" step="${p.step}" value="${p.def}" aria-label="${esc(p.label)} 滑块">`;
    box.appendChild(d);
    d.querySelector('input[type=range]').addEventListener('input',e=>{P[p.key]=+e.target.value;active=-1;sync();reset()});
    const num=d.querySelector('input[type=number]');
    num.addEventListener('change',()=>{let v=parseFloat(num.value);
      if(Number.isFinite(v)){v=Math.min(p.max,Math.max(p.min,v));P[p.key]=v;active=-1;reset()}sync()});
    num.addEventListener('keydown',e=>{if(e.key==='Enter')num.blur()});
  }
});
box.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;P[b.dataset.k]=b.dataset.v;active=-1;sync();reset()});
let active=-1;
const shown=w=>!w||Object.entries(w).every(([k,v])=>[].concat(v).includes(P[k]));
const CH0=PS.find(p=>p.type==='choice');   // 预设只按第一个选项参数（情境 / 模式）分组，其余选项由预设的 load 带过去
const chosen=o=>!CH0||o[CH0.key]===undefined||o[CH0.key]===P[CH0.key];
const numTxt=(p,v)=>String(+(+v).toFixed(Math.max(p.dec??2,4)));
function sync(){
  PS.forEach(p=>{
    if(p.type==='choice'){p.options.forEach(o=>$(`opt-${p.key}-${o.value}`).setAttribute('aria-pressed',P[p.key]===o.value));if(p.when)$(`f-${p.key}`).hidden=!shown(p.when)}
    else{$(`in-${p.key}`).value=P[p.key];const n=$(`num-${p.key}`);if(document.activeElement!==n)n.value=numTxt(p,P[p.key]);$(`f-${p.key}`).hidden=!shown(p.when)}
  });
  const fill=s=>esc(s).replace(/\{(\w+)\}/g,(m,k)=>{
    if(k==='constraint'){const p=PS.find(x=>x.type==='choice');return esc(p.options.find(o=>o.value===P[p.key]).text)}
    const p=PS.find(x=>x.key===k);return p?`<span class="num">${esc(fmtP(p))}</span>`:m});
  const [lead,ask='']=D.problem.stem.split(/问[:：]/);
  $('stem').innerHTML=fill(lead.trim());
  const qs=ask.split(/[①②③④⑤⑥]/).map(s=>s.trim()).filter(Boolean);
  $('asks').innerHTML=qs.map((q,i)=>`<li><b>${i+1}</b><span>${fill(q)}</span></li>`).join('');
  $('asks').hidden=!qs.length;
  $('verdict').innerHTML=SIM.verdict(P);
  const ch=PS.find(p=>p.type==='choice');
  $('presetMode').textContent=ch?`· ${ch.options.find(o=>o.value===P[ch.key]).label}`:'';
  $('presets').innerHTML=D.presets.map((p,i)=>chosen(p.load)?`<button data-preset="${i}" aria-pressed="${i===active}" title="${esc(p.note||'')}">${esc(p.label)}</button>`:'').join('');
  const pn=$('pnote'),ap=D.presets[active];pn.hidden=!(ap&&ap.note);if(ap&&ap.note)pn.innerHTML=`<b>${esc(ap.label)}</b>：${esc(ap.note)}`;
}
function load(o,i=-1){Object.assign(P,o);active=i;sync();reset()}
$('presets').addEventListener('click',e=>{const b=e.target.closest('[data-preset]');if(b)load(D.presets[+b.dataset.preset].load,+b.dataset.preset)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-load]');if(!b)return;
  load(D.variants.find(v=>v.id===b.dataset.load).load);
  show('pane-lab');document.querySelector('.board').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})});

/* 画布与循环 */
const cv=$('cv'),ctx=cv.getContext('2d');let S,running=false,speed=1,lastT=0;
function size(){const r=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);const w=Math.max(200,Math.round(r.width*dpr));if(cv.width!==w){cv.width=w;cv.height=w}}
function render(){size();SIM.draw(ctx,S,P,cv.width,cv.height,tok);
  $('readout').innerHTML=SIM.readouts(S,P).map(([k,v])=>`<div class="ro"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('');
  const st=$('status');st.textContent=S.status.text;st.className='status '+S.status.cls}
function reset(){running=false;S=SIM.init(P);$('play').textContent=`▶ ${PLAY}`;render()}
function loop(t){if(!running)return;const real=Math.min(.05,(t-lastT)/1000);lastT=t;
  const sim=real*speed,n=Math.max(1,Math.ceil(sim/5e-4));for(let i=0;i<n;i++)SIM.step(S,P,sim/n);
  render();if(S.done){running=false;$('play').textContent=`▶ 再${PLAY}`;return}requestAnimationFrame(loop)}
$('play').onclick=()=>{if(running){running=false;$('play').textContent='▶ 继续';return}
  if(S.done)S=SIM.init(P);running=true;$('play').textContent='❚❚ 暂停';lastT=performance.now();requestAnimationFrame(loop)};
$('reset').onclick=reset;
$('slow').onclick=()=>{speed=speed===1?.25:1;$('slow').textContent=speed===1?'慢放 ×0.25':'正常速度'};
new ResizeObserver(render).observe(cv);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);
new MutationObserver(render).observe(root,{attributes:true,attributeFilter:['data-theme']});
/* 选项卡 */
const tabs=[...document.querySelectorAll('[role=tab]')];
function show(id){tabs.forEach(t=>{const on=t.dataset.pane===id;t.setAttribute('aria-selected',on);t.tabIndex=on?0:-1;$(t.dataset.pane).hidden=!on});
  if(id==='pane-lab')requestAnimationFrame(render)}
tabs.forEach((t,i)=>{t.addEventListener('click',()=>show(t.dataset.pane));
  t.addEventListener('keydown',e=>{const d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;if(!d)return;e.preventDefault();
    const n=tabs[(i+d+tabs.length)%tabs.length];n.focus();show(n.dataset.pane)})});
$('nConcl').textContent=D.conclusions.length;$('nVar').textContent=D.variants.length;$('nSkin').textContent=D.reskins.length;$('nSrc').textContent=D.sources.length;
show('pane-lab');
sync();reset();
})();
</script>
