/* ================= 线稿绘图工具 FIG（所有母题共用，不改） =================
   画法照试卷插图：装置用墨线，固定面画斜线阴影，辅助线用虚线，物理量和点的字母用斜体衬线；
   只有矢量带颜色（--g 重力/外力，--n 弹力/约束力，--v 速度，--a 其他矢量）。
   用法：SIM.draw 里 const F=FIG(ctx,W,tok)；坐标是画布像素，F.u = W/720 是线宽与几何的基准单位，
   F.ut 是字号单位（窄屏时不再随画布缩小，保证字母不小于约 11 CSS 像素；自写文字函数也要用 F.ut 算字号）。
   颜色：F.ink 墨线、F.auxColor 辅助线、F.paper 纸色（F.aux 是画辅助线的方法，不是颜色）。 */
const FIG=(ctx,W,tok)=>{
  const u=W/720,ink=tok('--fig-ink'),aux=tok('--fig-aux'),paper=tok('--card');
  const dp=W/(ctx.canvas.clientWidth||W),ut=Math.max(u,dp*11/19);   // dp：每 CSS 像素的画布像素数
  const SERIF='"Times New Roman","STIX Two Text",Times,serif',SANS=tok('--f-body');
  const path=(fn,{w=1.6,color=ink,dash=null,fill=null}={})=>{ctx.save();ctx.beginPath();fn();
    if(fill){ctx.fillStyle=fill;ctx.fill()}
    if(w>0){ctx.lineWidth=w*u;ctx.strokeStyle=color;ctx.setLineDash(dash?dash.map(d=>d*u):[]);ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}
    ctx.restore()};
  // 文字先描一圈底色再填色，压在线条上也清楚
  const text=(t,x,y,font,color,align,base)=>{ctx.save();ctx.font=font;ctx.textAlign=align;ctx.textBaseline=base;
    ctx.lineJoin="round";ctx.lineWidth=5*ut;ctx.strokeStyle=paper;ctx.strokeText(t,x,y);ctx.fillStyle=color;ctx.fillText(t,x,y);ctx.restore()};
  const F={u,ut,ink,auxColor:aux,paper,
    clear(){ctx.save();ctx.setLineDash([]);ctx.fillStyle=paper;ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height);ctx.restore()},
    line(x1,y1,x2,y2,o){path(()=>{ctx.moveTo(x1,y1);ctx.lineTo(x2,y2)},o)},
    poly(pts,o){path(()=>pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y)),o)},
    circle(x,y,r,o){path(()=>ctx.arc(x,y,r,0,2*Math.PI),o)},
    arc(x,y,r,a0,a1,o){path(()=>ctx.arc(x,y,r,a0,a1),o)},
    rect(x,y,w,h,o){path(()=>ctx.rect(x,y,w,h),o)},
    // 辅助线（中心线、投影线等）
    aux(x1,y1,x2,y2,o={}){F.line(x1,y1,x2,y2,{w:1,color:aux,dash:[6,5],...o})},
    // 运动轨迹：细虚线
    trail(pts,o={}){if(pts.length>1)F.poly(pts,{w:1.3,color:aux,dash:[5,5],...o})},
    // 固定面斜线：沿 (x1,y1)→(x2,y2) 的直线，画在 side 一侧（屏幕坐标下，1 = 前进方向右手侧）
    hatch(x1,y1,x2,y2,side=1,{gap=12,len=10}={}){const L=Math.hypot(x2-x1,y2-y1),n=Math.max(1,Math.round(L/(gap*u)));
      const tx=(x2-x1)/L,ty=(y2-y1)/L,nx=-ty*side,ny=tx*side,ox=(nx-tx)*len*u/Math.SQRT2,oy=(ny-ty)*len*u/Math.SQRT2;
      path(()=>{for(let i=0;i<=n;i++){const x=x1+(x2-x1)*i/n,y=y1+(y2-y1)*i/n;ctx.moveTo(x,y);ctx.lineTo(x+ox,y+oy)}},{w:1,color:aux})},
    // 圆弧形固定面的斜线：out = true 画在圆外侧
    hatchArc(cx,cy,r,a0,a1,out=true,{gap=12,len=10}={}){const n=Math.max(1,Math.round(r*Math.abs(a1-a0)/(gap*u))),s=out?1:-1;
      path(()=>{for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n,c=Math.cos(a),si=Math.sin(a),x=cx+r*c,y=cy+r*si;
        const nx=c*s,ny=si*s,tx=-si,ty=c;ctx.moveTo(x,y);ctx.lineTo(x+(nx-tx)*len*u/Math.SQRT2,y+(ny-ty)*len*u/Math.SQRT2)}},{w:1,color:aux})},
    // 矢量：从 (x,y) 画到 (x+dx,y+dy)，细杆 + 窄实心箭头；label 用斜体写在箭头外侧，
    // 与别的矢量共线时用 off=[dx,dy]（单位 u，相对箭头尖）把标注挪到旁边
    arrow(x,y,dx,dy,color,label,{w=2,head=12,size=19,off=null}={}){const L=Math.hypot(dx,dy);if(L<2*u)return;
      const ux=dx/L,uy=dy/L,h=Math.min(head*u,L*.6),hw=h*.34,tx=x+dx,ty=y+dy;
      F.line(x,y,tx-ux*h*.7,ty-uy*h*.7,{w,color});
      path(()=>{ctx.moveTo(tx,ty);ctx.lineTo(tx-ux*h-uy*hw,ty-uy*h+ux*hw);ctx.lineTo(tx-ux*h+uy*hw,ty-uy*h-ux*hw);ctx.closePath()},{w:0,fill:color});
      if(label)F.label(label,off?tx+off[0]*u:tx+ux*14*u,off?ty+off[1]*u:ty+uy*14*u,{color,size})},
    // 斜体衬线字母（物理量、点名）
    label(t,x,y,{color=ink,size=19,align='center',base='middle',italic=true}={}){text(t,x,y,`${italic?'italic ':''}${size*ut}px ${SERIF}`,color,align,base)},
    // 中文小注
    zh(t,x,y,{color=aux,size=14,align='center',base='middle'}={}){text(t,x,y,`${size*ut}px ${SANS}`,color,align,base)},
    dot(x,y,r=2.6,color=ink){F.circle(x,y,r*u,{w:0,fill:color})},
    // 带名字的点：实心小点 + 斜体字母（dx、dy 为字母相对点的偏移，单位 u）
    point(x,y,name,dx=-13,dy=13){F.dot(x,y);if(name)F.label(name,x+dx*u,y+dy*u)},
    // 小球：空心圆，球心另用 F.dot 标出（矢量画完后再点，表示力作用在重心）
    ball(x,y,r){F.circle(x,y,r,{w:1.6,fill:paper})},
    // 尺寸标注：两端带箭头的细线，文字写在中点外侧 off（单位 u）
    dim(x1,y1,x2,y2,t,{off=14,color=ink}={}){const L=Math.hypot(x2-x1,y2-y1);if(L<4*u)return;const ux=(x2-x1)/L,uy=(y2-y1)/L,h=Math.min(8*u,L/3),hw=h*.38;
      F.line(x1,y1,x2,y2,{w:1,color});
      for(const[px,py,sx]of[[x1,y1,1],[x2,y2,-1]])path(()=>{ctx.moveTo(px,py);ctx.lineTo(px+sx*ux*h-uy*hw,py+sx*uy*h+ux*hw);ctx.lineTo(px+sx*ux*h+uy*hw,py+sx*uy*h-ux*hw);ctx.closePath()},{w:0,fill:color});
      if(t)F.label(t,(x1+x2)/2-uy*off*u,(y1+y2)/2+ux*off*u,{color})},
  };
  return F;
};

/* ================= SIM 模块：每个母题替换这一段 =================
   约定接口：
   SIM.legend            [{label, color(CSS 变量名)}]
   SIM.init(P)           → 状态 S（含 S.done、S.status={text,cls}）
   SIM.step(S,P,dt)      推进 dt 秒（引擎保证 dt ≤ 0.5 ms）
   SIM.readouts(S,P)     → [[标签, 带单位的值]]
   SIM.draw(ctx,S,P,W,H,tok)  tok(name) 取主题色
   SIM.verdict(P)        → 理论预判 HTML
*/
const SIM=(()=>{
  const g=10,PI=Math.PI;
  const SUP={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
  // n 位有效数字；负号用 −，很大（≥10⁴）或很小（<10⁻³）的数写成 a×10ⁿ
  const sf=(x,n=3)=>{if(!isFinite(x))return'—';const a=Math.abs(x),sg=x<0?'−':'';if(a<1e-12)return'0';
    const r=+a.toPrecision(n),p=Math.floor(Math.log10(r));
    if(r<1e-3||p>=4)return sg+(r/Math.pow(10,p)).toFixed(n-1)+'×10'+String(p).replace(/./g,c=>SUP[c]);
    return sg+r.toFixed(Math.max(0,n-1-p))};
  const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
  const pc=x=>sf(100*x,3)+'%';
  const nice=x=>{const p=Math.pow(10,Math.floor(Math.log10(x))),n=x/p;return(n<1.5?1:n<3.5?2:n<7.5?5:10)*p};
  const tnum=x=>String(+x.toPrecision(3));
  const rk4=(f,y,h)=>{const ad=(a,b,c)=>a.map((v,i)=>v+b[i]*c),k1=f(y),k2=f(ad(y,k1,h/2)),k3=f(ad(y,k2,h/2)),k4=f(ad(y,k3,h));
    return y.map((v,i)=>v+h/6*(k1[i]+2*k2[i]+2*k3[i]+k4[i]))};

  /* 参数换算与理论值（理论值只用于预判、画图比例、慢放节奏和对照，不参与积分） */
  function cfg(P){
    const S=P.S*1e-4,v=P.v,rho=P.rho,e=P.e,tau=P.tau*1e-3,q=rho*S*v,F0=q*v;
    const K={mode:P.mode,S,v,rho,e,tau,q,F0,Pw:.5*q*v*v,dm:q*tau};
    if(P.mode==='jet'){
      K.L=Math.max(.5,1.4*v*tau);K.tA=K.L/v;                       // 喷口到挡板的距离，保证虚线框画得下
      K.dtp=Math.max(Math.min(1e-3,tau/10,K.tA/40),K.tA/3000);K.dmp=q*K.dtp;            // 流体微元：每 δt 从喷口放出一段，δm = ρSv·δt
      K.rA=K.tA/1.5;K.rB=Math.min(K.rA,tau/1.2);                   // 慢放：水柱走到挡板约 1.5 s，一段柱体打完约 1.2 s（画面时间）
      K.pre=.4*tau;K.boxes=[K.tA+.6*tau,K.tA+2.8*tau];K.tEnd=K.tA+4.6*tau;
      K.ev=[K.tA,K.boxes[0],K.boxes[0]+tau,K.boxes[1],K.boxes[1]+tau,K.tEnd];
      K.Fp=(1+e)*F0;
    }else if(P.mode==='thrust'){
      K.M=P.M;K.W=P.M*g;K.a=F0/K.M-g;K.h0=1;K.T=3;K.v0=Math.sqrt(K.W/(rho*S));
      const hT=K.a>0?K.h0+.5*K.a*K.T*K.T:K.h0;K.Hv=Math.min(30,Math.max(2,hT*1.15));   // 画面高度（m）
      K.hover=Math.abs(F0-K.W)<=2e-3*K.W;
    }else{
      const m=P.m,dt=P.dt;Object.assign(K,{m,dt,mg:m*g,H:v*v/(2*g),tF:v/g});
      // 缓冲垫：压缩时 N = k₁x，回弹时劲度 k₂ = k₁/e²（离开速度恰为 ev）。k₁ 用二分法反算，使计入重力时接触时间 = Δt
      // 压缩段用时 t₁ = [π/2 + arcsin(g/√(g² + v²ω²))]/ω（ω² = k₁/m），回弹段用时 e·t₁，共 (1 + e)t₁
      const t1=dt/(1+e),tl=w=>(PI/2+Math.asin(g/Math.sqrt(g*g+v*v*w*w)))/w;
      let lo=1e-6,hi=1e9;for(let i=0;i<120;i++){const mid=Math.sqrt(lo*hi);if(tl(mid)>t1)lo=mid;else hi=mid}
      const w1=Math.sqrt(lo*hi);K.w1=w1;K.k1=m*w1*w1;K.k2=e>0?K.k1/(e*e):Infinity;
      const xe=g/(w1*w1),A=Math.sqrt(xe*xe+v*v/(w1*w1));K.zm=xe+A;K.Nm=K.k1*K.zm;
      K.dp=m*(1+e)*v;K.Fng=K.dp/dt;K.Fbar=K.mg+K.Fng;K.I=K.Fbar*dt;
      K.rF=Math.max(1,K.tF/1.5);K.rC=dt/2;K.rR=Math.max(1,e*v/g/1.5);    // 下落实时（超过 1.5 s 按比例加快），接触段慢放到约 2 s
      K.hL=Math.min(1e-3,dt/2000);K.hU=e>0?Math.min(K.hL,.05*e/w1):K.hL;
    }
    return K;
  }

  /* ---------- 流体冲击：水柱离散为等质量的微元，逐段打到挡板上，统计动量变化 ---------- */
  function initJet(K){return{K,t:0,par:[],nk:0,xf:0,I:0,Pg:0,Ek:0,mOut:0,Fp:0,Fg:0,tArr:null,
    bx:K.boxes.map(()=>({I0:null,I:0,dm:null,done:false})),hist:[[0,0]],lastH:0,done:false,status:{text:'准备就绪：水柱将射向挡板',cls:''}}}
  function advJet(S,K,h){
    const t1=S.t+h,c=K.v*K.dtp;
    while(S.nk*K.dtp<t1-1e-15){S.par.push({k:S.nk,x:0,fe:0,fh:0});S.nk++}
    let dI=0,dP=0,dE=0,dM=0;
    for(const p of S.par){
      const ts=Math.max(S.t,p.k*K.dtp);if(t1<=ts)continue;
      // 微元前端 x：水平射流不计重力，dx/dt = v，四阶龙格–库塔的四个斜率都等于 v，一步给出 x += v·h（精确）
      p.x+=K.v*(t1-ts);
      const fe=clamp(p.x/c,0,1),fh=clamp((p.x-K.L)/c,0,1);          // 已离开喷口的比例、已打到挡板的比例
      dM+=(fe-p.fe)*K.dmp;dP+=(fe-p.fe)*K.dmp*K.v;dE+=(fe-p.fe)*.5*K.dmp*K.v*K.v;
      dI+=(fh-p.fh)*K.dmp*(1+K.e)*K.v;                                 // 打到挡板的部分：法向速度 v → −ev
      if(S.tArr===null&&fh>0)S.tArr=t1-(p.x-K.L)/K.v;
      p.fe=fe;p.fh=fh;
    }
    S.par=S.par.filter(p=>p.fh<1);
    S.xf=Math.min(K.L,S.xf+K.v*h);
    S.I+=dI;S.Pg+=dP;S.Ek+=dE;S.mOut+=dM;S.Fp=dI/h;S.Fg=dP/h;S.t=t1;
  }
  // 时刻 tb 虚线框 [L − vτ, L] 内水的质量（由微元实际位置统计）
  function boxMass(S,K){const a=K.L-K.v*K.tau,b=K.L,c=K.v*K.dtp;let m=0;
    for(const p of S.par){const lo=Math.max(p.x-c,0,a),hi=Math.min(p.x,K.L,b);if(hi>lo)m+=(hi-lo)/c*K.dmp}return m}
  function stepJet(S,K,dt){
    let rem=dt;
    while(rem>1e-15&&!S.done){
      const r=S.t<K.tA-1e-12?K.rA:K.rB;
      let tn=S.t+rem*r;const ev=K.ev.find(x=>x>S.t+1e-13);if(ev!==undefined&&tn>ev)tn=ev;
      const h=tn-S.t;if(h<=0)break;
      advJet(S,K,h);rem-=h/r;
      K.boxes.forEach((tb,b)=>{const B=S.bx[b];
        if(B.I0===null&&S.t>=tb-1e-12){B.I0=S.I;B.dm=boxMass(S,K)}
        if(B.I0!==null&&!B.done){B.I=S.I-B.I0;if(S.t>=tb+K.tau-1e-12)B.done=true}});
      if(S.t-S.lastH>=K.tEnd/600||Math.abs(S.Fp-S.hist[S.hist.length-1][1])>.02*K.Fp){S.hist.push([S.t,S.Fp]);S.lastH=S.t}
      if(S.t>=K.tEnd-1e-12){S.done=true;S.hist.push([S.t,S.Fp])}
    }
    const t=S.t,T=K.tau;let st={text:'水柱射向挡板',cls:''};
    if(S.done)st={text:`结束：F = ${sf(S.Fp)} N，与所取的 τ 无关`,cls:'ok'};
    else if(S.I>0){st={text:'水柱打到挡板：受力立即稳定',cls:''};
      K.boxes.forEach(tb=>{if(t>=tb-K.pre&&t<tb)st={text:'取柱：框内是 τ 内将打到挡板的水',cls:''};
        else if(t>=tb&&t<tb+T)st={text:'这段水柱正打到挡板上',cls:''};
        else if(t>=tb+T&&t<tb+1.8*T)st={text:'τ 内这段水全部打到挡板上',cls:'ok'}})}
    S.status=st;
  }

  /* ---------- 反冲推力：喷口每步放出 δm = ρSv·h，统计相对喷口的动量得推力；飞行器 (h, u) 用 RK4 ---------- */
  function initThrust(K){return{K,t:0,h:K.h0,u:0,a:0,Fm:0,mOut:0,Prel:0,Ek:0,hist:[],lastH:0,end:'',done:false,
    status:{text:'准备就绪：支架托住，t = 0 撤去并开始喷水',cls:''}}}
  function stepThrust(S,K,dt){
    let rem=dt;
    while(rem>1e-15&&!S.done){
      const h=Math.min(rem,1e-3,K.T-S.t);if(h<=1e-15){S.done=true;break}
      // 这一步喷出的水 δm = ρSv·h 由相对喷口静止加速到 v：喷口对水的力 F′ = δm·v/h，由牛顿第三定律推力 F = F′
      const Fm=K.q*h*K.v/h,f=y=>[y[1],Fm/K.M-g],y0=[S.h,S.u];let y=rk4(f,y0,h),hh=h;
      if(y[0]<=0){let lo=0,hi=h;for(let i=0;i<60;i++){const mid=(lo+hi)/2;if(rk4(f,y0,mid)[0]>0)lo=mid;else hi=mid}
        hh=hi;y=rk4(f,y0,hh);y[0]=0;S.end='land'}
      const dm=K.q*hh;S.mOut+=dm;S.Prel+=dm*K.v;S.Ek+=.5*dm*K.v*K.v;S.Fm=Fm;
      S.a=(y[1]-S.u)/hh;[S.h,S.u]=y;S.t+=hh;rem-=hh;
      if(S.t-S.lastH>=.01||!S.hist.length){S.hist.push([S.t,S.Fm]);S.lastH=S.t}
      if(S.end==='land'){S.done=true;S.u=0}
      else if(S.h>=K.Hv){S.done=true;S.end='out'}
      else if(S.t>=K.T-1e-12){S.done=true;S.end='time'}
    }
    if(S.done&&S.hist.length)S.hist.push([S.t,S.Fm]);
    const F=S.Fm,W=K.W,hov=Math.abs(F-W)<=2e-3*W;
    if(S.done)S.status=S.end==='land'?{text:`落回地面：t = ${sf(S.t)} s`,cls:'warn'}:S.end==='out'?{text:`升出画面：t = ${sf(S.t)} s`,cls:'ok'}:
      {text:hov?'满 3 s：始终悬停，F = Mg':`满 3 s：h = ${sf(S.h)} m`,cls:'ok'};
    else S.status=hov?{text:'悬停：推力 F = Mg',cls:'ok'}:F>W?{text:'加速上升：F > Mg',cls:''}:{text:'下落：F < Mg',cls:'warn'};
  }

  /* ---------- 物体撞击：自由下落 → 压缩（k₁）→ 回弹（k₂ = k₁/e²）或停住 → 弹起；(z, w, I) 用 RK4，事件用二分法定位 ---------- */
  // z：物体底部低于缓冲垫原上表面的深度（向下为正）；w = dz/dt；I = ∫N dt
  function initImpact(K){return{K,t:0,ph:'fall',z:-K.H,w:0,I:0,N:0,tc:null,vin:null,vout:null,zm:null,zr:0,Nmax:0,dtm:null,Ic:null,
    tStop:null,hN:[],lastH:-1,done:false,status:{text:`准备就绪：从 H = ${sf(K.H)} m 处由静止释放`,cls:''}}}
  function Nof(S,K,ph,z){return ph==='load'?Math.max(0,K.k1*z):ph==='unload'?Math.max(0,K.k2*(z-S.zr)):ph==='rest'?K.mg:0}
  function stepImpact(S,K,dt){
    let rem=dt;
    while(rem>1e-15&&!S.done){
      const ph=S.ph,r=ph==='fall'?K.rF:ph==='rise'?K.rR:K.rC;
      if(ph==='rest'){const h=Math.min(rem*r,S.tStop-S.t);S.t+=h;rem-=h/r;S.N=K.mg;
        if(S.t-S.lastH>=K.dt/300){S.hN.push([S.t-S.tc,S.N,0]);S.lastH=S.t}
        if(S.t>=S.tStop-1e-15){S.done=true;S.hN.push([S.t-S.tc,S.N,0])}continue}
      const hmax=ph==='load'?K.hL:ph==='unload'?K.hU:1e-3,h=Math.min(rem*r,hmax);
      const f=y=>{const N=Nof(S,K,ph,y[0]);return[y[1],g-N/K.m,N]};
      const ef=y=>ph==='fall'?-y[0]:ph==='load'?y[1]:ph==='unload'?y[0]-S.zr:-y[1];   // 由正变为 ≤ 0 时发生事件
      const y0=[S.z,S.w,S.I];let y=rk4(f,y0,h),hh=h,hit=false;
      if(ef(y)<=0){let lo=0,hi=h;for(let i=0;i<60;i++){const mid=(lo+hi)/2;if(ef(rk4(f,y0,mid))>0)lo=mid;else hi=mid}
        hh=hi;y=rk4(f,y0,hh);hit=true}
      [S.z,S.w,S.I]=y;S.t+=hh;rem-=hh/r;S.N=Nof(S,K,ph,S.z);S.Nmax=Math.max(S.Nmax,S.N);
      if(hit){
        if(ph==='fall'){S.z=0;S.ph='load';S.tc=S.t;S.vin=S.w;S.I=0;S.lastH=-1}
        else if(ph==='load'){S.w=0;S.zm=S.z;S.N=K.k1*S.zm;S.Nmax=Math.max(S.Nmax,S.N);
          if(K.e>0){S.ph='unload';S.zr=S.zm*(1-K.e*K.e)}
          else{S.ph='rest';S.dtm=S.t-S.tc;S.Ic=S.I;S.vout=0;S.tStop=S.t+.4*K.dt;S.hN.push([S.t-S.tc,S.N,0]);S.N=K.mg}}
        else if(ph==='unload'){S.z=S.zr;S.N=0;S.ph='rise';S.dtm=S.t-S.tc;S.Ic=S.I;S.vout=-S.w;S.hN.push([S.t-S.tc,0,-K.m*S.w])}
        else{S.w=0;S.done=true}
      }
      if((S.ph==='load'||S.ph==='unload')&&S.t-S.lastH>=K.dt/300){S.hN.push([S.t-S.tc,S.N,-K.m*S.w]);S.lastH=S.t}
      if(S.ph==='rise'&&S.t-S.tc<=1.3*K.dt&&S.t-S.lastH>=K.dt/300){S.hN.push([S.t-S.tc,0,-K.m*S.w]);S.lastH=S.t}
    }
    const ph=S.ph;
    S.status=S.done?(K.e>0?{text:`弹起到最高点：e²H = ${sf(K.e*K.e*K.H)} m`,cls:'ok'}:{text:`停住：作用时间 Δt = ${sf(S.dtm,4)} s`,cls:'ok'}):
      ph==='fall'?(S.t>0?{text:'自由下落',cls:''}:S.status):ph==='load'?{text:'接触：缓冲垫压缩，N 增大',cls:''}:ph==='unload'?{text:'回弹：N 减小，物体向上加速',cls:''}:
      ph==='rest'?{text:'速度减为零，停住：此后 N = mg',cls:'ok'}:{text:`离开缓冲垫：v′ = ${sf(S.vout)} m/s`,cls:'ok'};
  }

  /* ---------- 画图工具 ---------- */
  function mk(ctx,W,H,tok){
    const F=FIG(ctx,W,tok),u=F.u,ut=F.ut;
    const SERIF='"Times New Roman","STIX Two Text",Times,serif',SANS=tok('--f-body');
    // 字号、测宽和跟文字大小有关的偏移都用 F.ut（窄屏时字不随画布缩小），几何仍用 u
    const wid=(str,s,o={})=>{ctx.save();ctx.font=o.zh?`${s*ut}px ${SANS}`:`${o.i===false?'':'italic '}${s*ut}px ${SERIF}`;const w=ctx.measureText(str).width;ctx.restore();return w};
    const pw=parts=>parts.reduce((a,[str,o={}])=>a+wid(str,(o.s||19)*(o.sub?.66:1),o),0);
    // 一行混排：parts = [[文字, {i:false 正体, s 字号, sub 下标, zh 中文}]]，按 align 对齐到 (x,y)
    const run=(parts,x,y,{color=F.ink,align='left'}={})=>{let cx=x-(align==='center'?.5:align==='right'?1:0)*pw(parts);
      for(const[str,o={}]of parts){const s=(o.s||19)*(o.sub?.66:1),w=wid(str,s,o),y1=y+(o.sub?6*ut:0);
        if(o.zh)F.zh(str,cx,y1,{color,size:s,align:'left'});else F.label(str,cx,y1,{color,size:s,align:'left',italic:o.i!==false});cx+=w}};
    // 桌面宽度时状态条（一行，底边约 46 CSS px）浮在画布左上角，图从它下面开始；窄屏（≤ 640px）时状态条排在画布下方
    const narrow=typeof matchMedia==='function'&&matchMedia('(max-width:640px)').matches,cw=ctx.canvas.clientWidth||640;
    const y0=narrow?10*u+8*ut:(46*720/cw+8)*u;
    const gTop=H-218*u-44*ut;                     // 下部坐标图区域的顶边
    return{F,u,ut,k:ut/u,W,H,ctx,tok,run,wid,pw,y0,gTop,narrow,ink:F.ink,cX:F.auxColor,paper:F.paper,
      cG:tok('--g'),cN:tok('--n'),cV:tok('--v'),cW:tok('--warn')};
  }
  const ellipse=(G,x,y,rx,ry,o)=>{const pts=[];for(let i=0;i<=40;i++){const a=2*PI*i/40;pts.push([x+rx*Math.cos(a),y+ry*Math.sin(a)])}G.F.poly(pts,o)};
  // 坐标轴：原点 (x0, yO)，y 轴从 yB 画到 yT，x 轴画到 xR；轴名斜体带单位
  function axes(G,{x0,yO,yB=yO,yT,xR,ylab,xlab}){
    const{F,u,ut,run,ink}=G;
    F.arrow(x0,yB,0,yT-yB,ink,null,{w:1.3,head:10});F.arrow(x0,yO,xR-x0,0,ink,null,{w:1.3,head:10});
    F.label('O',x0-10*ut,yO+12*ut);
    run(ylab,x0+9*u,yT+6*u);run(xlab,xR,yO+17*ut,{align:'right'});
  }
  // 横轴刻度：tMax 为数据区右端对应的时间，scale 为显示倍数（ms 时为 1000）；skip 为要避开的 [x1, x2]
  function tticks(G,{x0,x1,xR,yO,tMax,TX,scale,skip=[],ulab}){
    const{F,u,ut,wid}=G,st=nice(tMax*scale/4)/scale,lw=wid(ulab,15,{i:false})+wid('t',19);
    const tk=[];for(let i=1;i*st<=tMax*1.0001;i++)tk.push(i);
    const wmax=Math.max(0,...tk.map(i=>wid(tnum(i*st*scale),14,{i:false})));
    const ev=[1,2,5,10].find(m=>(TX(st)-x0)*m>=wmax+10*ut)||20;
    for(const i of tk){const x=TX(i*st),s=tnum(i*st*scale),w=wid(s,14,{i:false});F.line(x,yO,x,yO-5*u,{w:1});
      if(i%ev===0&&x+w/2<xR-lw-8*ut&&!skip.some(([a,b])=>x+w/2>a-4*ut&&x-w/2<b+4*ut))F.label(s,x,yO+15*ut,{italic:false,size:14})}
  }
  const fLab=(e,val)=>{const p=e>0?[['(1 + ',{i:false}],['e'],[')',{i:false}]]:[];return[...p,['ρ'],['S'],['v'],['²',{i:false}],[` = ${val} N`,{i:false,s:15}]]};

  /* ---------- 流体冲击的画面 ---------- */
  function drawJet(G,S,P){
    const{F,u,ut,run,wid,pw,y0,gTop,ink,cX,cN,cV,cW,W,H,paper}=G,K=S.K,t=S.t,e=K.e;
    const yAb=gTop-12*u,Hp=Math.min(125*u,(yAb-y0)/2-10*u),yj=(y0+yAb)/2+4*u;
    const xn=150*u,xp=600*u,sx=(xp-xn)/K.L,X=x=>xn+x*sx;
    const rj=Math.max(3.5*u,Math.min(24*u,7.5*u*Math.sqrt(P.S))),ws=Math.max(2.5*u,rj*.5);
    const Rg=Math.max(60*u,rj+ws+24*u+42*ut),xg=xp-Rg;          // 凹形挡板（半圆槽）半径与圆心
    const arr=S.I>0,ta=S.tArr===null?K.tA:S.tArr,since=Math.max(0,t-ta);
    const bh=Math.max(rj+9*u,15*u),xb0=62*u,xb1=xn-24*u;
    // 水枪：枪管、收窄的枪口、握把；喷口截面画成竖直小椭圆
    F.poly([[76*u,yj+bh],[100*u,yj+bh],[90*u,yj+bh+54*u],[64*u,yj+bh+54*u],[76*u,yj+bh]],{w:1.8,fill:paper});
    F.rect(xb0,yj-bh,xb1-xb0,2*bh,{w:1.8,fill:paper});
    F.poly([[xb1,yj-bh],[xn,yj-rj-1.5*u],[xn,yj+rj+1.5*u],[xb1,yj+bh]],{w:1.8,fill:paper});
    ellipse(G,xn,yj,3.5*u,rj+1.5*u,{w:1.4,fill:paper});
    F.label('S',xn+2*u,yj-rj-1.5*u-13*ut);
    // 挡板：e = 0 竖直平板，e > 0 开口向左的凹形挡板；背面斜线
    if(e<=0){F.line(xp,yj-Hp,xp,yj+Hp,{w:2.4});F.hatch(xp,yj+Hp,xp,yj-Hp,1)}
    else{F.arc(xg,yj,Rg,-PI/2,PI/2,{w:2.4});F.hatchArc(xg,yj,Rg,-PI/2,PI/2,true)}
    // 水柱：两条墨线作边界；稀疏的辅助色短线随水流移动（取实际微元的位置）
    const tick=(x1,y1,x2,y2)=>F.line(x1,y1,x2,y2,{w:1.2,color:cX});
    const ri=Rg-ws,thi=Math.asin(Math.min(.95,rj/ri)),rc=Math.min(10*u,rj*.8+3*u),xs=xp-ws;
    const xEnd=!arr?X(S.xf):e<=0?xs-rc:xg+ri*Math.cos(thi);
    if(t>0||arr){F.line(xn,yj-rj,xEnd,yj-rj,{w:1.6});F.line(xn,yj+rj,xEnd,yj+rj,{w:1.6});if(!arr&&S.xf>0)F.line(xEnd,yj-rj,xEnd,yj+rj,{w:1.6})}
    const n=Math.max(1,Math.ceil(30*u/(K.v*K.dtp*sx)));
    for(const p of S.par)if(p.k%n===0&&p.x>0&&p.x<K.L){const x=X(p.x);if(x<xEnd-2*u)tick(x,yj-rj*.6,x,yj+rj*.6)}
    const sig=30*u;
    if(arr&&e<=0){
      // 沿板面向上、向下流开（速度大小仍为 v），流到板端后离开
      const lu=Math.min(Hp-rj,rc+K.v*since*sx);
      for(const s of[-1,1]){
        F.arc(xs-rc,yj+s*(rj+rc),rc,s<0?0:-PI/2,s<0?PI/2:0,{w:1.6});
        if(lu>rc){F.line(xs,yj+s*(rj+rc),xs,yj+s*(rj+lu),{w:1.6});if(lu<Hp-rj-1*u)F.line(xs,yj+s*(rj+lu),xp,yj+s*(rj+lu),{w:1.6})}
        const ph=(K.v*since*sx)%sig;for(let d=rc+ph;d<lu-2*u;d+=sig)tick(xs+1.2*u,yj+s*(rj+d),xp-1.2*u,yj+s*(rj+d));
      }
      if(lu>=rc+40*u+12*ut){const y1=yj-rj-rc-16*ut-6*u;F.arrow(xs-12*u,y1,0,-44*u,cV,null);F.label('v',xs-12*u-12*ut,y1-44*u+4*u,{color:cV})}
    }else if(arr){
      // 沿槽面折回，以 ev 从上、下两侧向左流出，流出一段后渐隐
      const lr=Math.min(170*u,K.e*K.v*since*sx),fade=Math.min(30*u,lr);
      for(const s of[-1,1]){
        F.arc(xg,yj,ri,s<0?-PI/2:thi,s<0?-thi:PI/2,{w:1.6});
        const ya=yj+s*Rg,yb=yj+s*ri;
        if(lr>0){for(const yy of[ya,yb]){F.line(xg,yy,xg-lr+fade,yy,{w:1.6});F.line(xg-lr+fade,yy,xg-lr,yy,{w:1.2,color:cX,dash:[4,4]})}
          const ph=(K.e*K.v*since*sx)%sig;for(let d=ph+4*u;d<lr-fade;d+=sig)tick(xg-d,ya-s*1.2*u,xg-d,yb+s*1.2*u)}
      }
      if(lr>=60*u){const y1=yj-Rg-16*u;F.arrow(xg-24*u,y1,-Math.max(16*u,56*u*K.e),0,cV,null);run([['e'],['v']],xg-24*u-Math.max(16*u,56*u*K.e)-6*u,y1,{color:cV,align:'right'})}
    }
    // 入射水流的速度 v
    if(t>0)F.arrow(xn+28*u,yj-rj-22*u,64*u,0,cV,'v',{off:[4,-14*G.k]});
    // 取柱：虚线框随水流前进，前端到达挡板后逐段打到挡板上，框逐渐缩短，经 τ 全部消失
    const vt=K.v*K.tau,yd=yj+rj+6*u+12*u;
    const dimTxt=(a,b)=>{F.dim(X(a),yd,X(b),yd,null);const parts=[['v'],['τ'],[` = ${sf(vt)} m`,{i:false,s:15}]],w=pw(parts),dy=yd+24*ut-yj;
      const xr=(e>0?xg+Math.sqrt(Math.max(0,ri*ri-dy*dy)):xs)-5*u;run(parts,Math.max(xn+w/2,Math.min((X(a)+X(b))/2,xr-w/2)),yd+15*ut,{align:'center'})};
    K.boxes.forEach((tb,b)=>{
      let a=null,c=null;
      if(t>=tb-K.pre-1e-12&&t<tb){c=K.L-K.v*(tb-t);a=c-vt}else if(t>=tb&&t<tb+K.tau){a=K.L-vt+K.v*(t-tb);c=K.L}
      if(a!==null){const xa=X(a),xc=X(c),w=Math.max(1.5*u,xc-xa);
        F.rect(xa,yj-rj-6*u,w,2*rj+12*u,{w:1.3,color:cX,dash:[5,4]});
        if(xc-xa>=wid('Δm',19)+6*u)F.label('Δm',(xa+xc)/2,yj);
        if(t<tb)dimTxt(a,c);else dimTxt(K.L-vt,K.L)}
      else if(t>=tb+K.tau&&t<tb+1.8*K.tau){dimTxt(K.L-vt,K.L);{const dy=yd+34*ut-yj,xr=e>0?xg+Math.sqrt(Math.max(0,ri*ri-(dy+9*ut)**2))-8*u:xs-6*u;F.zh('τ 内这段水全部打到挡板上',xr,yd+34*ut,{align:'right',color:ink})}}
    });
    // 作用力：挡板对框内水的力 F′（向左）、水对挡板的冲击力 F（向右）、水对水枪的反冲力 F反（向左）
    const LF=40*u*(1+e);
    if(arr){const yF=yj-rj-14*u,xF=e>0?xg+Math.sqrt(Math.max(0,ri*ri-(rj+14*u)**2))-4*u:xs-4*u;
      F.arrow(xF,yF,-LF,0,cN,null);run([['F′']],xF-LF-12*ut,yF,{color:cN,align:'center'});
      F.arrow(xp+2*u,yj,LF,0,cN,null);F.label('F',xp+LF-4*u,yj-15*ut,{color:cN})}
    if(t>0){F.arrow(xb0,yj,-40*u,0,cN,null);run([['F'],['反',{zh:1,sub:1}]],xb0-40*u+4*u,yj-17*ut,{color:cN,align:'center'})}
    // 比例尺（右下角）与示意说明
    const sb=nice(K.L/4),sw=sb*sx,ysb=yAb-4*u;
    F.line(xp-sw,ysb,xp,ysb,{w:1.4});F.line(xp-sw,ysb-4*u,xp-sw,ysb+1*u,{w:1.4});F.line(xp,ysb-4*u,xp,ysb+1*u,{w:1.4});
    F.label(`${tnum(sb)} m`,xp-sw/2,ysb-12*ut,{italic:false,size:14});
    F.zh('示意图，水柱已放大',16*u,ysb-6*ut,{align:'left',size:13});
    /* ---------- F–t 图：墨线为实测的挡板受力 ---------- */
    const gx0=66*u,gxR=W-20*u,gx1=W-46*u,gyO=H-14*u-16*ut,gyT=gTop+24*ut+6*u,ms=K.tEnd<.5,sc=ms?1e3:1;
    const TX=tt=>gx0+tt/K.tEnd*(gx1-gx0),Fax=1.32*K.Fp,FY=f=>gyO-f/Fax*(gyO-gyT-6*u);
    {const y=gTop+8*ut,sl=`慢放 1/${Math.round(1/(t<K.tA-1e-12?K.rA:K.rB))}`;
      F.zh('挡板受到的冲击力（实测）',gx0-30*u,y,{align:'left',color:ink});F.zh(sl,gxR,y,{align:'right',color:cW})}
    const yT=FY(K.Fp);F.aux(gx0,yT,gx1+8*u,yT);
    const thL=fLab(e,sf(K.Fp)),thW=pw(thL);run(thL,gx0+8*u,yT-14*ut);
    // 每段柱体：高为平均力、宽为 τ 的虚线矩形，面积 = Δm(1 + e)v
    let lastB=-1;K.boxes.forEach((tb,b)=>{if(t<tb)return;lastB=b;const t2=Math.min(t,tb+K.tau),B=S.bx[b];if(t2-tb<1e-12)return;
      const hgt=B.I/(t2-tb),x1=TX(tb),x2=TX(t2);F.rect(x1,FY(hgt),x2-x1,gyO-FY(hgt),{w:1.2,color:cX,dash:[5,4]});
      if(B.done&&x2-x1>=18*u)F.dim(x1,(FY(hgt)+gyO)/2,x2,(FY(hgt)+gyO)/2,'τ',{off:-12*G.k})});
    if(lastB>=0){const tb=K.boxes[lastB],xm=(TX(tb)+TX(tb+K.tau))/2,parts=[['面积 = ',{zh:1,s:14}],['Δm'],...(e>0?[['(1 + ',{i:false}],['e'],[')',{i:false}]]:[]),['v']],w=pw(parts);
      const xl=Math.min(gx1-w/2,Math.max(xm,gx0+8*u+thW+12*u+w/2));run(parts,xl,yT-14*ut,{align:'center'})}
    const pts=S.hist.map(([tt,f])=>[TX(tt),FY(f)]);pts.push([TX(t),FY(S.Fp)]);F.poly(pts,{w:2});
    axes(G,{x0:gx0,yO:gyO,yT:gyT,xR:gxR,ylab:[['F'],['/N',{i:false,s:15}]],xlab:[['t'],[ms?'/ms':'/s',{i:false,s:15}]]});
    tticks(G,{x0:gx0,x1:gx1,xR:gxR,yO:gyO,tMax:K.tEnd,TX,scale:sc,ulab:ms?'/ms':'/s'});
    if(t>0){F.aux(TX(t),gyT+10*u,TX(t),gyO,{dash:[3,4]});F.dot(TX(t),FY(S.Fp),3)}
  }

  /* ---------- 反冲推力的画面 ---------- */
  function drawThrust(G,S,P){
    const{F,u,ut,k,run,wid,y0,gTop,ink,cX,cG,cN,cV,W,H,paper}=G,K=S.K,t=S.t;
    const rj=Math.max(3*u,Math.min(18*u,3.2*u*Math.sqrt(P.S))),nz=20*u,bw=56*u,bH=92*u;
    const yG=gTop-28*u,top=y0+14*u,sc=(yG-top-bH-nz-8*u)/K.Hv,cx=270*u;
    const ym=yG-S.h*sc,yb=ym-nz,ytop=yb-bH,ycm=(yb+ytop)/2;
    // 地面
    F.line(24*u,yG,W-24*u,yG,{w:2});F.hatch(24*u,yG,W-24*u,yG,1);
    // 输水软管（外接水管供水，飞行器质量不变）
    {const p0=[cx+bw,yb-14*u],p2=[W-118*u,yG],c1=[W-118*u,p0[1]],pts=[];
      for(let i=0;i<=30;i++){const s=i/30,a=(1-s)*(1-s),b=2*s*(1-s),c=s*s;pts.push([a*p0[0]+b*c1[0]+c*p2[0],a*p0[1]+b*c1[1]+c*p2[1]])}
      F.poly(pts,{w:4.4});F.poly(pts,{w:1.8,color:paper});F.zh('输水软管',W-126*u,yG-12*ut,{align:'right',size:13})}
    // 支架：t = 0 时托住飞行器
    if(t===0)for(const s of[-1,1]){const x=cx+s*(bw-12*u);F.line(x,yG,x,yb,{w:2.2});F.line(x-9*u,yG,x+9*u,yG,{w:2.2});F.line(x-8*u,yb,x+8*u,yb,{w:2.2})}
    // 水柱：竖直向下喷到地面后向两侧溅开；短线随水流向下移动
    if(t>0){const df=Math.min(S.h,K.v*t+.5*g*t*t)*sc,ye=ym+df;
      F.line(cx-rj,ym,cx-rj,ye,{w:1.6});F.line(cx+rj,ym,cx+rj,ye,{w:1.6});
      if(ye<yG-1*u)F.line(cx-rj,ye,cx+rj,ye,{w:1.6});
      else for(const s of[-1,1])F.poly([[cx+s*rj,yG-1*u],[cx+s*(rj+10*u),yG-7*u],[cx+s*(rj+24*u),yG-9*u],[cx+s*(rj+36*u),yG-5*u]],{w:1.4});
      const sp=28*u,ph=(t*Math.min(240*u,Math.max(40*u,(K.v-S.u)*sc)))%sp;
      for(let y=ym+4*u+ph;y<ye-2*u;y+=sp)F.line(cx-rj*.6,y,cx+rj*.6,y,{w:1.2,color:cX})}
    // 飞行器：墨线箱体 + 喷管；喷口截面小椭圆标 S
    F.rect(cx-bw,ytop,2*bw,bH,{w:1.8,fill:paper});

    // 离地高度 h

    // 取柱：紧贴喷口下方长 vτ 的一段水，就是 τ 内喷出的水
    if(t>0){const bh=Math.min(Math.max(K.v*K.tau*sc,30*u*k),Math.max(0,Math.min(S.h,K.v*t)*sc));

        const LFp=Math.min(36*u,yG-6*u-ym-bh/2);if(LFp>=12*u){F.arrow(cx,ym+bh/2,0,LFp,cN,null);run([['F′']],cx-14*ut,ym+bh/2+LFp,{color:cN,align:'center'})}
        const yv=ym+bh+10*u,Lv=Math.min(46*u,yG-8*u-yv);if(Lv>=18*u)F.arrow(cx+rj+16*u,yv,0,Lv,cV,'v',{off:[14*k,-6]})}}
    // 重力 Mg 与推力 F（同一比例尺，悬停时等长）；飞行器速度 u

    if(t>0&&LF>=2*u){F.arrow(cx,ycm,0,-LF,cN,null);F.label('F',cx+13*ut,ycm-LF+6*u,{color:cN})}
    F.arrow(cx,ycm,0,Lg,cG,null);run([['M'],['g']],cx-10*u-12*ut,ycm+Lg-8*u,{color:cG,align:'center'});
    F.dot(cx,ycm,2.6);
    if(Math.abs(S.u)>.02){const L=clamp(S.u*20*u,-64*u,64*u);F.arrow(cx+bw+16*u,ycm,0,-L,cV,null);F.label('u',cx+bw+16*u+12*ut,ycm-L+(L>0?8:-8)*u,{color:cV})}
    // 右侧标尺（比例尺）
    {const xr=W-36*u,st=nice(K.Hv/5),Ht=Math.floor(K.Hv/st+1e-9)*st;F.line(xr,yG,xr,yG-Ht*sc,{w:1});
      for(let i=1;i*st<=K.Hv+1e-9;i++){const y=yG-i*st*sc;F.line(xr,y,xr-5*u,y,{w:1});if(y>top+8*ut)F.label(tnum(i*st),xr-8*u,y,{italic:false,size:13,align:'right'})}
      F.label('m',xr+8*u,yG-Ht*sc,{italic:false,size:13,align:'left'})}
    /* ---------- F–t 图：墨线为实测推力，虚线为 Mg ---------- */

      const ny=FY(S.Fm)+(up||hov?-14:14)*ut;F.zh(hov?'悬停：F = Mg':up?'F > Mg，加速上升':'F < Mg，下落',Math.max(gx0+70*u,TX(t)-8*u),ny,{align:'right',color:ink})}
    axes(G,{x0:gx0,yO:gyO,yT:gyT,xR:gxR,ylab:[['F'],['/N',{i:false,s:15}]],xlab:[['t'],['/s',{i:false,s:15}]]});

  }

  /* ---------- 物体撞击的画面 ---------- */
  function drawImpact(G,S,P){
    const{F,u,ut,k,run,wid,pw,y0,gTop,ink,cX,cG,cN,cV,cW,W,H,paper}=G,K=S.K,t=S.t,e=K.e;

    const ph=S.ph,surf=ph==='fall'?0:ph==='load'||ph==='unload'?xd(S.z):xd(ph==='rest'?S.zm:S.zr);

    F.line(40*u,yG,W-40*u,yG,{w:2});F.hatch(40*u,yG,W-40*u,yG,1);
    F.rect(xc0,yC+surf,xc1-xc0,Tc-surf,{w:1.8,fill:paper});
    for(const f of[1/3,2/3]){const y=yC+surf+(Tc-surf)*f;F.line(xc0+6*u,y,xc1-6*u,y,{w:1,color:cX,dash:[6,5]})}
    F.zh('缓冲垫',xc0-10*u,yC+Tc/2,{align:'right'});
    if(surf>5*u){F.aux(xc1,yC,xc1+26*u,yC,{dash:[3,3]});F.dim(xc1+18*u,yC,xc1+18*u,yC+surf,null);
      run([['x'],[` = ${sf(ph==='load'||ph==='unload'?S.z:ph==='rest'?S.zm:S.zr)} m`,{i:false,s:15}]],xc1+28*u,yC+surf/2);
      F.zh('压缩量已放大',xc1+28*u,yC+surf/2+18*ut,{align:'left',size:13})}
    // 下落高度 H（由静止落下）与弹起高度 e²H

    F.aux(xh-6*u,yS+rb,cx-4*u,yS+rb,{dash:[3,4]});F.dim(xh,yC,xh,yS+rb,null);
    run([['H'],[` = ${sf(K.H)} m`,{i:false,s:15}]],xh-8*u,(yC+yS+rb)/2,{align:'right'});
    if(e>0&&(ph==='rise'||S.done)){const yR=yC+xd(S.zr)-e*e*K.H*sc;F.aux(cx+rb+4*u,yR,cx+96*u,yR);run([['e'],['²',{i:false}],['H'],[` = ${sf(e*e*K.H)} m`,{i:false,s:15}]],cx+100*u,yR)}
    F.trail([[cx,yS],[cx,Math.max(yS,Math.min(by,yC-rb))]]);
    // 物体与矢量：重力 mg、速度 v、缓冲垫的支持力 N（长度随 N 变化），都从球心画出
    F.ball(cx,by,rb);
    const Nax=Math.max(K.Nm,K.mg*1.3),Lmin=26*u,Lmax=110*u,fs=Lmax/Nax;
    const len=f=>K.mg*fs>=Lmin?f*fs:(f<=K.mg?Lmin*f/K.mg:Lmin+(f-K.mg)/(Nax-K.mg)*(Lmax-Lmin));   // mg 太小时分段线性，保证 mg 可见
    const Lv=-S.w/Math.max(K.v,1e-9)*58*u;
    if(Math.abs(Lv)>=3*u){F.arrow(cx,by,0,-Lv,cV,null);F.label('v',cx-13*ut,by-Lv+(Lv<0?-6:6)*u,{color:cV})}
    const Lg=len(K.mg);F.arrow(cx,by,0,Lg,cG,null);run([['m'],['g']],cx+18*ut,by+Lg-4*u,{color:cG,align:'center'});
    if(S.N>0){const LN=len(S.N);F.arrow(cx,by,0,-LN,cN,null);F.label('N',cx+13*ut,by-LN+6*u,{color:cN})}
    F.dot(cx,by,2.2);
    {const sl=`接触段慢放 1/${Math.round(1/K.rC)}`;if(K.rC<.95)F.zh(sl,W-16*u,y0+6*u+8*ut,{align:'right',color:cW})}
    /* ---------- 下部：N–t 图（左）与 p–t 图（右），从接触瞬间计时 ---------- */
    const yh=gTop+8*ut;F.zh('从接触瞬间计时；取向上为正',40*u,yh,{align:'left',color:ink});
    const gyT=gTop+24*ut+6*u,gyB=H-14*u-16*ut,Tw=1.25*K.dt,ms=Tw<.5,scT=ms?1e3:1,ul=ms?'/ms':'/s';
    // N–t
    {const x0=60*u,xR=342*u,x1=322*u,Nax2=1.15*Math.max(K.Nm,K.Fbar,1.3*K.mg),TX=tt=>x0+tt/Tw*(x1-x0),NY=n=>gyB-n/Nax2*(gyB-gyT-8*u);
      const ym=NY(K.mg);F.aux(x0,ym,x1+6*u,ym);run([['m'],['g']],xR-2*u,ym-12*ut,{align:'right',color:cX});
      const xD=TX(K.dt);F.line(xD,gyB,xD,gyB-5*u,{w:1});const wD=pw([['Δ',{i:false}],['t']]);run([['Δ',{i:false}],['t']],xD,gyB+15*ut,{align:'center'});
      if(S.dtm!==null){const Fb=S.Ic/S.dtm,xr=TX(S.dtm);F.rect(x0,NY(Fb),xr-x0,gyB-NY(Fb),{w:1.2,color:cX,dash:[5,4]});F.label('F̄',xr+4*u+8*ut,NY(Fb))}
      if(S.hN.length){const pts=[[x0,gyB],...S.hN.filter(p=>p[0]<=Tw).map(([tt,n])=>[TX(tt),NY(n)])];F.poly(pts,{w:2});
        if(t>=S.tc&&t-S.tc<=Tw)F.dot(TX(t-S.tc),NY(S.N),3)}
      axes(G,{x0,yO:gyB,yT:gyT,xR,ylab:[['N'],['/N',{i:false,s:15}]],xlab:[['t'],[ul,{i:false,s:15}]]});
      tticks(G,{x0,x1,xR,yO:gyB,tMax:Tw,TX,scale:scT,ulab:ul,skip:[[xD-wD/2,xD+wD/2]]})}
    // p–t
    {const x0=420*u,xR=W-18*u,x1=W-58*u,mv=K.m*K.v,pT=Math.max(e*mv,0)+.2*mv,pB=-mv-.06*mv;
      const yBot=gyB-14*ut,TX=tt=>x0+tt/Tw*(x1-x0),PY=p=>gyT+8*u+(pT-p)/(pT-pB)*(yBot-gyT-8*u),yO=PY(0);
      F.aux(x0,PY(-mv),TX(K.dt),PY(-mv));run([['−',{i:false}],['m'],['v']],x0-5*u,PY(-mv),{align:'right'});
      if(e>0){F.aux(x0,PY(e*mv),TX(K.dt),PY(e*mv));run([['e'],['m'],['v']],x0-5*u,PY(e*mv),{align:'right'})}
      const xD=TX(1.1*K.dt);F.dim(xD,PY(-mv),xD,PY(e*mv),null);{const ym=(PY(-mv)+PY(e*mv))/2;run([['Δ',{i:false}],['p']],xD-6*u,Math.abs(ym-yO)<14*ut?yO+16*ut:ym,{align:'right'})}
      if(S.hN.length){const pts=[[x0,PY(-mv)],...S.hN.filter(p=>p[0]<=Tw).map(([tt,,p])=>[TX(tt),PY(p)])];F.poly(pts,{w:2});
        if(t>=S.tc&&t-S.tc<=Tw)F.dot(TX(t-S.tc),PY(-K.m*S.w),3)}
      F.arrow(x0,yBot,0,gyT-yBot,ink,null,{w:1.3,head:10});F.arrow(x0,yO,xR-x0,0,ink,null,{w:1.3,head:10});
      F.label('O',x0-10*ut,yO+12*ut);run([['p'],['/(kg·m·s⁻¹)',{i:false,s:15}]],x0+9*u,gyT+6*u);
      run([['t'],[ul,{i:false,s:15}]],xR,yO+(e>0?17:-14)*ut,{align:'right'});
      run([['斜率 = 合力 ',{zh:1,s:14}],['N'],[' − ',{i:false}],['m'],['g']],xR,gyB+4*ut,{align:'right'})}
  }

  return{
    legend:[{label:'重力 mg、Mg',color:'--g'},{label:'作用力 F、F′、N',color:'--n'},{label:'速度 v、u',color:'--v'}],
    init(P){const K=cfg(P);return K.mode==='jet'?initJet(K):K.mode==='thrust'?initThrust(K):initImpact(K)},
    step(S,P,dt){if(S.done)return;const K=S.K;if(K.mode==='jet')stepJet(S,K,dt);else if(K.mode==='thrust')stepThrust(S,K,dt);else stepImpact(S,K,dt)},
    readouts(S,P){
      const K=S.K,t=S.t;
      if(K.mode==='jet'){
        const B=[...S.bx].reverse().find(b=>b.I0!==null),dm=B?B.dm:null;
        return[['时间 t（真实）',sf(t,4)+' s'],['流量 q（实测）',t>0?sf(S.mOut/t,4)+' kg/s':'—'],
          ['τ 内打到挡板的水 Δm',dm!==null?sf(dm,4)+' kg':sf(K.dm,4)+' kg（理论）'],['柱长 vτ',sf(K.v*K.tau,4)+' m'],
          ['每段动量变化 Δm(1+e)v',sf(K.dm*(1+K.e)*K.v,4)+' kg·m/s'],['本段柱体的冲量（实测）',B?sf(B.I,4)+' N·s':'—'],
          ['挡板受力 F（实测）',sf(S.Fp,4)+' N'],['F 理论 (1+e)ρSv²',sf(K.Fp,4)+' N'],['冲击压强 p = F/S',sf(S.I>0?S.Fp/K.S:K.Fp/K.S,4)+' Pa'],
          ['水枪反冲力（实测）',t>0?sf(S.Fg,4)+' N':'—'],['反冲力理论 ρSv²',sf(K.F0,4)+' N'],
          ['输出功率 P（实测）',t>0?sf(S.Ek/t,4)+' W':'—'],['P 理论 ½ρSv³',sf(K.Pw,4)+' W'],['已喷出的水',sf(S.mOut,4)+' kg']];
      }
      if(K.mode==='thrust'){
        const dir=x=>Math.abs(x)<1e-9?'':x>0?'，向上':'，向下';
        return[['时间 t',sf(t,4)+' s'],['离地高度 h',sf(S.h,4)+' m'],['速度 u',sf(Math.abs(S.u),3)+' m/s'+dir(S.u)],
          ['加速度 a',t>0?sf(Math.abs(S.a),4)+' m/s²'+dir(S.a):'—'],['推力 F（实测）',t>0?sf(S.Fm,4)+' N':'—'],['推力理论 ρSv²',sf(K.F0,4)+' N'],
          ['重力 Mg',sf(K.W,4)+' N'],['流量 q（实测）',t>0?sf(S.mOut/t,4)+' kg/s':'—'],['τ 内喷出的水 Δm',sf(K.dm,4)+' kg'],
          ['悬停所需喷速 v₀',sf(K.v0,4)+' m/s'],['水获得动能的功率（实测）',t>0?sf(S.Ek/t,4)+' W':'—'],['功率理论 ½ρSv³',sf(K.Pw,4)+' W']];
      }
      const has=S.dtm!==null,Fb=has?S.Ic/S.dtm:null,vo=S.vout;
      return[['时间 t（从释放算起）',sf(t,4)+' s'],['速度（向下为正）',sf(S.w,3)+' m/s'],['支持力 N',sf(S.N,4)+' N'],
        ['撞击速度 v（实测）',S.vin!==null?sf(S.vin,4)+' m/s':'—'],['离开速度（实测）',has?(K.e>0?sf(vo,4)+' m/s':'0（停住）'):'—'],
        ['作用时间 Δt（实测）',has?sf(S.dtm,4)+' s':'—'],['动量变化 Δp（向上）',has?sf(K.m*(S.vin+vo),4)+' kg·m/s':'—'],
        ['缓冲垫的冲量 I（实测）',has?sf(S.Ic,4)+' N·s':S.tc!==null?sf(S.I,4)+' N·s':'—'],['平均作用力 F̄ = I/Δt',has?sf(Fb,4)+' N':'—'],
        ['公式 mg + m(1+e)v/Δt',sf(K.Fbar,4)+' N'],['不计重力 m(1+e)v/Δt',sf(K.Fng,4)+' N'],['偏小 mg/F̄',pc(K.mg/(has?Fb:K.Fbar))],
        ['F̄/mg',sf((has?Fb:K.Fbar)/K.mg,4)+' 倍'],['峰值 N_max',S.zm!==null?sf(S.Nmax,4)+' N':'—'],
        ['最大压缩量 x_m（模型值）',S.zm!==null?sf(S.zm,3)+' m':'—'],['损失的动能',has?sf(.5*K.m*(S.vin*S.vin-vo*vo),4)+' J':'—']];
    },
    draw(ctx,S,P,W,H,tok){
      const G=mk(ctx,W,H,tok);G.F.clear();
      if(S.K.mode==='jet')drawJet(G,S,P);else if(S.K.mode==='thrust')drawThrust(G,S,P);else drawImpact(G,S,P);
    },
    verdict(P){
      const K=cfg(P),b=x=>`<b>${x}</b>`;
      if(K.mode==='jet'){
        let h=`流量 q = ρSv = ${b(sf(K.q)+' kg/s')}；取 τ = ${sf(K.tau*1e3)} ms，这段时间内打到挡板的水 Δm = ρSvτ = ${b(sf(K.dm)+' kg')}，水柱长 vτ = ${b(sf(K.v*K.tau)+' m')}（C4）。<br>`;
        h+=`挡板受到的平均冲击力 F = Δm(1 + e)v/τ = (1 + e)ρSv² = ${b(sf(K.Fp)+' N')}（C5），τ 约掉了，与所取的 τ 无关；冲击压强 p = F/S = ${b(sf(K.Fp/K.S)+' Pa')}。`;
        if(K.e>0)h+=`凹形挡板 e = ${sf(K.e,2)}：Δv = (1 + e)v，F 是平板的 ${sf(1+K.e)} 倍。`;
        h+=`<br>水枪受到的反冲力 ρSv² = ${b(sf(K.F0)+' N')}，方向与喷水方向相反（C6）；输出功率 P = ½ρSv³ = ${b(sf(K.Pw)+' W')}。<br>`;
        h+=`柱体自身的重力冲量与 Δm·v 之比为 gτ/v = ${sf(g*K.tau/K.v,2)}，可略（C5）。`;
        return h;
      }
      if(K.mode==='thrust'){
        const a=K.a;let h=`推力 F = ρSv² = ${b(sf(K.F0)+' N')}（C6），重力 Mg = ${b(sf(K.W)+' N')}：`;
        h+=K.hover?`${b('F = Mg，恰好悬停')}。`:a>0?`F > Mg，${b('加速上升')}，a = (F − Mg)/M = ${b(sf(a)+' m/s²')}。`:`F < Mg，${b('下落')}，加速度 ${b(sf(-a)+' m/s²')}，向下。`;
        h+=`<br>悬停所需喷速 v₀ = √(Mg/(ρS)) = ${b(sf(K.v0)+' m/s')}；喷出的水每秒获得的动能 P = ½ρSv³ = ${b(sf(K.Pw)+' W')}`;
        h+=`${K.hover?`（= ½Mg·v₀）`:`，悬停时为 ½Mg·v₀ = ${sf(.5*K.W*K.v0)} W`}。<br>`;
        h+=`流量 q = ρSv = ${sf(K.q)} kg/s；τ 内喷出的水 Δm = ρSvτ = ${sf(K.dm)} kg，喷口对它的力 F′ = Δm·v/τ = ρSv²，由牛顿第三定律得推力（C1、C6）。`;
        return h;
      }
      const ratio=K.mg/K.Fbar;
      let h=`物体从 H = v²/(2g) = ${b(sf(K.H)+' m')} 处落下。取向上为正，Δp = m(1 + e)v = ${b(sf(K.dp)+' kg·m/s')}（C2）${K.e>0?`，离开速度 ev = ${sf(K.e*K.v)} m/s，弹起 e²H = ${sf(K.e*K.e*K.H)} m`:''}。<br>`;
      h+=`F̄ = mg + m(1 + e)v/Δt = ${sf(K.mg)} N + ${sf(K.Fng)} N = ${b(sf(K.Fbar)+' N')}（= ${sf(K.Fbar/K.mg)}mg）（C3）；缓冲垫的冲量 I = F̄Δt = ${sf(K.I)} N·s。<br>`;
      h+=`不计重力得 ${b(sf(K.Fng)+' N')}，偏小 mg/F̄ = ${b(pc(ratio))}：${ratio<.02?'作用时间短，重力可以略去':ratio<.05?'重力占比小，按精度要求决定是否略去':'作用时间不算短，重力不能略'}。<br>`;
      h+=`动画中缓冲垫用双劲度模型（压缩时 N = k₁x，回弹时 k₂ = k₁/e²），k₁ = ${sf(K.k1)} N/m 由 Δt 反算，峰值约 ${sf(K.Nm)} N；F̄ 与曲线形状无关。`;
      return h;
    },
    _cfg:cfg
  };
})();

/* ================= 通用渲染引擎（所有母题共用，不改） ================= */
(()=>{
const D=JSON.parse(document.getElementById('data').textContent);
const PLAY=D.playLabel||'发射';   // 播放按钮上的动词，数据里可用 playLabel 改写（如「碰撞」「转动」）
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const root=document.documentElement;
const tok=n=>getComputedStyle(root).getPropertyValue(n).trim();
const PS=D.problem.params;
const P={};PS.forEach(p=>P[p.key]=p.def);
const unitSep=u=>/^[°′″]/.test(u)?'':' ';   // 角度单位紧贴数字：90°
const fmtP=p=>p.type==='choice'?p.options.find(o=>o.value===P[p.key]).label:(+P[p.key]).toFixed(p.dec??2)+(p.unit?unitSep(p.unit)+p.unit:'');

/* 静态内容 */
document.title=`格物 ${D.id} ${D.name.replace(/（.*）/,'')}`;
$('hName').textContent=D.name;
$('hSub').textContent=`${D.module} · ${D.chapter}　关联：${D.related.join('、')}`;
$('hTable').innerHTML=`<tr><th>编号</th><th>考查频率</th><th>难度</th><th>版本</th></tr>
<tr><td class="code">${esc(D.id)}</td><td>${esc(D.freq)}</td><td title="${D.difficulty} / 5">${'●'.repeat(D.difficulty)}${'○'.repeat(5-D.difficulty)}</td><td>${esc(D.version)}</td></tr>`;
$('foot').textContent=`格物 Gewu · ${D.id} · ${D.version} · ${D.footer??'g 取 10 m/s²'}`;   // 数据里可用 footer 改写页脚常量
$('tags').innerHTML=D.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('');
$('stemNote').textContent=D.problem.note||'';
$('bCond').innerHTML=D.boundary.conditions.map(c=>`<li><span>${esc(c)}</span></li>`).join('');
$('bBack').innerHTML=D.boundary.fallback.map(c=>`<li><span>${esc(c)}</span></li>`).join('');
$('legend').innerHTML=SIM.legend.map(l=>`<span><i style="background:var(${l.color})"></i>${esc(l.label)}</span>`).join('');
$('concl').innerHTML=D.conclusions.map(c=>`<details><summary><span class="badge">${c.id}</span><span class="t">${esc(c.title)}</span><span class="f">${esc(c.formula)}</span><span class="chev" aria-hidden="true"></span></summary><div class="deriv">${esc(c.derivation)}</div></details>`).join('');
const qCard=(q,isVar)=>`<article class="q">
  <div class="head"><span class="badge">${q.id}</span><h3>${esc(q.title)}</h3>${isVar?q.cs.map(c=>`<span class="chip">${c}</span>`).join(''):`<span class="chip">${q.anim?'计划做动画':'不做动画'}</span>`}</div>
  <p>${esc(q.stem)}</p>
  ${isVar?'':`<p class="map">映射：<b>${esc(q.map)}</b></p>`}
  <details><summary><span class="chev" aria-hidden="true"></span>答案与解析</summary><div class="ans"><p class="a">答案：${esc(q.answer)}</p><p>${esc(q.analysis)}</p></div></details>
  <div class="foot"><span class="src">${esc(q.source)}</span>${isVar?`<button data-load="${q.id}">加载到动画 ↑</button>`:''}</div>
</article>`;
$('variants').innerHTML=D.variants.map(v=>qCard(v,true)).join('');
$('reskins').innerHTML=D.reskins.map(r=>qCard(r,false)).join('');
$('sources').innerHTML=D.sources.map(s=>`<li><b>${esc(s.src)}</b><span>${esc(s.desc)}</span></li>`).join('');

/* 参数控件 */
const box=$('params');
PS.forEach(p=>{
  if(p.type==='choice'){
    const d=document.createElement('div');d.className='seg';d.id=`f-${p.key}`;d.setAttribute('role','group');d.setAttribute('aria-label',p.label);
    d.innerHTML=p.options.map(o=>`<button id="opt-${p.key}-${o.value}" data-k="${p.key}" data-v="${o.value}">${esc(o.label)}${o.hint?`<small>${esc(o.hint)}</small>`:""}</button>`).join('');
    box.appendChild(d);
  }else{
    const d=document.createElement('div');d.className='field';d.id=`f-${p.key}`;
    d.innerHTML=`<label for="num-${p.key}"><span class="s">${esc(p.sym)}</span><span class="note">${esc(p.label)}</span></label><span class="numin"><input type="number" id="num-${p.key}" min="${p.min}" max="${p.max}" step="any" inputmode="decimal" aria-label="${esc(p.label)}"><span class="u">${esc(p.unit||'')}</span></span><input type="range" id="in-${p.key}" min="${p.min}" max="${p.max}" step="${p.step}" value="${p.def}" aria-label="${esc(p.label)} 滑块">`;
    box.appendChild(d);
    d.querySelector('input[type=range]').addEventListener('input',e=>{P[p.key]=+e.target.value;active=-1;sync();reset()});
    const num=d.querySelector('input[type=number]');
    num.addEventListener('change',()=>{let v=parseFloat(num.value);
      if(Number.isFinite(v)){v=Math.min(p.max,Math.max(p.min,v));P[p.key]=v;active=-1;reset()}sync()});
    num.addEventListener('keydown',e=>{if(e.key==='Enter')num.blur()});
  }
});
box.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;P[b.dataset.k]=b.dataset.v;active=-1;sync();reset()});
let active=-1;
const shown=w=>!w||Object.entries(w).every(([k,v])=>[].concat(v).includes(P[k]));
const CH0=PS.find(p=>p.type==='choice');   // 预设只按第一个选项参数（情境 / 模式）分组，其余选项由预设的 load 带过去
const chosen=o=>!CH0||o[CH0.key]===undefined||o[CH0.key]===P[CH0.key];
const numTxt=(p,v)=>String(+(+v).toFixed(Math.max(p.dec??2,4)));
function sync(){
  PS.forEach(p=>{
    if(p.type==='choice'){p.options.forEach(o=>$(`opt-${p.key}-${o.value}`).setAttribute('aria-pressed',P[p.key]===o.value));if(p.when)$(`f-${p.key}`).hidden=!shown(p.when)}
    else{$(`in-${p.key}`).value=P[p.key];const n=$(`num-${p.key}`);if(document.activeElement!==n)n.value=numTxt(p,P[p.key]);$(`f-${p.key}`).hidden=!shown(p.when)}
  });
  const fill=s=>esc(s).replace(/\{(\w+)\}/g,(m,k)=>{
    if(k==='constraint'){const p=PS.find(x=>x.type==='choice');return esc(p.options.find(o=>o.value===P[p.key]).text)}
    const p=PS.find(x=>x.key===k);return p?`<span class="num">${esc(fmtP(p))}</span>`:m});
  const [lead,ask='']=D.problem.stem.split(/问[:：]/);
  $('stem').innerHTML=fill(lead.trim());
  const qs=ask.split(/[①②③④⑤⑥]/).map(s=>s.trim()).filter(Boolean);
  $('asks').innerHTML=qs.map((q,i)=>`<li><b>${i+1}</b><span>${fill(q)}</span></li>`).join('');
  $('asks').hidden=!qs.length;
  $('verdict').innerHTML=SIM.verdict(P);
  const ch=PS.find(p=>p.type==='choice');
  $('presetMode').textContent=ch?`· ${ch.options.find(o=>o.value===P[ch.key]).label}`:'';
  $('presets').innerHTML=D.presets.map((p,i)=>chosen(p.load)?`<button data-preset="${i}" aria-pressed="${i===active}" title="${esc(p.note||'')}">${esc(p.label)}</button>`:'').join('');
  const pn=$('pnote'),ap=D.presets[active];pn.hidden=!(ap&&ap.note);if(ap&&ap.note)pn.innerHTML=`<b>${esc(ap.label)}</b>：${esc(ap.note)}`;
}
function load(o,i=-1){Object.assign(P,o);active=i;sync();reset()}
$('presets').addEventListener('click',e=>{const b=e.target.closest('[data-preset]');if(b)load(D.presets[+b.dataset.preset].load,+b.dataset.preset)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-load]');if(!b)return;
  load(D.variants.find(v=>v.id===b.dataset.load).load);
  show('pane-lab');document.querySelector('.board').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})});

/* 画布与循环 */
const cv=$('cv'),ctx=cv.getContext('2d');let S,running=false,speed=1,lastT=0;
function size(){const r=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);const w=Math.max(200,Math.round(r.width*dpr));if(cv.width!==w){cv.width=w;cv.height=w}}
function render(){size();SIM.draw(ctx,S,P,cv.width,cv.height,tok);
  $('readout').innerHTML=SIM.readouts(S,P).map(([k,v])=>`<div class="ro"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('');
  const st=$('status');st.textContent=S.status.text;st.className='status '+S.status.cls}
function reset(){running=false;S=SIM.init(P);$('play').textContent=`▶ ${PLAY}`;render()}
function loop(t){if(!running)return;const real=Math.min(.05,(t-lastT)/1000);lastT=t;
  const sim=real*speed,n=Math.max(1,Math.ceil(sim/5e-4));for(let i=0;i<n;i++)SIM.step(S,P,sim/n);
  render();if(S.done){running=false;$('play').textContent=`▶ 再${PLAY}`;return}requestAnimationFrame(loop)}
$('play').onclick=()=>{if(running){running=false;$('play').textContent='▶ 继续';return}
  if(S.done)S=SIM.init(P);running=true;$('play').textContent='❚❚ 暂停';lastT=performance.now();requestAnimationFrame(loop)};
$('reset').onclick=reset;
$('slow').onclick=()=>{speed=speed===1?.25:1;$('slow').textContent=speed===1?'慢放 ×0.25':'正常速度'};
new ResizeObserver(render).observe(cv);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);
new MutationObserver(render).observe(root,{attributes:true,attributeFilter:['data-theme']});
/* 选项卡 */
const tabs=[...document.querySelectorAll('[role=tab]')];
function show(id){tabs.forEach(t=>{const on=t.dataset.pane===id;t.setAttribute('aria-selected',on);t.tabIndex=on?0:-1;$(t.dataset.pane).hidden=!on});
  if(id==='pane-lab')requestAnimationFrame(render)}
tabs.forEach((t,i)=>{t.addEventListener('click',()=>show(t.dataset.pane));
  t.addEventListener('keydown',e=>{const d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;if(!d)return;e.preventDefault();
    const n=tabs[(i+d+tabs.length)%tabs.length];n.focus();show(n.dataset.pane)})});
$('nConcl').textContent=D.conclusions.length;$('nVar').textContent=D.variants.length;$('nSkin').textContent=D.reskins.length;$('nSrc').textContent=D.sources.length;
show('pane-lab');
sync();reset();
})();
</script>
